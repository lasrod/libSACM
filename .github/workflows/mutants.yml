name: mutants

# Full mutation-testing run over the whole workspace (LIB-QA-007): weekly, and on
# demand: at each milestone's close, and for a slice that changes the mutation config
# or removes tests (ADR 0006 amendment 3). The PR job in ci.yml mutates each PR's
# diff, including xtask changes, and is the per-slice evidence.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The W3C XML Conformance Test Suite, fetched into the git-ignored third_party/
  # (LIB-SEC-006). An absolute path, because cargo-mutants does not copy
  # git-ignored files into its build directory.
  SACM_XMLCONF_DIR: ${{ github.workspace }}/third_party/xmlconf/xmlconf
  # Rebuilding each mutant is most of the time; debug info only slows it.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  mutants:
    name: mutants (shard ${{ matrix.shard }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # One group per shard, keyed by head repository and branch (the same for PR and
    # dispatch events), so a newer run's shard cancels the older run's. It is set on
    # the job, not the workflow, so a draft PR's skipped run cancels nothing.
    concurrency:
      group: mutants-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}-${{ matrix.shard }}
      cancel-in-progress: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache the W3C XML Conformance Test Suite (LIB-SEC-006)
        uses: actions/cache@v6
        with:
          path: third_party/xmlconf
          key: xmlconf-9b61db9f5dbffa545f4b8d78422167083a8568c59bd1129f94138f936cf6fc1f
      - run: cargo xtask fetch-spec --only xmlconf
      - run: cargo install cargo-mutants --locked --version 27.1.0
      - run: cargo install cargo-nextest --locked --version 0.9.151
      - run: cargo mutants --workspace --shard ${{ matrix.shard }}/4 --sharding round-robin
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: error
