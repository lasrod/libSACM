name: mutants

# Full mutation-testing run over the whole workspace (LIB-QA-007). The PR job in
# ci.yml tests only the diff; this run catches what a diff cannot see (test-only
# changes, configuration changes) and serves as the verifier's baseline.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .cargo/mutants.toml
      - .github/workflows/mutants.yml
      - "crates/**"
      - "xtask/**"
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  mutants:
    name: mutants (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-mutants --locked --version 27.1.0
      - run: cargo mutants --workspace --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: error
