name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The W3C XML Conformance Test Suite, fetched into the git-ignored third_party/
  # (LIB-SEC-006). An absolute path, because cargo-mutants does not copy
  # git-ignored files into its build directory.
  SACM_XMLCONF_DIR: ${{ github.workspace }}/third_party/xmlconf/xmlconf

jobs:
  # LIB-QA-018: whether the latest push changed anything outside docs/. The gates below
  # fail open: they skip only on an explicit `code=false`, so a failed `changes` job runs
  # everything. A push that
  # changes only docs/ (such as a slice's verification record) skips the jobs that can
  # only fail on code: the Windows and macOS tests, MSRV, the PR-diff mutants, coverage
  # and the fuzz smoke run. Their required checks pass as skipped. The Ubuntu tests still
  # run, because the xtask and catalog tests read docs/; so does `semver checks`, a
  # required check. When in doubt, `code` is true.
  #
  # A push compared with the commit before it (a pull request's new commits, or a push to
  # main) may skip only if CI succeeded on that commit, so a docs-only push never turns
  # failed, cancelled or unfinished code checks green; each docs-only run vouches for its
  # predecessor in turn. A newly opened pull request compares with its base, which CI
  # verified when it reached main.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Known limit (verification 0051, accepted at M3's close): the runs API does not
      # filter by base, so on a pull_request run a success against an older base still
      # counts. Only docs-only pushes skip jobs on it, and every merge to main runs in full.
      - id: previous
        name: Whether CI succeeded on the previous commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          ok=false
          if [ -n "$BEFORE" ] && n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$BEFORE&status=success&event=$EVENT" --jq '.total_count') && [ "$n" -gt 0 ]; then
            ok=true
          fi
          echo "CI succeeded on $BEFORE: $ok"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PREVIOUS_OK: ${{ steps.previous.outputs.ok }}
        run: |
          set -u
          range=""
          needs_previous=false
          if [ "$EVENT" = pull_request ] && [ "$ACTION" = synchronize ]; then range="$BEFORE $AFTER"; needs_previous=true
          elif [ "$EVENT" = pull_request ]; then range="$BASE $HEAD"
          elif [ "$EVENT" = push ]; then range="$BEFORE $AFTER"; needs_previous=true
          fi
          code=true
          if [ -n "$range" ] && files=$(git diff --name-only --no-renames $range) && [ -n "$files" ]; then
            if ! echo "$files" | grep -qv '^docs/'; then code=false; fi
          fi
          if [ "$code" = false ] && [ "$needs_previous" = true ] && [ "${PREVIOUS_OK:-}" != true ]; then
            echo "docs only, but CI did not succeed on the previous commit"
            code=true
          fi
          echo "changed outside docs/: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: changes
    # Runs even if `changes` failed: only an explicit "docs only" skips anything.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # LIB-QA-018: the steps are skipped on Windows and macOS when only docs/ changed (the
    # job must still exist, because its check is required).
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false' || matrix.os == 'ubuntu-latest'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: needs.changes.outputs.code != 'false' || matrix.os == 'ubuntu-latest'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.code != 'false' || matrix.os == 'ubuntu-latest'
      - name: Cache the W3C XML Conformance Test Suite (LIB-SEC-006)
        if: needs.changes.outputs.code != 'false' || matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6
        with:
          path: third_party/xmlconf
          key: xmlconf-9b61db9f5dbffa545f4b8d78422167083a8568c59bd1129f94138f936cf6fc1f
      - run: cargo xtask fetch-spec --only xmlconf
        if: needs.changes.outputs.code != 'false' || matrix.os == 'ubuntu-latest'
      - run: cargo test --workspace --all-features
        if: needs.changes.outputs.code != 'false' || matrix.os == 'ubuntu-latest'
      - run: cargo test -p xtask
        if: needs.changes.outputs.code != 'false' || matrix.os == 'ubuntu-latest'
      # LIB-COMPAT-015: real SACM files from other tools, fetched (never committed) and read.
      - name: Cache the SACM corpus (LIB-COMPAT-015)
        if: needs.changes.outputs.code != 'false' || matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6
        with:
          path: third_party/corpus
          key: corpus-${{ hashFiles('xtask/src/fetch.rs') }}
      - name: The SACM corpus (LIB-COMPAT-015, LIB-COMPAT-005)
        if: needs.changes.outputs.code != 'false' || matrix.os == 'ubuntu-latest'
        env:
          SACM_CORPUS_DIR: ${{ github.workspace }}/third_party/corpus
        run: |
          cargo xtask fetch-corpus
          cargo test -p xtask --test corpus

  msrv:
    name: MSRV
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # rust-toolchain.toml selects stable for development; `+1.85` overrides it.
      - name: Cache the W3C XML Conformance Test Suite (LIB-SEC-006)
        uses: actions/cache@v6
        with:
          path: third_party/xmlconf
          key: xmlconf-9b61db9f5dbffa545f4b8d78422167083a8568c59bd1129f94138f936cf6fc1f
      - run: cargo xtask fetch-spec --only xmlconf
      - run: cargo +1.85 test -p sacm -p sacm-cli --all-features

  wasm:
    # LIB-QA-017: the library builds for the browser target, as Assurance Forge's web
    # version needs (GitHub issue #58).
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build -p sacm --target wasm32-unknown-unknown
      - run: cargo build -p sacm --target wasm32-unknown-unknown --all-features

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --all-features

  matrix:
    name: functionality matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask matrix check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4

  hooks:
    name: agent hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python -m unittest discover -s .claude/hooks -p "test_*.py" -v

  # LIB-TOOL-023 (ADR 0043): the SACM XML Schema, generated from ptc/22-03-13 and never
  # committed, and every strict golden file and strict output checked against it with
  # xmllint. LIB-TOOL-004: the metamodel coverage test. It always runs, with no `changes`
  # gate, because its xtask tests read docs/. Linux only; not part of the local gate.
  schema:
    name: SACM XML Schema
    runs-on: ubuntu-latest
    env:
      SACM_SPEC_DIR: ${{ github.workspace }}/third_party/sacm-2.3
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache the OMG references (LIB-TOOL-002)
        uses: actions/cache@v6
        with:
          path: third_party/sacm-2.3
          key: sacm-spec-${{ hashFiles('xtask/src/fetch.rs') }}
      - name: Cache the W3C XML Conformance Test Suite (LIB-SEC-006)
        uses: actions/cache@v6
        with:
          path: third_party/xmlconf
          key: xmlconf-9b61db9f5dbffa545f4b8d78422167083a8568c59bd1129f94138f936cf6fc1f
      - name: Cache the SACM corpus (LIB-COMPAT-015)
        uses: actions/cache@v6
        with:
          path: third_party/corpus
          key: corpus-${{ hashFiles('xtask/src/fetch.rs') }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: cargo xtask fetch-spec
      - run: cargo xtask fetch-corpus
      - run: cargo build -p sacm-cli
      - name: Strict outputs (tolerant read, strict save) of every fixture and corpus file
        run: |
          set -u
          mkdir -p target/schema/outputs
          made=0
          while IFS= read -r f; do
            out="target/schema/outputs/$(printf '%s' "$f" | sed -e 's#^crates/sacm/tests/data/sacm23/##' -e 's#^third_party/##' -e 's#/#__#g')"
            rc=0; target/debug/sacm roundtrip "$f" -o "$out" >/dev/null 2>&1 || rc=$?
            case "$rc" in 0|1|2) ;; *) echo "sacm roundtrip crashed on $f (exit $rc)"; exit 1 ;; esac
            if [ -f "$out" ]; then made=$((made+1)); else echo "no strict output (exit $rc): $f"; fi
          done < <( { find crates/sacm/tests/data/sacm23 crates/sacm/tests/data/compat -type f -name '*.xmi'; find third_party/corpus -type f; } | LC_ALL=C sort )
          echo "strict outputs written: $made"
      - run: cargo xtask schema validate
      - run: cargo test -p xtask --test metamodel --test schema --test compliance

  # LIB-QA-006 (ADR 0046 D4): sacm's public API, with the `serde` feature only, against the
  # newest release tag. Before 1.0 a break must be listed under `[Unreleased] ### Breaking`
  # in CHANGELOG.md; from 1.0 it needs the major version bump. A required check: no
  # `changes` gate, so it runs on every pull request. It needs the tags (`fetch-depth: 0`).
  semver:
    name: semver checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-semver-checks@0.51.0
      - run: cargo xtask semver

  # LIB-QA-004 (ADR 0046 D3): the line coverage of the sacm crate's own tests, in the job
  # summary and as the `coverage-sacm` artifact (lcov and HTML). Doctests are not measured
  # (they need nightly). Advisory, not a required check.
  coverage:
    name: coverage
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The line coverage, in percent, below which the job fails. Empty: report only.
      # The maintainer set 98 on 2026-11-28 after the first measurement (98.78%).
      COVERAGE_MIN_LINES: "98"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-llvm-cov@0.9.2
      - name: Cache the W3C XML Conformance Test Suite (LIB-SEC-006)
        uses: actions/cache@v6
        with:
          path: third_party/xmlconf
          key: xmlconf-9b61db9f5dbffa545f4b8d78422167083a8568c59bd1129f94138f936cf6fc1f
      - run: cargo xtask fetch-spec --only xmlconf
      - run: cargo llvm-cov clean --workspace
      - run: cargo llvm-cov --no-report --package sacm --all-features
      # `shell: bash` runs with `pipefail`, so the threshold fails the step through `tee`.
      - name: Report
        shell: bash
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info
          cargo llvm-cov report --html --output-dir target/llvm-cov
          cargo llvm-cov report ${COVERAGE_MIN_LINES:+--fail-under-lines "$COVERAGE_MIN_LINES"} | tee target/llvm-cov/summary.txt
      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Line coverage of `sacm` (LIB-QA-004)'
            echo
            if [ -n "$COVERAGE_MIN_LINES" ]; then
              echo "The job fails below $COVERAGE_MIN_LINES% of lines."
            else
              echo 'No threshold yet (`COVERAGE_MIN_LINES` is empty): report only.'
            fi
            echo
            if [ -f target/llvm-cov/summary.txt ]; then
              echo '```text'
              cat target/llvm-cov/summary.txt
              echo '```'
            else
              echo 'No report: an earlier step failed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-sacm
          path: target/llvm-cov
          if-no-files-found: warn

  # LIB-SEC-004 (ADR 0046 D2): a short cargo-fuzz run of both targets on each pull
  # request, from the corpus the weekly fuzz.yml keeps in the cache and the test data as
  # seeds. Advisory, not a required check. A crash, timeout or out-of-memory input is
  # uploaded; see fuzz/README.md for turning it into a regression input.
  fuzz-smoke:
    name: fuzz (smoke)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-11-25
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo +nightly-2026-11-25 install cargo-fuzz --locked --version 0.13.2
      - name: Restore the xmi_read corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/xmi_read
          key: fuzz-corpus-xmi_read-${{ github.run_id }}
          restore-keys: fuzz-corpus-xmi_read-
      - name: Restore the serde_records corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/serde_records
          key: fuzz-corpus-serde_records-${{ github.run_id }}
          restore-keys: fuzz-corpus-serde_records-
      - run: mkdir -p fuzz/corpus/xmi_read fuzz/corpus/serde_records
      - run: cargo +nightly-2026-11-25 fuzz run xmi_read ${{ github.workspace }}/fuzz/corpus/xmi_read ${{ github.workspace }}/crates/sacm/tests/data ${{ github.workspace }}/crates/sacm-cli/tests/data -- -dict=${{ github.workspace }}/fuzz/xmi.dict -max_total_time=60 -max_len=65536 -timeout=10 -rss_limit_mb=2048
      - run: cargo +nightly-2026-11-25 fuzz run serde_records ${{ github.workspace }}/fuzz/corpus/serde_records ${{ github.workspace }}/crates/sacm/tests/data/golden/serde -- -max_total_time=30 -max_len=16384 -timeout=10 -rss_limit_mb=2048
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-smoke-artifacts
          path: fuzz/artifacts
          if-no-files-found: warn

  # Mutation testing of the PR's diff (LIB-QA-007), in four shards. The full
  # sharded run is in mutants.yml. The job only makes sense on pull requests:
  # push and dispatch events have no base ref to diff against. Rebuilding each
  # mutant is most of the time, so the mutant builds carry no debug info.
  # Round-robin sharding spreads slow mutants evenly; the default gives each shard
  # a contiguous block, which left one shard about twice as slow as another.
  mutants-shard:
    name: mutants (PR diff, shard ${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      # LIB-RT-004 (ADR 0046 D1): 16 cases per property keep each mutant's test run short.
      PROPTEST_CASES: "16"
      # The pinned OMG references (LIB-TOOL-002), for the xtask tests that read them
      # (LIB-TOOL-004, LIB-TOOL-023). Set, a missing file fails those tests instead of
      # skipping them, so their mutants cannot show as missed (full run 45995064802).
      SACM_SPEC_DIR: ${{ github.workspace }}/third_party/sacm-2.3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cache the OMG references (LIB-TOOL-002)
        uses: actions/cache@v6
        with:
          path: third_party/sacm-2.3
          key: sacm-spec-${{ hashFiles('xtask/src/fetch.rs') }}
      - name: Cache the W3C XML Conformance Test Suite (LIB-SEC-006)
        uses: actions/cache@v6
        with:
          path: third_party/xmlconf
          key: xmlconf-9b61db9f5dbffa545f4b8d78422167083a8568c59bd1129f94138f936cf6fc1f
      - run: cargo xtask fetch-spec
      - run: cargo install cargo-mutants --locked --version 27.1.0
      - run: cargo install cargo-nextest --locked --version 0.9.151
      - name: Write the pull request's diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/${BASE_REF}...HEAD" > mutants.diff
      - run: cargo mutants --workspace --in-diff mutants.diff --shard ${{ matrix.shard }}/4 --sharding round-robin
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-diff-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: warn

  # The required status check: passes only when every shard passed.
  mutants:
    name: mutants (PR diff)
    if: always() && github.event_name == 'pull_request'
    needs: [changes, mutants-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed, or only docs/ changed (LIB-QA-018)
        env:
          RESULT: ${{ needs.mutants-shard.result }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: test "$RESULT" = success || { test "$CHANGES" = success && test "$CODE" = false && test "$RESULT" = skipped; }
