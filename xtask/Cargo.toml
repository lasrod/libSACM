[package]
name = "xtask"
description = "Repository automation for libSACM (functionality-matrix gate, reference fetching, SACM XML Schema)"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Decides which `- Row verdict:` lines of a verification record are hidden by
# Markdown (code blocks, HTML blocks, inline HTML), as a CommonMark 0.31.2
# renderer does (ADR 0008, LIB-TOOL-005/015). Without default features it
# adds only bitflags, memchr and unicase.
pulldown-cmark = { version = "0.13", default-features = false }
# Reads the pinned ptc/22-03-13, namespaced XML with id references, for the
# metamodel check and the schema generator (LIB-TOOL-004, LIB-TOOL-023). The
# library's own XML backend (ADR 0005), at the version already in Cargo.lock.
roxmltree = { version = "0.21.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# Writes crates/sacm/src/diagnostic/catalog.json (`cargo xtask catalog`,
# LIB-DIAG-006). MIT OR Apache-2.0, already in Cargo.lock through the sacm tests.
serde_json = "1.0.128"
sha2 = "0.11"
toml = "1.2"

[dev-dependencies]
# The corpus test reads real SACM files through the library's public API
# (LIB-COMPAT-015); a workspace path crate, not a third-party dependency.
sacm.workspace = true

[lints]
workspace = true
