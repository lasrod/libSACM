[package]
name = "xtask"
description = "Repository automation for libSACM (functionality-matrix gate, reference fetching)"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Decides which `- Row verdict:` lines of a verification record are hidden by
# Markdown (code blocks, HTML blocks, inline HTML), as a CommonMark 0.31.2
# renderer does (ADR 0008, LIB-TOOL-005/015). Without default features it
# adds only bitflags, memchr and unicase.
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1.2"

[dev-dependencies]
# Parses .github/workflows/ci.yml in the CI regression tests (LIB-QA-002/003) so
# block scalars, flow mappings and continuation lines are read as YAML data, not
# text. Chosen for: YAML 1.2 (no `on`/`yes` -> bool), MIT OR Apache-2.0, maintained,
# MSRV 1.85 (verification 0002 round-2 addendum).
yaml-rust2 = "0.13"

[lints]
workspace = true
