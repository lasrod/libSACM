# cargo-mutants configuration (LIB-QA-007). Every exclusion here is listed,
# with its reason and owning row, in docs/quality/mutants-triage.md.

# A lint that `-D warnings` denies must not turn a mutant unviable (D5).
cap_lints = true

# Build and test with every feature, as CI does (D6).
all_features = true

# A mutant must be killed by its own package's tests, not another package's (D8).
test_workspace = false

# Run the tests under nextest, whose `mutants` profile (.config/nextest.toml)
# kills every running test at the first failure, so a mutant that one fast
# test kills is caught even when another test target becomes slow under it
# (LIB-QA-012, ADR 0009). Doctests do not run under nextest; they still run in
# the normal gate. `--no-tests=warn`: a package with no tests gives missed
# mutants, not caught ones.
test_tool = "nextest"
additional_cargo_test_args = ["--profile=mutants", "--no-tests=warn"]

# Equivalent mutants, each with a row in docs/quality/mutants-triage.md.
exclude_re = [
  '^crates/sacm/src/xmi\.rs:\d+:\d+: replace WriteError::code -> Option<Code> with None$',
  '^crates/sacm/src/model/document\.rs:\d+:\d+: replace Document::commit_generated_id with \(\)$',
  '^crates/sacm/src/edit\.rs:\d+:\d+: replace Mutation::changed_ids -> &\[ElementId\] with Vec::leak\(Vec::new\(\)\)$',
  '^crates/sacm/src/edit\.rs:\d+:\d+: replace Mutation::deleted_ids -> &\[ElementId\] with Vec::leak\(Vec::new\(\)\)$',
  "^crates/sacm/src/xmi/input\\.rs:\\d+:\\d+: replace < with <= in Locator<'t>::locate$",
  '^crates/sacm/src/model/document\.rs:\d+:\d+: replace IdUse::is_unused -> bool with false$',
]
