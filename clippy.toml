msrv = "1.85"
# Public API items are documented with SACM terms that look like code identifiers.
doc-valid-idents = [
    "SACM", "XMI", "OMG", "MOF", "UML", "EMF", "GSN", "CAE", "OCL",
    "AssuranceCasePackage", "ArgumentPackage", "ArtifactPackage", "TerminologyPackage",
    "..",
]

# LIB-QA-017: platform APIs that compile for wasm32-unknown-unknown but fail at run time.
# `sacm` denies these lints in its non-test code (crates/sacm/src/lib.rs); the rest of the
# workspace allows them (Cargo.toml [workspace.lints.clippy]).
disallowed-methods = [
    { path = "std::fs::canonicalize", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::copy", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::create_dir", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::create_dir_all", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::exists", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::hard_link", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::metadata", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::read", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::read_dir", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::read_link", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::read_to_string", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::remove_dir", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::remove_dir_all", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::remove_file", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::rename", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::set_permissions", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::soft_link", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::symlink_metadata", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::write", reason = "no file system on wasm32-unknown-unknown: return bytes or text" },
    { path = "std::path::Path::exists", reason = "no file system on wasm32-unknown-unknown; lexical Path methods are fine" },
    { path = "std::path::Path::try_exists", reason = "no file system on wasm32-unknown-unknown; lexical Path methods are fine" },
    { path = "std::path::Path::is_file", reason = "no file system on wasm32-unknown-unknown; lexical Path methods are fine" },
    { path = "std::path::Path::is_dir", reason = "no file system on wasm32-unknown-unknown; lexical Path methods are fine" },
    { path = "std::path::Path::is_symlink", reason = "no file system on wasm32-unknown-unknown; lexical Path methods are fine" },
    { path = "std::path::Path::metadata", reason = "no file system on wasm32-unknown-unknown; lexical Path methods are fine" },
    { path = "std::path::Path::symlink_metadata", reason = "no file system on wasm32-unknown-unknown; lexical Path methods are fine" },
    { path = "std::path::Path::canonicalize", reason = "no file system on wasm32-unknown-unknown; lexical Path methods are fine" },
    { path = "std::path::Path::read_link", reason = "no file system on wasm32-unknown-unknown; lexical Path methods are fine" },
    { path = "std::path::Path::read_dir", reason = "no file system on wasm32-unknown-unknown; lexical Path methods are fine" },
    { path = "std::thread::spawn", reason = "no threads on wasm32-unknown-unknown" },
    { path = "std::thread::sleep", reason = "no threads on wasm32-unknown-unknown" },
    { path = "std::thread::scope", reason = "no threads on wasm32-unknown-unknown" },
    { path = "std::process::exit", reason = "no processes on wasm32-unknown-unknown; a library returns errors" },
    { path = "std::process::abort", reason = "no processes on wasm32-unknown-unknown; a library returns errors" },
    { path = "std::env::var", reason = "no environment on wasm32-unknown-unknown: take options as arguments" },
    { path = "std::env::var_os", reason = "no environment on wasm32-unknown-unknown: take options as arguments" },
    { path = "std::env::vars", reason = "no environment on wasm32-unknown-unknown: take options as arguments" },
    { path = "std::env::vars_os", reason = "no environment on wasm32-unknown-unknown: take options as arguments" },
    { path = "std::env::args", reason = "no environment on wasm32-unknown-unknown: take options as arguments" },
    { path = "std::env::args_os", reason = "no environment on wasm32-unknown-unknown: take options as arguments" },
    { path = "std::env::current_dir", reason = "no environment on wasm32-unknown-unknown: take paths as arguments" },
    { path = "std::env::set_current_dir", reason = "no environment on wasm32-unknown-unknown" },
    { path = "std::env::temp_dir", reason = "no environment on wasm32-unknown-unknown" },
]
disallowed-types = [
    { path = "std::fs::File", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::OpenOptions", reason = "no file system on wasm32-unknown-unknown: take bytes or text" },
    { path = "std::fs::DirEntry", reason = "no file system on wasm32-unknown-unknown" },
    { path = "std::fs::ReadDir", reason = "no file system on wasm32-unknown-unknown" },
    { path = "std::thread::Builder", reason = "no threads on wasm32-unknown-unknown" },
    { path = "std::process::Command", reason = "no processes on wasm32-unknown-unknown" },
    { path = "std::net::TcpListener", reason = "no sockets on wasm32-unknown-unknown" },
    { path = "std::net::TcpStream", reason = "no sockets on wasm32-unknown-unknown" },
    { path = "std::net::UdpSocket", reason = "no sockets on wasm32-unknown-unknown" },
    { path = "std::time::Instant", reason = "no clock on wasm32-unknown-unknown (it panics); output must be deterministic" },
    { path = "std::time::SystemTime", reason = "no clock on wasm32-unknown-unknown (it panics); output must be deterministic" },
]
