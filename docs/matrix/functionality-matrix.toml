acceptance = [
  "For one input per refusal-list entry, read strictly, `code()` is the code stated, and for every entry a tolerant read keeps, the strict refusal's code equals the code of the tolerant Warning at the same location. `OtherSacmNamespace`, `OtherXmiNamespace` and `Encoding` give `Unsupported` with SACM-XMI-002, SACM-XMI-015 and SACM-XML-002 in both modes. `WriteError` gives SACM-XMI-001 for `NoRoot`, SACM-XML-003 for `UnrepresentableCharacter`, SACM-XMI-016 for `Invalid` and SACM-XMI-006 for `PreservedContent`.",
  "A strict read of an AssuranceCasePackage `case` that holds `<terminologyPackage xmi:type=\"sacm:TerminologyPackageInterface\" xmi:id=\"ti\"/>` at line 3 is `Unsupported`. It has `code()` SACM-XMI-014, `template()` `SACM-XMI-014/unread-kind-in-root` and `arguments()` `[class: \"TerminologyPackageInterface\", element: \"terminologyPackage\", container: \"sacm:AssuranceCasePackage\", row: \"SACM23-TERM-007\"]`. Its `Display` is `the reader cannot represent the input at line 3, column 3: the TerminologyPackageInterface \"terminologyPackage\" in the root element \"sacm:AssuranceCasePackage\" is not read in this release (a limit of this version; SACM23-TERM-007 reads it)`.",
  "Before any code changes, the slice records `tests/data/golden/messages-0.1.0.txt`: for every fixture under `crates/sacm/tests/data` and `crates/sacm-cli/tests/data`, the `Display` of the refusal, or of each diagnostic, from a strict read, a tolerant read and `validate`. Afterwards every line is unchanged.",
  "A table-driven test (`crates/sacm/tests/message_templates.rs`) gives one input for each of the 102 refusal templates and checks `code()`, `template()`, every argument by name, kind and value, and `Display`. The three `SACM-SEC-002` capacity templates and the three `SACM-SEC-002/unheld-*` templates, which no input reaches through the public API, are built instead by a unit test of their crate-private constructors.",
  "A crate unit test checks the template table: ids are unique, match `SACM-[A-Z]+-[0-9]{3}/[a-z0-9]+(-[a-z0-9]+)*`, and each id's prefix is its code's text; each const is named after its id; every placeholder names a declared argument: `{n}` and `{n:?}` take Text, `{n:04X}` takes Count; arguments are declared in the order they first appear in the pattern, and every declared argument appears, except `row`; among the refusal templates, `row` is declared last exactly on the `Unsupported` templates of SACM-XMI-014, -007, -002 and -015, whose label names it; a diagnostic template declares `row` only where its pattern names it (LIB-API-018); the renderer writes Text unchanged for `{n}`, Debug-quoted for `{n:?}`, and Count as decimal or as at least 4 uppercase hex digits.",
  "`xtask/tests/message_templates.rs` checks two things. First, the `## Message templates` table of docs/sacm/diagnostics.md lists exactly the templates of `crates/sacm/src/diagnostic/template.rs`: id, carrier, argument names and kinds, and English. Second, every template const is named, outside comments, literals and tests, in another file of `crates/sacm/src`. Pure-helper tests on synthetic inputs report a missing, extra or reordered argument, a different English, a missing row, and an unused const.",
  "With `serde`, the golden files `read-errors.json` and `write-errors.json` hold one value per variant (`Unsupported` once per code) and read back `==`. These inputs are refused: an unknown `type` or key, or a missing key; a `code` that is not the variant's and its template's; a template of another variant, or an unknown template; arguments that are missing, extra, out of order, or of the wrong kind; a `character` that is not one character.",
  "`sacm validate` prints `xmi-attribute.sacm.xmi`'s refusal as `SACM-XMI-003` and `latin-1.sacm.xmi`'s as `SACM-XML-002`, where 0.1.0 printed `error`. JSON writes those codes for the strict refusal, not `\"code\":null`.",
  "The catalog gains: live rows for SACM-XMI-002 (`Code::XMI_NAMESPACE_NOT_PINNED`), SACM-XMI-015 (`XMI_WRAPPER_NAMESPACE`), SACM-XMI-016 (`XMI_STRICT_SAVE_INVALID`), SACM-XML-002 (`XML_ENCODING_NOT_READ`), SACM-XML-003 (`XML_UNREPRESENTABLE_CHARACTER`) and SACM-SEC-002 (`PARSER_LIMIT`); rows for SACM-XMI-001, -003, -007 and -014 that name their refusal uses. LIB-DIAG-002 passes with 42 live codes (41 before SACM23-VAL-009 made SACM-EXPR-001 live).",
]

[[row]]
id = "LIB-API-018"
area = "API"
milestone = "M4"
title = "Every diagnostic carries its template and arguments"
requirement = "Every `Diagnostic` the crate emits has `template()` and `arguments()`, as LIB-API-017 defines them. Its `message` is rendered from them by the same crate-private renderer, so the two cannot drift, and is byte-identical to the 0.1.0 message for the same input. A diagnostic built with `test-support`'s `Diagnostic::new`, or read from JSON that has no template, has its code's text as its template and no arguments. Diagnostics order by the seven ADR 0011 keys, then by template, then by arguments. With `serde`, a `Diagnostic` writes `template` and `arguments` after `message` (ADR 0030 amendment 3), and 0.1.0 JSON still reads, with those defaults."
source = "GitHub issue #82; the maintainer's decisions Q8, Q9 and Q11, 2026-11-17; D-DIAG; ADR 0011; ADR 0030 amendment 3"
kind = "api"
code = ["crates/sacm/src/diagnostic.rs", "crates/sacm/src/diagnostic/template.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/validation/names.rs", "crates/sacm/src/validation/descriptions.rs", "crates/sacm/src/validation/multi_lang.rs", "crates/sacm/src/validation/repeats.rs", "crates/sacm/src/validation/terminology.rs", "crates/sacm/src/validation/expressions.rs", "crates/sacm/src/validation/constraints.rs", "crates/sacm/src/validation/references.rs", "crates/sacm/src/validation/relationships.rs", "crates/sacm/src/validation/gid.rs", "crates/sacm/src/validation/homogeneity.rs", "crates/sacm/src/validation/ids.rs", "docs/sacm/diagnostics.md"]
