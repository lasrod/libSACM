[[row]]
id = "LIB-TOOL-005"
area = "TOOL"
milestone = "M0"
title = "Verification records carry a per-row verdict the gate reads"
requirement = "A verified row's verification record must state a PASS verdict for that specific row in a machine-readable line, and the gate checks the verdict rather than mere mention of the id."
source = "Verification 0001 follow-up (a record saying 'LIB-X-001: FAIL' satisfied the substring check)"
kind = "tooling"
status = "implemented"
code = ["xtask/src/matrix.rs"]
acceptance = [
  "A verdict line is a line, outside fenced code blocks, that after removing trailing spaces and tabs is exactly `- Row verdict: <ROW-ID>: <VERDICT>`. <VERDICT> is one of PASS, FAIL or OPEN. Indented, block-quoted and fenced lines are not verdict lines.",
  "A verified row passes only if its cited record contains exactly one verdict line for that row, and that line says PASS. The old check, which accepted any mention of the id, is removed.",
  "Each failure is reported with the row id and the record path: no verdict line for the row; more than one verdict line for the row (with the count); a verdict other than PASS (naming it); and a verdict line for a similar id, such as `LIB-TOOL-0011` or `LIB-TOOL-001x`, which does not count.",
  "A line that starts with `- Row verdict:` but is not a well-formed verdict line is reported as malformed, with the record path and its 1-based line number.",
  "Every verified row in the real matrix passes. The lead adds the verdict lines to the existing records, the record template (`.claude/skills/sacm-slice/references/verification-record.md`) and `docs/matrix/README.md` rule 5.",
]
depends_on = ["LIB-TOOL-001"]
tests = [
  "xtask/tests/gate_hardening.rs::lib_tool_005_a_single_pass_line_for_the_row_passes",
  "xtask/tests/gate_hardening.rs::lib_tool_005_a_record_without_a_verdict_line_fails_the_row",
  "xtask/tests/gate_hardening.rs::lib_tool_005_a_record_that_only_mentions_the_row_fails",
  "xtask/tests/gate_hardening.rs::lib_tool_005_more_than_one_verdict_line_is_reported_with_the_count",
  "xtask/tests/gate_hardening.rs::lib_tool_005_a_verdict_other_than_pass_is_reported_by_name",
  "xtask/tests/gate_hardening.rs::lib_tool_005_a_verdict_line_for_a_similar_id_does_not_count",
  "xtask/tests/gate_hardening.rs::lib_tool_005_a_verdict_line_for_a_different_row_does_not_count",
  "xtask/tests/gate_hardening.rs::lib_tool_005_indented_and_block_quoted_lines_are_not_verdict_lines",
  "xtask/tests/gate_hardening.rs::lib_tool_005_lines_in_fenced_code_blocks_are_not_verdict_lines",
  "xtask/tests/gate_hardening.rs::lib_tool_005_a_pass_line_inside_a_nested_mismatched_or_indented_fence_does_not_count",
