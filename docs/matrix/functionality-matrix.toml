[[row]]
id = "SACM23-XMI-011"
area = "XMI"
milestone = "M1"
title = "String values survive XML exactly"
requirement = "Every string value written as an XML attribute (today an element id and a name's `lang` and `content`) reads back exactly. `xmi::write` escapes `&`, `<`, `>` and `\"`, and writes TAB, LF and CR as `&#9;`, `&#10;` and `&#13;`, so XML 1.0 §3.3.3 attribute normalisation cannot change them. A string holding a character outside XML 1.0 `Char` makes `xmi::write` fail with `UnrepresentableCharacter` naming the element and the character, and nothing is returned. For a LangString, an absent `lang` or `content` is written as no attribute and reads back absent; an empty one is written as `=\"\"` and reads back empty (ADR 0012). The reader keeps every value exactly, with no trimming or normalisation beyond what XML 1.0 itself does. Every later LangString role inherits these rules. C++ writes absent and empty alike (`xmi_writer.cpp:260-265`)."
source = "formal/23-05-08 §8.3 (p. 18) \"lang:String[0..1] - a field to indicate the language used in the string.\", \"content:String[0..1] - the content of the string\"; XML 1.0 (Fifth Edition) §2.2 [2] Char, §3.3.3 \"For a character reference, append the referenced character to the normalized value.\" and \"For a white space character (#x20, #xD, #xA, #x9), append a space character (#x20) to the normalized value.\"; XMI 2.5.1 §9.5 (p. 60) \"XML attributes are normalized by XML processors\"; D-RT; D-PRESERVE; ADR 0012; ADR 0017 W3"
kind = "xmi"
status = "verified"
depends_on = ["SACM23-BASE-001", "SACM23-XMI-007", "SACM23-XMI-001"]
acceptance = [
  "All nine absent/empty/non-empty combinations of a name's `lang` and `content` round-trip through `xmi::write` and `xmi::read` on a named AssuranceCasePackage or ArgumentPackage root to an equal `LangString`. Absent fields write `<name />`; `lang=\"\"` and `content=\"\"` appear literally.",
  "Reading `<name lang=\"\" />` gives `lang` `Some(\"\")` and `content` `None`; reading `<name />` gives `LangString::default()`.",
  "A `lang` or `content` holding `& < > \" '`, TAB, LF, CR, CRLF, U+0085, U+2028, a character outside the BMP and a leading or trailing space round-trips exactly. The output contains `&amp;`, `&lt;`, `&gt;`, `&quot;`, `&#9;`, `&#10;` and `&#13;`, and no literal TAB, LF or CR inside an attribute value.",
  "Reading `lang` or `content` set to `\"a&#9;b&#10;c&#13;d\"` gives `\"a\\tb\\nc\\rd\"`; the same value with a literal TAB, LF or CR reads as spaces (XML 1.0 §3.3.3); `lang=\" en \"` reads with its spaces kept.",
  "A name whose `lang` or `content` holds U+0000, U+0008, U+000B, U+000C, U+001F, U+FFFE or U+FFFF makes `xmi::write` fail with `UnrepresentableCharacter` naming the owning element and the character, and no output is returned, on a root and on a nested Claim.",
  "Within one element the id is checked before the name, and `lang` before `content`; the first failure is the result (ADR 0017).",
  "The same named document writes identical bytes twice and matches a golden file.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "crates/sacm/src/xmi/roots.rs", "docs/adr/0017-xmi-writer.md"]
tests = [
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_011_all_nine_absent_empty_and_non_empty_lang_and_content_combinations_round_trip",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_011_an_empty_lang_and_an_empty_name_element_read_to_exactly_those_fields",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_011_content_with_markup_line_breaks_non_bmp_and_edge_spaces_round_trips_exactly",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_011_lang_with_markup_line_breaks_non_bmp_and_edge_spaces_round_trips_exactly",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_011_character_references_read_as_the_characters_and_literal_white_space_as_spaces",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_011_a_character_outside_xml_char_in_lang_or_content_is_refused_naming_the_element",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_011_within_one_element_the_id_is_checked_before_the_name_and_lang_before_content",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_011_a_named_document_writes_identical_bytes_twice_and_matches_the_golden_file",
]
verification = "docs/verification/0026-m1-names-in-xmi.md"

[[row]]
id = "SACM23-XMI-012"
area = "XMI"
milestone = "M1"
title = "The name containment in XMI"
requirement = "`xmi::write` writes the name of every ModelElement that has one as exactly one `name` child: in no namespace, with no type attribute unless it holds an ExpressionLangString (`xmi:type=\"sacm:ExpressionLangString\"`, SACM23-BASE-009), and no `xmi:id` unless one was read (SACM23-XMI-022), as the element's first child (before any containment child), carrying `lang` and then `content` (SACM23-XMI-011 rules), then an ExpressionLangString's `expression` (SACM23-BASE-009). An element whose name is missing is written with no `name` child, and nothing is invented (ADR 0013). `xmi::read` reads one `name` child of every element it reads (a root, SACM23-XMI-001, or a child, SACM23-XMI-016) into that element's name: no `name` child gives no name, and `<name/>` gives a name whose fields are absent. The `name` child may carry only `lang` and `content` in no namespace, an `xmi:id` (SACM23-XMI-022), an `xmi:type` or `xsi:type` naming `LangString` or `ExpressionLangString` and, on an ExpressionLangString, its `expression` (SACM23-BASE-009), and may contain only the value elements `lang` and `content` (SACM23-XMI-014), an ExpressionLangString's one `expression` reference element (SACM23-XMI-015), white space, comments and processing instructions. Anything else on or in it is never dropped and never reinterpreted. Conforming content not read yet (`xmi:uuid` and `xmi:label`, SACM23-XMI-019) is refused as `ReadError::Unsupported` at its location (LIB-API-011). Content that does not conform (any other attribute, including `xml:lang`, which is not SACM `lang`; a type naming a class that is not a LangString, or whose `sacm` prefix is rebound; an element child other than the value elements `lang` and `content`, SACM23-XMI-014, LIB-COMPAT-008) keeps the whole `name` as preserved content of its owner, which then has no name, with one SACM-XMI-003 at the `name` start tag; a `name` element in a namespace is preserved at its start tag (LIB-COMPAT-003, ADR 0033). Non-white-space text, and a single `value` or `content lang`, are LIB-COMPAT-008's C++ shapes (slice 0049). A missing name is a validation Error (SACM23-VAL-018); a strict save writes the element (LIB-COMPAT-007, ADR 0035 D4)."
source = "formal/23-05-08 §8.6 (p. 19) \"name:LangString[1] (composition) - the name of the ModelElement.\"; ptc/22-03-13 Base::ModelElement name (Association \"name\", D8); XMI 2.5.1 §7.8.6 (p. 19) \"Each property that is a composite is represented by an XML element, but not by an XML attribute.\", §7.8.4 (pp. 17-18), rule 2a (p. 63); XML 1.0 §2.12 (`xml:lang`); D-PRESERVE; ADR 0013; ADR 0015; ADR 0017 amendment 1. C++ always writes `<name>`, matches it by local name and keeps the last of two names (`xmi_writer.cpp:255-256`, `xmi_reader.cpp:1182-1218`)"
kind = "xmi"
status = "verified"
depends_on = ["SACM23-XMI-001", "SACM23-BASE-003", "SACM23-XMI-011", "LIB-TOOL-020", "SACM23-XMI-002"]
notes = "Slice 0026: the LangString `xmi:id` rule moved to SACM23-XMI-022 and the second-name rule to SACM23-XMI-021; both are `Unsupported` until then. C++ behaviours not matched: the last of two names wins (`xmi_reader.cpp:1182-1218`, a silent drop), text read as content (`:805-808`, LIB-COMPAT-008), and matching `name` by local name only. Only a no-namespace `name` is read (XMI 2.5.1 rule 2a is ambiguous; reversible, with SACM23-XMI-016). Slice 0037: the element form of `lang` and `content` (and of `assertionDeclaration`) is read now (SACM23-XMI-014); reworded and re-checked there. Slice 0039: a second `name` is `RepeatedValue` (SACM23-XMI-021) and `xmi:id` on `name` is read (SACM23-XMI-022); reworded, re-check there. Its tests listing those two as `Unsupported` move to the new rows. Slice 0065: reworded for ExpressionLangString (SACM23-BASE-009); re-check there."
acceptance = [
  "Write: a `name` child is written on a named root and on named elements at every depth, one per ModelElement kind the document can hold, as the first child, with attributes `lang` then `content`.",
  "Write: an element whose only content is its name is written as a start tag, one `<name … />` line and an end tag; an element with neither a name nor children stays `<x … />`.",
  "Write: an element with no name is written with no `name` child, and a UtilityElement never gets one.",
  "Write: no type attribute is written on a `name` that holds a plain LangString (an ExpressionLangString's is SACM23-BASE-009's), and an `xmi:id` only when one was read (SACM23-XMI-022).",
  "Read: AssuranceCasePackage and ArgumentPackage roots, bare and wrapped, with `<name lang=\"en\" content=\"Case\"/>` read to that name; a root without `name` reads to no name; `<name/>` reads to `LangString::default()`.",
  "Read: a `name` holding white space, comments or processing instructions is accepted.",
  "Read: `xmi:label` and `xmi:uuid` on `name` are each `Unsupported` at the offending construct, and no document is returned; `xml:lang=\"en\"`, `foo` or a prefixed `sacm:lang` on `name`, `xmi:type=\"sacm:MultiLangString\"` and an element child such as `<foo/>` each keep the whole `name` as preserved content of the owner, which has no name, with one SACM-XMI-003 at the `name` start tag in both modes, and `<sacm:name/>` is preserved at its start tag (LIB-COMPAT-003) (a second `name` is `RepeatedValue`, SACM23-XMI-021, and an `xmi:id` on `name` is read, SACM23-XMI-022); `<name><value content=\"x\"/></name>` (since slice 0049 a LIB-COMPAT-008 shape: SACM-XMI-012 tolerant, `LegacyShape` strict; two entries keep the whole `name` as preserved content); `<name>text</name>` (since slice 0049 a LIB-COMPAT-008 shape: SACM-XMI-012 tolerant, `LegacyShape` strict) (`xmi:type=\"sacm:ExpressionLangString\"` is read since slice 0065, SACM23-BASE-009).",
  "Read: `xmi:type` or `xsi:type` naming `sacm:LangString` on `name` is accepted, resolved in the scope of the `name` element as for roots (SACM23-XMI-002): a prefix declared on `name` itself is accepted, and `sacm` rebound to another URI on `name` keeps the whole `name` as preserved content of the owner, with SACM-XMI-003 at the `name` start tag (LIB-COMPAT-003).",
  "Read: a `name` with `xmlns=\"\"` under a root in a default SACM namespace, and the same `name` under a `sacm:`-prefixed root, read to that name, equal to the plain form (Namespaces 1.0 §6.2).",
  "A minimized fixture in the third-party form `<name lang=\"English\" content=\"…\"/>` on a pinned-namespace root reads and round-trips.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "crates/sacm/src/xmi/roots.rs", "docs/adr/0017-xmi-writer.md"]
tests = [
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_every_model_element_kind_at_every_depth_is_written_with_its_name_first",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_an_element_holding_only_its_name_has_a_start_tag_a_name_line_and_an_end_tag",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_an_element_without_a_name_and_every_utility_element_have_no_name_child",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_no_xmi_id_or_type_attribute_is_ever_written_on_name",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_a_bare_or_wrapped_package_root_reads_its_name_child",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_white_space_comments_and_processing_instructions_in_name_are_accepted",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_an_attribute_other_than_lang_and_content_on_name_is_unsupported_or_preserved",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_a_type_naming_another_class_on_name_is_preserved_at_the_name",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_an_element_child_in_name_is_preserved_with_the_name",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_a_name_element_in_a_namespace_is_preserved_at_the_element",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_a_type_naming_lang_string_on_name_is_accepted",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_the_type_on_name_is_resolved_in_the_scope_of_the_name_element",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_a_name_undeclaring_the_default_namespace_reads_as_the_plain_form",
  "crates/sacm/tests/xmi_names.rs::sacm23_xmi_012_a_minimized_third_party_name_reads_and_round_trips",
]
