[[row]]
id = "LIB-TOOL-013"
area = "TOOL"
milestone = "M0"
title = "Matrix check names an overridden root"
requirement = "When `XTASK_ROOT` overrides the repository root, `cargo xtask matrix check` says which root it checked, in both the OK line and the error, so a run against another tree cannot be mistaken for a check of the repository."
source = "Verification 0004 round 1 follow-up"
kind = "tooling"
status = "verified"
code = ["xtask/src/lib.rs", "xtask/src/main.rs", "xtask/src/matrix.rs"]
acceptance = [
  "The binary records where its root came from. With `XTASK_ROOT` set, `cargo xtask matrix check` names the root it checked. Without it, the output is unchanged: `functionality matrix OK: <n> rows`, and the LIB-TOOL-010 error. The rule depends on where the root came from, not on its value: an `XTASK_ROOT` equal to the build root is still named.",
  "Under `XTASK_ROOT=<p>`, a passing check writes exactly `functionality matrix OK: <n> rows (root: <p>)` and a newline to stdout. `<p>` is the root as `Path::display` shows it, with control characters escaped as in LIB-TOOL-010.",
  "Under `XTASK_ROOT=<p>`, the first line of a failing check's error is `functionality matrix: <n> problem(s) (root: <p>)`. The problem lines are unchanged. When the matrix cannot be read or parsed, the one-line load error of LIB-TOOL-014 ends with ` (root: <p>)`. The binary prints the error with the `xtask: ` prefix.",
  "An `XTASK_ROOT` that is set but empty is an error, not a root: the binary prints `xtask: XTASK_ROOT is set but empty` on stderr, writes nothing to stdout, runs no command and exits with a failure status. This holds for every command.",
  "The other commands (`render`, `next`, `status`, `fetch-spec`, `help`) do not change. The library function `xtask::run(args, root, out)` keeps its signature and its unnamed output. The override reaches the library through a new entry point that the binary calls. Tests drive both that entry point and the binary.",
]
depends_on = ["LIB-TOOL-010"]
tests = [
  "xtask/tests/reporting.rs::lib_tool_013_a_passing_check_from_the_build_root_writes_the_unnamed_ok_line",
