[[row]]
id = "LIB-EDIT-006"
area = "EDIT"
milestone = "M2"
title = "Package delete policies"
requirement = "Deleting a non-empty package requires an explicit policy — reject if non-empty (SACM-CMD-006) or delete recursively — and cross-package references are reported and handled under an explicit policy (SACM-CMD-007)."
source = "D-POLICY; ADR 0031 (the maintainer, 2026-11-15); assurance-forge `commands/policies.h`, `commands/operations.h:362`, `commands.cpp:1771-2140`, `document.cpp:36-111`"
kind = "editing"
status = "verified"
verification = "docs/verification/0048-m2-batches-and-delete.md"
depends_on = ["LIB-EDIT-004"]
acceptance = [
  "`RejectIfNonEmpty` refuses an element that contains any non-UtilityElement or preserved child element (LIB-COMPAT-003) with `EditError::NotEmpty` (SACM-CMD-006) giving the count of the non-UtilityElements and preserved child elements it contains at any depth (a preserved element counts once with its subtree; preserved attributes and text count for nothing); a Claim holding only Notes and Descriptions is not refused. `DeleteRecursively` deletes the whole subtree.",
  "A reference crosses a package boundary when the holder's nearest package (itself or its closest package, interface or binding ancestor) is not the target's; a nested package is a different package.",
  "`RejectIfExternalReferencesExist` refuses a crossing dangling reference with `EditError::CrossPackageReference` (SACM-CMD-007); `ApplyReferencePolicy` hands crossing references to the reference policy.",
  "Check order: ElementNotFound, then CMD-006, then the first refused dangling reference in list order (CMD-007 if it crosses and is rejected, otherwise CMD-002).",
]
code = ["crates/sacm/src/edit/delete.rs", "docs/adr/0031-delete-previews-and-revisions.md"]
tests = [
  "crates/sacm/tests/delete.rs::lib_edit_006_reject_if_non_empty_refuses_a_package_with_its_count_of_contained_elements",
  "crates/sacm/tests/delete.rs::lib_edit_006_reject_if_non_empty_refuses_any_element_that_contains_a_model_element",
  "crates/sacm/tests/delete.rs::lib_edit_006_an_element_holding_only_utility_elements_is_not_refused",
  "crates/sacm/tests/delete.rs::lib_edit_006_delete_recursively_deletes_the_whole_subtree_and_references_within_it_do_not_refuse",
  "crates/sacm/tests/delete.rs::lib_edit_006_reject_if_external_references_exist_refuses_a_crossing_reference_with_cmd_007",
  "crates/sacm/tests/delete.rs::lib_edit_006_apply_reference_policy_hands_crossing_references_to_the_reference_policy",
  "crates/sacm/tests/delete.rs::lib_edit_006_a_nested_package_is_a_different_package",
  "crates/sacm/tests/delete.rs::lib_edit_006_the_nearest_package_is_the_element_itself_or_its_closest_package_interface_or_binding_ancestor",
  "crates/sacm/tests/delete.rs::lib_edit_006_the_first_refused_reference_in_list_order_decides_between_cmd_007_and_cmd_002",
  "crates/sacm/tests/delete.rs::lib_edit_006_the_check_order_is_element_not_found_then_not_empty_then_references",
  "crates/sacm/tests/edit_atomic.rs::lib_edit_006_the_set_deletes_non_empty_elements_and_crossing_references_under_the_permissive_policies",
  "crates/sacm/tests/serde.rs::lib_edit_006_not_empty_and_cross_package_reference_are_written_with_their_codes",
]

[[row]]
id = "LIB-EDIT-007"
area = "EDIT"
milestone = "M2"
title = "Stale previews are rejected"
requirement = "`Document::revision()` returns an opaque `Revision` identifying the document's state within the process. `edit::apply_preview(&mut Document, &Preview)` refuses a preview taken at another revision with `EditError::PreviewExpired` (SACM-CMD-003) and changes nothing; otherwise it applies the preview's operation and returns a `Mutation` equal to `preview.mutation()`."
source = "D-PREVIEW; ADR 0031 (the maintainer, 2026-11-15); assurance-forge `commands/policies.h`, `commands/operations.h:362`, `commands.cpp:1771-2140`, `document.cpp:36-111`"
kind = "editing"
status = "verified"
verification = "docs/verification/0048-m2-batches-and-delete.md"
depends_on = ["LIB-EDIT-004"]
acceptance = [
  "Revisions: a new, default or read document has a revision distinct from every other document's; `Clone` copies it; `==` ignores it; every successful `apply`, `apply_preview`, `batch` and `apply_all` (even one that changes nothing) gives a new one; a refusal or a rolled-back batch keeps it.",
  "`apply_preview` after any successful change gives `PreviewExpired` and leaves the document `==` to before, with the same next ids and revision.",
  "A preview taken on a clone is refused by the original once either has changed.",
  "A preview applied at once returns a `Mutation` equal to `preview.mutation()`.",
  "Tests compare revisions only for equality, never their values.",
]
code = ["crates/sacm/src/model/revision.rs", "crates/sacm/src/edit/preview.rs", "docs/adr/0031-delete-previews-and-revisions.md"]
tests = [
  "crates/sacm/tests/preview.rs::lib_edit_007_apply_preview_takes_the_document_mutably_and_the_preview_by_reference",
  "crates/sacm/tests/preview.rs::lib_edit_007_new_default_and_read_documents_have_distinct_revisions",
  "crates/sacm/tests/preview.rs::lib_edit_007_clone_copies_the_revision",
  "crates/sacm/tests/preview.rs::lib_edit_007_equality_ignores_the_revision",
  "crates/sacm/tests/preview.rs::lib_edit_007_every_successful_apply_gives_a_new_revision_even_one_that_changes_nothing",
  "crates/sacm/tests/preview.rs::lib_edit_007_every_successful_apply_preview_batch_and_apply_all_gives_a_new_revision",
  "crates/sacm/tests/preview.rs::lib_edit_007_a_refusal_or_a_rolled_back_batch_keeps_the_revision",
  "crates/sacm/tests/preview.rs::lib_edit_007_apply_preview_after_any_successful_change_is_preview_expired_and_changes_nothing",
  "crates/sacm/tests/preview.rs::lib_edit_007_a_refusal_leaves_a_preview_applicable",
  "crates/sacm/tests/preview.rs::lib_edit_007_a_preview_taken_on_a_clone_is_refused_by_the_original_once_either_has_changed",
  "crates/sacm/tests/preview.rs::lib_edit_007_a_preview_of_another_document_is_refused",
  "crates/sacm/tests/preview.rs::lib_edit_007_a_preview_applied_at_once_returns_its_mutation",
  "crates/sacm/tests/preview.rs::lib_edit_007_revision_is_a_comparable_thread_safe_value",
  "crates/sacm/tests/batch.rs::lib_edit_007_a_committed_batch_gives_a_new_revision_even_when_it_changes_nothing",
  "crates/sacm/tests/batch.rs::lib_edit_007_a_rolled_back_batch_and_a_refused_apply_all_keep_the_revision",
  "crates/sacm/tests/serde.rs::lib_edit_007_a_real_preview_expired_round_trips_with_its_revisions_as_json_numbers",
]

[[row]]
id = "LIB-EDIT-008"
area = "EDIT"
milestone = "M2"
title = "Attribute edits"
requirement = "Operations on an existing element set its `name` (any ModelElement; a full LangString, any of the nine absent/empty/non-empty `lang` x `content` combinations, held exactly; it can never be removed, D-VAL-LAYER), its `gid` (any SACMElement; absent, `\"\"` or any string, held exactly), `isCitation` and `isAbstract` (any SACMElement, each independently of `citedElement` and `abstractForm`), `isCounter` (AssertedRelationship kinds only) and `assertionDeclaration` (Assertion kinds only, any of the six literals). Each is atomic and refuses an unknown element (SACM-CMD-001) and a kind that lacks the feature (SACM-CMD-008), in that order; `SetName` then checks an ExpressionLangString name as SACM23-BASE-009 states. It never refuses a content finding: gid uniqueness, the §8.2 citation and abstract-form rules, the §8.6 implementationConstraint rule or `asCited`. A replaced name keeps its `xmi:id` (`name_id`); a name holds no value ids (SACM23-XMI-014). `changed_ids` is `[element]` exactly when `semantic_compare` reports a difference. Descriptions, notes and tagged values: their content is LIB-EDIT-012, adding them LIB-EDIT-001, removing them LIB-EDIT-004/005."
source = "formal/23-05-08 §8.6 (p. 20) \"name:LangString[1] (composition) - the name of the ModelElement.\"; §8.2 (p. 18) \"gid:String[0..1] - a unique identifier that is unique within the scope of the model instance\", \"isCitation[0..1]=false - a flag to indicate whether the SACMElement cites another SACMElement.\", \"isAbstract[0..1]=false - a flag to indicate whether the SACMElement is considered to be abstract.\"; §11.10 (p. 39) \"assertionDeclaration:AssertionDeclaration[1] = asserted - the declaration indicating the state of the Assertion.\"; §11.13 (p. 40) \"isCounter:Boolean[1] = false\"; D-VAL-LAYER; D-ATOMIC; D-RESULT; D-PRESERVE; ADR 0019; assurance-forge `operations.h:109-113, 223-245`, `commands.cpp:620-648, 1343-1413, 1528-1578`"
kind = "editing"
status = "verified"
verification = "docs/verification/0045-m2-set-operations.md"
depends_on = ["LIB-EDIT-002", "LIB-EDIT-003", "SACM23-BASE-003", "SACM23-BASE-005", "SACM23-BASE-006", "SACM23-BASE-007", "SACM23-BASE-008", "SACM23-ARG-002", "SACM23-ARG-007", "SACM23-XMI-017"]
notes = "Slice 0040: when a gid can be set, test that a gid holding a character XML 1.0 cannot represent fails the write with `WriteAttribute::Gid` (moved from SACM23-BASE-006). Slice 0045 research: content and key edits split to LIB-EDIT-012; ExpressionLangString names (SACM23-BASE-009) will widen the name setter. Maintainer decisions of 2026-11-15 (slice 0045): a kind without the feature is the new SACM-CMD-008 and a bad order list the new SACM-CMD-009; `citedElement` and `isCitation` are set independently (unlike C++ `SetCitation`); reorder applies to the children of any element and to the roots; typed before-values move to LIB-EDIT-011 (ADR 0019 E10 amended). Lead decisions: a replaced name or content keeps its role element's `xmi:id` and its value ids by position (D-PRESERVE); removing an id removes every occurrence, and an id the end does not hold is refused. Slice 0065: reworded for ExpressionLangString (SACM23-BASE-009); re-check there."
acceptance = [
  "On every ModelElement kind, each of the nine `lang` x `content` combinations can be set as the name; `name()` returns exactly it, and write then read gives an equal document with absent and `\"\"` distinct.",
  "Setting a name on an element read with none removes its SACM23-VAL-018 finding; a replaced name read as `<name xmi:id=\"n1\">` keeps `n1`.",
  "A name on a Description, Note, ImplementationConstraint or TaggedValue is refused as SACM-CMD-008 and the document is `==` to before.",
  "After every `Ok` operation of the LIB-EDIT-002 set, every ModelElement that had a name still has one.",
  "A gid of `None`, `Some(\"\")`, `Some(\" x \")` or one another element holds is accepted on a ModelElement and a UtilityElement and held exactly; a duplicate gives SACM-ID-003 from `validate`; a round trip keeps absent, `\"\"` and the value apart.",
  "A gid holding U+0001 is accepted by the edit, and `xmi::write` then fails with `WriteAttribute::Gid` (moved from SACM23-BASE-006).",
  "`isCitation` and `isAbstract` can be set true and false on every kind, independently of `citedElement` and `abstractForm`; `isCitation=true` alone is held, and `citedElement` without the flag gives SACM-CITE-001 from `validate`.",
  "`isAbstract=true` on an element with an `abstractForm` succeeds and `validate` reports SACM-ABS-001; `isAbstract=false` on an element with an ImplementationConstraint succeeds.",
  "`isCounter` can be set true and false on each of the five relationship kinds; on a Claim, an ArgumentReasoning or a package it is SACM-CMD-008.",
  "Each of the six literals can be set on a Claim and on each relationship kind; `asCited` without a citation is accepted; a non-Assertion is SACM-CMD-008.",
  "An unknown element is SACM-CMD-001; the document is `==` to before and generates the same next ids; an operation failing both checks pins their order.",
  "`changed_ids` is `[element]` when the value differs and `[]` when not (for example `isCounter=false` on a relationship read without it); `created_ids` and `deleted_ids` are empty; each operation has a stable `operation_name()` and joins the LIB-EDIT-002 set.",
]
tests = [
  "crates/sacm/tests/edit_atomic.rs::lib_edit_008_the_attribute_edits_join_the_set_with_every_answer",
  "crates/sacm/tests/edit_atomic.rs::lib_edit_008_no_successful_operation_of_the_set_removes_a_name",
