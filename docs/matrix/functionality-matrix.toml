# libSACM functionality matrix — canonical source.
#
# Rules: docs/matrix/README.md. After editing run:
#   cargo xtask matrix render && cargo xtask matrix check
#
# Row fields: id, area, milestone, title, requirement, source, kind, status,
#   depends_on, acceptance, code, tests, verification, notes.
# Statuses: planned -> analyzed -> tests-failing -> implemented -> verified;
#   or candidate / deferred / out-of-scope (with notes).
# Test citations: "path::function" (function named <row id in snake case>_...) or "doctest:path".

schema_version = 1

# ---------------------------------------------------------------------------
# Milestones (in build order)
# ---------------------------------------------------------------------------

[[milestone]]
id = "M0"
title = "Foundation"
goal = "Workspace, CI gates, matrix gate, reference fetching and agent guard are in place and verified, so every later slice runs on trusted tooling."

[[milestone]]
id = "M1"
title = "Minimal editable vertical slice"
goal = "Create, load, validate, edit and save a strict SACM 2.3 document containing an AssuranceCasePackage, ArgumentPackage and Claims, with semantic round trip, structured diagnostics, safe XML handling and a CLI."

[[milestone]]
id = "M2"
title = "Base model and argumentation"
goal = "All shared Base features (utility elements, gid, citations, abstract forms), the full Argumentation package except modularity, references, the core constraint checks, and previewable destructive editing."

[[milestone]]
id = "M3"
title = "Artifact model"
goal = "The Artifact package: artifact packages, assets, properties, relationships and groups, with their date-typed attributes and model-spelling variants."

[[milestone]]
id = "M4"
title = "Terminology model"
goal = "The Terminology package and ExpressionLangString, so claim text can be tied to controlled vocabulary."

[[milestone]]
id = "M5"
title = "Modularity: interfaces and bindings"
goal = "Package interfaces and bindings for all four package families, with the citation and participant rules as resolved in docs/sacm/decisions.md."

[[milestone]]
id = "M6"
title = "Interoperability and compliance claims"
goal = "Third-party dialects and corpus, metamodel coverage checked against ptc/22-03-13, resource limits, conversion tooling — and the four model compliance points claimed on verified evidence."

[[milestone]]
id = "M7"
title = "1.0 readiness"
goal = "Property tests, fuzzing, coverage, mutation testing, semver checks, release process, complete documentation and guide, and undo/redo — the bar for a stable 1.0 API."

