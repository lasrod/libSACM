[[row]]
id = "LIB-RT-002"
area = "RT"
milestone = "M1"
title = "Load → save → load is lossless"
requirement = "For every valid fixture in scope, `xmi::read`, then `xmi::write` in tolerant mode (`WriteOptions::default().with_mode(Mode::Tolerant)`, which writes every document as held, LIB-COMPAT-007), then `xmi::read` again yields a document that `semantic_compare` finds equal to the first, and the second write gives the same bytes as the first. The fixtures in scope are the files under `crates/sacm/tests/data/sacm23/xmi/` that are not under `invalid/`: the `*-valid.sacm.xmi` files and the golden files, except those listed as pending because they hold kinds no verified row reads yet. In this release no file is pending (slice 0066 reads `golden/nested.golden.sacm.xmi`). A pending file must still be refused by a strict `xmi::read` as `Unsupported`; once it reads, it must leave the pending list and join the round trip."
source = "D-RT \"Semantic round trip (load → save → load yields an equal model) is guaranteed. Textual round trip is not. Output is deterministic\"; ADR 0020"
kind = "xmi"
status = "verified"
verification = "docs/verification/0038-m1-audit-fixes.md"
depends_on = ["LIB-RT-001", "SACM23-XMI-007", "SACM23-XMI-011", "SACM23-XMI-016", "LIB-COMPAT-007"]
acceptance = [
  "Each `*-valid.sacm.xmi` file directly under `xmi/` and each golden file (`golden/*.golden.sacm.xmi`) that is not pending reads, writes, reads back with `semantic_compare` giving `[]`, and writes the same bytes again.",
  "The test enumerates the fixture directory, so a new valid fixture is covered without a test change. It fails if it finds no fixture. It skips nothing under the directory except `invalid/` and the named pending list.",
  "A golden file writes back to its own bytes.",
  "Each pending file is still refused by `xmi::read` with `ReadError::Unsupported`. The test fails once a pending file reads, so the list cannot hide a file the reader handles.",
]
code = ["crates/sacm/src/compare.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/output.rs"]
tests = [
  "crates/sacm/tests/round_trip.rs::lib_rt_002_the_fixture_walk_finds_every_valid_fixture_and_skips_only_invalid_and_pending",
  "crates/sacm/tests/round_trip.rs::lib_rt_002_each_pending_fixture_is_still_refused_as_unsupported",
  "crates/sacm/tests/round_trip.rs::lib_rt_002_the_fixture_walk_fails_when_it_finds_no_fixture",
  "crates/sacm/tests/round_trip.rs::lib_rt_002_every_valid_fixture_reads_writes_reads_back_equal_and_writes_the_same_bytes",
  "crates/sacm/tests/round_trip.rs::lib_rt_002_every_golden_file_writes_back_to_its_own_bytes",
