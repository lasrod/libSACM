[[row]]
id = "SACM23-ARG-004"
area = "ARG"
milestone = "M2"
title = "metaClaim"
requirement = "Every element of an Assertion kind (Claim and the five asserted relationship kinds) holds `metaClaim`, a multi-valued reference end typed Claim (§11.10 `[0..*]`), as ids in document order with repeats (`SacmElement::meta_claims() -> &[ElementId]`, empty by default; ADR 0026, ADR 0027). It is the first multi-valued end (`ReferenceEnd::is_many()`): the attribute keeps every token in order, and each `<metaClaim>` element appends one id; an attribute and elements for the end is `RepeatedValue`. It is written as one attribute, ids separated by one space, after `assertionDeclaration`, and compared in order (`Difference::MetaClaims`). A dangling id is SACM-REF-001 with clause `11.10`; a non-Claim target is held (SACM23-VAL-004). On a non-Assertion it is kept as preserved content of the element, with SACM-XMI-003 (on or in a `name`, the whole `name`; LIB-COMPAT-003). Setting it is LIB-EDIT-009."
source = "formal/23-05-08 §11.10 (p. 39) \"metaClaim:Claim[0..*] - references Claims concerning (i.e., about) the Assertion (e.g., regarding the confidence in the Assertion)\"; ptc/22-03-13 Argumentation::Assertion.metaClaim (0..*, no isOrdered/isUnique); XMI 2.5.1 rule 2b (p. 63) \"for multi-valued properties, there is one XML element for each value\", rule 2h (p. 63), rule 2j (p. 64), §7.8.5 (xsd:IDREFS); D-ORDER; D-STRICT; ADR 0026; ADR 0027; assurance-forge argumentation.h:141-152"
kind = "model"
status = "verified"
