source = "User request: Assurance Forge, GitHub issue #58 (2026-11-14); D-API"
kind = "quality"
status = "verified"
verification = "docs/verification/0046-m2-wasm-and-containment.md"
depends_on = ["LIB-QA-001"]
acceptance = [
  "ci.yml has a job that installs the `wasm32-unknown-unknown` target and runs `cargo build -p sacm --target wasm32-unknown-unknown` and the same with `--all-features`; a regression test fails if either command or the target is removed.",
  "`clippy.toml` lists, as `disallowed-methods` and `disallowed-types` with a reason, the platform APIs that compile for that target but fail at run time: the `std::fs` functions and `File`, `OpenOptions`, `DirEntry` and `ReadDir`; `std::thread::{spawn, sleep, scope}` and `Builder`; `std::process::{exit, abort}` and `Command`; `std::env::{var, var_os, vars, vars_os, args, args_os, current_dir, set_current_dir, temp_dir}`; `std::time::Instant` and `SystemTime`; the `std::path::Path` methods that touch the file system (`exists`, `try_exists`, `is_file`, `is_dir`, `is_symlink`, `metadata`, `symlink_metadata`, `canonicalize`, `read_link`, `read_dir`), while its lexical methods stay allowed; and `std::net::{TcpListener, TcpStream, UdpSocket}`.",
  "The two lints are allowed workspace-wide (the CLI, xtask and test code may use those APIs) and denied in `sacm`'s non-test code by a crate attribute in `crates/sacm/src/lib.rs` (`#![cfg_attr(not(test), deny(...))]`); a regression test fails if the attribute or any listed path is removed.",
