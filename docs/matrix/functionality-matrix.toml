[[row]]
id = "SACM23-XMI-006"
area = "XMI"
milestone = "M1"
title = "Type attribute where the class differs from the role's type"
requirement = "`xmi::write` writes `xmi:type=\"sacm:<Kind>\"` on a child whose class is not known from its role: under the abstract roles `argumentElement`, `artifactElement` and `terminologyElement`, and for an Interface or Binding under one of AssuranceCasePackage's four package roles, and on a `name` or `value` that holds an ExpressionLangString, whose role's type is LangString (SACM23-BASE-009). Any other child, and every root, has no type attribute, other than one kept as preserved content (LIB-COMPAT-003). The value is `sacm:` followed by the exact `ElementKind` name, or `sacm:ExpressionLangString` on a `name` or `value`. XMI's own form is used (XMI 2.5.1 §7.8.8 and rule 2g; SACM sets no `useSchemaExtensions`), not the `xsi:type` that C++ writes; this is the maintainer's decisions of 2026-11-12 (ADR 0017). Import keeps accepting both `xmi:type` and `xsi:type`, as C++ and EMF do."
source = "XMI 2.5.1 §7.6.3 (p. 15) \"The type attribute is used to specify the type of object being serialized, when the type is not known from the model\", §7.8.8 (p. 21) \"XMI specifies that inheritance will be copy-down inheritance and therefore uses xmi:type instead of xsi:type\", Table 7.1 (p. 28) useSchemaExtensions default false, production 2g (p. 62), rule 2g (p. 63) \"You must specify the class name using the \"type\" attribute.\" and \"You may only use the XML schema instance type attribute if org.omg.xmi.useSchemaExtensions is true\" (rule 2g and production 2d, read literally, require the attribute on every element; this row takes §7.6.3, specification defect D11); ptc/22-03-13 (no `org.omg.xmi` tags); ADR 0017; assurance-forge `io/xmi_writer.cpp:435-439` (followed for where the type is written; departed from only in `xmi:` versus `xsi:`)"
kind = "xmi"
status = "verified"
depends_on = ["SACM23-XMI-001", "SACM23-ARG-002"]
notes = "Slice 0023 research: XMI 2.5.1 rule 2g (p. 63) \"You may only use the XML schema instance type attribute if org.omg.xmi.useSchemaExtensions is true\", and §7.8.8 (p. 21) \"uses xmi:type instead of xsi:type\". The default is `false` (Table 7.1, p. 28), and ptc/22-03-13 has no `org.omg.xmi` tags. Decide here whether the pinned export form `xsi:type=\"sacm:<Class>\"` (metamodel-inventory.md) stands, and whether strict import accepts `xsi:type` as a tolerance; it may also be a specification defect. Slice 0023 verification: C++ matches a type value's class name case-insensitively (`kind_from_class_name_ci`, `xmi_reader.cpp:2160`); this crate matches exactly. Name that departure here. Slice 0025 research: strict import requiring the type attribute (SACM-XMI-005) moves to SACM23-XMI-016, which reads containment children; tolerant inference from the element name moves to the new LIB-COMPAT-010. Slice 0065: reworded for ExpressionLangString (SACM23-BASE-009); re-check there."
acceptance = [
  "Every ArgumentationElement kind under an ArgumentPackage is written as `<argumentElement xmi:type=\"sacm:<Kind>\" …>`; likewise every ArtifactElement kind under `artifactElement` and every TerminologyElement kind under `terminologyElement`.",
  "Under each of AssuranceCasePackage's four package roles, a plain package has no type attribute, and its Interface and Binding have `xmi:type=\"sacm:<Kind>\"` (8 cases).",
  "Children of `description`, `implementationConstraint`, `note`, `taggedValue` and `property` have no type attribute, and a root never has one.",
  "The output never contains `xsi:` or `xmlns:xsi` outside preserved content (LIB-COMPAT-003).",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "docs/adr/0017-xmi-writer.md", "crates/sacm/src/model/containment.rs"]
tests = [
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_every_argumentation_element_kind_under_an_argument_package_is_typed",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_every_artifact_element_kind_under_an_artifact_package_is_typed",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_every_terminology_element_kind_under_a_terminology_package_is_typed",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_in_the_four_package_roles_only_interfaces_and_bindings_are_typed",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_utility_property_and_root_elements_have_no_type_attribute",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_output_never_contains_xsi",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_every_child_has_the_role_and_type_its_parent_class_and_kind_give",
]
verification = "docs/verification/0025-m1-xmi-export.md"

[[row]]
id = "SACM23-XMI-007"
area = "XMI"
milestone = "M1"
title = "Deterministic export"
requirement = "Writing the same document always produces identical bytes: UTF-8 without a BOM; the declaration `<?xml version=\"1.0\" encoding=\"UTF-8\"?>`; LF line endings; two spaces of indentation per depth; `<x … />` for an element with no children; a final LF. Attributes are in double quotes, in the order namespace declarations, `xmi:type`, `xmi:id`, `gid`, `isCitation`, `isAbstract`, `citedElement`, `abstractForm`, then, on an Assertion, `assertionDeclaration` and `metaClaim`, then, on an asserted relationship, `isCounter`, `reasoning`, `source` and `target`, then the class's other written reference ends in `ReferenceEnd::ALL` order (not the derived `expression`, which the `name` or `value` holding it carries after `content`, SACM23-BASE-009) (SACM23-ARG-005, -006, -007, -013, SACM23-ART-011 and -010, SACM23-TERM-002, -004, -005, -006), then `version`, `date`, `startTime`, `endTime`, `value` and `externalReference` (SACM23-ART-002, -004, -006, -007, SACM23-TERM-003, -004), then preserved attributes in input order (LIB-COMPAT-003). Children are written in model order (ADR 0010 D2), each preserved child at its index among them, not grouped by role as C++ does. Nothing depends on hash iteration order. The output is checked against golden files."
source = "D-RT; XMI 2.5.1 §9.5 (p. 60) \"the XML attributes may be serialized in any order\", rule 2a (p. 63); ADR 0010 D2; ADR 0017; assurance-forge `io/xmi.h:18-21`, `tests/test_roundtrip.cpp:892-925`"
kind = "xmi"
status = "verified"
depends_on = ["SACM23-XMI-003", "SACM23-XMI-004", "SACM23-XMI-006"]
notes = "Slice 0036: a test's ids or expectations changed for the new id rules (ADR 0015 amendment 2, SACM23-VAL-020); re-checked there. Slice 0055: reworded because Artifact, Resource, Activity and Event are read now (ADR 0034 amendment 1); re-check there. Slice 0060 (M3 close audit): reworded; re-check there. Slice 0062: reworded for the Terminology kinds; re-check there. Slice 0065: reworded for ExpressionLangString (SACM23-BASE-009); re-check there."
acceptance = [
  "Writing one document twice gives identical bytes, and so does writing a document and its clone.",
  "Two documents built by the same `insert` sequence, with at least 50 elements, write identical bytes.",
  "The output equals golden files byte for byte: (a) one ArgumentPackage, bare and self-closing; (b) ArgumentPackage, AssuranceCasePackage, ArgumentPackage inside `xmi:XMI`; (c) an AssuranceCasePackage with nested packages, typed and untyped children, and model order across roles.",
  "The output has no CR byte and no BOM, line 1 is the declaration, and it ends in exactly one LF.",
  "In an ArgumentPackage whose children are inserted as Note, Claim, Description, they are written in that order.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "docs/adr/0017-xmi-writer.md", "crates/sacm/src/model/containment.rs"]
tests = [
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_writing_a_document_twice_or_its_clone_gives_identical_bytes",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_two_documents_built_by_the_same_inserts_write_identical_bytes",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_one_argument_package_matches_the_single_root_golden_file",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_three_roots_match_the_several_roots_golden_file",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_a_nested_assurance_case_package_matches_the_nested_golden_file",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_output_is_lf_only_without_a_bom_starts_with_the_declaration_and_ends_in_one_lf",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_lines_are_indented_two_spaces_per_depth_and_childless_elements_self_close",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_attributes_are_written_in_the_pinned_order",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_children_are_written_in_model_order_across_roles",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_reading_a_golden_file_and_writing_it_gives_the_golden_bytes",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_writing_what_was_read_from_written_output_gives_the_same_bytes",
]
