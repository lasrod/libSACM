[[row]]
id = "LIB-EDIT-014"
area = "EDIT"
milestone = "M2"
title = "Atomic batches of operations"
requirement = "Several operations apply as one atomic change. Either all succeed, or the document is `==` to before and generates the same next ids, and the error names the refused operation and its `EditError`. A later operation can use an id an earlier one generated. The result holds each operation's `Mutation` in order, and the batch's net created, changed and deleted ids as `semantic_compare(before, after)` defines them for LIB-EDIT-003."
source = "User request: Assurance Forge, GitHub issue #59 (2026-11-14); ADR 0019 \"Atomic batches of several operations, as the GSN layer will want, belong in a later row\"; D-ATOMIC; D-RESULT; ADR 0032 (the maintainer, 2026-11-15)"
kind = "editing"
status = "verified"
verification = "docs/verification/0048-m2-batches-and-delete.md"
depends_on = ["LIB-EDIT-003", "LIB-EDIT-013"]
notes = "Needs an ADR for the API shape: a list of operations, or a closure that applies operations one at a time and sees each `Mutation` (which gives later operations the generated ids without a new id API). Slice 0056: net changed ids also take the parents of moved elements (ADR 0036 D4); re-check there. Slice 0060 (M3 close audit): reworded; re-check there."
acceptance = [
  "`edit::batch(&mut doc, |tx| ...)`: on `Ok` every operation applied through `tx.apply` is committed and each returned `Mutation` equals what applying the operations one by one gives; a later operation can use an id an earlier one generated.",
  "On an `Err` from the closure, the closure's error is returned unchanged and the document is `==` to before with the same next ids and revision; a panic in the closure (`catch_unwind`) leaves it as before too. A refusal the closure catches and ignores changes nothing, and the rest commits.",
  "`edit::apply_all(&mut doc, ops)` equals `batch` over the same list; on the first refusal at index k the document is unchanged and `BatchError` gives `index() == k`, the operation, its `EditError` and `code()`.",
  "`BatchMutation::mutations()` holds every accepted `Mutation` in order; its net `created_ids`, `changed_ids` and `deleted_ids` are the right-only ids of `semantic_compare(before, after)` in creation order, its per-element ids in document pre-order after, and its left-only ids in pre-order before (an element created and deleted in the batch is in neither), over random sequences of creates, sets, reorders and deletes; moves and copies in a batch are held to it by targeted tests (LIB-EDIT-017, LIB-EDIT-018; ADR 0036 D4).",
  "`BatchMutation` and `BatchError` round-trip in the ADR 0030 shape, with golden samples (except one holding a `CopyElements`, which does not serialize: LIB-API-006); the rustdoc example builds an ArgumentReasoning and an AssertedInference that names it in one batch.",
]
code = ["crates/sacm/src/edit/batch.rs", "crates/sacm/src/compare.rs", "docs/adr/0032-atomic-batches.md"]
tests = [
  "crates/sacm/tests/batch.rs::lib_edit_014_batch_error_display_names_the_index_the_operation_and_the_refusal",
