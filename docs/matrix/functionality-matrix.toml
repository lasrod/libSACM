[[row]]
id = "SACM23-ARG-013"
area = "ARG"
milestone = "M2"
title = "ArgumentGroup"
requirement = "ArgumentGroup (§11.2, superclass ArgumentationElement) is read under `argumentElement` of an ArgumentPackage with its membership end `argumentElement` (`ArgumentationElement[0..*]`, a reference, not containment; `SacmElement::group_members() -> &[ElementId]`), multi-valued under ADR 0026/0027's rules, written after `abstractForm` when non-empty, compared (`Difference::GroupMembers`) and round-tripped (ADR 0028). The parent's kind decides how `argumentElement` reads: a reference under a group, the composite role under a package; a nested element under a group's `argumentElement` is never dropped: its `xmi:id` or type attribute is `Unsupported` (SACM23-XMI-019), and one with no link and only a name is kept whole as preserved content of the group (LIB-COMPAT-003). A member stays where it is contained. It is created by `CreateArgumentGroup::new(parent, name)` with `with_id` and `with_group_members` (none required), after ADR 0019's four checks: `InvalidReference` (white space), `ReferenceNotFound`, then `EditError::WrongReferenceType` (SACM-REF-002) for an end whose target does not conform to its declared type (ADR 0028). The text spelling `argumentationElement` is read as SACM23-XMI-009 says. Deleting a member is LIB-EDIT-005."
source = "formal/23-05-08 §11.2 (p. 36) \"Superclass ArgumentationElement\", \"argumentationElement:ArgumentationElement[0..*] - an optional collection of ArgumentationElements organised within the ArgumentGroup.\", \"ArgumentGroups serve no structural purpose in the formation of the argument network\" (informative); §11.4 (p. 36) \"(composition)\" for contrast; ptc/22-03-13 Argumentation::ArgumentGroup (argumentElement, no aggregation); D-TEXT-MODEL; ADR 0026; ADR 0027; ADR 0028"
kind = "model"
status = "verified"
verification = "docs/verification/0044-m2-artifact-relationships.md"
depends_on = ["SACM23-ARG-001", "SACM23-XMI-005", "SACM23-XMI-016", "LIB-EDIT-001", "SACM23-VAL-003", "SACM23-ARG-004"]
notes = "Slice 0057: reworded for ArtifactAssetRelationship and the SACM23-XMI-009 spellings; re-check there."
acceptance = [
  "`<argumentElement xmi:type=\"sacm:ArgumentGroup\" xmi:id=\"g1\" argumentElement=\"c1 c2\"/>` reads in both modes with members `[c1, c2]`, and c1 and c2 stay children of their package.",
  "A member element `<argumentElement xmi:idref=\"c1\"/>` inside the group reads equal to the attribute form; `<argumentElement xmi:type=\"sacm:Claim\" xmi:id=\"c9\">` inside a group is `Unsupported` at that construct.",
  "An `argumentationElement` attribute or element on a group is read by a tolerant read as members, with one SACM-XMI-013 Warning each, and kept by a strict read as preserved content with one SACM-XMI-013 Error (SACM23-XMI-009); an `argumentElement` attribute on an ArgumentPackage (or another kind without that end) is kept as preserved content of the element, with SACM-XMI-003 at its name (LIB-COMPAT-003).",
  "Write, compare and round trip as SACM23-ARG-006; members `\"c1 c1\"` are kept; a group whose members include itself, another group or its own package gives no finding.",
  "`CreateArgumentGroup` gives `argument_group_1`; no members is accepted; the ADR 0027 refusals apply; an AssuranceCasePackage member is `WrongReferenceType`.",
  "No class has a composite role and a reference end of the same name (a model test).",
]
tests = [
  "crates/sacm/tests/argument_groups.rs::sacm23_arg_013_the_attribute_reads_its_members_in_both_modes_and_they_stay_in_their_package",
  "crates/sacm/tests/argument_groups.rs::sacm23_arg_013_member_elements_by_idref_or_href_read_equal_to_the_attribute",
  "crates/sacm/tests/argument_groups.rs::sacm23_arg_013_a_nested_element_under_a_group_is_unsupported_or_preserved_at_that_construct",
  "crates/sacm/tests/argument_groups.rs::sacm23_arg_013_an_attribute_and_member_elements_are_repeated_value_and_an_empty_one_is_preserved",
  "crates/sacm/tests/argument_groups.rs::sacm23_arg_013_argumentation_element_on_a_group_is_a_spelling_and_argument_element_on_a_package_is_preserved",
  "crates/sacm/tests/argument_groups.rs::sacm23_arg_013_members_are_written_after_abstract_form_kept_when_repeated_and_absent_when_empty",
  "crates/sacm/tests/argument_groups.rs::sacm23_arg_013_semantic_compare_reports_one_group_members_difference",
