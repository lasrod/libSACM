[[row]]
id = "SACM23-ARG-008"
area = "ARG"
milestone = "M2"
title = "AssertedInference"
requirement = "AssertedInference (§11.14, superclass AssertedRelationship, no features of its own) is read under `argumentElement` of an ArgumentPackage with SACM23-ARG-007's features, written and round-tripped (ADR 0027). It is created by `CreateAssertedInference::new(parent, name, sources, target)` (with `with_id`, `with_reasoning`, `with_is_counter`) under the LIB-EDIT-001 contract, taking premises (sources) and a conclusion (target); after ADR 0019's checks, no source is `EditError::TooFewReferences` (SACM-MULT-001), a source, target or reasoning id holding white space is `EditError::InvalidReference` (SACM-ID-002), one naming no element is `EditError::ReferenceNotFound` (SACM-CMD-001), and one whose target does not conform to the end's declared type is `EditError::WrongReferenceType` (SACM-REF-002, ADR 0028); repeated sources are not refused (a content finding, SACM23-VAL-022). Kind-specific end typing is none: the clause has no Constraints section (SACM23-VAL-016). Target types are checked by SACM23-VAL-004."
source = "formal/23-05-08 §11.14 (pp. 40-41) \"Superclass AssertedRelationship\"; ptc/22-03-13 Argumentation::AssertedInference; ADR 0019; ADR 0026; ADR 0027; D-VAL-LAYER; assurance-forge operations.h:98-107, commands.cpp:500-545, validate.cpp:129-133 (no kind-specific typing)"
kind = "model"
