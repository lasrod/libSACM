[[row]]
id = "SACM23-XMI-011"
area = "XMI"
milestone = "M1"
title = "String values survive XML exactly"
requirement = "Saving and reloading keeps every string value exactly, including LangString `lang` and `content`: markup characters are escaped, TAB, LF and CR in attribute values are written as character references so attribute normalisation cannot change them, and a string holding a character XML 1.0 cannot represent makes saving fail with an error. It is never dropped or altered. For every LangString role, an absent `lang` or `content` is written as no attribute and reads back absent, and an empty one is written as `=\"\"` and reads back empty (ADR 0012); all nine absent/empty/non-empty combinations round-trip."
source = "D-RT; D-PRESERVE; XML 1.0 §2.2, §3.3.3; formal/23-05-08 §8.3; ADR 0012"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-BASE-001", "SACM23-XMI-007"]

[[row]]
id = "SACM23-XMI-012"
area = "XMI"
milestone = "M1"
title = "The name containment in XMI"
requirement = "Every ModelElement that has a name is written with exactly one `name` child holding its LangString as `lang` and `content` attributes (SACM23-XMI-011 rules), and import reads the `name` child into the element's name. A ModelElement read with no `name` child keeps no name: none is invented on load or save. Tolerant save writes it with no `name` child; strict save refuses the document (LIB-COMPAT-007; ADR 0013 amendment 1), and the absence is reported (SACM23-VAL-018). A second `name` child is preserved with an Error diagnostic in both load modes, never dropped silently, and strict save refuses the document (SACM-XMI-006, D-PRESERVE). A document is never refused on load for it, because the schema allows it (XMI 2.5.1 rule 4f: `maxOccurs` 'unbounded' regardless)."
source = "formal/23-05-08 §2.4, §8.6 `name:LangString[1] (composition)`; XMI 2.5.1 §7.8.2, rule 4f; ptc/22-03-13 Base::ModelElement name; D-PRESERVE; D-STRICT; ADR 0013; assurance-forge libs/sacm io/xmi_reader.cpp, io/xmi_writer.cpp (name)"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-001", "SACM23-BASE-003", "SACM23-XMI-011", "LIB-TOOL-020"]
notes = "Slice 0025: owns the LangString `xmi:id` rule moved from SACM23-XMI-004 (an `xmi:id` on a LangString is not kept; it is reported with an Info diagnostic naming the id)."

[[row]]
id = "SACM23-VAL-018"
area = "VAL"
milestone = "M1"
title = "A missing name is diagnosed"
requirement = "A ModelElement without a name is reported as a SACM-MULT-001 error that names the element and cites §8.6 `name:LangString[1]`, and the element is kept. A name whose `lang` or `content` is absent or empty is not a missing name and is not reported. The catalog entry for SACM-MULT-001 is widened to cover a required containment."
source = "formal/23-05-08 §8.6 `name:LangString[1]`; §8.3 `content:String[0..1]`; D-SEV (a multiplicity in text and model is normative structure: Error); D-VAL-LAYER; ADR 0013; docs/sacm/diagnostics.md SACM-MULT-001"
kind = "validation"
status = "planned"
depends_on = ["SACM23-BASE-003", "SACM23-XMI-012", "LIB-DIAG-001"]

[[row]]
id = "LIB-COMPAT-001"
area = "COMPAT"
milestone = "M1"
title = "Strict and tolerant load modes"
requirement = "Loading takes an explicit mode: tolerant (default) accepts and reports recognised variations as warnings; strict reports them as errors. Saving is strict by default. The mode used is visible in the load result. The SACM-SEC-001 and SACM-XML-001 refusals (LIB-SEC-001, LIB-SEC-002) are the same in both modes."
source = "D-STRICT"
kind = "api"
status = "planned"
depends_on = ["SACM23-XMI-001", "SACM23-XMI-003"]

[[row]]
id = "SACM23-VAL-001"
area = "VAL"
milestone = "M1"
title = "Unique element ids"
requirement = "Duplicate `xmi:id` values in a document are reported as SACM-ID-001 errors naming every element involved; the edit API refuses to create a duplicate (SACM-CMD-004)."
source = "XMI 2.5.1 identity; docs/sacm/diagnostics.md SACM-ID-001"
kind = "validation"
status = "planned"
depends_on = ["SACM23-XMI-004", "LIB-DIAG-001"]

[[row]]
id = "SACM23-VAL-006"
area = "VAL"
milestone = "M1"
title = "Enumeration literals"
requirement = "An unknown `assertionDeclaration` literal is reported as SACM-ENUM-001 with the raw value; it is never silently mapped to the default."
source = "ptc/22-03-13 Argumentation::AssertionDeclaration; docs/sacm/diagnostics.md SACM-ENUM-001"
kind = "validation"
status = "planned"
depends_on = ["SACM23-ARG-003", "SACM23-XMI-001", "LIB-DIAG-001"]

[[row]]
id = "LIB-RT-001"
area = "RT"
milestone = "M1"
title = "Semantic comparison"
requirement = "A public function compares two documents semantically (ignoring formatting, attribute order and prefixes, not ignoring any model content) and reports the differences with element ids and feature names. A missing name differs from every present name, including `<name/>` (`LangString::default()`) and `content=\"\"`, and MultiLangString values are compared in order: a difference only in value order is reported, though the metamodel does not order `value`."
source = "D-RT"
kind = "api"
status = "planned"
depends_on = ["SACM23-ARG-002"]

[[row]]
id = "LIB-RT-002"
area = "RT"
milestone = "M1"
title = "Load → save → load is lossless"
requirement = "For every valid fixture in scope, loading, saving strictly and reloading yields a semantically equal document."
source = "D-RT"
kind = "xmi"
status = "planned"
depends_on = ["LIB-RT-001", "SACM23-XMI-007", "SACM23-XMI-011"]

[[row]]
id = "LIB-EDIT-001"
area = "EDIT"
milestone = "M1"
title = "Create operations"
requirement = "Elements are created through explicit operations taking a parent, a `name` LangString and an optional caller-provided id; generated ids are deterministic for a given sequence of operations; an invalid parent is refused (SACM-CMD-005). Initially AssuranceCasePackage, ArgumentPackage and Claim; each later model row extends it to its class."
source = "D-ID, D-ATOMIC"
kind = "editing"
status = "planned"
depends_on = ["SACM23-ARG-002", "LIB-API-004"]

[[row]]
id = "LIB-EDIT-002"
area = "EDIT"
milestone = "M1"
title = "Atomic mutations"
requirement = "Every public mutation either succeeds and leaves the document structurally valid, or fails with an error and leaves the document unchanged (semantically equal to before)."
source = "D-ATOMIC, D-VAL-LAYER"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-001"]

[[row]]
id = "LIB-EDIT-003"
area = "EDIT"
milestone = "M1"
title = "Mutation results"
requirement = "Every successful mutation returns the ids it created, changed and deleted and the operation that ran, sufficient for an audit log."
source = "D-RESULT"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-001"]

[[row]]
id = "LIB-RT-003"
area = "RT"
milestone = "M1"
title = "Created documents round-trip"
requirement = "A document built through the edit API saves strictly, reloads, validates without errors and is semantically equal to the in-memory document."
source = "D-RT"
kind = "xmi"
status = "planned"
depends_on = ["LIB-EDIT-001", "LIB-RT-002"]

[[row]]
id = "LIB-CLI-002"
area = "CLI"
milestone = "M1"
title = "`sacm validate`"
requirement = "`sacm validate <file>` loads (tolerant by default, `--strict` available), validates, prints diagnostics in a human format or as JSON (`--format json`), and exits 0 when there are no errors, 1 when there are errors, 2 when the file cannot be read."
source = "Project policy (D-API)"
kind = "cli"
status = "planned"
depends_on = ["LIB-CLI-001", "SACM23-XMI-001", "SACM23-VAL-001"]

[[row]]
id = "LIB-CLI-003"
area = "CLI"
milestone = "M1"
title = "`sacm roundtrip`"
requirement = "`sacm roundtrip <file>` loads, saves strictly to memory, reloads and reports any semantic difference, exiting non-zero if there is one; `-o` writes the strict output."
source = "Project policy (D-API)"
kind = "cli"
status = "planned"
depends_on = ["LIB-CLI-002", "LIB-RT-002"]

[[row]]
id = "LIB-DOC-001"
area = "DOC"
milestone = "M1"
title = "Crate root documentation with a complete example"
requirement = "The crate root explains SACM in plain words, states what is supported (linking the matrix), and shows a runnable load → inspect → validate → edit → save example as a doctest; the crate README mirrors it."
source = "Project goal (well documented, easy to use)"
kind = "docs"
status = "planned"
depends_on = ["LIB-EDIT-001", "LIB-RT-002"]

