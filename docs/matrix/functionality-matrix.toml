requirement = "The optional SACMElement `gid` is represented, preserved exactly, writable and editable on every element, distinct from the XMI id."
source = "formal/23-05-08 §8.2; ptc/22-03-13 Base::SACMElement.gid"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-003", "SACM23-XMI-004"]

[[row]]
id = "SACM23-XMI-005"
area = "XMI"
milestone = "M2"
title = "Reference serialization"
requirement = "Non-containment references are written as attributes named by the reference end holding space-separated xmi:ids; import also accepts child-element and `href=\"#id\"` forms; references to unknown ids are kept and diagnosed, not dropped."
source = "XMI 2.5.1 reference rules; docs/sacm/metamodel-inventory.md"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-004"]

[[row]]
id = "SACM23-BASE-007"
area = "BASE"
milestone = "M2"
title = "Citations"
requirement = "SACMElement `isCitation` and `citedElement` are represented on every element, round-tripped and editable; `citedElement` is a reference to any SACMElement."
source = "formal/23-05-08 §8.2; ptc/22-03-13 Base::SACMElement"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-003", "SACM23-XMI-005"]

[[row]]
id = "SACM23-BASE-008"
area = "BASE"
milestone = "M2"
title = "Abstract elements and abstract forms"
requirement = "SACMElement `isAbstract` and `abstractForm` are represented on every element, round-tripped and editable."
source = "formal/23-05-08 §8.2; ptc/22-03-13 Base::SACMElement"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-003", "SACM23-XMI-005"]

[[row]]
id = "SACM23-ARG-004"
area = "ARG"
milestone = "M2"
title = "metaClaim"
requirement = "Assertion `metaClaim` (references to Claims about an assertion) is represented on Claims and asserted relationships, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::Assertion.metaClaim"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-002", "SACM23-XMI-005"]

[[row]]
id = "SACM23-ARG-005"
area = "ARG"
milestone = "M2"
title = "ArgumentReasoning"
requirement = "ArgumentReasoning is represented with its optional `structure` reference to an ArgumentPackage, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::ArgumentReasoning"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-001", "SACM23-XMI-005"]

[[row]]
id = "SACM23-ARG-006"
area = "ARG"
milestone = "M2"
title = "ArtifactReference"
requirement = "ArtifactReference is represented with its `referencedArtifactElement` references (0..*, to ArtifactElements), created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::ArtifactReference"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-001", "SACM23-XMI-005"]

[[row]]
id = "SACM23-ARG-007"
area = "ARG"
milestone = "M2"
title = "AssertedRelationship common features"
requirement = "The shared features of all asserted relationships — `source` (1..*), `target` (1), optional `reasoning` (ArgumentReasoning) and required `isCounter` — are represented once and available on every relationship kind, round-tripped and editable."
source = "formal/23-05-08 §11.13; ptc/22-03-13 Argumentation::AssertedRelationship"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-002", "SACM23-ARG-005", "SACM23-XMI-005"]

[[row]]
id = "SACM23-ARG-008"
area = "ARG"
milestone = "M2"
title = "AssertedInference"
requirement = "AssertedInference is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedInference"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-007"]

[[row]]
id = "SACM23-ARG-009"
area = "ARG"
milestone = "M2"
title = "AssertedEvidence"
requirement = "AssertedEvidence is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedEvidence"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-007", "SACM23-ARG-006"]

[[row]]
id = "SACM23-ARG-010"
area = "ARG"
milestone = "M2"
title = "AssertedContext"
requirement = "AssertedContext is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedContext"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-007"]

[[row]]
id = "SACM23-ARG-011"
area = "ARG"
milestone = "M2"
title = "AssertedArtifactSupport"
requirement = "AssertedArtifactSupport is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedArtifactSupport"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-007", "SACM23-ARG-006"]

[[row]]
id = "SACM23-ARG-012"
area = "ARG"
milestone = "M2"
title = "AssertedArtifactContext"
requirement = "AssertedArtifactContext is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedArtifactContext"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-007", "SACM23-ARG-006"]

[[row]]
id = "SACM23-ARG-013"
area = "ARG"
milestone = "M2"
title = "ArgumentGroup"
requirement = "ArgumentGroup is represented with its `argumentElement` membership references (not containment), round-tripped and editable; deleting a member does not delete the group."
source = "formal/23-05-08 §11.2; ptc/22-03-13 Argumentation::ArgumentGroup; D-TEXT-MODEL (argumentElement spelling)"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-001", "SACM23-XMI-005"]

[[row]]
id = "SACM23-XMI-010"
area = "XMI"
milestone = "M2"
title = "Source locations on read diagnostics"
requirement = "Every diagnostic produced while reading XMI carries the line and column of the element or attribute it concerns."
source = "D-DIAG"
kind = "xmi"
status = "planned"
depends_on = ["LIB-DIAG-001", "SACM23-XMI-001"]

[[row]]
id = "LIB-COMPAT-003"
area = "COMPAT"
milestone = "M2"
title = "Unknown content is preserved, not dropped"
requirement = "In tolerant mode, elements and attributes the model does not recognise (vendor extensions, unknown standard-looking names) are preserved at their position with a SACM-XMI-003 warning, and survive load → save in tolerant output."
source = "D-PRESERVE; docs/sacm/diagnostics.md SACM-XMI-003"
kind = "xmi"
status = "planned"
depends_on = ["LIB-COMPAT-001"]

[[row]]
id = "SACM23-XMI-008"
area = "XMI"
milestone = "M2"
title = "Strict save refuses what it cannot write conformantly"
requirement = "Strict save of a document holding preserved unknown or compatibility-only content fails with SACM-XMI-006 listing that content, and writes nothing; it never silently omits it."
source = "D-PRESERVE, D-STRICT; docs/sacm/diagnostics.md SACM-XMI-006"
kind = "xmi"
status = "planned"
depends_on = ["LIB-COMPAT-003"]

[[row]]
id = "SACM23-VAL-002"
area = "VAL"
milestone = "M2"
title = "gid uniqueness"
requirement = "Two elements with the same non-empty gid are reported as SACM-ID-003 errors; absent or empty gids are not compared."
source = "formal/23-05-08 §8.2 (\"unique within the scope of the model instance\"); SACM-ID-003"
kind = "validation"
status = "planned"
depends_on = ["SACM23-BASE-006"]

[[row]]
id = "SACM23-VAL-003"
area = "VAL"
milestone = "M2"
title = "Dangling references"
requirement = "A reference whose target id does not resolve is reported as SACM-REF-001 naming the referring element, the reference end and the missing id."
source = "XMI 2.5.1; docs/sacm/diagnostics.md SACM-REF-001"
kind = "validation"
status = "planned"
depends_on = ["SACM23-XMI-005", "LIB-DIAG-001"]

[[row]]
id = "SACM23-VAL-004"
area = "VAL"
milestone = "M2"
title = "Reference target typing"
requirement = "A reference resolving to an element of the wrong type for its end (per ptc/22-03-13) is reported as SACM-REF-002; a target that is preserved-but-untyped content is SACM-REF-003 (warning), not a dangling reference."
source = "ptc/22-03-13 reference end types; docs/sacm/diagnostics.md SACM-REF-002, SACM-REF-003"
kind = "validation"
status = "planned"
depends_on = ["SACM23-VAL-003", "LIB-API-003"]

[[row]]
id = "SACM23-VAL-005"
area = "VAL"
milestone = "M2"
title = "Relationship multiplicities"
requirement = "An asserted relationship with no source or without exactly one target is reported as SACM-MULT-001; the edit API cannot create one."
source = "formal/23-05-08 §11.13 (source[1..*], target[1]); SACM-MULT-001"
kind = "validation"
status = "planned"
depends_on = ["SACM23-ARG-007"]

[[row]]
id = "SACM23-VAL-007"
area = "VAL"
milestone = "M2"
title = "Citation constraints"
requirement = "The clause 8.2 citation rules are checked: `isCitation` true requires a `citedElement` and vice versa (SACM-CITE-001), with severity per D-SEV."
source = "formal/23-05-08 §8.2; SACM-CITE-001; D-SEV"
kind = "validation"
status = "planned"
depends_on = ["SACM23-BASE-007"]

[[row]]
id = "SACM23-VAL-008"
area = "VAL"
milestone = "M2"
title = "Abstract-form constraints (clause 8.2)"
requirement = "The clause 8.2 abstract-form rules are checked with the severities of D-SEV: an abstract element using abstractForm is an error; an abstractForm target that is not abstract, or of a different type, is a warning (SACM-ABS-001)."
source = "formal/23-05-08 §8.2; SACM-ABS-001; D-SEV"
kind = "validation"
status = "planned"
depends_on = ["SACM23-BASE-008"]

[[row]]
id = "SACM23-VAL-010"
area = "VAL"
milestone = "M2"
title = "MultiLangString language uniqueness"
requirement = "A MultiLangString with two values for the same language is diagnosed per clause 8.5."
source = "formal/23-05-08 §8.5"
kind = "validation"
status = "planned"
depends_on = ["SACM23-BASE-002"]

[[row]]
id = "SACM23-VAL-011"
area = "VAL"
milestone = "M2"
title = "Description multiplicity"
requirement = "A ModelElement with more than one description is preserved and reported as a SACM-MULT-001 warning citing clause 8.6 (D-DESC-MULT)."
source = "formal/23-05-08 §8.6; D-DESC-MULT"
kind = "validation"
status = "planned"
depends_on = ["SACM23-BASE-004"]

[[row]]
id = "SACM23-VAL-012"
area = "VAL"
milestone = "M2"
title = "ArgumentPackage homogeneity"
requirement = "An ArgumentPackage that nests a plain ArgumentPackage and also contains other argumentation elements is reported as a SACM-PKG-001 error; contained interfaces and bindings do not trigger it (D-PKG-HOMOG)."
source = "formal/23-05-08 §11.4, §11.6; D-PKG-HOMOG"
kind = "validation"
status = "planned"
depends_on = ["SACM23-ARG-001"]
notes = "The interface/binding exception is exercised by SACM23-ARG-014 and SACM23-ARG-015."

[[row]]
id = "SACM23-VAL-016"
area = "VAL"
milestone = "M2"
title = "Relationship end typing per kind"
requirement = "The source and target typing each asserted relationship kind's clause requires (e.g. evidence sources are ArtifactReferences) is checked, with severity per D-SEV."
source = "formal/23-05-08 clause 11 (each Asserted* subclause)"
kind = "validation"
status = "planned"
depends_on = ["SACM23-ARG-008", "SACM23-ARG-009", "SACM23-ARG-010", "SACM23-ARG-011", "SACM23-ARG-012", "SACM23-VAL-004"]

[[row]]
id = "LIB-DIAG-002"
area = "DIAG"
milestone = "M2"
title = "Diagnostic catalog stays in sync"
requirement = "Every diagnostic code the crate can emit is documented in docs/sacm/diagnostics.md and every live code there exists in the crate; a test enforces both directions."
source = "D-DIAG"
kind = "quality"
status = "planned"
depends_on = ["LIB-DIAG-001"]

[[row]]
id = "LIB-EDIT-004"
area = "EDIT"
milestone = "M2"
title = "Delete preview"
requirement = "Deleting an element can be previewed: the preview lists the element, everything it contains, every relationship and reference that would dangle, and whether the delete is applicable under each policy, without changing the document."
source = "D-PREVIEW"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-003", "SACM23-ARG-007"]

[[row]]
id = "LIB-EDIT-005"
area = "EDIT"
milestone = "M2"
title = "Element delete policies"
requirement = "Deleting a referenced element requires an explicit policy — reject if referenced (SACM-CMD-002) or delete the referencing relationships — and never leaves a dangling reference."
source = "D-POLICY"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-004"]

[[row]]
id = "LIB-EDIT-006"
area = "EDIT"
milestone = "M2"
title = "Package delete policies"
requirement = "Deleting a non-empty package requires an explicit policy — reject if non-empty (SACM-CMD-006) or delete recursively — and cross-package references are reported and handled under an explicit policy (SACM-CMD-007)."
source = "D-POLICY"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-004"]

[[row]]
id = "LIB-EDIT-007"
area = "EDIT"
milestone = "M2"
title = "Stale previews are rejected"
requirement = "A preview records the document revision it was computed against; applying it after any other mutation fails with SACM-CMD-003 and changes nothing."
source = "D-PREVIEW"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-004"]

[[row]]
id = "LIB-EDIT-008"
area = "EDIT"
milestone = "M2"
title = "Attribute edits"
requirement = "Names, descriptions, notes, tagged values, gid, citation and abstract flags, assertion declarations and isCounter can be changed through operations that are atomic and report what changed."
source = "D-ATOMIC, D-RESULT"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-002", "SACM23-BASE-005", "SACM23-ARG-007"]

[[row]]
id = "LIB-EDIT-009"
area = "EDIT"
milestone = "M2"
title = "Reference edits"
requirement = "Relationship sources/targets/reasoning, metaClaims, citedElement, abstractForm, group membership and artifact references can be set, added and removed through atomic operations that refuse targets of the wrong type."
source = "D-ATOMIC"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-002", "SACM23-ARG-007", "SACM23-ARG-013", "SACM23-VAL-004"]

[[row]]
id = "LIB-EDIT-010"
area = "EDIT"
milestone = "M2"
title = "Reorder contained elements"
requirement = "The order of a package's contained elements can be changed atomically; the new order is preserved through save and load."
source = "D-ATOMIC, D-RT"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-002"]

