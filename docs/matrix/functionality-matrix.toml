[[row]]
id = "LIB-TOOL-018"
area = "TOOL"
milestone = "M0"
title = "Verdict-like text in any written form is reported"
requirement = "A line outside every hidden block, other than a counted candidate, whose rendered text starts with `row verdict` is a problem, matched case-insensitively with an optional colon and whitespace runs collapsed. Removed before matching: footnote labels (`[^1]:`), a leading table pipe (`|`), list markers, `#` heading markers, `\\` escapes, task boxes and `_`/`*` emphasis, or the parser's text events are used instead. C0 control characters other than tab, LF and CRLF, and U+2028, U+2029 and U+0085, are refused like a lone CR. The D12 differential test also compares the records it now adjudicates against a second reference (comrak) instead of skipping them, and checks look-alike visibility against a recorded corpus of GitHub renderings, so CI makes no network calls (verification 0007 round 3)."
source = "Verification 0007 round 2 (Low: rest of F4; Info: D12 adjudicated records)"
kind = "tooling"
status = "out-of-scope"
