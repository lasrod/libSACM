[[row]]
id = "SACM23-XMI-009"
area = "XMI"
milestone = "M3"
title = "Model and text spellings read on import"
requirement = "A tolerant `xmi::read` reads three spellings as the names formal/23-05-08 gives, with one SACM-XMI-013 Warning per construct read (`Code::XMI_SPELLING_VARIANT`): the ptc/22-03-13 type `ArtifactAssertedRelationship` (§12.14 `ArtifactAssetRelationship`) in `xmi:type` or `xsi:type`, under a role that admits an ArtifactAssetRelationship; the ptc/22-03-13 attribute `occurece` of an Event (§12.9 `date`), as an attribute or a value element; and the §11.2 and §11.4 text spelling `argumentationElement` (ptc/22-03-13 `argumentElement`) as an ArgumentPackage's role element and as an ArgumentGroup's member end. Each is read under every rule of its resolved name, except that a value given under both names is read from the resolved name, and the spelled one is the repeat (SACM-MULT-001, LIB-COMPAT-001). A strict read never maps a spelling: it keeps the construct as preserved content of the element it sits in, with one SACM-XMI-013 Error (LIB-COMPAT-003), so a strict write refuses the document (SACM-XMI-006); the maintainer's M3 decision 3. Elsewhere a spelling is ordinary content (SACM-XMI-003): `occurece` on another kind, `argumentationElement` on a kind without `argumentElement`, and the type under a role that does not admit the kind; the C++ library's `occurence` is not read. `xmi::write` writes `sacm:ArtifactAssetRelationship`, `date` and `argumentElement`. The §10.4 role spelling `TerminologyElement` is SACM23-XMI-028."
source = "formal/23-05-08 §12.14 (p. 49) \"12.14 ArtifactAssetRelationship\"; §12.9 (p. 48) \"date: date[0..1] - the date on which the Event occurred.\"; §11.2 (p. 36) \"argumentationElement:ArgumentationElement[0..*] - an optional collection of ArgumentationElements organised within the ArgumentGroup.\"; §11.4 (p. 36) \"argumentationElement:ArgumentationElement[0..*] (composition) - a collection of ArgumentationElements forming a structured argument\"; ptc/22-03-13 Artifact::ArtifactAssertedRelationship, Artifact::Event `occurece`, Argumentation::ArgumentPackage and ArgumentGroup `argumentElement`; §2.3 (p. 4) \"XMI documents that conform with the SACM XML Schema produced by applying XMI rules to the normative MOF metamodel\"; D-TEXT-MODEL; D-STRICT; D-PRESERVE; spec defects D6, D17; the maintainer's M3 decision 3 (2026-11-15); ADR 0034 amendment 2"
kind = "xmi"
status = "verified"
verification = "docs/verification/0057-artifact-relationships.md"
depends_on = ["SACM23-ART-010", "SACM23-ART-007", "SACM23-ARG-013", "SACM23-XMI-016", "LIB-COMPAT-001", "LIB-COMPAT-003"]
notes = "Slice 0060: the strict message tail now says \"reads the name as R\" (verification 0057's follow-up); re-check there."
code = ["crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/refusal.rs", "crates/sacm/src/diagnostic.rs", "docs/adr/0034-artifact-packages-assets-and-groups.md"]
tests = [
  "crates/sacm/tests/model_spellings.rs::sacm23_xmi_009_the_type_spelling_reads_as_an_artifact_asset_relationship_with_one_warning",
  "crates/sacm/tests/model_spellings.rs::sacm23_xmi_009_the_type_spelling_elsewhere_is_unknown_content_or_an_invalid_root",
  "crates/sacm/tests/model_spellings.rs::sacm23_xmi_009_occurece_reads_as_the_date_of_an_event_with_one_warning",
  "crates/sacm/tests/model_spellings.rs::sacm23_xmi_009_a_date_beside_occurece_is_read_and_occurece_is_the_repeat",
  "crates/sacm/tests/model_spellings.rs::sacm23_xmi_009_occurece_elsewhere_and_occurence_are_unknown_content",
  "crates/sacm/tests/model_spellings.rs::sacm23_xmi_009_argumentation_element_reads_as_an_argument_package_s_role_in_document_order",
