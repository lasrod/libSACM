[[row]]
id = "SACM23-BASE-002"
area = "BASE"
milestone = "M1"
title = "MultiLangString"
requirement = "MultiLangString (§8.5) is a value type holding a list of LangString values. The list keeps insertion order, duplicate values and duplicate languages, and may be empty in memory, so a document can be held as read; the lower bound of one and the language-uniqueness constraint are checked by validation (SACM23-VAL-010). Equality depends on order. It is not a SACMElement: it has no id and no kind."
source = "formal/23-05-08 §8.5: \"Superclass Element\"; \"value:LangString[1..*] (composition) - contains the descriptions which bear the same meaning but in different languages\"; \"For each of the LangString in the value feature, their +lang must be unique.\" ptc/22-03-13 Base::MultiLangString (value: composite LangString, no bounds, no isOrdered; the order is kept by D-RT, not by the standard); D-TEXT-MODEL; assurance-forge libs/sacm model/lang_string.h"
kind = "model"
status = "verified"
verification = "docs/verification/0016-m1-names.md"
depends_on = ["SACM23-BASE-001"]
acceptance = [
  "`MultiLangString::default()` has no values: `values()` is empty, `len() == 0` and `is_empty()` is true. The §8.5 lower bound is checked by validation (SACM23-VAL-010), not refused here.",
  "Values from `collect()` (on an array, a `Vec` or an iterator of `LangString`), or added one at a time with `push`, come back from `values()` in the order given, each equal to its input, for all nine absent/empty/non-empty combinations. `len()` is the number given. Collecting and pushing the same sequence build equal values.",
  "Two values with the same `lang` (both `\"en\"`, both `\"\"`, both absent) and two identical values are both kept, in order, and `len()` counts each one. `push` never overwrites or deduplicates.",
  "Equality and hashing depend on order (the maintainer's decision; C++ `operator==`): `[en, fr] != [fr, en]`; values that differ only in `lang` absent versus `\"\"` are unequal; an empty MultiLangString differs from one holding `LangString::default()`; equal values hash equally.",
  "`MultiLangString` is `Clone + Debug + Default + Eq + Hash + Send + Sync` and implements `FromIterator<LangString>`. Building, cloning, comparing, hashing and `Debug` never panic, including with 10,000 values.",
  "It has no id and no kind: no `id()` or `kind()` method, and no `ElementKind` names it (ptc: it generalizes Element). Review item.",
