area = "API"
milestone = "M3"
title = "Public flag and reference-end readers"
requirement = "`SacmElement::flag(Flag)` and `SacmElement::references(ReferenceEnd)` are public: a flag the kind lacks is `false`, and an end it lacks holds no id. `Flag::ALL` and `ReferenceEnd::ALL` list every flag and end in a documented order, as `&'static` slices so a later variant is additive. `Flag::applies_to(kind)` and `ReferenceEnd::applies_to(kind)` say whether an element of `kind` has it. `ReferenceEnd::bounds(kind)` gives the fewest and most ids the end holds on an element of `kind`, as `(lower, upper)` with `None` for no upper bound, and `None` when the kind has no such end; bounds depend on the owner (§11.13 `target:ArgumentAsset[1]`; §12.14 `target:ArtifactAsset[1..*]` for an ArtifactAssetRelationship, `ReferenceEnd::ArtifactTarget`). So a generic property panel can list an element's flags and ends without mapping each variant by hand. They read the tables the reader, writer and edits use; `ReferenceEnd::Expression` is derived from the names and texts, and the reference edits refuse it (SACM23-BASE-009)."
source = "Docs review 0045 (docs/follow-ups.md); the maintainer, 2026-11-16 (needed by the GSN layer, moved to M3); formal/23-05-08 §11.13 (p. 40) \"target:ArgumentAsset[1]\"; §12.14 (p. 50) \"target:ArtifactAsset[1..*]\"; ADR 0029 amendment 1"
kind = "api"
status = "verified"
verification = "docs/verification/0056-edit-move-copy.md"
depends_on = ["LIB-EDIT-008", "LIB-EDIT-009"]
code = ["crates/sacm/src/model/reference.rs", "crates/sacm/src/model/document.rs", "docs/adr/0029-set-reference-and-reorder-operations.md"]
tests = [
  "crates/sacm/tests/flag_and_end_readers.rs::lib_api_015_applies_to_agrees_with_set_flag_and_set_references_for_every_kind",
  "crates/sacm/tests/flag_and_end_readers.rs::lib_api_015_bounds_agree_with_the_reference_edit_refusals_for_every_kind",
  "crates/sacm/tests/flag_and_end_readers.rs::lib_api_015_references_and_flag_equal_the_named_accessors",
  "crates/sacm/tests/flag_and_end_readers.rs::lib_api_015_all_lists_every_flag_and_end_in_order",
]
notes = "Slice 0057: reworded for ArtifactAssetRelationship and the SACM23-XMI-009 spellings; re-check there. Slice 0062: reworded for the Terminology kinds; re-check there. Slice 0065: reworded for ExpressionLangString (SACM23-BASE-009); re-check there. Slice 0066: reworded for the ARG/ART package interfaces and bindings (SACM23-ARG-014, -015, SACM23-ART-012, -013, LIB-EDIT-019); re-check there."
acceptance = [
  "For every kind in `ElementKind::ALL`, `Flag::applies_to` and `ReferenceEnd::applies_to` are true exactly when a `SetFlag`, or a `SetReferences::clear`, of that flag or end is not `FeatureNotApplicable`.",
  "`bounds` on an AssertedInference is `Some((1, None))` for `source` and `Some((1, Some(1)))` for `target`; on a Claim `Some((0, Some(1)))` for `citedElement`, `Some((0, None))` for `metaClaim`, `None` for `source`; for every end but `Expression` and every kind it agrees with SetReferences' `TooFewReferences` and `TooManyReferences`; `Expression` is `Some((0, None))` on every kind and refused as `DerivedEnd`.",
  "`references(end)` equals the named accessor for every end, and is empty for an end the kind lacks (`GroupMember` on an ArtifactGroup included). `flag(f)` equals `is_citation`, `is_abstract` and `is_counter`.",
  "`Flag::ALL` is `[IsCitation, IsAbstract, IsCounter]`, and `ReferenceEnd::ALL` is the nineteen written ends in write order: `Category`, `Element`, `Origin`, `TerminologyGroupMember`, then `Interface`, `Implements` and `ParticipantPackage`, followed by the derived `Expression`. A doctest lists a Claim's flags and ends as a property panel would.",
]

[[row]]
id = "LIB-API-006"
area = "API"
milestone = "M2"
title = "serde support for edit and diagnostic values"
requirement = "An optional `serde` feature implements `Serialize` and `Deserialize` for `Operation` and every operation struct, `Mutation`, `EditError`, the value types they carry (`ElementId`, `ElementKind`, `LangString`, `MultiLangString`, `AssertionDeclaration` and the edit selectors), for `Diagnostic`, `Code`, `Severity` and `SourceLocation`, and for `ReadError`, `WriteError` and `WriteAttribute` (LIB-API-017). The one exception is `CopyElements`, which holds a snapshot of another document: serializing an `Operation::CopyElements`, or a value that holds one, is an error, and its tag does not deserialize (ADR 0030 amendment 2). `Document` does not implement them: XMI stays the only serialization of the model. A deserialized operation is checked by `edit::apply` exactly as a constructed one, and an unknown `Code` or kind name is a deserialization error. The serialized form is documented and golden-tested in JSON; the goldens guard against accidental change, and the shape changes only in a semver-breaking release (ADR 0030 amendment 1; the maintainer, 2026-11-16)."
source = "User request: Assurance Forge, GitHub issue #57 (2026-11-14); rust-library-craft \"`serde` support, if added, is behind `serde`\"; ADR 0011 \"Later additions are additive: user-built diagnostics, `operation` and serde\"; ADR 0030 (the maintainer, 2026-11-15)"
kind = "api"
status = "verified"
verification = "docs/verification/0053-simplification.md"
depends_on = ["LIB-EDIT-003", "LIB-EDIT-008", "LIB-EDIT-009", "LIB-EDIT-010"]
notes = "Narrowed 2026-11-15 from \"serializes the model and diagnostics\": leaving `Document` out removes the concern that serde freezes a second serialization of the model. The maintainer decided on 2026-11-15 that the serialized form is a stability promise, like `operation_name()`: changing it is a breaking change. Needs an ADR for the serde dependency (optional, with `derive`) and the JSON shape. LIB-QA-017 builds the wasm target with this feature too. Slice 0056: `CopyElements` is not serialized (ADR 0030 amendment 2); `MoveElement` and the three new `EditError` variants have goldens; re-check there. Slice 0057: reworded for ArtifactAssetRelationship and the SACM23-XMI-009 spellings; re-check there. Slice 0063: refusals carry codes, templates and arguments (LIB-API-017); re-check there. Slice 0064: Diagnostic JSON gains `template` and `arguments`; `diagnostics-0.1.0.json` still reads (LIB-API-018); re-check there."
acceptance = [
  "With the `serde` feature, every type ADR 0030 lists implements `Serialize` and `Deserialize`; `Document` does not (a `compile_fail` doctest). Without the feature, `sacm` has no serde dependency.",
  "Golden JSON files fix the shape of every operation struct but `CopyElements` (each constructor form: root and parent, with and without id, set and remove), a `Mutation`, every `EditError` variant, a full and a minimal `Diagnostic`, and LangString and MultiLangString values. Serializing gives the file's bytes, and deserializing the file gives values `==` to the originals. A test with an exhaustive `match` fails to compile when an `Operation` or `EditError` variant has no sample.",
  "Every operation's `\"type\"` is its `operation_name()`; every `ElementKind`, `Flag`, `AssertionDeclaration`, `Severity` and catalog `Code` round-trips as its name or code string, and every `ReferenceEnd` as its name, except `ArtifactSource` and `ArtifactTarget`, which are `artifactSource` and `artifactTarget` (ADR 0034 amendment 2).",
  "Refused on input: an unknown `type`, an unknown key, a missing required key (a package create's `parent` included), an unknown code, kind, flag, end, feature or expected-class name, an `EditError` whose `code` does not match its variant, and a location line or column of 0.",
  "An omitted optional key reads as the constructor default; `{}` and `{\"content\":\"\"}` are different LangStrings.",
  "A deserialized operation is `==` to its constructed twin, and `check` and `apply` refuse an invalid one (`\"id\":\"a b\"` gives `InvalidId`) exactly as a constructed one.",
  "The wasm32 build with `--all-features`, `cargo deny` and the MSRV build pass with the feature.",
]
code = ["crates/sacm/Cargo.toml", "crates/sacm/src/edit/record.rs", "crates/sacm/src/diagnostic.rs", "crates/sacm/src/lib.rs", "docs/adr/0030-serde-for-edit-and-diagnostic-values.md"]
tests = [
  "crates/sacm/tests/serde.rs::lib_api_006_every_listed_type_implements_serialize_and_deserialize",
  "crates/sacm/tests/serde.rs::lib_api_006_operations_serialize_to_the_golden_json_and_read_back_equal",
