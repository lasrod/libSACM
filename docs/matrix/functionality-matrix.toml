[[row]]
id = "SACM23-VAL-006"
area = "VAL"
milestone = "M2"
title = "Enumeration literals"
requirement = "A strict `xmi::read` refuses an `assertionDeclaration` value that is not exactly one of the six AssertionDeclaration literals, in the attribute form (SACM23-XMI-017) or the element form (SACM23-XMI-014), as `ReadError::InvalidLiteral { element, property, value, location }` whose `code()` is SACM-ENUM-001 (ADR 0021 amendment 2). `value` is the value as read: after XML attribute-value normalisation for the attribute, the exact character content for the element. It is located at the attribute's name or the value element's `<`. The value is never mapped to a literal and never held in a `Document` as a value. A tolerant read keeps the attribute or value element as preserved content of the element, with SACM-ENUM-001 as a Warning, and the model holds the default (`asserted`); the same holds for a bad boolean flag (the default `false`) and a bad `xsi:nil` (the value element is preserved whole). A bad value counts as the property's first occurrence. `SetAssertionDeclaration` and `SetFlag` remove a preserved attribute in no namespace named after their property, whatever value they set, and report the element changed (ADR 0035)."
source = "formal/23-05-08 §11.8 (p. 38) the six literals, §11.10 (p. 39) \"assertionDeclaration:AssertionDeclaration[1] = asserted\"; ptc/22-03-13 Argumentation::AssertionDeclaration; XMI 2.5.1 rule 8 (p. 53) \"a simple type derived from string whose legal values are the enumeration literals\", rule 2i (p. 64); D-ENUM-EXACT; the maintainer's decision of 2026-11-14; ADR 0021 amendment 2; C++ `xmi_reader.cpp:1788-1794` (keeps `asserted`)"
kind = "validation"
status = "verified"
verification = "docs/verification/0053-simplification.md"
depends_on = ["SACM23-ARG-003", "SACM23-XMI-001", "LIB-DIAG-001", "SACM23-XMI-017", "SACM23-XMI-014", "SACM23-XMI-023"]
notes = "SACM23-XMI-017 moved to M1 in slice 0030; this row stays in M2. ADR review, 2026-11-13: decide how the model holds a non-literal value (for tolerant mode) before its tests. Maintainer decision 2026-11-14: refused in both load modes with a coded `ReadError` (SACM-ENUM-001) naming the value and its location; the model does not hold an unknown value. A later compatibility row may map known legacy literals. Slice 0053 (the maintainer, 2026-11-16; ADR 0035): the refusal is now strict only; a tolerant read keeps the value as preserved content with a SACM-ENUM-001 Warning, and the model holds the default. Slice 0063: refusals carry codes, templates and arguments (LIB-API-017); re-check there."
acceptance = [
  "Attribute form, on a Claim, in strict mode: each of `foo`, `Asserted`, `ASSERTED`, `\" asserted\"`, `\"asserted \"`, `\"\"`, `justification` and `needs Support` gives `InvalidLiteral` with `code()` SACM-ENUM-001, the value as read, `location()` at the first character of the attribute's name, and `locations() == [location]`.",
  "Normalisation: `assertionDeclaration=\"asserted&#9;\"` gives the value `\"asserted\\t\"`, and a literal TAB gives `\"asserted \"`; both are refused, nothing is trimmed.",
  "Element form: `<assertionDeclaration>foo</assertionDeclaration>`, `<assertionDeclaration> asserted </assertionDeclaration>`, `<assertionDeclaration/>` (value `\"\"`) and a CDATA or character-reference non-literal are each refused at the element's `<` with the exact content; `asser<!--x-->ted` reads as `asserted`.",
  "First defect in document order: a bad attribute plus an element form gives `InvalidLiteral` at the attribute; a good attribute plus a bad element gives `InvalidLiteral` at the element, not `RepeatedValue`; two good occurrences stay `RepeatedValue`.",
  "Preserved, not refused: `assertionDeclaration` on a non-Assertion and `sacm:assertionDeclaration` are kept as preserved content of their element, with one SACM-XMI-003 at the attribute's name in both modes, and are never checked as a literal (LIB-COMPAT-003).",
  "All six literals and an absent attribute still read, the same in both modes.",
  "`InvalidLiteral`'s `Display` is one line naming the element and the property, quoting the value with `{:?}`, giving the location and listing the literals; the error is `Clone + Eq + Debug + std::error::Error` with no source.",
  "The catalog's SACM-ENUM-001 row names `Code::ENUM_INVALID_LITERAL` and `ReadError::InvalidLiteral`.",
  "Tolerant mode: `assertionDeclaration=\"Assumed\"` reads with the default `asserted` and one SACM-ENUM-001 Warning at the attribute's name; the tolerant write holds `assertionDeclaration=\"Assumed\"` exactly once; after `SetAssertionDeclaration(c1, Assumed)` the output holds `assertionDeclaration=\"assumed\"` once and the document holds no preserved content.",
  "Tolerant mode: `isAbstract=\"yes\"` plus `<isAbstract>true</isAbstract>` reads `false`, with SACM-ENUM-001 at the attribute and SACM-MULT-001 at the element, and a tolerant write never emits two `isAbstract` attributes; a bad `xsi:nil` keeps the value element whole.",
]
tests = [
  "crates/sacm/tests/xmi_literals.rs::sacm23_val_006_each_bad_attribute_value_on_a_claim_is_invalid_literal_in_strict_mode",
  "crates/sacm/tests/xmi_literals.rs::sacm23_val_006_a_bad_attribute_value_is_refused_even_beside_a_valid_sibling",
  "crates/sacm/tests/xmi_literals.rs::sacm23_val_006_an_attribute_value_is_normalised_and_never_trimmed",
  "crates/sacm/tests/xmi_literals.rs::sacm23_val_006_each_bad_element_value_is_invalid_literal_at_its_start_tag_with_the_exact_content",
  "crates/sacm/tests/xmi_literals.rs::sacm23_val_006_a_comment_inside_a_literal_element_is_ignored_and_it_reads",
  "crates/sacm/tests/xmi_literals.rs::sacm23_val_006_the_first_defect_in_document_order_decides",
  "crates/sacm/tests/xmi_literals.rs::sacm23_val_006_the_property_on_a_non_assertion_and_a_qualified_attribute_are_preserved",
  "crates/sacm/tests/xmi_literals.rs::sacm23_val_006_the_six_literals_and_an_absent_attribute_still_read_the_same_in_both_modes",
  "crates/sacm/tests/xmi_literals.rs::sacm23_val_006_invalid_literal_display_is_one_line_naming_the_element_property_value_location_and_literals",
  "crates/sacm/tests/xmi_literals.rs::sacm23_val_006_invalid_literal_is_clone_eq_debug_and_an_error_with_no_source",
  "crates/sacm/tests/xmi_literals.rs::sacm23_val_006_the_catalog_enum_001_row_names_the_code_and_the_refusal",
  "crates/sacm/tests/tolerant_read.rs::sacm23_val_006_a_bad_flag_and_xsi_nil_are_preserved_in_tolerant_mode",
  "crates/sacm/tests/tolerant_read.rs::sacm23_val_006_a_tolerant_read_preserves_a_bad_literal_and_holds_the_default",
  "crates/sacm/tests/tolerant_read.rs::sacm23_val_006_a_tolerant_write_never_emits_a_property_attribute_twice",
  "crates/sacm/tests/tolerant_read.rs::sacm23_val_006_set_assertion_declaration_and_set_flag_replace_the_preserved_attribute",
  "crates/sacm/tests/tolerant_read.rs::sacm23_val_006_a_bad_declaration_attribute_counts_as_the_first_occurrence",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/diagnostic.rs"]

[[row]]
id = "LIB-RT-001"
area = "RT"
milestone = "M1"
title = "Semantic comparison"
requirement = "`sacm::compare::semantic_compare(left, right) -> Vec<Difference>` compares two documents by their SACM content and lists every difference, naming the element id and the feature; an empty result means equal, and `Document: PartialEq + Eq` means exactly that (ADR 0020). Elements are matched by id. Compared: presence, kind, parent, `gid`, the flags (`isCitation`, `isAbstract`, `isCounter`), every reference end (the derived `expression` through the name and texts that hold it, SACM23-BASE-009), name, the `xmi:id` of the name (`NameId`, SACM23-XMI-022), UtilityElement `content` and TaggedValue `key` with their ids, Artifact `version`, the `date` of an Artifact or an Event, Resource `location` with its ids, Activity `startTime` and `endTime` (SACM23-ART-002, -004 to -007), the `value` of a Term or Expression and a Term's `externalReference` (SACM23-TERM-003, -004), `assertionDeclaration`, preserved content, the order of the roots and the relative order of each element's children across roles. Values are compared exactly: a missing name differs from every present name, including `<name/>` (`LangString::default()`) and `content=\"\"`. Not compared: the generated-id counters, which are not SACM content. Formatting, attribute order and prefixes are not held by a `Document`, except in preserved content, which `==` and `semantic_compare` compare exactly and in order (`Difference::PreservedContent`, reported last for its element; LIB-COMPAT-003). MultiLangString values are compared in order, though the metamodel does not order `value` (UtilityElement `content`, TaggedValue `key` and Resource `location`, SACM23-BASE-004/005, SACM23-ART-005). The result is deterministic and in a fixed order, and comparison never panics."
source = "D-RT; D-ID; ADR 0010 D2; ADR 0012; ADR 0013; ADR 0020; assurance-forge `libs/sacm/include/sacm/compare/semantic_compare.h`, `src/compare/semantic_compare.cpp`"
kind = "api"
status = "verified"
depends_on = ["SACM23-ARG-002", "SACM23-ARG-003", "SACM23-XMI-012", "LIB-EDIT-001"]
notes = "Slice 0031: designed in ADR 0020. The generated-id counters are excluded so that LIB-RT-003 can hold; LIB-EDIT-002 checks the next generated id on its own. Slice 0037: a test input that still carried `xmi:version` in \"the pinned form\" was corrected (a follow-up); re-checked there. Slice 0039: `Difference::NameId` (a name's `xmi:id`) is added after `Name`; it is tested by SACM23-XMI-022. Slice 0040: reworded for ADR 0025 (MultiLangString roles); re-check there. Slice 0055: reworded because Artifact, Resource, Activity and Event are read now (ADR 0034 amendment 1); re-check there. Slice 0062: reworded for the Terminology kinds; re-check there. Slice 0065: reworded for ExpressionLangString (SACM23-BASE-009); re-check there."
acceptance = [
  "Equal: a document compared with itself and with its clone gives `[]` and `==`; two documents built by the same operations in the same order give `[]` and `==`, for documents with two or more roots, depth 3 or more, names with absent, empty and non-ASCII fields, and each of the six declarations.",
  "Counters: a document built with generated ids and the same content inserted with caller ids compare equal.",
  "Each feature is reported as its own variant with the element id, for a pair differing only in that feature: `LeftOnly` and `RightOnly` (with kind), `Kind`, `Parent` (including root vs contained), `Name`, `AssertionDeclaration`, `ChildOrder` and `RootOrder`. The result is exactly that one difference.",
  "Names: missing vs `LangString::default()`, missing vs `content=\"\"`, `lang` absent vs `lang=\"\"`, and different content are each one `Name` difference; equal names give none.",
  "Order: swapping two siblings, of the same role and of different roles, is one `ChildOrder` on the parent; swapping two roots is one `RootOrder`; adding one child is one `RightOnly` and no order difference.",
  "One-side subtrees: a package present only on the right, holding two Claims, gives three `RightOnly`, in pre-order. A moved element gives one `Parent` and no `LeftOnly` or `RightOnly`.",
  "Output order: a pair with several differences gives them in the ADR 0020 order (root order; then per left element in pre-order: left-only or kind, parent, gid, each flag, each reference end, name, name id, `content` and `key` (value, id, value ids), `version`, `date`, `location` (value, id, value ids), `startTime`, `endTime`, `value`, `externalReference`, declaration, child order, preserved content; then right-only in right's pre-order), and the same result on every run.",
  "Symmetry: `semantic_compare(b, a)` reports the same differences with left and right swapped; `==` is symmetric.",
  "`Difference::element_id` returns the element (the parent for `ChildOrder`, `None` for `RootOrder`); `Display` is one line containing the quoted id and the feature name, and absent and empty names read differently.",
  "MultiLangString: `MultiLangString: Eq` is order-sensitive (a unit or integration test); the order rule is recorded in ADR 0020 for the first row that adds a MultiLangString feature.",
]
code = ["crates/sacm/src/compare.rs", "crates/sacm/src/model/document.rs", "docs/adr/0020-semantic-comparison.md"]
tests = [
  "crates/sacm/tests/compare.rs::lib_rt_001_a_document_equals_itself_and_its_clone",
  "crates/sacm/tests/compare.rs::lib_rt_001_documents_built_by_the_same_operations_are_equal",
