[[row]]
id = "SACM23-XMI-015"
area = "XMI"
milestone = "M2"
title = "Element form of references"
requirement = "Both load modes read a reference given as an empty element in no namespace named by the end, with exactly one link attribute: `xmi:idref=\"id\"` (rule 2l) or an unqualified `href=\"#id\"` (rule 2n, the same document); the value is trimmed (xsd:IDREF, anyURI) and the element may hold only white space, comments and processing instructions (ADR 0026). It reads to a model equal to the attribute form, and `write` writes the attribute form. An attribute and an element for the same end, or two elements on a single-valued end, is `RepeatedValue` (rule 2h). A reference element that does not conform (both link attributes or neither, an empty or all-white-space `xmi:idref` included; an `xmi:idref` with white space inside it; another attribute, such as an unqualified `idref` or `xmi:href`; a child element or text; a namespace-qualified reference element) is kept whole as preserved content of its owner, with one SACM-XMI-003 at its start tag and the end absent (LIB-COMPAT-003, ADR 0033). `Unsupported` at the attribute: a type attribute or `xmi:id` on it (SACM23-XMI-019); an `href` that is not `#id`, with a document part, an XPointer, an empty fragment or white space in the fragment (cross-document links are SACM23-XMI-027)."
source = "XMI 2.5.1 production 2c (p. 62); rules 2c, 2h (p. 63); 2l, 2m, 2n (p. 64) \"Use the idref attribute to specify the id of an XML element that is referenced in the document; use the href attribute to specify an XML element in another document\"; §7.6.2 (pp. 14-15) LinkAttribs; §7.10.1 (p. 23) \"Proxies ... contain no nested elements\"; D-STRICT; D-ROLE-UNQUALIFIED; ADR 0021 amendment 1; ADR 0026"
kind = "xmi"
status = "verified"
verification = "docs/verification/0042-m2-references.md"
depends_on = ["SACM23-XMI-001", "SACM23-XMI-005", "LIB-TOOL-020"]
acceptance = [
  "`<citedElement xmi:idref=\"c2\"/>` and `<citedElement href=\"#c2\"/>` each read equal to `citedElement=\"c2\"`, in both modes and anywhere among the siblings; `write` writes the attribute form.",
  "`xmi:idref=\" c2 \"` reads as `c2` with no diagnostic.",
  "Attribute plus element (same or different ids), and two elements, are each `RepeatedValue` in strict mode (tolerant: LIB-COMPAT-001), with every location.",
  "An element naming an unknown id is kept and gives SACM-REF-001 under `validate`.",
  "`href=\"other.xmi#c2\"`, `href=\"c2\"`, `href=\"#xpointer(...)\"`, `href=\"#\"` and `href=\"\"` are `Unsupported` at the attribute, never dropped.",
  "Both link attributes, neither (also an empty or all-white-space `xmi:idref`), an extra attribute `foo`, an unqualified `idref`, `xmi:href`, a child element, a nested reference element, non-white-space text and `sacm:citedElement` each keep the whole reference element as preserved content of its owner, with one SACM-XMI-003 at its start tag in both modes and the end absent (LIB-COMPAT-003); an `xmi:id`, `xmi:type` or `xsi:type` on it is `Unsupported` at the attribute (SACM23-XMI-019).",
  "An `xmi:idref` holding XML white space inside it after trimming (`\"a b\"`, `\"a&#9;b\"`, `\"a&#10;b\"`) keeps the whole reference element as preserved content of its owner, with SACM-XMI-003 at its start tag, on both ends, because it is no xsd:IDREF and would write back as two ids (LIB-COMPAT-003); white space around it is still trimmed; an `href` whose fragment holds white space (`href=\"#a b\"`) is `Unsupported` at the attribute (SACM23-XMI-027; found by Copilot on PR #53).",
]
tests = [
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_015_idref_and_href_elements_read_equal_to_the_attribute_anywhere_and_write_as_it",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_015_a_link_value_with_white_space_around_it_reads_trimmed_with_no_diagnostic",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_015_an_attribute_and_an_element_or_two_elements_are_repeated_value_with_every_location",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_015_an_element_naming_an_unknown_id_is_kept_and_reported_by_validate",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_015_a_cross_document_xpointer_or_empty_href_is_unsupported_at_the_attribute",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_015_the_cross_document_fixture_is_unsupported_never_dropped",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_015_a_malformed_reference_element_is_preserved_or_unsupported_at_that_construct",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_015_an_idref_with_white_space_inside_is_preserved_and_such_an_href_unsupported",
]
code = ["crates/sacm/src/xmi/roots.rs"]

[[row]]
id = "LIB-COMPAT-008"
area = "COMPAT"
milestone = "M2"
title = "The C++ library's name and text shapes"
requirement = "A tolerant `xmi::read` reads, as their standard form and with one SACM-XMI-012 Warning per occurrence, the name and text shapes the assurance-forge C++ library reads that map one to one onto a LangString or a MultiLangString: a `name=\"…\"` attribute on a ModelElement (its `content`, `lang` absent); text as the `content` of a `name` or `value`; a `name` holding one `value`, or one `content` carrying `lang`; the single-language shorthand of a `content` or `key` role element (`lang`/`content` attributes or text, with no `value`), read as a MultiLangString of one value; `content=` (with optional `lang=`) or text directly on a UtilityElement; and `key=` and `value=` on a `taggedValue` (its `key` and its `content`). Values are kept exactly: absent is not `\"\"` (ADR 0012), and nothing is trimmed. A field given both in a shorthand and in the standard form, or twice, is `RepeatedValue` (SACM-MULT-001) in strict mode (tolerant: LIB-COMPAT-001). A strict read refuses each shape with SACM-XMI-012 (ADR 0022). Both saves write only the standard form. Shapes that invent or merge elements are LIB-COMPAT-012."
source = "XMI 2.5.1 §7.8.6 (p. 19) \"Each property that is a composite is represented by an XML element, but not by an XML attribute.\"; rule 4a (p. 50) \"If the org.omg.xmi.contentType value is mixed, then the mixed attribute is included.\"; formal/23-05-08 §8.5 \"value:LangString[1..*]\", §8.6 \"name:LangString[1] (composition)\"; D-PRESERVE; D-STRICT; ADR 0022 amendment 1 (the maintainer, 2026-11-15); ADR 0025; assurance-forge 65577b3 `libs/sacm/src/io/xmi_reader.cpp:786-846, 1150-1281`, `src/legacy_sacm/sacm_serializer.cpp:27-133`"
kind = "xmi"
status = "verified"
verification = "docs/verification/0049-m2-reading-and-validation.md"
depends_on = ["LIB-COMPAT-001", "SACM23-XMI-012", "SACM23-BASE-004", "SACM23-XMI-014", "SACM23-BASE-005", "SACM23-XMI-021", "SACM23-XMI-022"]
acceptance = [
  "Tolerant: `<sacm:Claim … name=\"X\">` reads with name `lang` None and `content` Some(\"X\") and one SACM-XMI-012 Warning at the attribute's name affecting the element; `name=\"\"` gives Some(\"\"); it writes as `<name content=\"X\"/>`, and the output reads in strict mode with no diagnostic.",
  "Tolerant: `<name>X</name>` gives content \"X\" exactly; `<name lang=\"en\"> X </name>` gives `lang` \"en\" and content \" X \" untrimmed; CDATA and character references give their characters; white-space-only text is no shorthand; the name's `xmi:id` is kept.",
  "`<name content=\"a\">b</name>`, `<name><content>a</content>b</name>`, `name=\"a\"` with a `<name>` child, and `<name lang=\"en\"><content lang=\"de\">x</content></name>` are each `RepeatedValue` (SACM-MULT-001) in strict mode (tolerant: LIB-COMPAT-001), listing every occurrence.",
  "`<name><value lang=\"en\" content=\"X\"/></name>` and `<name><content lang=\"en\">X</content></name>` read as name {en, X} with one Warning; two or more such entries keep the whole `name` as preserved content of the owner, with SACM-XMI-003 at its start tag (LIB-COMPAT-003; LIB-COMPAT-012 is to read them).",
  "`<content lang=\"en\">t</content>`, `<content lang=\"en\" content=\"t\"/>` and `<key>k</key>` each read as a MultiLangString of one value with one Warning; the role element's `xmi:id` is kept as its content or key id; text or a shorthand attribute beside `value` children, and a `lang` alone, keep the whole `content` or `key` as preserved content of its owner, with SACM-XMI-003 (LIB-COMPAT-003).",
  "`<description content=\"x\"/>`, `<note lang=\"en\">x</note>` and `<description content=\"\"/>` read as content [{None,\"x\"}], [{en,\"x\"}] and [{None,\"\"}]; each combined with a `<content>` child is `RepeatedValue`.",
  "`<taggedValue key=\"k\" value=\"v\"/>` reads as key [{None,\"k\"}] and content [{None,\"v\"}]; `key=` with `<key>` is `RepeatedValue`; `key=` or `value=` on any other kind is kept as preserved content of that element, with SACM-XMI-003 at its name (LIB-COMPAT-003).",
  "Strict: each shape is refused with SACM-XMI-012 at the construct (attribute name, first non-white-space text character, or start tag); none is `Unsupported` any more.",
  "Every tolerant read here, written by `xmi::write` in either mode, gives the standard form, and reading it back is `==` to the tolerant read with no diagnostic.",
  "The catalog row SACM-XMI-012 names LIB-COMPAT-008; the shorthand messages and the `xmi` module docs no longer name LIB-COMPAT-008 as pending; the tests that pinned the old refusals are updated.",
]
code = ["crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi.rs", "docs/adr/0022-load-and-save-modes.md"]
tests = [
  "crates/sacm/tests/legacy_shapes.rs::lib_compat_008_a_lang_alone_on_content_or_key_is_preserved_with_it",
  "crates/sacm/tests/legacy_shapes.rs::lib_compat_008_a_shorthand_attribute_beside_value_children_is_preserved_with_its_content_or_key",
