kind = "model"
status = "planned"
depends_on = ["SACM23-ART-003"]

[[row]]
id = "SACM23-ART-006"
area = "ART"
milestone = "M3"
title = "Activity"
requirement = "Activity is represented with `startTime` and `endTime`, created, round-tripped and editable."
source = "formal/23-05-08 clause 12; ptc/22-03-13 Artifact::Activity"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-002", "SACM23-ART-003"]

[[row]]
id = "SACM23-ART-007"
area = "ART"
milestone = "M3"
title = "Event"
requirement = "Event is represented with `date`, created, round-tripped and editable."
source = "formal/23-05-08 §12.9; D-TEXT-MODEL"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-002", "SACM23-ART-003"]

[[row]]
id = "SACM23-ART-008"
area = "ART"
milestone = "M3"
title = "Technique"
requirement = "Technique is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 12; ptc/22-03-13 Artifact::Technique"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-003"]

[[row]]
id = "SACM23-ART-009"
area = "ART"
milestone = "M3"
title = "Participant"
requirement = "Participant is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 12; ptc/22-03-13 Artifact::Participant"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-003"]

[[row]]
id = "SACM23-ART-010"
area = "ART"
milestone = "M3"
title = "ArtifactAssetRelationship"
requirement = "ArtifactAssetRelationship is represented with `source` (1..*) and `target` (1..*) references to ArtifactAssets, created, round-tripped, editable, and its multiplicities validated."
source = "formal/23-05-08 §12.14; D-TEXT-MODEL (name and generalization)"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-004"]

[[row]]
id = "SACM23-ART-011"
area = "ART"
milestone = "M3"
title = "ArtifactGroup"
requirement = "ArtifactGroup is represented with its `artifactElement` membership references, round-tripped and editable."
source = "formal/23-05-08 clause 12; ptc/22-03-13 Artifact::ArtifactGroup"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-001"]

[[row]]
id = "SACM23-XMI-009"
area = "XMI"
milestone = "M3"
title = "Machine-readable-model spellings accepted on import"
requirement = "Tolerant import accepts the ptc/22-03-13 spellings `ArtifactAssertedRelationship`, `occurece` and `argumentationElement` with a warning and maps them to the resolved names; export always writes the resolved names."
source = "D-TEXT-MODEL; docs/sacm/metamodel-inventory.md (Known defects)"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-ART-010", "SACM23-ART-007", "SACM23-ARG-013"]

