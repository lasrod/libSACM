[[row]]
id = "LIB-QA-009"
area = "QA"
milestone = "M0"
title = "Third-party CI actions are pinned and their inputs reviewed"
requirement = "Every third-party action used by a workflow in `.github/workflows/` (every `uses` whose owner is not GitHub's `actions`) is pinned by a full commit SHA. A test keeps a reviewed table of each pinned action and SHA, with the inputs the repository may pass it. A version bump, which changes the SHA, therefore fails the test until someone reviews the action's inputs at the new SHA."
source = "Verification 0002 rounds 3 and 4 follow-up (cargo-deny-action@v2 splices inputs into an unquoted command line; @v2 is a moving tag)"
kind = "quality"
status = "out-of-scope"
notes = "Retired 2026-11-09 (slice 0012, ADR 0006 amendment 2): harness hardening beyond what protects the library's users; CI configuration is protected by branch protection and review."

