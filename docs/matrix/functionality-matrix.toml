source = "formal/23-05-08 §12.11 (p. 49) \"Activity represents units of work related to the management of ArtifactAssets.\", \"startTime: date[0..1] - time when the activity started.\", \"endTime: date[0..1] - time when the activity ended.\"; ptc/22-03-13 Artifact::Activity (generalization ArtifactAsset); ADR 0034 amendment 1"
