  "crates/sacm/tests/serde_diagnostics.rs::lib_api_018_arguments_that_do_not_match_the_template_are_refused",
  "crates/sacm/tests/serde_diagnostics.rs::lib_api_018_a_refusal_record_naming_a_diagnostic_template_is_refused",
  "crates/sacm/tests/serde_diagnostics.rs::lib_api_018_the_invalid_write_error_s_diagnostics_carry_their_templates",
  "xtask/tests/message_templates.rs::lib_api_018_template_rs_declares_the_102_diagnostic_templates",
  "xtask/tests/message_templates.rs::lib_api_018_the_crate_builds_diagnostics_only_from_templates",
  "xtask/tests/message_templates.rs::lib_api_018_construction_check_reports_a_diagnostic_built_without_a_template",
