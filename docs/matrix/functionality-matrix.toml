[[row]]
id = "LIB-TOOL-006"
area = "TOOL"
milestone = "M0"
title = "Cited paths stay inside the repository"
requirement = "Code, test and verification-record citations must be relative paths that resolve inside the repository; absolute paths and `..` escapes are rejected by the gate."
source = "Verification 0001 follow-up"
kind = "tooling"
status = "verified"
code = ["xtask/src/matrix.rs"]
acceptance = [
  "A cited path is a `code` entry, the path part of a `path::function` test citation, a `doctest:` path, or `verification`. It must be a relative, `/`-separated path. Any of the following is reported as `cited path `<p>` must be a relative path inside the repository`, with the row id: an empty path; a path starting with `/`; a path containing `\\` or `:`; a path with an empty component (`a//b`, a trailing `/`); a path with a `.` or `..` component.",
  "The gate never reads or stats a rejected path: it reports it and skips the existence, content and test checks for that citation. A test uses a `Repo` that records every path asked for.",
  "Real names that only look unusual stay accepted: dot-files and dot-directories (`.github/workflows/ci.yml`, `.cargo/mutants.toml`), and names containing `..` inside a component (`a..b.md`).",
  "Every path cited in the real matrix passes.",
]
depends_on = ["LIB-TOOL-001"]
tests = [
  "xtask/tests/gate_hardening.rs::lib_tool_006_rejects_an_empty_path",
  "xtask/tests/gate_hardening.rs::lib_tool_006_rejects_an_absolute_path",
  "xtask/tests/gate_hardening.rs::lib_tool_006_rejects_a_path_containing_a_backslash",
  "xtask/tests/gate_hardening.rs::lib_tool_006_rejects_a_path_containing_a_colon",
  "xtask/tests/gate_hardening.rs::lib_tool_006_rejects_a_path_with_an_empty_component",
  "xtask/tests/gate_hardening.rs::lib_tool_006_rejects_a_path_with_a_dot_component",
  "xtask/tests/gate_hardening.rs::lib_tool_006_rejects_a_path_with_a_dot_dot_component",
  "xtask/tests/gate_hardening.rs::lib_tool_006_a_path_breaking_several_rules_is_reported_once",
  "xtask/tests/gate_hardening.rs::lib_tool_006_accepts_dot_names_and_double_dots_inside_a_component",
  "xtask/tests/gate_hardening.rs::lib_tool_006_a_rejected_path_does_not_hide_the_other_citations",
  "xtask/tests/gate_hardening.rs::lib_tool_006_a_bad_verification_path_on_a_non_verified_row_is_rejected_and_never_read",
  "xtask/tests/gate_hardening.rs::lib_tool_006_every_path_cited_in_the_real_matrix_is_inside_the_repository",
]
verification = "docs/verification/0004-m0-gate-hardening-round2.md"

