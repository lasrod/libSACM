[[row]]
id = "SACM23-XMI-019"
area = "XMI"
milestone = "M6"
title = "XMI document metadata"
requirement = "XMI document metadata is preserved or refused, never dropped silently: `xmi:documentation`, `xmi:extension` and `xmi:Extension` (on the wrapper and inside any object), `xmi:difference`, `xmi:uuid`, `xmi:label`, `href` and `xmi:idref` on objects, and `xsi:schemaLocation`. SACM23-XMI-001 refuses them as `Unsupported` until then."
source = "XMI 2.5.1 formal/15-06-07 §7.3.3 (p. 7) \"Tools that rely on XMI are expected to store the extension information and export it again to enable round trip engineering\"; §7.6.1 (p. 14) \"The value of the label attribute is ignored on import.\"; XMI.xsd; assurance-forge xmi_reader.cpp:1543-1546 (ignores unknown XMI and XSI attributes)"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-001"]

[[row]]
id = "SACM23-XMI-020"
area = "XMI"
milestone = "M2"
title = "An element without an xmi:id"
requirement = "Import, in both load modes, accepts an element with no `xmi:id`. It gives the element a generated id that is unused in the document and deterministic for the input, and reports SACM-XMI-004 naming the generated id and the element's location. This narrows SACM23-XMI-001's `Unsupported` for a root without an id. It departs from C++, where a missing id is an Error in strict mode and the element is dropped (`xmi_reader.cpp:755-762`); this is the maintainer's decision of 2026-11-12."
source = "XMI 2.5.1 §7.6.1 (p. 13) `use=\"optional\"`; D-STRICT; D-ID; the maintainer's decision of 2026-11-12"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-001", "SACM23-XMI-004"]

[[row]]
id = "LIB-COMPAT-009"
area = "COMPAT"
milestone = "M6"
title = "Foreign container roots"
requirement = "A tolerant load reads SACM packages out of a non-SACM root (an ODE `DDIPackage`, say) and reports SACM-XMI-009; a strict load refuses it with SACM-XMI-001, as SACM23-XMI-001 does today."
source = "docs/sacm/diagnostics.md SACM-XMI-009; assurance-forge xmi_reader.cpp:2227-2263"
kind = "compliance"
status = "planned"
depends_on = ["SACM23-XMI-001", "LIB-COMPAT-001"]

[[row]]
id = "LIB-COMPAT-010"
area = "COMPAT"
milestone = "M2"
title = "Tolerant inference of a missing type attribute"
requirement = "A tolerant load of an abstract-role child with no type attribute infers the class from the element's local name, exactly, and reports a warning. A strict load reports SACM-XMI-005 (SACM23-XMI-016)."
source = "Moved from SACM23-XMI-006 in slice 0025; assurance-forge `xmi_reader.cpp:1103-1116` (case-insensitive there)"
kind = "compliance"
status = "planned"
depends_on = ["LIB-COMPAT-001", "SACM23-XMI-016"]

[[row]]
id = "LIB-TOOL-021"
area = "TOOL"
milestone = "M2"
title = "XMI.xsd is fetched with the XMI specification"
requirement = "`cargo xtask fetch-spec` also downloads the normative XMI.xsd (`http://www.omg.org/spec/XMI/20131001/XMI.xsd`, listed on the XMI 2.5.1 cover as a normative machine-consumable file), hash-pinned like the other sources."
source = "Slice 0021 research: SACM23-XMI-001 and specification defect D10 rest on XMI.xsd, read unpinned"
kind = "tooling"
status = "planned"
depends_on = ["LIB-TOOL-020"]

[[row]]
id = "LIB-SEC-006"
area = "SEC"
milestone = "M1"
title = "W3C XML conformance: not-well-formed input is refused"
requirement = "`cargo xtask fetch-spec` also fetches the W3C XML Conformance Test Suite 20130923 (`xmlts20130923.tar.gz`, SHA-256-pinned) into the git-ignored `third_party/xmlconf/` and extracts it; it is never committed, and no case file is copied into the repository (fetch-only use, the maintainer's decision of 2026-11-11, because the suite's parts carry different terms). `cargo xtask fetch-spec --only xmlconf` fetches only the suite, for CI. A test reads the suite's 21 catalogs and runs through `xmi::read` every TEST with TYPE `not-wf`, RECOMMENDATION XML1.0 (the default), XML1.0-errata2e/3e/4e, NS1.0 or NS1.0-errata1e, VERSION absent or listing 1.0, and EDITION absent or listing 5. Each is refused: `Malformed` or `Doctype`, or `Unsupported` only from the encoding steps; a root-stage result (`Ok`, `InvalidRoot`, `NoPackage`, root-stage `Unsupported`) counts as accepted, because the suite's documents are not SACM. The one case roxmltree 0.21.2 accepts, rmt-ns10-032 (`xmlns:xmlns` declared), is refused by a new check (Namespaces 1.0 §3), so the list of accepted cases is empty and the parser's leniencies within the suite form a closed, reviewed list. Valid and invalid XML 1.0 and NS 1.0 cases that reach the root stage are never refused as `Malformed` (a guard against an over-strict scan). Outside the suite, other parser leniencies may remain; LIB-SEC-005's tree-oracle sweep checks only that libSACM's checks agree with the parser's tree."
source = "XML 1.0 5th ed. §1.2 \"fatal error: An error which a conforming XML processor MUST detect and report to the application.\", \"Violations of well-formedness constraints are fatal errors.\"; Namespaces in XML 1.0 3rd ed. §3 \"The prefix xmlns is used only to declare namespace bindings and is by definition bound to the namespace name http://www.w3.org/2000/xmlns/. It MUST NOT be declared.\", §7, §8 \"a processor MUST report violations of namespace well-formedness\"; W3C XML Conformance Test Suite 20130923 (https://www.w3.org/XML/Test/xmlts20130923.tar.gz, SHA-256 9b61db9f5dbffa545f4b8d78422167083a8568c59bd1129f94138f936cf6fc1f) and its testcases.dtd (TYPE, RECOMMENDATION, VERSION, EDITION, ENTITIES); rmt-ns10-032; slice 0021 verification rounds 2-4; ADR 0005 B1; roxmltree 0.21.2 src/parse.rs:779-813 (prefix `xmlns` with local name `xmlns` is not checked); slice 0022 research probe (1,017 applicable cases, 1 accepted)"
kind = "security"
status = "verified"
verification = "docs/verification/0024-m1-utf16-input.md"
depends_on = ["LIB-SEC-005", "LIB-TOOL-020"]
acceptance = [
  "Fetch: `cargo xtask fetch-spec` downloads the pinned archive to `third_party/xmlconf/`, refuses a hash mismatch (deleting the partial file), extracts it with the system `tar` only after the hash matches, re-extracts when `xmlconf/xmlconf.xml` is missing, and changes nothing when both are present. `--only xmlconf` fetches only the suite, and the OMG sources are untouched. A missing or failing `tar` is an error naming it, never a panic. Tests use a fake downloader; the existing `ARTIFACTS` list is unchanged. `/third_party/xmlconf/` is git-ignored, and the fetch module docs state the fetch-only terms.",
  "Catalogs: the test's catalog list equals the master `xmlconf.xml`'s external entity declarations (21 files); each TEST URI resolves against its own catalog file's directory, and every one exists.",
  "Counts are pinned exactly: 2,585 TEST elements; 1,017 selected (993 XML 1.0, 24 NS 1.0); excluded and named: 309 edition-1-4-only, 172 XML 1.1 or NS 1.1, and the 3 NS1.0 `error` cases.",
  "Every selected case is refused, with the breakdown pinned: `Doctype` 719, `Unsupported` from the encoding steps 2, `Malformed` 296 (after SACM23-XMI-018). An `Unsupported` counts as refused only for a case the test itself sees as UCS-4, as UTF-16 without a byte order mark, or as declaring an encoding other than UTF-8 or ASCII without a UTF-16 byte order mark.",
  "On failure the test lists every accepted case with its id, file, SECTIONS and result. The test's list of known accepted cases is empty; were a case ever listed, it would fail once refused, so the list stays exact.",
  "Guard against over-strictness: the valid and invalid XML 1.0 and NS 1.0 cases with NAMESPACE `yes` that reach the root stage (73 in this release, after SACM23-XMI-018) are never `Malformed`.",
  "No case panics, and the whole run returns within the deadline.",
  "`xmlns:xmlns=\"urn:x\"` gives `Malformed` at the attribute name, on the root and on a child, with single quotes, with white space around `=`, and before an ArtifactPackage root (not `Unsupported`), with a reason of its own in the LIB-SEC-002 form. `xmlns:xmlns=\"\"` gets this reason, not the undeclaring one. `xmlns:xmlns=\"http://www.w3.org/2000/xmlns/\"` keeps the parser's refusal.",
  "Not refused: `xmlns:xmlnsx=\"urn:x\"`, `xmlns:xmlfoo=\"urn:x\"` (§3: processors \"MUST NOT treat them as fatal errors\"), `xmlns:xml=\"http://www.w3.org/XML/1998/namespace\"` (§3 \"MAY … be declared\"), and `xmlns:xmlns='x'` inside a comment, a CDATA section, a PI or an attribute value.",
  "LIB-SEC-005's tree-oracle sweep also generates `xmlns:xmlns` declarations; such an input is `Malformed` exactly when the roxmltree tree binds the prefix `xmlns`.",
  "With the suite absent, the test fails when the `CI` environment variable is set and prints a SKIPPED notice to stderr otherwise; every run with the suite prints `ran 1017 cases`. CI fetches the suite with `--only xmlconf` and caches it by its hash in every job that runs the crate's tests, including the mutation jobs.",
  "The `read` docs (`# Errors` step 7), the input.rs module docs and ADR 0005 B1 state the closed list against the suite, and that outside it other parser leniencies may remain, with LIB-SEC-005's sweep checking only that libSACM's checks agree with the parser's tree.",
]
