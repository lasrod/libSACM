[[row]]
id = "SACM23-ARG-014"
area = "ARG"
milestone = "M5"
title = "ArgumentPackageInterface"
requirement = "ArgumentPackageInterface is represented with `implements` (1), and is created, round-tripped and editable; it does not trigger the homogeneity rule (D-PKG-HOMOG). An ArgumentPackage's `interface` references (0..*) are owned here: the model declares them, the text of the package's clause omits them (metamodel inventory, model followed). Each reference end it adds follows SACM23-XMI-005/015 (serialization), SACM23-VAL-003/004/022 (dangling, typing, repeats), LIB-EDIT-009 (edits), LIB-API-015 (a `ReferenceEnd` in `ALL`, with `applies_to` and `bounds`; LIB-API-014 lists its referrers) and, for an end with a lower bound, LIB-EDIT-005's scrub rule, rewording SACM23-ART-010 and LIB-API-015 where they count the ends. As an owner it is exempt from SACM23-VAL-012 (D-PKG-HOMOG, following C++), though it is an ArgumentPackage by inheritance (§11.6). The ends are kept as written and never synced (Q1); the exemption from SACM23-VAL-012 is kept (Q5)."
source = "formal/23-05-08 §11.6 (pp. 37-38) \"ArgumentPackageInterface is a kind of ArgumentPackage that defines an interface that may be exchanged between users.\", \"Superclass ArgumentPackage\", \"implements:ArgumentPackage[1] - a reference to the ArgumentPackage which the ArgumentPackageInterface declares.\"; ptc/22-03-13 Argumentation::ArgumentPackageInterface (implements, no multiplicity: [1]) and ArgumentPackage::interface (0..*, l. 785); M5 decisions Q1, Q5, Q9 (the maintainer, 2026-11-18); D-PKG-HOMOG; ADR 0039"
kind = "model"
code = ["crates/sacm/src/model/reference.rs", "crates/sacm/src/model/document.rs", "crates/sacm/src/compare.rs", "crates/sacm/src/edit/argumentation.rs", "crates/sacm/src/edit/references.rs", "crates/sacm/src/edit/copy.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/output.rs", "crates/sacm/src/xmi/refusal.rs", "docs/adr/0039-package-interfaces-and-bindings.md"]
tests = [
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_reads_typed_in_every_role_and_as_a_root",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_implements_and_interface_read_in_attribute_and_element_form",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_repeated_empty_and_qualified_implements_follow_the_reference_rules",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_missing_implements_reads_and_writes_back_unchanged",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_dangling_and_wrongly_typed_ends_report_their_clause_and_type",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_writes_attribute_order_and_the_golden_file",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_the_fixture_reads_validates_and_writes_exactly_the_golden_file",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_reference_end_tables_bounds_and_serde",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_reference_edits_keep_implements_at_exactly_one",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_interface_and_implements_are_never_synced",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_compare_reports_interfaces_and_implements",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_homogeneity_exemption_on_the_read_path",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_move_copy_and_the_element_edits_apply",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_copy_follows_copied_ids",
  "crates/sacm/tests/serde.rs::sacm23_arg_014_create_interface_serializes_to_the_golden_json",
  "crates/sacm/tests/argument_package_interfaces.rs::sacm23_arg_014_create_reports_what_it_holds_and_checks_in_order",
]
acceptance = [
  "`sacm23_arg_014_reads_typed_in_every_role_and_as_a_root`: In both modes, with no diagnostic, it reads as `<argumentElement xmi:type=\"sacm:ArgumentPackageInterface\">` in an ArgumentPackage, as `<argumentPackage xmi:type=…>` in an AssuranceCasePackage, as `<artifactElement xmi:type=…>` in an ArtifactPackage, and as a `<sacm:ArgumentPackageInterface>` root, bare and inside `xmi:XMI`. It reads with its name, utility children, gid, flags, `citedElement` and `abstractForm`, and holds its children in `argumentElement`. An untyped `<argumentElement>` is `MissingType`. An untyped `<argumentPackage>` reads as a plain ArgumentPackage.",
  "`sacm23_arg_014_implements_and_interface_read_in_attribute_and_element_form`: `implements=\"p\"`, `<implements xmi:idref=\"p\"/>` and `<implements href=\"#p\"/>` read equal. `interface=\"i1 i2\"` on an ArgumentPackage and on an ArgumentPackageInterface (inherited) reads both ids in order, and element forms append.",
  "`sacm23_arg_014_repeated_empty_and_qualified_implements_follow_the_reference_rules`: `implements=\"a b\"` and attribute plus element are `RepeatedValue` in strict mode. In tolerant mode they follow today's single-valued end rule (as `target`): `implements=\"a b\"` is kept with SACM-MULT-001 `repeat-kept` and the end holds none; attribute plus element keeps the attribute's id as the first occurrence, and the element is kept with `repeat-kept`. `implements=\"\"` and `sacm:implements=\"p\"` are preserved content of the element, with one SACM-XMI-003 in both modes. `interface=\"i i\"` is held twice and gives one SACM23-VAL-022 Warning with clause `11.4`.",
  "`sacm23_arg_014_missing_implements_reads_and_writes_back_unchanged`: no `implements` reads in both modes, both saves write it with nothing added, and `validate` gives no finding for it in this slice.",
  "`sacm23_arg_014_dangling_and_wrongly_typed_ends_report_their_clause_and_type`: `implements=\"gone\"` gives SACM-REF-001, clause `11.6`, message `ArgumentPackageInterface \"i\" has the implements \"gone\", which names no element of the document (the end's type is ArgumentPackage)`. A strict write refuses it; a tolerant write writes it. `implements` naming a Claim gives SACM-REF-002, clause `11.6`, type `ArgumentPackage`. Naming an ArgumentPackage, an ArgumentPackageInterface or an ArgumentPackageBinding gives none; naming an ArtifactPackage gives REF-002. `interface` naming a Claim, an ArgumentPackageBinding, an ArgumentPackage or an ArtifactPackageInterface gives REF-002, clause `11.4`, type `ArgumentPackageInterface`.",
  "`sacm23_arg_014_writes_attribute_order_and_the_golden_file`: Attribute order is `xmi:type, xmi:id, gid, isCitation, isAbstract, citedElement, abstractForm, interface, implements`. The ArgumentPackage writes `… abstractForm, interface`. `sacm23_arg_014_the_fixture_reads_validates_and_writes_exactly_the_golden_file` (shared with SACM23-ARG-015): `argument-package-interfaces-valid.sacm.xmi`, with `implements` and `participantPackage` in element form, reads in both modes with no diagnostic and no `validate` finding; a strict write gives exactly `golden/argument-package-interfaces.golden.sacm.xmi`, which reads back `==` and writes the same bytes again.",
  "`sacm23_arg_014_reference_end_tables_bounds_and_serde`: `Interface.name()==\"interface\"` and `Implements.name()==\"implements\"`. Bounds: `Implements.bounds(ArgumentPackageInterface)==Some((1,Some(1)))`; `Interface.bounds(ArgumentPackage|ArgumentPackageInterface|ArgumentPackageBinding)==Some((0,None))`; `Implements.bounds(ArgumentPackage)==None`; `Interface.bounds(TerminologyPackage)==None` and `Interface.bounds(AssuranceCasePackage)==None` in this slice. The serde names are `\"interface\"` and `\"implements\"`.",
  "`sacm23_arg_014_create_reports_what_it_holds_and_checks_in_order`: `root` and `new` hold the parent, id, name and `implements` given; the create reports the interface in `created_ids` only and leaves the package's `interface` end unchanged. An AssuranceCasePackage, an ArgumentPackage or an ArtifactPackage, their interfaces and bindings included, is a legal parent, and so is no parent (a root); a Claim, a TerminologyPackage or an Artifact is `InvalidParent`. The checks run `ParentNotFound`, `InvalidParent`, `InvalidId`, `DuplicateId`, the name's expression (5a), then `InvalidReference`, `ReferenceNotFound` and `WrongReferenceType` (`expected: \"ArgumentPackage\"`), each over `implements` before the name's expression. The generated id is `argument_package_interface_<n>`, and a refusal does not advance it.",
  "`sacm23_arg_014_reference_edits_keep_implements_at_exactly_one`: `SetReferences::clear(i, Implements)` and `RemoveReference` are `TooFewReferences{end:\"implements\",given:0,required:1}`. `[p,q]` and `AddReference` onto a held id are `TooManyReferences{given:2,allowed:1}`. `Implements` on an ArgumentPackage is `FeatureNotApplicable`, Display `the ArgumentPackage \"p\" has no implements`. `Interface` on a Claim is `FeatureNotApplicable`.",
  "`sacm23_arg_014_interface_and_implements_are_never_synced` (Q1): Creating `i` with `implements=p` leaves `p.interfaces()` empty. `AddReference(p, Interface, i)` leaves `i.implements()` as it was. Changing either end never changes the other. `doc.referrers(\"p\")` lists `(i, Implements, 0)`, and `doc.referrers(\"i\")` lists `(p, Interface, 0)`.",
  "`sacm23_arg_014_compare_reports_interfaces_and_implements`: `Difference::Interfaces` and `Difference::Implements`, after `TerminologyGroupMembers`. Display: `element \"p\" differs in interface: [\"i\"] on the left, [] on the right` and `element \"i\" differs in implements: \"p\" on the left, no implements on the right`.",
  "`sacm23_arg_014_homogeneity_exemption_on_the_read_path` (Q5, D-PKG-HOMOG): read from XMI, `p{i, c}` gives no SACM-PKG-001; `p{q, i, c}` gives exactly one, `[p, c]`; an interface owner `i{q, c}` gives none.",
  "`sacm23_arg_014_move_copy_and_the_element_edits_apply`: SetName, SetGid, SetFlag, ReorderElements, MoveElement and CopyElements, as described in the Copy and move section. Creates and deletes of interfaces join LIB-EDIT-002's set in `edit_atomic.rs`.",
  "Copy and move (ADR 0036, Q6): `…_copy_follows_copied_ids`: copying `p` gives `p'` with `interface=[i']`, `i'.implements=p'` and `ci'.citedElement=c'`. Assert through `source_ids()` and `created_ids()`. Copying `i` alone under `q` keeps `implements=p`, and `q.interfaces()` is unchanged. Copying `b` into an empty document gives `ReferenceNotFound{end:\"participantPackage\",id:\"i\"}`. An interface read with no `implements` gives `TooFewReferences{end:\"implements\",given:0,required:1}` when copied; a binding read with `[i,i]` gives `TooFewReferences{given:1,required:2}`. Move: an interface moves to the roots, into an ArtifactPackage and back. The references and the `validate` findings are unchanged. Into a TerminologyPackage is `InvalidParent`, and so is an ArtifactPackageInterface into an ArgumentPackage.",
]
status = "implemented"
depends_on = ["SACM23-ARG-001", "SACM23-BASE-007", "SACM23-VAL-012", "SACM23-XMI-015", "SACM23-VAL-004", "LIB-EDIT-009", "LIB-EDIT-005"]
notes = "Also read as an interchange root, bare or inside `xmi:XMI`, in both modes, since slice 0066 (SACM23-XMI-001); C++ accepts it too (element_kind.cpp:87-105).cpp:87-105)."

