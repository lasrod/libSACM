[[row]]
id = "SACM23-XMI-010"
area = "XMI"
milestone = "M2"
title = "Source locations on read diagnostics"
requirement = "Every diagnostic produced while reading XMI carries the line and column of the element or attribute it concerns."
source = "D-DIAG"
kind = "xmi"
status = "planned"
depends_on = ["LIB-DIAG-001", "SACM23-XMI-001"]

[[row]]
id = "LIB-COMPAT-007"
area = "COMPAT"
milestone = "M1"
title = "Strict save writes only valid models"
requirement = "Strict save runs `validate()` first. If it reports any Error, the save is refused with an error that names each code and its affected elements, and nothing is written. Tolerant save writes the document as it is held, including model-invalid content. Strict output is therefore schema-conforming (clause 2) and a valid SACM 2.3 model."
source = "formal/23-05-08 §2.1–2.5; XMI 2.5.1 §7.8.2; D-STRICT; ADR 0013 amendment 1"
kind = "xmi"
status = "planned"
depends_on = ["LIB-COMPAT-001", "SACM23-XMI-007", "SACM23-VAL-018", "LIB-TOOL-020"]

[[row]]
id = "SACM23-XMI-013"
area = "XMI"
milestone = "M1"
title = "Export of one or more roots"
requirement = "`xmi::write` writes every root in document order: one root bare, more than one inside a single `xmi:XMI` element that carries the namespace declarations and `xmi:version`. Each of the twelve package kinds is written as a root under its class name. A document with no root makes the write fail with an error, and nothing is returned; C++ writes an empty `xmi:XMI` instead (the maintainer's decisions of 2026-11-12 (ADR 0017))."
source = "XMI 2.5.1 §7.5.3 (p. 10) \"it must be the XMI element if there are multiple elements\"; formal/23-05-08 §2.2–2.5 (pp. 4–5), §9.3 (p. 24), §11.6 (p. 37) \"ArgumentPackageInterface is a kind of ArgumentPackage that defines an interface that may be exchanged between users\"; ADR 0010 D1; ADR 0016; ADR 0017; assurance-forge `io/xmi_writer.cpp:529-549`"
kind = "xmi"
status = "implemented"
depends_on = ["SACM23-XMI-001", "SACM23-XMI-007"]
acceptance = [
  "With one root, the document element is `sacm:<Kind>` and there is no `xmi:XMI`.",
  "With two or more roots, there is one `xmi:XMI` and the roots are its element children in `roots()` order; a mixed order such as AP, ACP, AP is kept.",
  "Each of the twelve package kinds written as a single root uses its own class name.",
  "An empty `Document` makes the write fail with an error, and no output is returned.",
  "The output for 1 and for 3 AssuranceCasePackage/ArgumentPackage roots reads back to the same ids, kinds and order.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "docs/adr/0017-xmi-writer.md"]
tests = [
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_013_one_root_is_the_document_element_with_no_xmi_element",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_013_several_roots_are_the_children_of_one_xmi_element_in_document_order",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_013_each_package_kind_is_written_as_a_single_root_under_its_class_name",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_013_an_empty_document_is_refused_with_no_root",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_013_one_and_three_roots_read_back_to_the_same_ids_kinds_and_order",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_013_every_readable_input_writes_and_reads_back_to_the_same_ids_and_kinds",
]
notes = "Slice 0025: the earlier clause on \"the four interchange packages\" is dropped; every package kind is a root (§9.3, §11.6, ADR 0016)."

[[row]]
id = "SACM23-XMI-014"
area = "XMI"
milestone = "M1"
title = "Element form of single-valued values"
requirement = "Import in both modes accepts the XML element form of single-valued DataType-typed properties (`lang`, `content`, `gid`, `isCitation`, `isAbstract`, `assertionDeclaration`, ...) as well as the attribute form, and the same document in either form loads to an equal model. Export writes the attribute form. When both forms are present, or a single-valued element form is repeated, every value is kept with an Error diagnostic and none is silently chosen (D-PRESERVE); strict save then refuses the document. An element form that carries attributes, such as the legacy `<name><content lang=\"en\">`, is not the schema form: LIB-COMPAT-008 reads it."
source = "formal/23-05-08 §2.4; XMI 2.5.1 §7.8.4 (an XML attribute and an XML element are both declared)"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-001", "SACM23-XMI-011", "LIB-TOOL-020"]

[[row]]
id = "SACM23-XMI-015"
area = "XMI"
milestone = "M2"
title = "Element form of references"
requirement = "Import in both modes accepts references written as XML elements (XMI 2.5.1 rule 2c) as well as IDREF and IDREFS attributes, and both load to an equal model. Only the non-XMI dialects stay tolerant-only. Export writes IDREFS attributes."
source = "formal/23-05-08 §2.4; XMI 2.5.1 rules 4e, 4i and 2c"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-001", "SACM23-XMI-005", "LIB-TOOL-020"]

[[row]]
id = "LIB-COMPAT-008"
area = "COMPAT"
milestone = "M2"
title = "The C++ library's name and text shapes"
requirement = "Documents written by the assurance-forge C++ library load without loss in both modes: the legacy multi-language `<name>` with `<content lang>` children (the first entry is the name; the rest are kept, never dropped), a `name=\"…\"` attribute on the element, and the single-language shorthand of a MultiLangString role (`lang`/`content` attributes on the role element with no `value` children, read as one value). Tolerant mode reports each with a warning, strict mode with an error, and strict save writes only the standard form."
source = "D-PRESERVE; D-STRICT; assurance-forge libs/sacm io/xmi_reader.cpp (name, read_multi_lang_values); slice 0016 verification"
kind = "xmi"
status = "planned"
depends_on = ["LIB-COMPAT-001", "SACM23-XMI-012", "SACM23-BASE-004"]

[[row]]
id = "LIB-TOOL-020"
area = "TOOL"
milestone = "M1"
title = "XMI 2.5.1 is fetched with the SACM sources"
requirement = "`cargo xtask fetch-spec` also downloads XMI 2.5.1 (formal/15-06-07) into the git-ignored third_party/, hash-pinned like the SACM sources, so the XMI rows can quote it."
source = "Verification 0016: the XMI citations in SACM23-XMI-012, -XMI-014, -XMI-015 and LIB-COMPAT-007 cannot be checked without the text"
kind = "tooling"
status = "verified"
depends_on = ["LIB-TOOL-002"]
acceptance = [
  "`xtask::fetch::ARTIFACTS` lists XMI 2.5.1 (formal/15-06-07) after the two SACM sources (ADR 0003 source priority 3): file `XMI-2.5.1-formal-15-06-07.pdf`, URL `https://www.omg.org/spec/XMI/2.5.1/PDF`, SHA-256 `2bf97c670f128affc9ed5dc202ef748101afd0eee8ee662e8763da6092c80c1b`. The SACM entries are unchanged.",
  "It is fetched into the same git-ignored `third_party/sacm-2.3/` under the LIB-TOOL-002 policy, with no special case: an existing file with the pinned hash is not downloaded again, and a wrong hash is an error.",
  "ADR 0003, CONTRIBUTING.md, the `fetch` module docs and the `fetch-spec` help text name XMI 2.5.1 among the fetched sources, and none of them says the command fetches only SACM documents.",
  "A live `cargo xtask fetch-spec` into an empty directory fetches all three files with their pinned hashes (evidence in the verification record).",
]
code = ["xtask/src/fetch.rs", "xtask/src/lib.rs", "docs/adr/0003-sacm-2-3-sources-and-priority.md", "CONTRIBUTING.md"]
tests = [
  "xtask/tests/fetch.rs::lib_tool_020_artifacts_end_with_the_xmi_2_5_1_pin",
  "xtask/tests/fetch.rs::lib_tool_020_sacm_artifacts_are_unchanged_and_come_first",
  "xtask/tests/run.rs::lib_tool_020_run_help_says_fetch_spec_fetches_xmi_2_5_1",
]
verification = "docs/verification/0020-m1-xmi-spec-fetch.md"

[[row]]
id = "LIB-COMPAT-003"
area = "COMPAT"
milestone = "M2"
title = "Unknown content is preserved, not dropped"
