[[row]]
id = "LIB-API-017"
area = "API"
milestone = "M4"
title = "Every read and write refusal has a code, a template and arguments"
requirement = "Every `ReadError` and `WriteError` has a catalog code, a message template and the template's arguments. `ReadError::code()` and `WriteError::code()` return a `Code`, not an `Option` (Breaking, 0.2.0). `ReadError::Unsupported` takes the code that a tolerant read gives the same input, by refusal-list entry: an `Interim` entry: SACM-XMI-014, except `CrossDocumentHref`, which is SACM-XMI-007; a `Defect`: SACM-XMI-003; `OtherSacmNamespace`: SACM-XMI-002; `OtherXmiNamespace`: SACM-XMI-015; `Encoding`: SACM-XML-002; `Capacity` and `Unheld`: SACM-SEC-002. `WriteError::NoRoot` is SACM-XMI-001, `UnrepresentableCharacter` is SACM-XML-003 and `Invalid` is SACM-XMI-016. `template()` returns a stable id `<CODE>/<form>` that names the English sentence form. `arguments()` returns the values the sentence is made from, as named `Argument`s (`ArgumentValue::Text` or `Count`), in the order they first appear in the sentence. Ids, names and kinds are listed in docs/sacm/diagnostics.md and follow ADR 0030 amendment 1's semver rule (ADR 0030 amendment 3). One crate-private renderer builds the variable part of every `Display` from the template and its arguments. Every `Display`, `reason` and `shape` is byte-identical to 0.1.0's for the same input. With `serde`, `ReadError`, `WriteError` and `WriteAttribute` serialize and read back. A refusal is `{\"type\", \"code\", \"template\", \"arguments\", …its fields}`."
source = "GitHub issue #82; the maintainer's decisions Q8–Q11, 2026-11-17; D-DIAG; ADR 0011; ADR 0030 and its amendments 1 and 3; docs/sacm/diagnostics.md"
kind = "api"
