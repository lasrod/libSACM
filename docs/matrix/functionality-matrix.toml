[[row]]
id = "SACM23-XMI-018"
area = "XMI"
milestone = "M1"
title = "UTF-16 input"
requirement = "`xmi::read` reads UTF-16 input that begins with a byte order mark (`FF FE` little-endian, `FE FF` big-endian, not followed by `00 00`). It decodes the input with std only (`u16::from_le_bytes`/`from_be_bytes`, `char::decode_utf16`) and then reads it exactly as the same characters in UTF-8, so the `ReadOutput` or `ReadError` is the same. Locations count characters as for UTF-8, and the byte order mark takes no column. The encoding declaration may be absent or name `UTF-16`, `UTF-16LE` or `UTF-16BE`, in any letter case. Any other declared name contradicts the mark and is `Malformed` (SACM-XML-001, XML 1.0 §4.3.3). So are an odd byte count and an unpaired surrogate. Everything else stays `Unsupported`, as in LIB-API-009: UTF-16 without a byte order mark (nothing is guessed), UTF-32 and UCS-4, and a UTF-16 name declared in UTF-8 input. This is the minimal UTF-16 support the maintainer chose on 2026-11-12 (ADR 0005 B2 amendment 1)."
source = "XML 1.0 (Fifth Edition): §2.2 \"All XML processors MUST accept the UTF-8 and UTF-16 encodings of Unicode\" and [2] Char; §4.3.3 \"All XML processors MUST be able to read entities in both the UTF-8 and UTF-16 encodings. The terms \"UTF-8\" and \"UTF-16\" in this specification do not apply to related character encodings, including but not limited to UTF-16BE, UTF-16LE\", \"Entities encoded in UTF-16 MUST ... begin with the Byte Order Mark\", \"it is a fatal error for an entity including an encoding declaration to be presented to the XML processor in an encoding other than that named in the declaration, or for an entity which begins with neither a Byte Order Mark nor an encoding declaration to use an encoding other than UTF-8\", \"it is a fatal error if an XML entity is determined ... to be in a certain encoding but contains byte sequences that are not legal in that encoding\", \"XML processors SHOULD match character encoding names in a case-insensitive way\"; §1.2 fatal error; §2.11; Appendix F (non-normative) \"the encoding name be checked to match the actual encoding of the entity\"; formal/23-05-08 §2.2, §2.4 (p. 4); ADR 0005 B2 and amendment 1 (the maintainer, 2026-11-12); assurance-forge pugixml.cpp:2055-2101 `guess_buffer_encoding`"
kind = "xmi"
status = "verified"
depends_on = ["LIB-API-009", "SACM23-XMI-001", "LIB-SEC-006", "LIB-SEC-001"]
acceptance = [
  "With a byte order mark: a SACM document as UTF-16LE and as UTF-16BE, each with no declaration and with `encoding=` `\"UTF-16\"`, `\"utf-16\"`, `\"UTF-16LE\"` and `\"UTF-16BE\"`, reads `Ok` with the same roots (id, kind, order) and diagnostics as the UTF-8 document.",
  "Contradicting name: after a UTF-16 byte order mark, `encoding=\"UTF-8\"`, `\"US-ASCII\"` or `\"ISO-8859-1\"` is `Malformed`, `code()` SACM-XML-001, at the first character of the name (line 1, column 31 for `<?xml version=\"1.0\" encoding=\"`), in both byte orders.",
  "Odd byte count: a complete document plus one trailing byte is `Malformed`, at the position after its last character. `FF FE 3C` is `Malformed` at 1:1.",
  "Unpaired surrogates are `Malformed` at the surrogate: a lone `D800` in text (`<r>` then U+D800, at 1:4), a lone `DC00`, a high surrogate as the last code unit, and a high surrogate followed by a code unit that is not a low surrogate. A valid pair (U+1F600) in an `xmi:id` reads exactly as in UTF-8.",
  "A byte order mark followed by nothing (`FF FE` or `FE FF` alone, or followed only by white space) is `Malformed` (no root element) at the same location as the UTF-8 input with `EF BB BF` and the same white space: 1:1 for the mark alone, and otherwise the end of the input.",
  "Locations: `<!--😀--><r/>` gives `InvalidRoot` at 1:9 in UTF-8, UTF-16LE and UTF-16BE (a character outside the BMP is one column, and the byte order mark takes none). A line feed, a carriage return plus line feed, or a lone carriage return before `<r/>` puts it at 2:1.",
  "Same output: a fixed list of UTF-8 inputs without an encoding declaration, taken from the `xmi_read.rs` and `xmi_roots.rs` tests, read as UTF-16LE and UTF-16BE with a byte order mark, gives the same result as the UTF-8: the same `Ok` roots and diagnostics, or an equal `ReadError` (variant, location, reason).",
  "DOCTYPE: a DOCTYPE with an external entity in UTF-16LE or UTF-16BE with a byte order mark is `Doctype` (SACM-SEC-001) at the `<` of `<!DOCTYPE`, and nothing in it is expanded.",
  "Still `Unsupported` at 1:1: UTF-16 without a byte order mark (first bytes `3C 00 3F 00` or `00 3C 00 3F`, with or without a declaration), the UTF-32 byte order marks (including `FF FE 00 00`, which is UTF-32LE, not UTF-16 plus U+0000) and the four-byte UCS-4 first forms. UTF-8 input that declares `UTF-16` stays `Unsupported` at the name (LIB-API-009).",
  "W3C suite (LIB-SEC-006): the breakdown is `Doctype` 719, `Unsupported` from the encoding steps 2, `Malformed` 296, and the list of known accepted cases stays empty. The 31 `o-p02fail*` cases are `Malformed`; `hst-lhs-008` and `hst-lhs-009` are `Malformed`; `rmt-e2e-61` and `hst-lhs-007` stay `Unsupported`. The over-strictness guard counts 73 cases, none `Malformed`. If the suite gives other counts, the test pins the real ones and the lead amends this item with the reason.",
  "Docs: the `read` docs, `ReadError::Malformed`, the `ReadError` location docs and SACM-XML-001 in `docs/sacm/diagnostics.md` say that UTF-16 with a byte order mark is read.",
]
code = ["crates/sacm/src/xmi/input.rs", "crates/sacm/src/xmi.rs", "docs/sacm/diagnostics.md", "docs/adr/0005-xml-backend.md"]
tests = [
  "crates/sacm/tests/xmi_utf16.rs::sacm23_xmi_018_utf16_with_a_bom_reads_as_the_utf8_document",
  "crates/sacm/tests/xmi_utf16.rs::sacm23_xmi_018_a_non_utf16_name_after_a_utf16_bom_is_malformed_at_the_name",
  "crates/sacm/tests/xmi_utf16.rs::sacm23_xmi_018_an_odd_byte_count_is_malformed_after_the_last_character",
  "crates/sacm/tests/xmi_utf16.rs::sacm23_xmi_018_an_unpaired_surrogate_is_malformed_at_the_surrogate",
  "crates/sacm/tests/xmi_utf16.rs::sacm23_xmi_018_a_surrogate_pair_in_an_id_reads_as_in_utf8",
  "crates/sacm/tests/xmi_utf16.rs::sacm23_xmi_018_a_bom_with_no_root_is_malformed_as_in_utf8",
  "crates/sacm/tests/xmi_utf16.rs::sacm23_xmi_018_locations_count_characters_and_the_bom_takes_no_column",
  "crates/sacm/tests/xmi_utf16.rs::sacm23_xmi_018_inputs_from_the_read_and_root_tests_give_the_utf8_result",
  "crates/sacm/tests/xmi_utf16.rs::sacm23_xmi_018_a_doctype_in_utf16_is_refused_at_its_start_and_not_expanded",
  "crates/sacm/tests/xmi_utf16.rs::sacm23_xmi_018_utf16_without_a_bom_stays_unsupported_at_1_1",
  "crates/sacm/tests/xmi_utf16.rs::sacm23_xmi_018_utf32_and_ucs4_stay_unsupported_at_1_1",
  "crates/sacm/tests/xmi_utf16.rs::sacm23_xmi_018_a_utf16_name_declared_in_utf8_stays_unsupported_at_the_name",
  "crates/sacm/tests/w3c_xml_conformance.rs::sacm23_xmi_018_the_utf16_cases_of_the_suite_have_their_pinned_results",
]
verification = "docs/verification/0024-m1-utf16-input.md"

