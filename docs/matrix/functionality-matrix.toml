[[row]]
id = "LIB-EDIT-005"
area = "EDIT"
milestone = "M2"
title = "Element delete policies"
requirement = "Deleting a referenced element requires an explicit policy — reject if referenced (SACM-CMD-002) or delete the referencing relationships — and never leaves a typed reference naming a deleted element or an id freed with its preserved content. References that dangled before the delete are left unchanged. An id named only inside preserved content (an `xmi:idref`, `href` or attribute of a preserved fragment) is not a reference: it is neither refused, listed nor scrubbed, and is written back as read (ADR 0033)."
source = "D-POLICY; ADR 0031 (the maintainer, 2026-11-15); assurance-forge `commands/policies.h`, `commands/operations.h:362`, `commands.cpp:1771-2140`, `document.cpp:36-111`"
kind = "editing"
status = "verified"
verification = "docs/verification/0051-m2-close.md"
depends_on = ["LIB-EDIT-004"]
notes = "Slice 0044: deleting an ArgumentGroup member does not delete the group; group membership is a reference under the chosen policy (moved from SACM23-ARG-013). Slice 0057: reworded for ArtifactAssetRelationship and the SACM23-XMI-009 spellings; re-check there. Slice 0066: reworded for the ARG/ART package interfaces and bindings (SACM23-ARG-014, -015, SACM23-ART-012, -013, LIB-EDIT-019); re-check there."
acceptance = [
  "`DeleteElement::new(id)` refuses a referenced element (a typed reference to an id in its preserved content included, LIB-COMPAT-003) with `EditError::Referenced` (SACM-CMD-002, `Code::CMD_DELETE_REFERENCED`) naming the first dangling holder, end and id, and changes nothing; an id that names no element is `ElementNotFound`.",
  "`DeleteReferencingRelationships` deletes every asserted relationship whose `source`, `target` or `reasoning` names a deleted element, and every ArtifactAssetRelationship whose `source` or `target` does (SACM23-ART-010) (to a fixpoint: a relationship that is itself a source or target), and removes every other dangling id from its end, except that an interface or binding left below its bound is deleted (LIB-EDIT-019); an ArgumentGroup that loses a member keeps existing.",
  "`ScrubReferences` removes every dangling id; a relationship left with no `source` or no `target` is deleted (§11.13; §12.14 for an ArtifactAssetRelationship), and so is an interface left with no `implements` or a binding with fewer than two distinct participants (LIB-EDIT-019), so no required end is left empty.",
  "After every successful delete (D-ATOMIC, D-VAL-LAYER): the structural checks of LIB-EDIT-002 hold, no element holds an id of `deleted_ids`, each surviving end equals its old list minus the deleted ids in order, and references that dangled before the delete (read from a file) are unchanged.",
  "The `Mutation`: `deleted_ids` are the left-only ids of `semantic_compare(before, after)` in pre-order before; `changed_ids` are the surviving elements it reports a difference for, in pre-order after (holders that lost ids, and an element whose preserved child moves to a lower index because a typed child before it was deleted, ADR 0033); `created_ids` is empty; the parent is not otherwise changed.",
  "A delete does not rewind the per-kind counter: after deleting a generated element, a create of the same kind generates the next number. No promise is made that a freed id is never used again (a caller may give it with `with_id`).",
]
code = ["crates/sacm/src/edit/delete.rs", "crates/sacm/src/model/document.rs", "docs/adr/0031-delete-previews-and-revisions.md"]
tests = [
  "crates/sacm/tests/xmi_missing_ids.rs::lib_edit_005_after_deleting_a_read_generated_id_the_next_create_does_not_reuse_it",
  "crates/sacm/tests/delete.rs::lib_edit_005_delete_element_rejects_by_default_and_each_policy_is_set_by_a_builder",
