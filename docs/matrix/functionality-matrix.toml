requirement = "Every third-party action in ci.yml whose inputs reach a command line (at least EmbarkStudios/cargo-deny-action) is pinned by full commit SHA, and a test keeps a reviewed allowlist of the inputs it may receive, so a version bump that adds or changes an input is reviewed before use."
