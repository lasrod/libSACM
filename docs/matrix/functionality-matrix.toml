acceptance = [
  "These read in both modes with the right kind, id, name, parent and document order: a `<sacm:TerminologyPackage …>` root, bare and inside `xmi:XMI` after an ArgumentPackage; under an AssuranceCasePackage's `terminologyPackage`, untyped and typed `xmi:type=\"sacm:TerminologyPackage\"`; nested as `<terminologyElement xmi:type=\"sacm:TerminologyPackage\">`; and as `<artifactElement xmi:type=\"sacm:TerminologyPackage\">` in an ArtifactPackage. `xsi:type` gives SACM-XMI-010, as elsewhere.",
  "An untyped `<terminologyElement xmi:id=\"x\"/>` in a TerminologyPackage is `MissingType` (SACM-XMI-005) at its `<` in strict mode; a tolerant read keeps it whole as preserved content of the package, with SACM-XMI-005 as a Warning. `<terminologyElement xmi:idref=\"t\"/>` is `Unsupported` (SACM23-XMI-019) and `<terminologyElement href=\"#t\"/>` is `Unsupported` (SACM23-XMI-027); tolerant: SACM-XMI-014 and SACM-XMI-007.",
  "Typed in `terminologyElement`, TerminologyPackage, Category, Term, Expression and TerminologyGroup are read. A TerminologyPackageInterface or TerminologyPackageBinding is `Unsupported` labelled `(a limit of this version; SACM23-TERM-007 reads it)` or `… SACM23-TERM-008 …` at its `<`, and `interface=\"i\"` on a TerminologyPackage is labelled with SACM23-TERM-007 at the attribute's name; a tolerant read keeps each with one SACM-XMI-014 naming the row. A Claim, an Artifact or a Note typed in `terminologyElement`, and an `<argumentElement>` or `<artifactElement>` child, are kept whole as preserved content of the package, with one SACM-XMI-003 in both modes.",
  "The writer writes `sacm:TerminologyPackage` as a root, an untyped `<terminologyPackage>` under an AssuranceCasePackage, and `<terminologyElement xmi:type=\"sacm:<Kind>\">` children. `terminology-valid.sacm.xmi` reads in both modes with no diagnostic, validates with no finding, and a strict `xmi::write` gives exactly `golden/terminology.golden.sacm.xmi`; reading that is `==`, and writing it again gives the same bytes.",
  "`CreateTerminologyPackage::root(name)` and `::new(parent, name)`, with `with_id`: legal parents are none (a root), an AssuranceCasePackage, a TerminologyPackage and an ArtifactPackage; a Claim, an ArgumentPackage, a Term or a TerminologyGroup parent is `InvalidParent`. Refusals come in the order ParentNotFound, InvalidParent, InvalidId, DuplicateId. The generated id is `terminology_package_<n>`. `check` and `preview` agree with `apply`; `operation_name()` is `\"CreateTerminologyPackage\"`, and the root and parent forms have golden JSON.",
  "Deleting a non-empty TerminologyPackage is `NotEmpty` (SACM-CMD-006) unless `DeleteRecursively`. `MoveElement` into an AssuranceCasePackage, TerminologyPackage or ArtifactPackage succeeds, and into an ArgumentPackage is `InvalidParent`. SetName, SetGid, SetFlag and ReorderElements apply to it.",
  "The refusal list has no TerminologyPackage entry, and a strict read of a bare TerminologyPackage root returns its document.",
]

[[row]]
id = "SACM23-TERM-002"
area = "TERM"
milestone = "M4"
title = "Category"
requirement = "Category (§10.8, a TerminologyAsset) is read and written typed in a TerminologyPackage's `terminologyElement` and in an ArtifactPackage's `artifactElement`, with its Base features and the reference end `category : Category [0..*]`. ptc/22-03-13 declares that end; §10.8 states it only in its Semantics (\"Categories can contain Categories\"), and the model is followed (D-TEXT-MODEL). On a Term or an Expression it holds the Categories the element belongs to (§10.9); on a Category, formal/23-05-08 does not say which way the end points (spec defect D21; SACM 2.4 Beta1 has a Category list its members instead), so the crate holds the ids as written and states no direction. Category's end and ExpressionElement's (SACM23-TERM-003) have one name, type and bound, and are one entry, `ReferenceEnd::Category`, held by every TerminologyAsset [Q1]. `SacmElement::categories()` reads it. It follows SACM23-XMI-005/015, SACM23-VAL-003/004/022 (dangling, typing to Category, repeats; clause `10.8` on a Category and `10.9` on a Term or an Expression), LIB-EDIT-009 and LIB-API-014/015; it has no lower bound, so a scrub leaves the holder. Nothing checks categories for cycles, because §10.8 states no rule. `edit::CreateCategory` creates one, and `semantic_compare` reports `Difference::Categories`."
source = "formal/23-05-08 §10.8 (p. 29) \"The Category class describes categories of ExpressionElements (Terms and Expressions) and can be used to group these elements within TerminologyPackages.\", \"Superclass TerminologyAsset\", \"Terms, Categories, and ExpressionElements can be said to belong to Categories. Categories can group Terms, Expressions, or a mixture of both and Categories can contain Categories.\"; §10.9 (p. 30) \"category: Category [0..*] - optionally associates the ExpressionElement with one or more terminology categories.\"; ptc/22-03-13 Terminology::Category (`category : Category [0..*]`, no aggregation); formal/21-11-01 §10.8 (SACM 2.2, without \"Categories can contain Categories\"); D-TEXT-MODEL; ADR 0034 amendment 3"
kind = "model"
status = "verified"
verification = "docs/verification/0062-terminology.md"
depends_on = ["SACM23-TERM-001", "SACM23-XMI-015", "SACM23-VAL-004", "SACM23-VAL-022", "LIB-EDIT-009", "LIB-EDIT-005", "LIB-API-014", "LIB-API-015"]
code = ["crates/sacm/src/model/reference.rs", "crates/sacm/src/edit/terminology.rs", "crates/sacm/src/compare.rs"]
tests = [
  "crates/sacm/tests/serde.rs::sacm23_term_002_the_category_end_round_trips_as_category",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_category_reads_from_the_attribute_and_both_element_forms_alike",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_categories_reads_the_category_end_as_written",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_an_attribute_and_an_element_of_category_are_repeated_value",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_an_empty_category_attribute_is_preserved_by_the_category",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_reference_end_category_applies_to_the_terminology_assets",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_reference_end_all_is_the_sixteen_written_ends_then_expression",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_validate_checks_a_category_s_category_with_clause_10_8",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_category_is_written_after_abstract_form_kept_when_repeated_and_absent_when_empty",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_a_categories_difference_displays_its_end_and_both_lists",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_semantic_compare_reports_one_categories_difference_after_artifact_targets",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_create_category_reports_what_it_was_given_and_creates_it",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_create_category_legal_parents_refusals_and_generated_id",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_set_add_and_remove_reference_edit_a_category_s_category",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_category_on_a_claim_is_feature_not_applicable",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_deleting_a_named_category_is_referenced_or_cross_package_reference",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_002_scrub_and_delete_referencing_relationships_keep_every_holder",
]
acceptance = [
  "`<terminologyElement xmi:type=\"sacm:Category\" xmi:id=\"mechanical\" category=\"hazards\">` reads in both modes with no diagnostic, and `categories()` is `[hazards]`. `<category xmi:idref=\"hazards\"/>` and `<category href=\"#hazards\"/>` read equal to it. The attribute plus an element is `RepeatedValue` (tolerant: one SACM-MULT-001 Warning). `category=\"\"` is preserved content with SACM-XMI-003. A Category typed in an ArtifactPackage's `artifactElement` reads.",
  "`ReferenceEnd::Category`: `name()` is `category`; `applies_to` is true exactly for Category, Term and Expression; `bounds` is `Some((0, None))` there and `None` elsewhere; with `serde` it is `category`. `categories()` equals `references(Category)` and is empty for other kinds. `ReferenceEnd::ALL` lists it directly after `ArtifactTarget`.",
  "`validate`: on a Category, `category=\"t1\"` naming a Term gives one SACM-REF-002 Error, clause `10.8`, affected `[mechanical, t1]`; an absent id gives SACM-REF-001, clause `10.8`; `category=\"hazards hazards\"` gives one SACM23-VAL-022 Warning; a self-reference and a two-Category cycle give no finding; a `category` naming an id held only as preserved content gives one SACM-REF-003 Warning, clause `10.8`.",
  "It is written as an IDREFS attribute after `abstractForm`; an empty end is absent; repeats are kept. `semantic_compare` reports one `Difference::Categories { id, left, right }`, after `ArtifactTargets`, with Display `element \"mechanical\" differs in category: [\"hazards\"] on the left, [] on the right`.",
  "`CreateCategory::new(parent, name)` with `with_id` and `with_categories(ids)`: the legal parents are a TerminologyPackage and an ArtifactPackage; an AssuranceCasePackage, an ArgumentPackage or a Term is `InvalidParent`. Refusals: ParentNotFound, InvalidParent, InvalidId, DuplicateId, then InvalidReference, ReferenceNotFound and WrongReferenceType (`expected: \"Category\"`), each over the ids in order. The generated id is `category_<n>`, and both forms have golden JSON.",
  "`SetReferences`, `AddReference` and `RemoveReference` with `Category` work on a Category; on a Claim they are `FeatureNotApplicable` with Display `the Claim \"c1\" has no category`.",
  "Deleting a Category that another element names is `Referenced { holder, end: \"category\", id }` under `RejectIfReferenced`, and `CrossPackageReference` across packages. `ScrubReferences` and `DeleteReferencingRelationships` remove the id and keep the holders, with `changed_ids` the holders in pre-order. `Document::referrers` lists the end.",
]

[[row]]
id = "SACM23-TERM-003"
area = "TERM"
milestone = "M4"
title = "ExpressionElement value and categories"
requirement = "The ExpressionElement features (§10.9) that Term and Expression share are held once. `value : String [1]` is `SacmElement::value()`, exactly as written: read from its attribute or its value element (`xsi:nil` included), written as an attribute after the element's references and before `externalReference`; given twice it is `RepeatedValue`; on another kind, a Category included, it is preserved content (SACM-XMI-003). `category : Category [0..*]` is SACM23-TERM-002's `ReferenceEnd::Category`, with clause `10.9`. A Term or Expression with no `value` reads in both modes and is written with none; `validation::validate` reports it as one SACM-MULT-001 Error, because the text and the model agree on `[1]` (D-SEV). `edit::SetValue` sets the value, and has no removal, as `SetKey` has none; each create takes it. `semantic_compare` reports `Difference::Value`."
source = "formal/23-05-08 §10.9 (p. 30) \"The ExpressionElement class is the abstract class for the elements in SACM that are necessary for modeling expressions.\", \"value:String[1] - the value of the expression.\", \"category: Category [0..*] - optionally associates the ExpressionElement with one or more terminology categories.\"; ptc/22-03-13 Terminology::ExpressionElement (`value` typed PrimitiveTypes String, no bounds; `category : Category [0..*]`); XMI 2.5.1 §7.8.4 (pp. 17-18), rule 4j (p. 51); D-SEV; ADR 0034 amendment 3"
kind = "model"
status = "verified"
verification = "docs/verification/0062-terminology.md"
depends_on = ["SACM23-TERM-002", "SACM23-XMI-014", "SACM23-XMI-021", "SACM23-XMI-026", "SACM23-VAL-018"]
code = ["crates/sacm/src/model/document.rs", "crates/sacm/src/edit/set.rs", "crates/sacm/src/validation/terminology.rs"]
tests = [
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_value_reads_and_writes_verbatim_on_a_term_and_an_expression",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_value_returns_the_value_exactly_as_written",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_each_value_element_form_reads_and_writes_as_its_attribute_twin",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_value_is_written_after_the_ends_and_before_external_reference",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_value_given_twice_is_repeated_value",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_a_tolerant_read_of_a_repeated_value_keeps_the_first",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_value_on_a_kind_without_it_is_preserved",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_a_preserved_value_is_no_value",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_validate_reports_a_term_or_expression_with_no_value",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_set_value_sets_the_value_and_refuses_a_kind_without_it",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_a_value_holding_u_0001_is_accepted_and_refused_by_the_write_in_order",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_a_value_difference_displays_both_values",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_semantic_compare_reports_one_value_difference_compared_exactly",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_category_on_a_term_and_an_expression_reads_and_validates_with_clause_10_9",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_deleting_a_category_of_a_term_is_referenced_and_a_scrub_keeps_the_term",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_003_category_edits_work_on_a_term_and_an_expression",
]
acceptance = [
  "`value` reads verbatim in both modes with no diagnostic: `blade`, `\"\"`, ` a b `, `$Blade$ is covered by the $Lid$`, and `a&amp;b&#9;c`, which reads back escaped. It reads from the attribute and from `<value>lid</value>` (also with CDATA, a comment or a character reference inside); `<value xsi:nil=\"true\"/>` is absent and counts as given. It is written as an attribute after `category`, `element` and `origin` and before `externalReference`, and each element-form input writes byte-identical to its attribute-form twin.",
  "An attribute plus a value element, or two value elements, are `RepeatedValue { property: \"value\" }` in strict mode; a tolerant read keeps the first, preserves the later one and gives one SACM-MULT-001 Warning. `value=\"x\"` on a Category, a Claim or a TerminologyPackage, and `<value>x</value>` on an Artifact, are preserved content with one SACM-XMI-003, and `value()` is `None`. `<value lang=\"en\" content=\"x\"/>` on a Term is preserved whole with one SACM-XMI-003.",
  "`validate` gives a Term or an Expression with no `value` one SACM-MULT-001 Error: requirement SACM23-TERM-003, clause `10.9`, affected `[id]`, no location, message `Term \"t1\" has no value (value:String[1])` or `Expression \"e1\" has no value (value:String[1])`. `value=\"\"` gives none. A strict write writes the element without a value.",
  "`SetValue::new(element, value)` holds the value exactly; `changed_ids` is `[element]` exactly when the value changes. An unknown element is `ElementNotFound`, then a kind without the feature is `FeatureNotApplicable` naming `value` (`the Category \"hazards\" has no value`). U+0001 is accepted, and `xmi::write` then refuses with `WriteAttribute::Value`, checked after `EndTime` and before `ExternalReference`.",
  "`semantic_compare` reports one `Difference::Value`, compared exactly, after `EndTime`, with Display `element \"blade\" differs in value: \"blade\" on the left, no value on the right`.",
  "On a Term and an Expression, `category` behaves as SACM23-TERM-002 items 1, 3 and 6–7, with clause `10.9` (`category=\"blade\"` on an Expression gives SACM-REF-002 with clause `10.9`).",
]

[[row]]
id = "SACM23-TERM-004"
area = "TERM"
milestone = "M4"
title = "Term"
requirement = "Term (§10.11, an ExpressionElement) is read and written typed in a TerminologyPackage's `terminologyElement` and in an ArtifactPackage's `artifactElement`. It has its Base features and the ExpressionElement features (SACM23-TERM-003). `externalReference : String [0..1]` is `SacmElement::external_reference()`, held exactly as written, read and written as `value` is, after it. The reference end `origin : Base::ModelElement [0..1]` is `ReferenceEnd::Origin` (`SacmElement::origin()`); it follows SACM23-XMI-005/015, SACM23-VAL-003/004 (typing to ModelElement, clause `10.11`), LIB-EDIT-009 and LIB-API-014/015. An abstract Term (`isAbstract`) is a placeholder (§10.11), and nothing more is checked here. `edit::CreateTerm::new(parent, name, value)` with `with_categories`, `with_origin` and `with_external_reference` creates one; `edit::SetExternalReference` sets or removes the attribute; `semantic_compare` reports `Difference::Origin` and `Difference::ExternalReference`."
source = "formal/23-05-08 §10.11 (p. 31) \"Term is used to model both abstract and concrete terms in SACM.\", \"Superclass ExpressionElement\", \"externalReference: String[0..1] - an attribute recording an external reference (e.g., URI) to the object referred to by the Term\", \"origin:Base::ModelElement[0..1] - a reference which points to the origin of the Term.\", \"The externalReference attribute enables the referencing of the object signified by the term (i.e., the signifier).\"; ptc/22-03-13 Terminology::Term (`externalReference` String lower 0; `origin : ModelElement [0..1]`, no aggregation); ADR 0034 amendment 3"
kind = "model"
status = "verified"
verification = "docs/verification/0062-terminology.md"
depends_on = ["SACM23-TERM-003", "SACM23-XMI-015", "SACM23-VAL-004", "LIB-EDIT-009", "LIB-EDIT-005", "LIB-API-014", "LIB-API-015"]
code = ["crates/sacm/src/edit/terminology.rs", "crates/sacm/src/model/reference.rs", "crates/sacm/src/edit/set.rs"]
tests = [
  "crates/sacm/tests/serde.rs::sacm23_term_004_the_origin_end_round_trips_as_origin",
  "crates/sacm/tests/serde.rs::sacm23_term_004_a_create_term_reads_with_its_defaults_and_requires_its_value",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_the_fixture_s_term_blade_reports_its_features",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_origin_and_external_reference_read_alike_in_each_form",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_a_term_s_attributes_are_written_in_the_pinned_order",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_two_origins_are_repeated_value",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_validate_types_origin_as_a_model_element_with_clause_10_11",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_external_reference_reads_and_writes_verbatim",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_external_reference_returns_it_exactly_as_written",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_external_reference_twice_is_repeated_and_elsewhere_is_preserved",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_set_external_reference_sets_removes_and_refuses_a_kind_without_it",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_reference_end_origin_applies_only_to_a_term_and_holds_one_id",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_create_term_reports_what_it_was_given_and_creates_it",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_create_term_legal_parents_refusals_and_generated_id",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_an_origin_difference_displays_both_origins",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_origin_value_and_external_reference_differences_come_in_order",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_deleting_an_origin_is_referenced_and_a_scrub_clears_it_and_keeps_the_term",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_a_term_named_by_an_artifact_reference_validates_and_is_cross_package",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_004_the_existing_edits_apply_to_a_term",
]
acceptance = [
  "Term `blade` of `terminology-valid.sacm.xmi` reads in both modes with no diagnostic: `categories()` `[mechanical]`, `origin()` `manual`, `value()` `blade`, `external_reference()` `https://example.org/terms/blade`. `<origin xmi:idref=\"manual\"/>`, `<origin href=\"#manual\"/>` and `<externalReference>…</externalReference>` read equal. The attribute order written is `xmi:type`, `xmi:id`, `gid`, `isCitation`, `isAbstract`, `citedElement`, `abstractForm`, `category`, `origin`, `value`, `externalReference`.",
  "`origin=\"a b\"` is `RepeatedValue`, as for a single-valued end (SACM23-XMI-005). `origin` naming a Note gives one SACM-REF-002 with clause `10.11`; naming an Artifact, a Claim, a Category or a TerminologyPackage gives none; a dangling id gives SACM-REF-001 with clause `10.11`.",
  "`externalReference` reads verbatim (`\"\"`, `urn:x`, ` https://x `); twice is `RepeatedValue`; on an Expression or a Category it is preserved with SACM-XMI-003. `SetExternalReference::new`/`remove` behave as `SetVersion`; on an Expression they are `FeatureNotApplicable` naming `externalReference`. U+0001 is refused at write as `WriteAttribute::ExternalReference`, checked after `Value`.",
  "`ReferenceEnd::Origin` has `name()` `origin`, applies only to Term, and has `bounds` `Some((0, Some(1)))`; with `serde` it is `origin`. `SetReferences(Origin, [a, b])` is `TooManyReferences`, and `origin()` equals `references(Origin).first()`.",
  "`CreateTerm::new(parent, name, value)` with `with_id`, `with_categories`, `with_origin` and `with_external_reference`: the accessors report what it holds. The legal parents are a TerminologyPackage and an ArtifactPackage; an AssuranceCasePackage, an ArgumentPackage, a Category or a Term is `InvalidParent`. Refusals: ParentNotFound, InvalidParent, InvalidId, DuplicateId, then InvalidReference, ReferenceNotFound and WrongReferenceType, each over `category` then `origin` (`expected` `\"Category\"`, `\"ModelElement\"`). The generated id is `term_<n>`, and both forms have golden JSON.",
  "`Difference::Origin` has Display `element \"blade\" differs in origin: \"manual\" on the left, no origin on the right` and is reported after `ExpressionElements`; `Difference::ExternalReference` comes after `Value`.",
  "Deleting the origin's target is `Referenced { end: \"origin\" }`; `ScrubReferences` and `DeleteReferencingRelationships` clear it and keep the Term. An ArtifactReference whose `referencedArtifactElement` names a Term gives no finding (§10.2), and deleting that Term under `RejectIfExternalReferencesExist` is `CrossPackageReference`.",
  "SetName, SetGid, SetFlag (`IsAbstract`; `IsCounter` is `FeatureNotApplicable`), SetReferences(CitedElement), ReorderElements, MoveElement (legal parents: a TerminologyPackage, an ArtifactPackage), CopyElements and DeleteElement apply to it; `CreateProperty` under a Term is `InvalidParent` (a Term is no ArtifactAsset).",
]

[[row]]
id = "SACM23-TERM-005"
area = "TERM"
milestone = "M4"
title = "Expression"
requirement = "Expression (§10.10, an ExpressionElement) is read and written typed in a TerminologyPackage's `terminologyElement` and in an ArtifactPackage's `artifactElement`, with its Base features, the ExpressionElement features (SACM23-TERM-003) and the reference end `element : ExpressionElement [0..*]`: `ReferenceEnd::Element`, read by `SacmElement::expression_elements()` [Q2]. The end follows SACM23-XMI-005/015, SACM23-VAL-003/004/022 (clause `10.10`), LIB-EDIT-009 and LIB-API-014/015; it has no lower bound. `edit::CreateExpression::new(parent, name, value)` with `with_categories` and `with_expression_elements` creates one, and `semantic_compare` reports `Difference::ExpressionElements`. The §10.10 OCL for concrete Expressions is SACM23-VAL-017. The two \"should\" sentences about names in `value` are not checked (D-EXPR-NAMES) [Q3]."
source = "formal/23-05-08 §10.10 (p. 30) \"The Expression class is used to model both abstract and concrete phrases in SACM.\", \"Superclass ExpressionElement\", \"element: ExpressionElement [0..*] - an optional reference to other ExpressionElements forming part of the structured Expression.\"; ptc/22-03-13 Terminology::Expression (`element : ExpressionElement [0..*]`, no aggregation); D-EXPR-NAMES; ADR 0034 amendment 3"
kind = "model"
status = "verified"
verification = "docs/verification/0062-terminology.md"
depends_on = ["SACM23-TERM-003", "SACM23-XMI-015", "SACM23-VAL-004", "SACM23-VAL-022", "LIB-EDIT-009", "LIB-EDIT-005", "LIB-API-014", "LIB-API-015"]
code = ["crates/sacm/src/edit/terminology.rs", "crates/sacm/src/model/reference.rs", "crates/sacm/src/compare.rs"]
tests = [
  "crates/sacm/tests/serde.rs::sacm23_term_005_the_element_end_round_trips_as_element",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_005_the_fixture_s_expression_holds_its_elements",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_005_element_reads_from_the_attribute_and_both_element_forms_alike",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_005_the_fixture_writes_element_after_category_and_before_value",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_005_reference_end_element_applies_only_to_an_expression",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_005_validate_types_element_as_an_expression_element_with_clause_10_10",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_005_create_expression_reports_what_it_was_given_and_creates_it",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_005_create_expression_legal_parents_refusals_and_generated_id",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_005_an_expression_elements_difference_displays_its_end_and_both_lists",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_005_expression_elements_are_reported_after_categories",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_005_the_element_edits_work_on_an_expression_and_not_on_a_term",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_005_deleting_an_element_of_an_expression_is_referenced_and_a_scrub_keeps_it",
  "crates/sacm/tests/terminology_assets.rs::sacm23_term_005_the_usage_example_builds_an_expression_over_two_terms",
]
acceptance = [
  "Expression `blade_guarded` of the fixture reads with `expression_elements()` `[blade, lid]` from `<element xmi:idref=\"blade\"/><element href=\"#lid\"/>`, and is written `element=\"blade lid\"` after `category` and before `value`. The attribute plus elements is `RepeatedValue`; `element=\"\"` is preserved with SACM-XMI-003.",
  "`ReferenceEnd::Element` has `name()` `element`, applies only to Expression, has `bounds` `Some((0, None))`, and is `element` with `serde`; `expression_elements()` equals `references(Element)` and is empty for other kinds.",
  "`validate`: `element=\"hazards\"` (a Category) or `element=\"c1\"` (a Claim) gives one SACM-REF-002 with clause `10.10` (`expected` ExpressionElement); an Expression naming itself or another Expression, and a cycle, give none; a dangling id gives SACM-REF-001; `element=\"blade blade\"` gives one SACM23-VAL-022 Warning. A `value` that does not mention the elements' names gives no finding.",
  "`CreateExpression::new(parent, name, value)` with `with_id`, `with_categories` and `with_expression_elements`: the legal parents are a TerminologyPackage and an ArtifactPackage. Refusals: ParentNotFound, InvalidParent, InvalidId, DuplicateId, then InvalidReference, ReferenceNotFound and WrongReferenceType over `category` then `element`. The generated id is `expression_<n>`, and both forms have golden JSON.",
  "`Difference::ExpressionElements` has Display `element \"blade_guarded\" differs in element: [\"blade\", \"lid\"] on the left, [\"blade\"] on the right` and is reported after `Categories`. `Element` on a Term is `FeatureNotApplicable` (`the Term \"blade\" has no element`).",
  "Deleting an element of an Expression is `Referenced { end: \"element\" }`; `ScrubReferences` and `DeleteReferencingRelationships` remove the id and keep the Expression (an Expression is no relationship), with `changed_ids == [expression]`.",
]

[[row]]
id = "SACM23-TERM-006"
area = "TERM"
milestone = "M4"
title = "TerminologyGroup"
requirement = "TerminologyGroup (§10.3, a TerminologyElement) is read and written typed in a TerminologyPackage's `terminologyElement` and in an ArtifactPackage's `artifactElement`, with the reference end `terminologyElement : TerminologyElement [0..*]`. ptc/22-03-13 gives the end no aggregation, so it is a reference, held as `ReferenceEnd::TerminologyGroupMember` (`serde` and XMI name `terminologyElement`; ADR 0034 decision 5). The parent's kind decides: under a TerminologyGroup `terminologyElement` is the member end (an IDREFS attribute, or elements with `xmi:idref` or `href=\"#id\"`, read as SACM23-ARG-013 reads `argumentElement`); under a TerminologyPackage it is the composite role. `group_members()` answers for the three group kinds, and members stay children of their own package. The end follows SACM23-XMI-005/015, SACM23-VAL-003/004/022 (typing to TerminologyElement, clause `10.3`), LIB-EDIT-009 and LIB-API-014/015; it has no lower bound, so a scrub leaves the group, even when empty. `edit::CreateTerminologyGroup` takes its members; `semantic_compare` reports `Difference::TerminologyGroupMembers`."
source = "formal/23-05-08 §10.3 (p. 28) \"Superclass TerminologyElement\", \"terminologyElement[0..*] - an optional collection of TerminologyElements that are organised within the TerminologyGroup.\", \"TerminologyGroups serve no structural purpose in the formation of the argument network, nor are they meant as a structural packaging mechanism (this should be done using TerminologyPackages).\"; ptc/22-03-13 Terminology::TerminologyGroup (`terminologyElement : TerminologyElement [0..*]`, no aggregation); ADR 0034 amendment 3"
kind = "model"
status = "verified"
verification = "docs/verification/0062-terminology.md"
depends_on = ["SACM23-TERM-001", "SACM23-XMI-015", "SACM23-VAL-004", "SACM23-VAL-022", "LIB-EDIT-009", "LIB-EDIT-005", "LIB-API-014", "LIB-API-015"]
code = ["crates/sacm/src/edit/terminology.rs", "crates/sacm/src/model/reference.rs", "crates/sacm/src/model/document.rs"]
tests = [
  "crates/sacm/tests/serde.rs::sacm23_term_006_the_member_end_round_trips_as_terminology_element",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_the_attribute_and_the_element_forms_read_equal_and_members_stay_children",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_an_attribute_and_member_elements_are_repeated_value_at_both_occurrences",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_an_empty_or_qualified_attribute_is_preserved_by_the_group",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_a_nested_element_under_a_group_is_unsupported_or_preserved_at_that_construct",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_each_group_kind_keeps_the_other_groups_ends_as_preserved_content",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_group_members_answers_for_the_three_group_kinds_and_is_empty_for_others",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_terminology_group_member_is_the_end_terminology_element",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_set_add_and_remove_reference_edit_a_terminology_group_s_members",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_terminology_group_member_on_an_artifact_group_is_feature_not_applicable",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_the_other_group_ends_on_a_terminology_group_are_feature_not_applicable",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_every_terminology_element_member_validates_and_a_claim_is_ref_002",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_an_absent_member_is_ref_001_and_a_repeat_is_one_mult_001_warning",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_members_are_written_after_abstract_form_kept_when_repeated_and_absent_when_empty",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_a_terminology_group_members_difference_displays_its_end_and_both_lists",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_semantic_compare_reports_one_terminology_group_members_difference",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_create_terminology_group_reports_what_it_was_given_and_creates_it",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_create_terminology_group_legal_parents_refusals_and_generated_id",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_deleting_a_member_is_referenced_or_cross_package_reference_by_default",
  "crates/sacm/tests/terminology_groups.rs::sacm23_term_006_scrub_and_delete_referencing_relationships_remove_the_member_and_keep_the_group",
]
acceptance = [
  "`terminologyElement=\"blade lid appliance\"` and the element form `<terminologyElement xmi:idref=\"blade\"/><terminologyElement href=\"#lid\"/>` read equal in both modes. The attribute plus elements is `RepeatedValue`; an empty attribute is preserved content; a nested typed element is `Unsupported` (SACM23-XMI-019), and one with only a name is preserved, as for SACM23-ARG-013.",
  "`group_members()` returns the members of a TerminologyGroup, an ArtifactGroup and an ArgumentGroup, in order with repeats, and is empty for other kinds; members stay children of their own package (`appliance` stays in `iec`).",
  "`SetReferences`, `AddReference` and `RemoveReference` work with `TerminologyGroupMember` on a TerminologyGroup. `TerminologyGroupMember` on an ArtifactGroup is `FeatureNotApplicable` (`the ArtifactGroup \"ag1\" has no terminologyElement`), and so are `GroupMember` and `ArtifactGroupMember` on a TerminologyGroup.",
  "`validate`: a Claim member is SACM-REF-002 (clause `10.3`); a TerminologyPackage member is none; an absent id is SACM-REF-001; a repeated id is one SACM-MULT-001 Warning. A strict write refuses only the absent id.",
  "It is written as an IDREFS attribute after `abstractForm`. `Difference::TerminologyGroupMembers { id, left, right }` has Display `element \"reviewed\" differs in terminologyElement: [\"blade\"] on the left, [] on the right` and is reported after `Origin`.",
  "`CreateTerminologyGroup::new(parent, name).with_group_members(ids)`: the legal parents are a TerminologyPackage and an ArtifactPackage; member checks as SACM23-ARG-013 (`expected: \"TerminologyElement\"`); the generated id is `terminology_group_<n>`.",
  "Deleting a member under `RejectIfReferenced` is `Referenced { holder, end: \"terminologyElement\", id }`, or `CrossPackageReference` across packages. `ScrubReferences` and `DeleteReferencingRelationships` keep the group, with `changed_ids == [group]`.",
]

[[row]]
id = "SACM23-BASE-009"
area = "BASE"
milestone = "M4"
title = "ExpressionLangString"
requirement = "ExpressionLangString (§8.4, a LangString) is a form of `LangString`: plain, or an ExpressionLangString with an optional `expression` id (ADR 0038). `LangString::expression()`, `is_expression_lang_string()`, `with_expression(id)` and `without_expression()` read and set it, and `Eq`, `Ord` and `Hash` tell the forms apart. Every LangString place can hold one: a name (§8.6) and each value of a `content` (§8.7), `key` (§8.12) or `location` (§12.10). Both load modes read a `name` or `value` typed `sacm:ExpressionLangString` (`xmi:type`, or `xsi:type` with SACM-XMI-010). Its `expression` is read as an IDREF attribute or as one reference element, under the SACM23-XMI-005 and SACM23-XMI-015 rules; two ids, or an attribute and an element, is `RepeatedValue` of `<property>.expression`. `xmi::write` writes `xmi:type=\"sacm:ExpressionLangString\"`, then the `xmi:id`, `lang` and `content`, then `expression=\"id\"`. These do not conform and keep the whole name or text as preserved content with SACM-XMI-003: an `expression` attribute or element on an untyped or LangString-typed `name` or `value`; an empty `expression`; a reference element that does not conform; and an ExpressionLangString `value` inside a `name`, and a `value` inside a `name` typed ExpressionLangString. `ReferenceEnd::Expression` (`expression`, clause 8.4, `[0..*]`, type ExpressionElement, on every kind) is derived. It holds the element's expression ids in write order: the name, then the values of `content`, `key` and `location`. `SacmElement::expressions()` reads it, and `Document::referrers` and delete previews list it. SACM23-VAL-003 and SACM23-VAL-004 check it with clause `8.4`, and so does the strict-save schema check; SACM23-VAL-022 does not. It is compared through the name and the texts. `SetReferences`, `AddReference` and `RemoveReference` refuse it as `EditError::DerivedEnd` (SACM-CMD-008). Every create, `SetName`, `SetContent`, `SetKey`, `SetLocation` and `CopyElements` check the expression ids they add as reference ids (`InvalidReference`, `ReferenceNotFound`, `WrongReferenceType`, end `expression`). They refuse an ExpressionLangString with no expression as `TooFewReferences`. On delete, `RejectIfReferenced` refuses an expression that names a deleted element. `ScrubReferences` and `DeleteReferencingRelationships` make each such ExpressionLangString plain, keeping `lang` and `content`, and put the holder in `changed_ids`. `validate` reports an ExpressionLangString with no expression as one SACM-MULT-001 Error (clause 8.4; spec defect D20). With `serde` an ExpressionLangString is `{\"type\":\"ExpressionLangString\",\"lang\",\"content\",\"expression\"}` (ADR 0030 amendment 4)."
source = "formal/23-05-08 §8.4 (pp. 18-19) \"ExpressionLangString is used to denote a structured expression, it contains a description (LangString) and it also (optionally) points to an ExpressionElement in the Terminology Package.\", \"Superclass LangString\", \"expression:Terminology::ExpressionElement[1] (composition) - a reference to an ExpressionElement in the TerminologyPackage\"; §8.5 (p. 19) \"value:LangString[1..*] (composition)\"; §8.6 (p. 19) \"name:LangString[1] (composition)\"; ptc/22-03-13 Base::ExpressionLangString (generalization LangString; `expression`: ExpressionElement, no aggregation, no bounds); XMI 2.5.1 §7.8.5 (p. 19), §7.8.6 (p. 19), §7.8.8 (p. 21) \"uses xmi:type instead of xsi:type\", rule 2g (p. 63), rule 2h (p. 63), rule 4i (p. 51) \"If the upper bound of the multiplicity of the Property is 1, the type is IDREF\"; spec defects D6, D8, D20; D-TEXT-MODEL; D-SEV; D-VAL-LAYER; D-POLICY; ADR 0012; ADR 0026; ADR 0029; ADR 0030 amendment 4; ADR 0031; ADR 0038"
kind = "model"
status = "verified"
verification = "docs/verification/0065-expression-lang-string.md"
depends_on = ["SACM23-BASE-001", "SACM23-BASE-002", "SACM23-BASE-004", "SACM23-BASE-005", "SACM23-ART-005", "SACM23-TERM-003", "SACM23-XMI-005", "SACM23-XMI-012", "SACM23-XMI-015", "SACM23-XMI-022", "SACM23-VAL-003", "SACM23-VAL-004", "LIB-EDIT-005", "LIB-EDIT-008", "LIB-EDIT-009", "LIB-EDIT-012", "LIB-EDIT-018", "LIB-API-006", "LIB-API-014", "LIB-API-015", "LIB-COMPAT-007"]
code = ["crates/sacm/src/model/lang_string.rs", "crates/sacm/src/model/reference.rs", "crates/sacm/src/model/document.rs", "crates/sacm/src/edit/references.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/output.rs", "docs/adr/0038-expression-lang-string.md", "crates/sacm/src/edit.rs", "crates/sacm/src/edit/set.rs", "crates/sacm/src/edit/copy.rs", "crates/sacm/src/compare.rs"]
tests = [
  "crates/sacm/tests/expression_lang_string.rs::sacm23_base_009_lang_string_reads_sets_and_orders_its_expression",
