area = "TERM"
milestone = "M4"
title = "TerminologyGroup"
requirement = "TerminologyGroup is represented with its `terminologyElement` membership references, round-tripped and editable."
source = "formal/23-05-08 clause 10; ptc/22-03-13 Terminology::TerminologyGroup"
kind = "model"
status = "planned"
depends_on = ["SACM23-TERM-001"]

[[row]]
id = "SACM23-BASE-009"
area = "BASE"
milestone = "M4"
title = "ExpressionLangString"
requirement = "ExpressionLangString — a LangString whose `expression` references an ExpressionElement — is represented wherever a LangString may appear, round-tripped and editable."
source = "formal/23-05-08 §8.4; ptc/22-03-13 Base::ExpressionLangString; D-TEXT-MODEL"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-001", "SACM23-TERM-003"]

[[row]]
id = "SACM23-VAL-009"
area = "VAL"
milestone = "M4"
title = "ExpressionLangString exclusivity"
requirement = "An ExpressionLangString carrying both an `expression` and literal `content` is reported as a SACM-EXPR-001 warning (\"should\", D-SEV)."
source = "formal/23-05-08 §8.4; SACM-EXPR-001"
