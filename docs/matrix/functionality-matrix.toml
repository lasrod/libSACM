[[row]]
id = "SACM23-ARG-007"
area = "ARG"
milestone = "M2"
title = "AssertedRelationship common features"
requirement = "Every AssertedRelationship kind holds `source` (multi-valued, ArgumentAsset `[1..*]`, `sources() -> &[ElementId]`), `target` (single-valued, ArgumentAsset `[1]`, `target() -> Option<&ElementId>`), `reasoning` (single-valued, ArgumentReasoning `[0..1]`, `reasoning()`), `isCounter` (Boolean `[1] = false`, `is_counter() -> bool`, read and written by ADR 0026's Boolean rules and only on asserted relationships), plus `assertionDeclaration` (SACM23-XMI-017's rules) and `metaClaim` (ADR 0027). A relationship read with no source or no target is kept as read; nothing is invented (its finding is SACM23-VAL-005). Write order: `... abstractForm assertionDeclaration metaClaim isCounter reasoning source target`. Comparison: `Difference::{IsCounter, Reasoning, Sources, Target}`."
source = "formal/23-05-08 §11.13 (p. 40) \"isCounter:Boolean[1] = false - a flag indicating whether the AssertedRelationship counters its declared purposes\", \"source:ArgumentAsset[1..*] - reference to the ArgumentAsset(s) that are the source (starting point) of the relationship.\", \"target:ArgumentAsset[1] - reference to the ArgumentAsset(s) that are the target (ending point) of the relationship.\", \"reasoning:ArgumentReasoning[0..1] - an optional reference to the a description of the reasoning underlying the AssertedRelationship.\"; §11.10 (p. 39); ptc/22-03-13 Argumentation::AssertedRelationship (isCounter defaultValue false; source [1..*]; target [1..1]); XMI 2.5.1 rules 2b, 2h, 2j, §9.4.1, Annex B.5.2; D-SEV; ADR 0026; ADR 0027; specification defect D14"
kind = "model"
status = "verified"
verification = "docs/verification/0043-m2-asserted-relationships.md"
depends_on = ["SACM23-ARG-002", "SACM23-ARG-005", "SACM23-XMI-005", "SACM23-XMI-017", "SACM23-ARG-004", "SACM23-XMI-014", "SACM23-XMI-015", "SACM23-VAL-006"]
acceptance = [
  "Seam defaults: no sources, no target, no reasoning, `is_counter()` false, `asserted`, no meta-claims.",
  "On an AssertedInference and an AssertedContext, both modes: `source=\"c2 c3\" target=\"c1\" reasoning=\"r1\" isCounter=\"true\" assertionDeclaration=\"assumed\" metaClaim=\"m1\"` reads each value; a byte-exact golden pins the attribute order.",
  "`isCounter`: `true`, `1`, `\" true \"` and `\"&#9;1&#10;\"` read true; `false`, `0` and absent read false and compare equal; `TRUE`, `yes`, `\"\"` and `t rue` are `InvalidLiteral` naming `isCounter`; `<isCounter>1</isCounter>` reads; attribute plus element is `RepeatedValue`; `sacm:isCounter` is kept as preserved content of the element, with SACM-XMI-003 (LIB-COMPAT-003); written only when true, as `\"true\"`.",
  "`isCounter`, `source`, `target` and `reasoning` on a Claim, an ArgumentReasoning or an ArgumentPackage are each kept as preserved content of that element, with one SACM-XMI-003 at the construct in both modes (LIB-COMPAT-003).",
  "`<source>` elements accumulate in order; attribute plus element is `RepeatedValue`; `target=\"a b\"`, `reasoning=\"a b\"`, two `<target>` and two `<reasoning>` are each `RepeatedValue`; `source=\"c1 c1\"` is held twice.",
  "A relationship with no `source`, no `target`, or neither reads in both modes, and a tolerant write writes it with nothing added.",
  "A dangling source, target or reasoning gives SACM-REF-001 with clause `11.13`; an AssertedContext targeting an AssertedInference, and a relationship whose source is itself, read with no finding.",
  "All six `assertionDeclaration` literals read, write and round-trip on each kind; a bad literal is `InvalidLiteral`.",
  "`semantic_compare` reports `IsCounter`, `Reasoning`, `Sources` (order counts) and `Target`.",
]
tests = [
