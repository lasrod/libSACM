[[row]]
id = "LIB-COMPAT-001"
area = "COMPAT"
milestone = "M1"
title = "Strict and tolerant load modes"
requirement = "`ReadOptions` carries a load mode (`xmi::Mode`), tolerant by default, and `ReadOutput::mode()` reports the mode used (ADR 0022). A **strict** read refuses what it cannot read conformantly, as each read row states; a refusal a read row states without naming a mode is a strict read's. A **tolerant** read returns a document for every well-formed input whose roots are SACM 2.3 packages (ADR 0035 D1): it refuses only a DOCTYPE, malformed XML, `InvalidRoot`, `NoPackage`, `DuplicateId`, and `Unsupported` for an encoding, a parser limit, a root outside SACM 2.3 (LIB-COMPAT-004), an `XMI` element outside XMI 2.5.1 (LIB-COMPAT-002) or an XMI-namespace document element; every other strict refusal is kept as preserved content at its construct (LIB-COMPAT-003), with one Warning at the strict refusal's location: SACM-ENUM-001 for a bad literal (the model holds the default), SACM-MULT-001 for each repeat of a single-valued property (the first occurrence is read), SACM-XMI-005 for an untyped child under an abstract role, SACM-ID-002 for an empty `xmi:id` (the element gets a generated id), and SACM-XMI-014 (SACM-XMI-007 for a cross-document `href`) for conforming content not read yet (LIB-API-011). A tolerant read reports no Error. Two read diagnostics are reported, one per attribute, located at its name, neither refusing or changing the document: an `xsi:type` attribute is SACM-XMI-010 (XMI 2.5.1 rule 2g), an Error in strict mode and a Warning in tolerant mode; an `xmi:version` attribute on the `xmi:XMI` element or a root is SACM-XMI-011 (§7.5.3), Info in both modes. LIB-COMPAT-008's C++ shapes read tolerantly with SACM-XMI-012 and are refused strictly as `LegacyShape` (ADR 0022 amendment 1). SACM23-XMI-009's spellings read tolerantly with SACM-XMI-013 and are kept strictly as preserved content with SACM-XMI-013 as an Error."
source = "D-STRICT; D-SEV; formal/23-05-08 §2.2, §2.4 (p. 4) \"shall be able to import and export XMI documents that conform with the SACM XML Schema produced by applying XMI rules to the normative MOF metamodel\"; XMI 2.5.1 §2.2.2 (p. 1) \"The XMI document must be equivalent to those generated by the XMI Document production rules\"; §9.5.2 rule 2g (p. 63) \"You may only use the XML schema instance type attribute if org.omg.xmi.useSchemaExtensions is true\"; §7.8.8 (p. 21) \"uses xmi:type instead of xsi:type\"; §7.5.3 (p. 10) \"identification of the XMI version is indicated by the presence of the XMI namespace declaration\"; ptc/22-03-13 (no `org.omg.xmi` tags); ADR 0015, 0016, 0021, 0022; assurance-forge `io/options.h:17-43`, `io/xmi_reader.cpp:320-323`"
kind = "api"
status = "verified"
verification = "docs/verification/0053-simplification.md"
depends_on = ["SACM23-XMI-001", "SACM23-XMI-003", "LIB-DIAG-001", "SACM23-XMI-002", "SACM23-XMI-024", "LIB-RT-001", "LIB-EDIT-001", "SACM23-XMI-016"]
acceptance = [
  "`ReadOptions::default()` reads in tolerant mode and `ReadOptions::default().with_mode(Mode::Strict)` in strict mode; `ReadOutput::mode()` reports which, also for an input with no diagnostic.",
  "One input per row of ADR 0035's tables: a strict read gives the stated refusal (variant, code, location); a tolerant read gives `Ok` with exactly one Warning of the stated code at that location, affecting the stated id, with the stated model value, the construct kept as preserved content of its holder; the tolerant write reads back equal and rewrites byte-identical; a strict write is `PreservedContent`.",
  "The fatal refusals (DOCTYPE, malformed XML, `InvalidRoot`, `NoPackage`, `DuplicateId`, and the refused `Unsupported` set) are identical in both modes.",
  "Repeats in tolerant mode: a `gid` attribute plus a `<gid>` reads the attribute's value; two names read the first; three `<gid>` give two SACM-MULT-001; `target=\"c2 c3\"` gives no target and one SACM-MULT-001 at `c3`; a `metaClaim` attribute plus elements reads the attribute's ids; `<name content=\"A\"><content>A</content></name>` gives no name.",
  "An empty `xmi:id` read tolerantly gives a generated id (`claim_1`), one SACM-ID-002 Warning and no SACM-XMI-004; two empty `xmi:id`s give no `DuplicateId`.",
  "An untyped `<argumentElement xmi:id=\"c1\"/>` read tolerantly gives no element `c1`, one SACM-XMI-005 Warning affecting the package, and `c1` stays in the id space (a create `with_id(\"c1\")` is `DuplicateId`).",
  "No tolerant read in these tests reports an Error (`diagnostic::has_errors` is false).",
  "Every golden file, and `write` output for documents built with `edit::apply`, reads with no diagnostic in either mode.",
  "`xsi:type` on a root naming its own class, on an `argumentElement` Claim and on a `name` (`sacm:LangString`) each gives exactly one SACM-XMI-010 at the attribute's name, affecting the element (the owner for `name`), an Error in strict mode and a Warning in tolerant mode; `xmi:version` gives one SACM-XMI-011 per attribute, Info in both modes; diagnostics are sorted and identical on every run.",
]
