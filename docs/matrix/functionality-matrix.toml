[[row]]
id = "SACM23-ARG-002"
area = "ARG"
milestone = "M1"
title = "Claim"
requirement = "Claim (§11.11, superclass Assertion; no features of its own) is represented with the Assertion attribute `assertionDeclaration: AssertionDeclaration [1] = asserted` (§11.10). Every element of an Assertion kind (Claim and the five asserted-relationship kinds) holds exactly one AssertionDeclaration: `asserted` until another is set, and any of the six literals once set. There is no absent state: the property is `[1]` with a metamodel default, and XMI 2.5.1 §9.4.1 leaves default values unserialized, so an omitted value means `asserted`, as in C++. Elements of any other kind have no assertionDeclaration. Homes: containment is LIB-API-008; `metaClaim` is SACM23-ARG-004; the ModelElement and SACMElement features are SACM23-BASE-003 to SACM23-BASE-008; XMI reading and writing is SACM23-XMI-017; the element form is SACM23-XMI-014; `xsi:type` is SACM23-XMI-006; unknown literals are SACM23-VAL-006; the asCited derivation is SACM23-VAL-019; creation is LIB-EDIT-001; editing is LIB-EDIT-008; comparison is LIB-RT-001."
source = "formal/23-05-08 §11.11 (p. 39): \"Superclass Assertion\"; §11.10 (p. 39): \"assertionDeclaration:AssertionDeclaration[1] = asserted - the declaration indicating the state of the Assertion.\"; §11.8 (p. 38): \"asserted - the default enumeration literal, indicating that an Assertion is asserted.\"; ptc/22-03-13 Argumentation::Claim, Argumentation::Assertion.assertionDeclaration (defaultValue InstanceValue -> `asserted`); XMI 2.5.1 §9.4.1 (p. 57): \"Properties whose values are the default values are not serialized except there the value is being used to specify the default itself\"; assurance-forge libs/sacm model/argumentation.h Assertion (`assertion_declaration_ = AssertionDeclaration::Asserted`), commands/commands.cpp SetAssertionDeclaration"
kind = "model"
status = "verified"
verification = "docs/verification/0018-m1-argument-package-claim.md"
depends_on = ["SACM23-ARG-001", "SACM23-ARG-003"]
acceptance = [
  "A Claim inserted through the seam has declaration `asserted` (§11.10 `= asserted`; the ptc `defaultValue`).",
  "Setting each of the six literals on a Claim reads back that literal, and a later set replaces an earlier one (`NeedsSupport` then `Asserted` reads `Asserted`).",
  "Over `ElementKind::ALL`, an element reports a declaration (`asserted` by default) exactly when its kind `is_a(AbstractClass::Assertion)`: Claim and the five Asserted* kinds. Every other kind reports none, ArgumentPackage, ArgumentReasoning, ArtifactReference and Note included.",
  "The setter refuses an unknown id, and an element of a kind that is not an Assertion (ArgumentReasoning, ArtifactReference, ArgumentPackage, Note); the error names the id, and the kind where there is one, and every element's declaration is as it was before.",
  "Elements are independent: setting `defeated` on Claim c1 leaves its sibling c2 `asserted`; a `clone()` keeps c1 `defeated`; setting `axiomatic` on the clone leaves the original c1 `defeated`.",
  "The declaration follows the kind, not the container: a Claim inside an ArtifactPackage (ADR 0014) also defaults to `asserted` and accepts all six literals.",
  "`SetAssertionDeclarationError` (test-support) follows ADR 0011: `#[non_exhaustive]`; `Clone + Eq + Debug + Error + Send + Sync + 'static`, checked statically; it boxes and downcasts as `dyn Error + Send + Sync`; each variant's `Display` is one lowercase line without trailing punctuation, with the id quoted and escaped (an id containing a line break stays one line), e.g. `the document has no element \"c9\"` and `element \"r1\" of kind ArgumentReasoning is not an Assertion`; `source()` is `None`; the setter refuses an empty, NUL-bearing, non-ASCII or 1 MiB unknown id without panicking.",
]
code = ["crates/sacm/src/model/document.rs", "crates/sacm/src/model/argumentation.rs"]
tests = [
  "crates/sacm/tests/claim.rs::sacm23_arg_002_a_claim_in_an_artifact_package_holds_a_declaration",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_a_claim_is_asserted_by_default",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_a_later_set_replaces_an_earlier_one",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_argument_package_reasoning_reference_and_note_report_none",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_declarations_are_held_per_element_and_per_document",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_each_literal_set_on_a_claim_reads_back",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_every_assertion_kind_accepts_all_six_literals",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_exactly_the_assertion_kinds_report_a_declaration",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_set_error_boxes_and_downcasts_as_a_send_sync_error",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_set_error_debug_names_the_variant",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_set_error_display_is_exact",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_set_error_has_no_source",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_set_error_is_a_clone_eq_send_sync_static_error",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_set_error_messages_follow_the_message_rules",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_set_error_messages_quote_awkward_ids_on_one_line",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_the_assertion_kinds_are_exactly_the_six",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_the_setter_accepts_a_one_mebibyte_claim_id",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_the_setter_refuses_a_kind_that_is_not_an_assertion",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_the_setter_refuses_a_one_mebibyte_unknown_id",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_the_setter_refuses_an_unknown_id",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_the_setter_refuses_every_kind_that_is_not_an_assertion",
  "crates/sacm/tests/claim.rs::sacm23_arg_002_the_setter_refuses_hostile_unknown_ids_without_panicking",
]

[[row]]
id = "LIB-SEC-001"
area = "SEC"
milestone = "M1"
title = "DTDs and entities are refused"
requirement = "`xmi::read` refuses any document with a DOCTYPE declaration (with or without an internal subset, entity declarations or an external DTD) with `ReadError::Doctype`, carrying code SACM-SEC-001 and the declaration's location, before anything in it could be declared, resolved, fetched or expanded, in every mode (ADR 0005, ADR 0015). The parser detects a real declaration, so `<!DOCTYPE` or `<!ENTITY` text in a comment, CDATA section or attribute value is not refused as one (ADR 0005 B3). A stray `<!ENTITY` outside a DOCTYPE, and an undeclared entity reference, are malformed XML (LIB-SEC-002) and are never expanded."
source = "OWASP XML External Entity Prevention; docs/sacm/diagnostics.md SACM-SEC-001 \"Document contains a DOCTYPE/external entity declaration; rejected for safety.\"; ADR 0005 (roxmltree, DTDs disabled; B3); ADR 0015; assurance-forge libs/sacm io/xmi_reader.cpp:2354-2366 (raw scan, deviated from)"
kind = "security"
status = "verified"
verification = "docs/verification/0019-m1-xml-input-safety.md"
depends_on = ["LIB-DIAG-001", "LIB-API-004", "LIB-API-009"]
acceptance = [
  "A DOCTYPE with no internal subset, one with an internal subset declaring entities (an XXE `SYSTEM \"file:...\"` entity, a billion-laughs chain, a parameter entity) and an external DTD (`PUBLIC` or `SYSTEM`) each return `ReadError::Doctype` whose `code()` is SACM-SEC-001 and whose `location()` is the line and column of `<!DOCTYPE`, including after a prolog of comments or processing instructions and on a line other than 1; after a UTF-8 BOM the DOCTYPE is at line 1, column 1, because the BOM is an encoding signature and takes no column (XML 1.0 §4.3.3).",
  "Nothing is resolved or expanded: an XXE entity naming a file that exists (the crate's own `Cargo.toml`) gives `Doctype`, and neither its `Display` nor its `Debug` contains any text of that file; the billion-laughs input returns `Doctype` without growing.",
  "`<!DOCTYPE` and `<!ENTITY` written inside a comment, a CDATA section, a processing instruction or an attribute value (escaped, as `&lt;!DOCTYPE`) of a well-formed document are not refused as `Doctype` or `Malformed`.",
  "A stray `<!ENTITY x \"y\">` outside any DOCTYPE, and an undeclared reference `&xxe;`, return `ReadError::Malformed` (SACM-XML-001), not `Doctype`; the reference is never expanded.",
  "`Code::XML_DOCTYPE_REJECTED` is SACM-SEC-001 and appears in a table row of `docs/sacm/diagnostics.md`.",
  "The `Doctype` `Display` is one line that starts in lower case, without trailing punctuation, and names the location: exactly `the input has a DOCTYPE, which is refused at line 2, column 1`; `source()` is `None`.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/input.rs"]
tests = [
  "crates/sacm/tests/xmi_read.rs::lib_sec_001_billion_laughs_is_refused_without_expansion",
  "crates/sacm/tests/xmi_read.rs::lib_sec_001_declaration_text_in_comment_cdata_or_attribute_is_not_refused",
  "crates/sacm/tests/xmi_read.rs::lib_sec_001_doctype_after_a_prolog_is_located_by_line_and_column",
  "crates/sacm/tests/xmi_read.rs::lib_sec_001_doctype_after_a_utf8_bom_is_at_line_1_column_1",
  "crates/sacm/tests/xmi_read.rs::lib_sec_001_doctype_display_is_one_located_line_without_source",
  "crates/sacm/tests/xmi_read.rs::lib_sec_001_doctype_rejected_code_is_sacm_sec_001_in_the_catalog",
  "crates/sacm/tests/xmi_read.rs::lib_sec_001_doctype_with_entity_declarations_is_refused_at_its_location",
  "crates/sacm/tests/xmi_read.rs::lib_sec_001_doctype_without_internal_subset_is_refused_at_its_location",
  "crates/sacm/tests/xmi_read.rs::lib_sec_001_external_dtd_is_refused_at_its_location",
  "crates/sacm/tests/xmi_read.rs::lib_sec_001_stray_entity_declaration_is_malformed_not_doctype",
  "crates/sacm/tests/xmi_read.rs::lib_sec_001_undeclared_entity_reference_is_malformed_and_not_expanded",
  "crates/sacm/tests/xmi_read.rs::lib_sec_001_xxe_naming_an_existing_file_is_not_resolved",
]

[[row]]
id = "LIB-SEC-002"
area = "SEC"
milestone = "M1"
title = "Malformed input is diagnosed, never a panic"
requirement = "Malformed XML (mismatched or unclosed tags, more than one root, no root, an undeclared namespace prefix, an undeclared entity reference, a duplicate attribute), truncated input and input that is not valid UTF-8 are refused by `xmi::read` with `ReadError::Malformed`, carrying code SACM-XML-001, a reason and a location where one is known (ADR 0005, ADR 0015). No input causes a panic, an abort or unbounded recursion. Wrong root elements are SACM23-XMI-001; resource limits are LIB-SEC-003; fuzzing is LIB-SEC-004."
source = "docs/sacm/diagnostics.md SACM-XML-001 \"Malformed XML; parse failed.\"; ADR 0005 (roxmltree >= 0.21.2: iterative parsing of nested elements; B1); ADR 0011 (SourceLocation, message rules); ADR 0015; assurance-forge libs/sacm io/xmi_reader.cpp (parse failure)"
kind = "security"
status = "verified"
verification = "docs/verification/0038-m1-audit-fixes.md"
depends_on = ["LIB-DIAG-001", "LIB-API-004", "LIB-API-009"]
acceptance = [
  "Every proper prefix of a small well-formed SACM document, the empty input included, returns `ReadError::Malformed` whose `code()` is SACM-XML-001; a prefix cut inside the document reports a location at or before the end of the input.",
  "Input that is not valid UTF-8 returns `Malformed` located at the first invalid byte (line and column), for an invalid byte on line 1 and on a later line.",
  "Each of: a mismatched end tag, an unclosed element, two root elements, text only, an undeclared namespace prefix, an undeclared entity reference and a duplicate attribute returns `Malformed` with a location.",
  "No panic: every prefix of the sample document, every single-byte replacement of it with 0x00, `<`, `&` and 0xFF, 100,000 levels of nesting (well-formed and unclosed), and empty, whitespace-only and BOM-only input each return a value without panicking.",
  "The `Malformed` `Display` is one lowercase line without trailing punctuation, naming the location when known (`... at line L, column C: <reason>`); names from the input are quoted, so a line break in the input never breaks the line; the reason contains no position of its own; e.g. `<?xml version=\"1.0\"?>\\n<r></s>` displays exactly `the input is not well-formed XML at line 2, column 4: the end tag \"s\" does not match the start tag \"r\"`.",
  "`ReadError`, `ReadOptions` and `ReadOutput` are `Send + Sync + 'static` (checked statically); `ReadError` is `Clone + Eq + Hash + Debug + std::error::Error` with `source()` `None`, and is `#[non_exhaustive]`.",
  "`Code::XML_MALFORMED` is SACM-XML-001 and appears in a table row of `docs/sacm/diagnostics.md`.",
  "Locations count lines as XML does (XML 1.0 §2.11): LF, CRLF and a lone CR each end exactly one line, for every refusal (`Doctype`, `Malformed` from the parser and from invalid UTF-8, `Unsupported`); e.g. the root of `<!--p-->\\r<r/>` is at line 2, column 1. A leading UTF-8 BOM takes no column: the root of `\\xEF\\xBB\\xBF<r/>` is at line 1, column 1.",
  "No recursion in the content reader: a 100,000-deep chain of ArgumentPackages, each in its parent's `argumentElement`, reads in both modes on a thread with a 2 MiB stack, and the document drops on that thread without overflow.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/input.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/model/document.rs"]
tests = [
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_every_proper_prefix_of_a_document_is_malformed",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_invalid_utf8_is_malformed_at_the_first_invalid_byte",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_each_kind_of_malformed_xml_is_refused_with_a_location",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_doctype_location_counts_lf_crlf_and_lone_cr_as_one_line_each",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_parser_error_location_counts_lf_crlf_and_lone_cr_as_one_line_each",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_invalid_utf8_location_counts_lf_crlf_and_lone_cr_as_one_line_each",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_unsupported_root_location_counts_lf_crlf_and_lone_cr_as_one_line_each",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_leading_utf8_bom_takes_no_column",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_prefixes_and_byte_replacements_never_panic",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_deep_nesting_returns_without_recursion",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_empty_whitespace_and_bom_only_input_return_a_value",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_malformed_display_is_one_located_line",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_malformed_display_quotes_names_and_never_breaks_the_line",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_every_refusal_in_the_sweep_has_its_display_code_and_no_source",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_read_types_are_send_sync_static_with_the_error_traits",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_each_refusal_is_clone_eq_and_deterministic_without_source",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_xml_malformed_code_is_sacm_xml_001_in_the_catalog",
  "crates/sacm/tests/xmi_roots.rs::lib_sec_002_invalid_root_and_no_package_locations_count_lines_as_xml_does",
  "crates/sacm/tests/xmi_roots.rs::lib_sec_002_leading_utf8_bom_takes_no_column_in_invalid_root_and_no_package",
  "crates/sacm/tests/xmi_read.rs::lib_sec_002_a_deep_readable_package_chain_reads_without_recursion",
]
notes = "Slice 0021: the location tests use roots that are still refused once SACM23-XMI-001 reads package roots; re-checked there. Slice 0038 (M1 audit): the no-recursion claim was tested only on input refused at the root; a readable deep chain is added; re-check required. Slice 0042: its tests replaced `isCitation`/`isAbstract` unread samples (now read, ADR 0026) with other unread ones, locations unchanged; re-check there. Slice 0062: its unread TerminologyPackage samples became TerminologyPackageInterface; re-check there."

[[row]]
id = "SACM23-XMI-001"
area = "XMI"
milestone = "M1"
title = "Interchange roots"
requirement = "`xmi::read` returns `Ok(ReadOutput)` with a `Document` (and its diagnostics, sorted per ADR 0011: SACM-XMI-010 for `xsi:type` and SACM-XMI-011 for `xmi:version` (LIB-COMPAT-001), the Infos SACM-XMI-004 for a missing `xmi:id` and SACM-ID-004 for a padded one (SACM23-XMI-020, SACM23-XMI-025), and SACM-XMI-003 for preserved content (LIB-COMPAT-003), SACM-XMI-012 and SACM-XMI-013 for shapes and spellings a tolerant read reads (LIB-COMPAT-008, SACM23-XMI-009)) when every interchange root is an `AssuranceCasePackage`, `ArgumentPackage`, `ArtifactPackage` or `TerminologyPackage` element in the pinned SACM namespace `http://www.omg.org/spec/SACM/20220301` (D-NS-PIN). A root is the document element, or each element child outside the XMI namespace of an `XMI` element in the XMI 2.5.1 namespace `http://www.omg.org/spec/XMI/20131001`. Elements and attributes are matched by namespace URI and local name, never by prefix (any-prefix equivalence is SACM23-XMI-002). Each root becomes a parentless element of its kind, in document order, whose id is its `xmi:id`'s `xsd:ID` value (SACM23-XMI-025), or a generated id when it has none (SACM23-XMI-020). Its name is missing (ADR 0013) unless it has a `name` child, which SACM23-XMI-012 reads. A read root may carry only namespace declarations, `xmi:id`, `xmi:version` (reported as SACM-XMI-011 and otherwise ignored: XMI 2.5.1 identifies its version by namespace) and an `xmi:type` or `xsi:type` naming its own class; its content may be only white space, comments, processing instructions, one `name` child under SACM23-XMI-012's rules, and the children SACM23-XMI-016 reads; content that does not conform there is preserved (below). The wrapper may carry only namespace declarations and `xmi:version`. An empty root id is `ReadError::InvalidId` and a root id that repeats an earlier element's is `ReadError::DuplicateId` (SACM23-VAL-020, SACM23-VAL-001). Content of a root that does not conform where it stands (an attribute or child element its class lacks, a type attribute naming another class (D-ROOT-NAME), an `id` attribute in no namespace or another namespace, non-white-space text) is kept as preserved content of the root, with one SACM-XMI-003 at it (Warning tolerant, Error strict; LIB-COMPAT-003, ADR 0033). Anything else is refused as `ReadError::Unsupported` at its location, never dropped (LIB-API-009, LIB-API-011): conforming content not read yet (XMI metadata and `xsi:schemaLocation` on a root, SACM23-XMI-019; a conforming child SACM23-XMI-016 does not read), a preserved attribute whose prefix binds `sacm` or `xmi` to another URI (a defect, ADR 0033), any attribute other than namespace declarations and `xmi:version`, and any non-white-space text, on the wrapper, the other four package kinds as roots (each refused under its own package row: SACM23-AC-002/003 and SACM23-TERM-007/008; the Argumentation and Artifact interface and binding roots are read, SACM23-ARG-014/015, SACM23-ART-012/013), a package-kind name in another namespace or none (LIB-COMPAT-004), an `XMI` element in another namespace (LIB-COMPAT-002), and an XMI-namespace element as a root or wrapper child (SACM23-XMI-019). A root or wrapper child whose local name is none of the twelve package-kind names, and a wrapper with no root, are refused with a `ReadError` whose `code()` is SACM-XMI-001, at that element; among the refusals found while reading the roots this takes precedence over `Unsupported`, so which roots get SACM-XMI-001 does not depend on what a release can read (an `XMI` element outside the XMI namespace is `Unsupported` before its children are classified, ADR 0016 D1). No document is returned beside a refusal (ADR 0015). The XML checks of LIB-SEC-005 run before any root is classified."
source = "formal/23-05-08 §2.2 (p. 4) \"The top object of the Argumentation package as a unit of interchange shall be the Argumentation::ArgumentPackage element of the SACM.\"; §2.4 (p. 4) \"The top object of the Assurance Case package as a unit of interchange shall be the SACM::AssuranceCasePackage element.\"; §2.2/§2.4 \"import and export XMI documents that conform with the SACM XML Schema produced by applying XMI rules to the normative MOF metamodel\"; §9.2 (p. 23) \"When users exchange content, it is expected they use this as the top-level container.\"; XMI 2.5.1 formal/15-06-07 §7.5.3 (p. 10) \"it must be the XMI element if there are multiple elements\", \"the XMI element may not be present when there is only a single top-level object\", \"Each version of XMI is unambiguously identified by its unique namespace URI\"; §7.8.1 (p. 16) \"The XML element name for each model Class, and Association in a document is its short name.\"; §9.5.2 rule 2a (p. 63); §7.6.1 (p. 13) `<xsd:attribute name=\"id\" type=\"xsd:ID\" use=\"optional\"/>`; XMI.xsd targetNamespace `http://www.omg.org/spec/XMI/20131001` (no `version` attribute; specification defect D10); D-NS-PIN; D-PRESERVE; ADR 0013; ADR 0015; ADR 0016; docs/sacm/diagnostics.md SACM-XMI-001; assurance-forge libs/sacm src/io/xmi_reader.cpp:2097-2142, 2191-2285, 2433-2459 (empty wrapper is SACM-XMI-001 as in C++; deviations in ADR 0016); §2.5 (p. 5) \"The top object of the Terminology package as a unit of interchange shall be the Terminology::TerminologyPackage element.\""
kind = "xmi"
status = "verified"
depends_on = ["SACM23-AC-001", "SACM23-ARG-001", "LIB-SEC-001", "LIB-SEC-002", "LIB-API-009", "LIB-SEC-005", "LIB-TOOL-020", "LIB-DIAG-001"]
acceptance = [
  "AssuranceCasePackage root (§2.4): `<sacm:AssuranceCasePackage xmlns:sacm=\"http://www.omg.org/spec/SACM/20220301\" xmlns:xmi=\"http://www.omg.org/spec/XMI/20131001\" xmi:id=\"acp_1\"/>` gives `Ok`; `roots()` is `[acp_1]`, its kind is AssuranceCasePackage, `parent()` is `None`, `children()` is empty, `name()` is `None`, the document has 1 element and `diagnostics()` is empty.",
  "ArgumentPackage root (§2.2): the same holds for `<sacm:ArgumentPackage xmlns:sacm=\"http://www.omg.org/spec/SACM/20220301\" xmlns:xmi=\"http://www.omg.org/spec/XMI/20131001\" xmi:id=\"arg_1\"/>`, with kind ArgumentPackage.",
  "Wrapper (XMI §7.5.3): `<xmi:XMI xmlns:xmi=\"http://www.omg.org/spec/XMI/20131001\" xmlns:sacm=\"http://www.omg.org/spec/SACM/20220301\"><sacm:ArgumentPackage xmi:id=\"a\"/></xmi:XMI>` gives the same document as the bare form (same roots, ids and kinds; 1 element): the wrapper is not an element.",
  "Several roots: a wrapper holding AssuranceCasePackage `n1`, ArgumentPackage `a1` and AssuranceCasePackage `n2` gives `roots()` in that order, each with its kind and no parent.",
  "Ignorable content gives the same document as the bare form: an XML declaration; comments and processing instructions before, inside and after the root and between wrapper children; white space; `xmi:version=\"2.0\"` or `\"2.1\"` on the root or the wrapper; an unused `xmlns:foo=\"urn:x\"`; an `xmlns:xsi` declaration.",
  "Redundant type: `xmi:type=\"sacm:ArgumentPackage\"` or `xsi:type=\"sacm:ArgumentPackage\"` on an ArgumentPackage root gives the same document; `xsi:type=\"sacm:ArgumentPackageInterface\"`, `xsi:type=\"sacm:Claim\"` or `xmi:type=\"sacm:Claim\"`, `xsi:type=\"sacm:ArgumentPackage\"` on an AssuranceCasePackage, a type whose prefix is bound to another namespace, and an unprefixed type with no default namespace each read, in both modes, as the root's own kind, with the type attribute kept as preserved content of the root and one SACM-XMI-003 at the attribute's name (D-ROOT-NAME, LIB-COMPAT-003).",
  "Ids are kept exactly: `xmi:id=\"Ünï.c-1\"` and `xmi:id=\"a&#x42;\"` give ids `Ünï.c-1` and `aB`.",
  "SACM-XMI-001: each of these gives `ReadError::InvalidRoot` with `code() == Code::XMI_INVALID_ROOT` (SACM-XMI-001), located at the `<` of the element's start tag, and `element_name` the name as written (`<sacm:Claim …>` displays exactly `the root element \"sacm:Claim\" is not a SACM package at line 1, column 1`): `<sacm:Claim xmlns:sacm=\"http://www.omg.org/spec/SACM/20220301\" xmlns:xmi=\"http://www.omg.org/spec/XMI/20131001\" xmi:id=\"c1\"/>` (the C++ fixture `invalid/root-invalid.sacm.xmi`), `<sacm:ArgumentGroup …>`, `<sacm:assuranceCasePackage …>`, `<sacm:Foo/>`, `<r/>`, `<html xmlns=\"http://www.w3.org/1999/xhtml\">`, `<uml:Model xmlns:uml=\"http://www.omg.org/spec/UML/20131001\">`; a wrapper holding a valid ArgumentPackage then a `sacm:Claim` (at the Claim; no document is returned); an empty `<xmi:XMI xmlns:xmi=\"http://www.omg.org/spec/XMI/20131001\"/>` and a wrapper holding only `<xmi:documentation/>` give `ReadError::NoPackage`, with the same code, located at the wrapper and displaying `the XMI element holds no SACM package at line L, column C`.",
  "SACM-XMI-001 takes precedence: a wrapper holding `<sacm:TerminologyPackageInterface xmi:id=\"f\"/>` then `<sacm:Claim xmi:id=\"c\"/>` gives SACM-XMI-001 at the Claim, not `Unsupported`.",
  "Not readable yet, so `Unsupported` (`code()` SACM-XMI-014 for a package-kind root and an `xmi:`-namespace element, SACM-XMI-002 for a root in another namespace or none, SACM-XMI-015 for an `XMI` wrapper outside the XMI 2.5.1 namespace; LIB-API-017) at the stated element: each of the other 4 package-kind roots in the pinned namespace; `<foo:ArgumentPackage xmlns:foo=\"urn:x\" …>`; `<ArgumentPackage xmlns:xmi=\"…20131001\" xmi:id=\"p\"/>` in no namespace; `<sacm:ArgumentPackage xmlns:sacm=\"http://www.omg.org/spec/SACM/2.2/argumentation\" …>`; `<xmi:XMI xmlns:xmi=\"http://www.omg.org/XMI\">` and `<XMI>` wrappers holding a valid root; a root `<xmi:Extension>`; a wrapper child `<xmi:documentation>` or `<xmi:extension>` next to a valid root (at that child).",
  "Unread content: on a valid root of either kind, each of `xmi:uuid`, `xmi:label`, `href`, `xmi:idref` and `xsi:schemaLocation`, a conforming child this version does not read (a `terminologyPackage` typed `sacm:TerminologyPackageInterface` of an AssuranceCasePackage) and `<xmi:Extension/>` is `Unsupported` at that content (SACM23-XMI-019, LIB-API-011); non-white-space text in the wrapper is `Unsupported` at its first character. Content that does not conform is kept as preserved content of the root, with one SACM-XMI-003 at it in both modes (LIB-COMPAT-003): any one of `sacm:isCitation`, `sacm:isAbstract`, `ext:isCitation`, `xmi:isAbstract`, `sacm:citedElement`, `ext:abstractForm`, `xml:lang`, `foo=\"1\"`, `ext:a=\"1\"`; `interface=\"x\"` on an AssuranceCasePackage is refused as `Unsupported` with SACM23-AC-002; on an ArgumentPackage it is read (SACM23-ARG-014); a `<foo/>` child, a child under a role the root's class lacks, `<sacm:isCitation>` and `<sacm:citedElement>`; non-white-space text, also after a comment. (A `gid`, utility children and the unqualified flags and references are read: SACM23-BASE-004 to -008, SACM23-XMI-005.)",
  "Ids: an unprefixed `id=\"p\"` or an `id` attribute in another namespace is kept as preserved content of the root, with one SACM-XMI-003 at the attribute's name, and the root reads with a generated id; a root with no `xmi:id` reads with a generated id (SACM23-XMI-020), and a padded one reads trimmed (SACM23-XMI-025); an empty `xmi:id` is `ReadError::InvalidId` (SACM23-VAL-020); two wrapped roots with the same `xmi:id` are `ReadError::DuplicateId` at the second (SACM23-VAL-001).",
  "Order and determinism: the encoding refusals (LIB-API-009), DOCTYPE (LIB-SEC-001) and `Malformed` (LIB-SEC-002, LIB-SEC-005) come before any root classification; the same input always gives the same result.",
  "`ReadOutput` has `document()`, `diagnostics()` (empty unless the input carries `xsi:type` or `xmi:version`, LIB-COMPAT-001, a missing or padded `xmi:id`, SACM23-XMI-020 and SACM23-XMI-025, or preserved content, SACM-XMI-003 and LIB-COMPAT-003, a C++ shape read tolerantly, SACM-XMI-012, or a SACM23-XMI-009 spelling, SACM-XMI-013 in either mode) and `into_document()`, and is `Send + Sync` (checked statically). The SACM-XMI-001 refusals follow ADR 0011: `InvalidRoot` and `NoPackage` are `#[non_exhaustive]` `ReadError` variants with a location (also returned by `location()`), its `Display` is one lowercase line without trailing punctuation that quotes names from the input, `source()` is `None`; `Code::XMI_INVALID_ROOT` is SACM-XMI-001 and appears in a table row of docs/sacm/diagnostics.md.",
  "A root whose `xmi:id` repeats an earlier element's (an earlier root's or its child's) is `ReadError::DuplicateId` at the root's `<`, before its attributes and content: a second wrapped `<sacm:ArgumentPackage xmi:id=\"a\" isAbstract=\"true\"/>` is refused at its `<`, not at `isAbstract`.",
]
