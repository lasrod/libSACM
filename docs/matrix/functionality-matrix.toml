  "`.config/nextest.toml` requires nextest 0.9.111 or later, and has `[profile.mutants]` with `fail-fast = { max-fail = 1, terminate = \"immediate\" }`. The default profile keeps nextest's fail-fast.",
  "A test reports each of these lost or changed, and reports unreviewed keys.",
  "Known residual, accepted in slice 0011: if hanging tests fill every worker slot before the killing test starts, the mutant is a TIMEOUT, which fails CI.",
