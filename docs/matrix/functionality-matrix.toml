[[row]]
id = "LIB-CLI-003"
area = "CLI"
milestone = "M1"
title = "`sacm roundtrip`"
requirement = "`sacm roundtrip <file> [--strict] [-o <out>]` reads the file (tolerant by default), writes it in strict mode to memory, reads that output back in strict mode, and compares the two with `compare::semantic_compare` (ADR 0023). It prints each `Difference` on one line, then `<file>: round trip ok` or `<file>: round trip failed: <reason>`. Exit 0 when the strict save succeeds, the output reads back with no Error and there is no difference; 1 when the strict save refuses (each Error printed), the output does not read back cleanly, or there is a difference; 2 when the input cannot be read, `-o` cannot be written, or the arguments are invalid. `-o <out>` writes the strict output only when the round trip is faithful."
source = "ADR 0023; D-API; D-RT; LIB-RT-002; LIB-COMPAT-007; assurance-forge `sacm_cli.cpp` `run_roundtrip` (differs: it fails on load Errors and has no `-o`)"
kind = "cli"
status = "verified"
verification = "docs/verification/0038-m1-audit-fixes.md"
depends_on = ["LIB-CLI-002", "LIB-RT-002", "LIB-COMPAT-007"]
acceptance = [
  "A clean fixture (packages, Claims, names, every `assertionDeclaration`) exits 0 with stdout exactly `<file>: round trip ok`.",
  "With `-o out.xmi` the file's bytes equal `xmi::write(&document, &WriteOptions::default())`, identical across runs.",
  "A reference naming no element (`dangling-reference.sacm.xmi`) makes the strict save refuse: exit 1, the `error SACM-REF-001 ...` line, and `round trip failed: ...`; no `-o` file is created.",
  "An input using `xsi:type` exits 0 in tolerant mode, and its `-o` output has `xmi:type` and no `xsi:type`.",
  "The difference report prints each `Difference` `Display` line followed by `round trip failed: N differences` and exits 1; a correct library produces no difference, so this is covered by an untraced unit test in the CLI.",
  "An unreadable input exits 2 with the same stderr form as an unreadable file in `validate`; `-o` into a directory that does not exist exits 2 with a message naming the path.",
  "`--strict` gives the same exit code and stdout as without it, for a clean fixture and for an `xsi:type` input (read diagnostics are not checked; ADR 0023).",
]
tests = [
  "crates/sacm-cli/tests/roundtrip.rs::lib_cli_003_a_clean_fixture_exits_0_with_only_the_round_trip_ok_line",
  "crates/sacm-cli/tests/roundtrip.rs::lib_cli_003_o_writes_the_strict_output_byte_for_byte_and_identically_across_runs",
  "crates/sacm-cli/tests/roundtrip.rs::lib_cli_003_a_refused_strict_save_exits_1_with_each_error_and_writes_no_output",
  "crates/sacm-cli/tests/roundtrip.rs::lib_cli_003_an_xsi_type_input_round_trips_tolerantly_and_its_output_uses_xmi_type",
  "crates/sacm-cli/tests/roundtrip.rs::lib_cli_003_an_unreadable_input_or_an_unwritable_output_exits_2",
  "crates/sacm-cli/tests/roundtrip.rs::lib_cli_003_invalid_arguments_exit_2_with_usage",
  "crates/sacm-cli/tests/roundtrip.rs::lib_cli_003_strict_changes_neither_the_exit_code_nor_the_output",
]
code = ["crates/sacm-cli/src/main.rs", "docs/adr/0023-command-line.md"]
notes = "Slice 0038 (M1 audit): `--strict` was documented but untested; a test is added; re-check required. Slice 0041: a test input broke §11.4 homogeneity or held two descriptions, which SACM23-VAL-011/012 now report; the input was changed, not the assertion; re-check there."

