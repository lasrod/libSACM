milestone = "M3"
title = "Undo: the decided approach"
requirement = "Undo and redo are the application's: the `edit` module docs show a history of whole documents, a `Document::clone` taken before each successful `edit::apply`, `edit::apply_preview`, `edit::batch` or `edit::apply_all` and restored with `std::mem::replace`, so one operation, one batch or an accepted draft (`CopyElements` in a batch) is one step. A restored clone is `==` to the document before the change and writes the same XMI, preserved content included; it has the revision and the generated-id counters it had, so the next create generates the id an undone create had (D-ID; an application that needs ids unique across its history gives its own, ADR 0031), and a preview taken before an undone change applies again after the undo. The docs say a step costs one clone, in time and memory proportional to the document, and leave the depth to the application. The crate has no history type and no inverse operations (ADR 0037, D-UNDO)."
source = "Q-UNDO and D-RESULT; D-UNDO; GitHub issue #61; ADR 0037 (accepted by the maintainer, 2026-11-17)"
kind = "editing"
status = "verified"
verification = "docs/verification/0058-undo-recipe.md"
depends_on = ["LIB-EDIT-005", "LIB-EDIT-009", "LIB-EDIT-014", "LIB-EDIT-018"]
notes = "Requirements from Assurance Forge (GitHub issue #61, 2026-11-14), input to Q-UNDO: one user action, even a batch (LIB-EDIT-014), is one undo step; accepting a draft `Document` into the main one is one step; the generated ids after an undo are specified (reused or not); history is per document and in memory; memory use is bounded for cases of thousands of elements. The web client sends changes as operations, which favours inverse operations over snapshots. Measured 2026-11-15 (release build, flat package of claims): `Document::clone` 0.26 ms at 1,000 elements, 1.4 ms at 5,000, 7.8 ms at 20,000; `==` and `semantic_compare` 0.8 ms at 5,000 but 12-16 ms at 20,000 (super-linear)."
code = ["crates/sacm/src/edit.rs", "crates/sacm/tests/undo.rs", "docs/adr/0037-undo-is-the-applications.md"]
tests = [
  "crates/sacm/tests/undo.rs::lib_edit_011_undoing_a_batch_restores_an_equal_document_that_writes_the_same_xmi_and_generates_the_same_next_id",
  "crates/sacm/tests/undo.rs::lib_edit_011_undoing_a_delete_restores_preserved_content_and_file_ids",
  "crates/sacm/tests/undo.rs::lib_edit_011_accepting_a_draft_is_one_step",
  "crates/sacm/tests/undo.rs::lib_edit_011_undo_and_redo_restore_the_revision",
  "crates/sacm/tests/undo.rs::lib_edit_011_a_preview_taken_before_an_undone_change_applies_after_the_undo",
  "crates/sacm/tests/undo.rs::lib_edit_011_a_refused_change_records_no_step",
]
acceptance = [
  "`lib_edit_011_undoing_a_batch_restores_an_equal_document_that_writes_the_same_xmi_and_generates_the_same_next_id`: a batch of two `CreateClaim` with generated ids and one `SetName`, then undo by the recipe: the document is `==` to before, `xmi::write` gives the same bytes as before, and the next generated claim id is `claim_1` again; and on a document whose generated `claim_1` was deleted before the step, an undone create of `claim_2` is followed by a create that generates `claim_2` again, not `claim_1`.",
  "`lib_edit_011_undoing_a_delete_restores_preserved_content_and_file_ids`: a tolerant read of a file with a vendor attribute, a vendor child element and the `xmi:id`s of names and contents under a package; `DeleteElement` of the package with `DeleteRecursively`, then undo: the document is `==` to the one read, and its tolerant write gives the same bytes as before the delete.",
  "`lib_edit_011_accepting_a_draft_is_one_step`: `CopyElements` from a draft document plus a `SetName` of a copy in one `edit::batch` is one step: one undo gives `==` the document before the batch, and one redo gives `==` the document after it.",
  "`lib_edit_011_undo_and_redo_restore_the_revision`: after an undo `revision()` equals the revision before the change, and after a redo the revision after it.",
  "`lib_edit_011_a_preview_taken_before_an_undone_change_applies_after_the_undo`: a preview taken before a change is `PreviewExpired` (SACM-CMD-003) after the change, and applies with `Ok` after that change is undone.",
  "`lib_edit_011_a_refused_change_records_no_step`: a refused operation leaves the document `==` and its revision unchanged, and the recipe, which pushes only on `Ok`, records no step: a following undo restores the state before the last successful change.",
  "A new section \"# Undo and redo\" in the `edit` module docs, after \"# Moving and copying elements\", holds the recipe as a doctest that compiles and runs: a `History` with `undo` and `redo` stacks and a size limit, the rule \"clone first, then exactly one atomic call, then push on `Ok`\", the cost per step, and the id rule. `edit/batch.rs`'s \"Undo itself is not provided yet (LIB-EDIT-011)\" becomes a link to that section. The tests live in `crates/sacm/tests/undo.rs` and use the recipe's `History` as written in the docs.",
]

[[row]]
id = "LIB-COMPAT-016"
area = "COMPAT"
milestone = "M6"
title = "ISO-8859-1 input"
requirement = "`xmi::read` reads, in both modes, a document whose XML declaration names the encoding ISO-8859-1 (the name compared case-insensitively), decoding each byte as the Unicode scalar value of the same number, with locations counted as for UTF-8. Other single-byte encodings stay `Unsupported` (a limit of this version)."
source = "XML 1.0 5th ed. §4.3.3 \"All XML processors MUST be able to read entities in both the UTF-8 and UTF-16 encodings.\" (other encodings are optional, so this is a convenience); D-STRICT (a conforming document in another encoding still conforms to the SACM XML Schema, so strict mode reads it too); LIB-COMPAT-015 corpus (justification-factory-*.xmi, ATL output)"
kind = "xmi"
status = "candidate"
depends_on = ["LIB-API-009", "SACM23-XMI-018", "LIB-COMPAT-015"]
notes = "Found by the corpus (slice 0054). Whether to accept the IANA aliases (latin1, l1, ISO_8859-1, IBM819, CP819) is open. Both corpus files are also in the SACM 2.0 namespace, so LIB-COMPAT-004 is needed before they read."

[[row]]
id = "LIB-COMPAT-017"
area = "COMPAT"
milestone = "M6"
title = "Foreign subclasses of SACM classes"
requirement = "An application can declare that an element type in a foreign namespace is a subclass of a SACM 2.3 class (for example a GSN profile's Goal as a Claim), and a tolerant `xmi::read` then reads such an element as that SACM class, keeping its declared type and the attributes SACM lacks as preserved content, so a tolerant save writes it back unchanged. The crate names no foreign class itself (D-TERM). A strict read refuses such an element as today."
source = "SCSC GSN Metamodel v2.2 (2021, CC BY 4.0) and SACM 2.4 Beta1 Annex A, which define GSN classes as subclasses of SACM classes; corpus files 12 and 13 (`http://acwg.org/3.0/gsn` types in SACM roles); the maintainer, 2026-11-17"
kind = "xmi"
status = "candidate"
depends_on = ["LIB-COMPAT-002", "LIB-COMPAT-004"]
notes = "Candidate: the GSN layer the maintainer plans may need it, to read files in the SCSC v2.2 or SACM 2.4 Annex A style; whether it does depends on which GSN style that layer follows (an open question for when it starts)."

[[row]]
id = "LIB-COMPAT-018"
area = "COMPAT"
milestone = "M6"
title = "SACM 2.4 import"
requirement = "Once SACM 2.4 is formal, decide how a SACM 2.4 document is read: SACM 2.4 Beta1 restructures the metamodel (a merged MultiLangString, `elementId`, NamedValue, one Group, one BindingPackage, renamed roles and ends), and its Annex G transformation from 2.3 is prose only, so 2.4 is not readable as 2.3 without loss. Until then LIB-COMPAT-004 refuses a 2.4 document with its own reason naming this row."
source = "SACM 2.4 Beta1 (ptc/26-06-34, ptc/26-05-28, OMG 2026), Annex G; the maintainer, 2026-11-17"
kind = "xmi"
status = "deferred"
depends_on = ["LIB-COMPAT-004"]
notes = "Deferred: SACM 2.4 is a Beta (adoption shown as September 2026), and reading it is a conversion question, not a namespace one; revisit when 2.4 is formal."

[[row]]
id = "LIB-COMPAT-015"
area = "COMPAT"
milestone = "M3"
title = "Real files are read"
requirement = "`cargo xtask fetch-corpus` downloads SACM files that tools other than this crate wrote, at URLs pinned to a commit with SHA-256 pins (`CORPUS` in `xtask/src/fetch.rs`), into the git-ignored `third_party/corpus/`, with the policy of `fetch-spec`; they are never committed. An xtask test reads each file tolerantly and strictly, validates the document a tolerant read returns, writes it back tolerantly and reads that back, and reports per file the outcome of each step, the diagnostics by code and severity with counts, and whether the write-back reads back semantically equal. The report is deterministic; `docs/compat/corpus.md` holds the list and the report, which the test checks. A file in a namespace other than SACM 2.3's, or one neither mode opens, is recorded as refused, not a failure. Every refusal or loss the report shows is mapped in `docs/compat/corpus.md` to a matrix row or a note, or is fixed."
source = "the maintainer, 2026-11-16 (independent review; consumer needs before M4 and M5); SACM 2.3 formal/23-05-08 §2.4 \"Software that conforms to the specification at the Assurance Case Model compliance point shall be able to import and export XMI documents that conform with the SACM XML Schema produced by applying XMI rules to the normative MOF metamodel defined in this entire specification.\"; LIB-TOOL-002 (pinned fetch); LIB-SEC-006 (a fetched corpus skipped when absent); LIB-COMPAT-005 (the committed corpus, M6); assurance-forge `docs/sacm/sacm-interop-corpus.md` at b0a0f0d (its corpus, which this list extends)"
kind = "xmi"
status = "verified"
verification = "docs/verification/0054-real-files.md"
depends_on = ["LIB-COMPAT-001", "LIB-TOOL-002", "LIB-TOOL-021"]
notes = "Slice 0062: the corpus report changed (the consumer's kitchen-blender file now reads strictly); re-check there."
code = ["xtask/src/fetch.rs", "xtask/src/lib.rs", "xtask/Cargo.toml", ".gitignore", ".github/workflows/ci.yml", "docs/compat/corpus.md"]
tests = [
  "xtask/tests/fetch.rs::lib_compat_015_the_corpus_pins_are_well_formed_unique_and_pinned_to_commits",
  "xtask/tests/fetch.rs::lib_compat_015_fetch_each_writes_a_line_per_file_and_needs_no_network_when_all_are_present",
  "xtask/tests/fetch.rs::lib_compat_015_fetch_each_names_the_file_on_a_hash_mismatch_and_leaves_no_partial_file",
  "xtask/tests/run.rs::lib_compat_015_run_fetch_corpus_checks_third_party_corpus_under_the_root",
  "xtask/tests/run.rs::lib_compat_015_the_usage_lists_fetch_corpus_and_third_party_corpus_is_git_ignored",
  "xtask/tests/corpus.rs::lib_compat_015_the_corpus_report_equals_the_one_in_docs_compat_corpus_md",
  "xtask/tests/corpus.rs::lib_compat_015_the_corpus_report_is_the_same_on_a_second_run",
  "xtask/tests/corpus.rs::lib_compat_015_an_absent_corpus_is_skipped_unless_configured",
  "xtask/tests/corpus.rs::lib_compat_015_the_files_table_lists_every_corpus_file_in_order",
]
acceptance = [
  "`cargo xtask fetch-corpus` fetches each `CORPUS` file into `third_party/corpus/` (git-ignored) with the `fetch_into` policy, one `ok`/`fetched` line per file: a file present with its pin is not downloaded, so a complete corpus needs no network; a download that does not match its pin fails naming the URL and both hashes and leaves no `.part` file; an existing file with another hash fails naming its path and is left untouched. The usage lists the command, and `fetch-spec`'s output is unchanged.",
  "`CORPUS` has 15 entries with unique plain file names and 64-digit lowercase SHA-256 pins; each URL is `https://raw.githubusercontent.com/<owner>/<repo>/<40-hex commit>/...`; they come from at least two repositories, at least one outside `lasrod/`.",
  "The corpus test checks each file's SHA-256, then reports per file, in `CORPUS` order, `tolerant read` and `strict read` (`read; <codes>`, or `refused <Variant>[ <code>][ at line L, column C][ <label>]`) and, for a file the tolerant read opens, `validate` (`<codes>`) and `tolerant write` (`reads back equal`, `reads back with N differences`, `does not read back: ...` or `refused: ...`), where `<codes>` is `none` or `<CODE> <severity> <count>` sorted by code then severity, then a totals line. Two runs give the same text, and it equals the block in `docs/compat/corpus.md`; when not, the test shows the actual report.",
  "With `SACM_CORPUS_DIR` unset and a corpus file absent, the test prints a SKIPPED notice naming `cargo xtask fetch-corpus` on stderr and passes; with it set, an absent file fails the test, and an empty value is an error; a file with another hash always fails it. CI's Linux test job fetches the corpus (cached by the hash of `xtask/src/fetch.rs`) and runs the test with `SACM_CORPUS_DIR` set.",
  "`docs/compat/corpus.md` lists every `CORPUS` file in order with its repository and commit, licence, writing tool, namespace and reason; holds the report; and maps each refusal, each Error and each loss to a matrix row or a note.",
]

[[row]]
id = "LIB-EDIT-017"
area = "EDIT"
milestone = "M3"
title = "Move an element"
requirement = "A `MoveElement` operation moves an element, with everything it contains and its preserved content, under another parent (`new`) or to the roots (`root`), after the last child or root, or at a position (`with_position`): its index among the new parent's children (or the roots) after the move, from 0 to the number of the others. Ids, references and the element's features do not change; its parent, its role and the order do. The containment table decides the legal parents (`InvalidParent`), and a root must be a package (`InvalidRoot`). Moving an element into itself or an element it contains is `ParentInSubtree`, and a position past the end is `PositionOutOfRange`. A preserved child of either parent keeps its place after the typed child it followed. `changed_ids` follow LIB-EDIT-003: the element when its parent changes, and a parent whose child order or preserved placement changes, in pre-order after. A move to the place the element holds changes nothing. It works with `check`, `preview`, batches and serde like every operation."
source = "the maintainer, 2026-11-16 (independent review; consumer needs before M4 and M5); Assurance Forge (drag and drop in an editor); containment: LIB-API-008, ADR 0014; ADR 0036"
kind = "api"
status = "verified"
verification = "docs/verification/0056-edit-move-copy.md"
depends_on = ["LIB-EDIT-010", "LIB-API-012", "LIB-COMPAT-003", "LIB-EDIT-014", "LIB-API-006"]
code = ["crates/sacm/src/edit/move_element.rs", "crates/sacm/src/model/document.rs", "crates/sacm/src/edit/batch.rs", "docs/adr/0036-moving-and-copying-elements.md"]
tests = [
  "crates/sacm/tests/batch.rs::lib_edit_017_a_batch_that_moves_an_element_away_and_back_reports_the_parent_whose_order_changed",
  "crates/sacm/tests/edit_atomic.rs::lib_edit_017_move_joins_the_set_with_every_answer",
  "crates/sacm/tests/move_element.rs::lib_edit_017_a_claim_moves_between_packages_and_within_one",
  "crates/sacm/tests/move_element.rs::lib_edit_017_with_position_puts_the_element_at_that_index",
  "crates/sacm/tests/move_element.rs::lib_edit_017_a_move_between_package_kinds_writes_the_new_role_and_reads_back_equal",
  "crates/sacm/tests/move_element.rs::lib_edit_017_a_package_moves_to_the_roots_and_back",
  "crates/sacm/tests/move_element.rs::lib_edit_017_preserved_children_keep_their_place_after_the_typed_child_they_followed",
  "crates/sacm/tests/move_element.rs::lib_edit_017_a_move_to_the_place_it_holds_changes_nothing",
  "crates/sacm/tests/move_element.rs::lib_edit_017_move_element_is_send_sync_clone_debug_eq_and_converts_into_operation",
  "crates/sacm/tests/move_element.rs::lib_edit_017_operation_name_is_move_element",
  "crates/sacm/tests/move_element.rs::lib_edit_017_a_move_keeps_ids_references_preserved_content_and_findings",
  "crates/sacm/tests/move_element.rs::lib_edit_017_refusals_come_in_order_and_change_nothing",
  "crates/sacm/tests/serde.rs::lib_edit_017_move_element_and_its_refusals_round_trip_as_their_golden_json",
  "crates/sacm/tests/move_element.rs::lib_edit_017_changed_ids_are_in_pre_order_after_the_move_when_preserved_placement_shifts",
  "crates/sacm/tests/move_element.rs::lib_edit_017_a_move_to_the_place_it_holds_after_a_delete_changes_nothing",
  "crates/sacm/tests/move_element.rs::lib_edit_017_a_root_move_keeps_the_document_content_after_the_root_it_followed",
]
acceptance = [
  "A Claim moves from one ArgumentPackage to another, appended and with `with_position(0)`, and within one package from last to first. `children()` of both parents reflect it, and `semantic_compare` reports exactly `Parent` for the Claim (between packages) or `ChildOrder` for the package (within one).",
  "A Claim moves to an ArtifactPackage and back. An ArgumentPackage moves from an AssuranceCasePackage into an ArgumentPackage, then to the roots. Each result writes and reads back `==`.",
  "Refusals, in order, each leaving the document `==` with the same revision and next ids: an unknown element (`ElementNotFound`), an unknown parent (`ParentNotFound`), a parent whose class cannot hold the kind (`InvalidParent`) or `root` of a kind that is no package (`InvalidRoot`), the element or a descendant as the parent (`ParentInSubtree`), a position past the end (`PositionOutOfRange`). An operation failing two checks gets the first.",
  "Ids, every reference to the moved subtree, its preserved content and the next generated ids are unchanged, and `validate` gives the same findings before and after a move between two ArgumentPackages.",
  "Preserved children of the old and new parent keep their place after the typed child they followed. A parent whose preserved child changes index is in `changed_ids`. A move to the place held gives empty `changed_ids` and an `==` document.",
  "Moves join LIB-EDIT-002's set. Their Mutations satisfy LIB-EDIT-003, `check`, `preview` and `apply` agree, and a batch that moves an element away and back reports the parent whose child order changed (LIB-EDIT-014 net ids).",
  "Golden JSON for `new`, `with_position` and `root`, `operation_name()` `\"MoveElement\"`, and golden samples for the three new `EditError` variants.",
]

[[row]]
id = "LIB-EDIT-018"
area = "EDIT"
milestone = "M3"
title = "Copy elements from another document"
requirement = "`CopyElements` copies elements of a source `Document`, each with everything it contains, under a parent of the target (`new`) or as roots (`root`), after the last child or root, in the order given, so an application can accept a draft built in another document (GitHub issue #61). The source elements are captured when the operation is built (`ElementNotFound` for an id the source lacks); an element listed twice, or inside another listed element, is copied once. An element keeps its id when it is an NCName free in the target (no element, part or preserved content holds it and no reference names it); otherwise it gets a generated id that avoids every id the copy keeps or names. A name, `content`, `key`, `location` or `value` keeps its `xmi:id` when it is an NCName free in the target, and is copied without one otherwise. A reference to a copied element follows its new id; every other reference is kept as written. The copy is checked as a create: the parent (`ParentNotFound`, `InvalidParent`, `InvalidRoot`), the preserved content's ids (`DuplicateId`), required ends (`TooFewReferences`), and every reference against the target and the copies (`ReferenceNotFound`, `WrongReferenceType`; a typed end never holds an id with white space, so `InvalidReference` cannot arise). An unknown parent is `ParentNotFound` even for an empty list. Everything else, preserved content included, is copied exactly. The `Mutation` lists the created ids in pre-order, the i-th being the copy of `source_ids()[i]`, and changes and deletes nothing. It works with `check`, `preview` and batches. It is the one operation serde does not serialize (ADR 0030 amendment 2)."
source = "the maintainer, 2026-11-16 (independent review; consumer needs before M4 and M5); GitHub issue #61 (accepting an AI draft); XMI 2.5.1 §7.6.1 (p. 14) \"XML semantics require the values of this attribute to be unique within an XML document; however, the value is not required to be globally unique.\"; formal/23-05-08 §8.2 (p. 18) \"gid:String[0..1] - a unique identifier that is unique within the scope of the model instance\"; D-VAL-LAYER; D-PRESERVE; ADR 0036; ADR 0030 amendment 2"
kind = "api"
status = "verified"
verification = "docs/verification/0056-edit-move-copy.md"
depends_on = ["LIB-EDIT-001", "LIB-EDIT-009", "LIB-EDIT-014", "LIB-API-012", "LIB-COMPAT-003", "LIB-API-006"]
code = ["crates/sacm/src/edit/copy.rs", "crates/sacm/src/model/document.rs", "docs/adr/0036-moving-and-copying-elements.md"]
tests = [
  "crates/sacm/tests/batch.rs::lib_edit_018_a_copy_and_an_edit_of_its_copy_commit_as_one_batch",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_a_draft_of_four_elements_is_copied_under_a_package_with_its_references",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_clashing_ids_get_generated_ids_and_internal_references_follow_them",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_a_copy_within_one_document_duplicates_the_elements",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_references_leaving_the_copy_are_kept_as_written",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_source_ids_pair_with_created_ids_in_pre_order",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_an_element_listed_twice_or_inside_another_is_copied_once",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_preserved_content_is_copied_exactly_or_refused_as_duplicate_id",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_unresolvable_references_are_refused_as_a_create_would_be",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_generated_ids_avoid_the_ids_the_copy_keeps_and_names",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_copy_elements_is_send_sync_clone_debug_eq_and_converts_into_operation",
  "crates/sacm/tests/edit_atomic.rs::lib_edit_018_copy_joins_the_set_with_every_answer",
  "crates/sacm/tests/serde.rs::lib_edit_018_copy_elements_is_neither_serialized_nor_deserialized",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_part_ids_are_kept_when_free_and_dropped_when_not",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_refusals_come_in_order_and_change_nothing",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_a_generated_id_skips_every_taken_candidate",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_a_copy_moved_to_the_place_it_holds_changes_nothing",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_a_generated_id_avoids_a_part_id_and_a_preserved_id_the_copy_keeps",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_a_preserved_id_a_reference_names_is_refused_as_duplicate_id",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_preserved_content_naming_a_dropped_part_id_is_refused_as_duplicate_id",
  "crates/sacm/tests/copy_elements.rs::lib_edit_018_a_copied_preserved_reference_is_avoided_by_later_generated_ids",
]
acceptance = [
  "An ArgumentReasoning, two Claims and an AssertedInference from one Claim to the other naming the reasoning, built in a scratch document, are copied as a list under an ArgumentPackage of the target. The target gains four elements, appended in order, with ids, names and references intact, and `validate` reports nothing new.",
  "When ids of the source exist in the target (copying a package within one document included), each copy gets a generated id and every reference inside the copy names the new ids. A reference leaving the copy is kept. `source_ids()` zipped with `created_ids()` is the mapping. A free source id is kept, and generated ids avoid it.",
  "Free part ids are kept and clashing ones dropped. Preserved content is copied exactly and its ids join the target. Preserved content that holds an id in use, or names an id the copy changes, is `DuplicateId`.",
  "Refusals, in order, each leaving the target `==` with the same revision and next ids: an id the source lacks, at construction (`ElementNotFound`); an unknown parent (also with an empty list); an illegal parent kind, or a root that is no package; `DuplicateId`; a relationship with no source or target (`TooFewReferences`); a reference naming nothing in the target, or naming an element of a kind its end does not admit.",
  "Copies join LIB-EDIT-002's set (from the document itself and from a fixed second source). Their Mutations satisfy LIB-EDIT-003, `check`, `preview` and `apply` agree, and a batch of a copy followed by a SetName of the copy commits with the net ids of `semantic_compare`.",
  "With `serde`, serializing `Operation::CopyElements`, or a `Mutation` holding one, is an `Err`, and `{\"type\":\"CopyElements\"}` does not deserialize. `operation_name()` is `\"CopyElements\"`.",
]

[[row]]
id = "LIB-API-016"
area = "API"
milestone = "M3"
title = "ReadOutput::has_errors"
requirement = "`ReadOutput::has_errors()` says whether the read reported any Error, so an application can tell a strict read's Errors (SACM-XMI-003, SACM-XMI-010, SACM-XMI-013) from a clean or warnings-only read without scanning the diagnostics. It equals `diagnostic::has_errors(output.diagnostics())`, which stays the function for any other list."
source = "the maintainer, 2026-11-16 (independent review; consumer needs before M4 and M5); docs review 0045 (moved from LIB-API-013)"
