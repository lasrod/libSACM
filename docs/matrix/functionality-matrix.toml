[[row]]
id = "SACM23-XMI-002"
area = "XMI"
milestone = "M1"
title = "Namespace-prefix independence"
requirement = "`xmi::read` matches element and attribute names by expanded name (namespace URI and local name), and resolves the QName value of `xmi:type`/`xsi:type` against the namespaces in scope on the element that carries it, so the choice of prefix never changes the result. A document that SACM23-XMI-001 reads gives the same `ReadOutput`, or the same refusal kind, code and location, whatever prefixes it uses for the SACM, XMI and XSI namespaces. This holds for a default namespace, for declarations on the wrapper or on the root, and for a prefix rebound on an inner element. A prefix confers nothing by its spelling: `xmi`, `xsi` or `sacm` bound to another URI is that other namespace. Namespace URIs compare as exact strings. `xmlns=\"\"` means no namespace, and a refusal says so. Before it is resolved, a type value is collapsed by the XSD white-space rules. An undeclared prefix in a type value, or an unprefixed value with no default namespace, is `Unsupported`, as in SACM23-XMI-001; this departs from C++ `xmi_reader.cpp:597-658` (ADR 0016 D2). A name as written (`InvalidRoot.element_name`) keeps the document's prefix."
source = "Namespaces in XML 1.0 (Third Edition): §4 \"Note that the prefix functions only as a placeholder for a namespace name.\"; §6.1 \"The expanded name corresponding to a prefixed element or attribute name has the URI to which the prefix is bound as its namespace name, and the local part as its local name.\", and the scope sentence.; §6.2 \"The namespace name for an unprefixed attribute name always has no value.\" and \"The attribute value in a default namespace declaration MAY be empty. This has the same effect, within the scope of the declaration, of there being no default namespace.\"; §2.3 \"they are identical if and only if the strings are identical\"; §6.3; XMI 2.5.1 formal/15-06-07: §7.2 (p. 5) \"The namespace URIs, not the namespace prefixes, are used to identify which schemas to use\"; rule 1h (p. 61) \"Document producers can choose their own namespace prefixes\"; Table 7.1 nsPrefix (p. 27) \"(Any legal XML prefix may be used in documents.)\"; §7.6.3 (p. 15) `type=\"xsd:QName\"`; rule 2g (p. 63); XML Schema 1.0: Part 1 §2.6 \"in practice, any prefix can be used\"; Part 1 §3.15.3 QName Interpretation, clauses 1.1, 2.2.1 and 2.2.2; Part 2 §3.2.18; Part 2 §4.3.6 \"the value of whiteSpace is collapse\"; Project decisions: D-NS-PIN; D-STRICT; ADR 0016 D2, D6.; assurance-forge: `tests/test_xmi_io.cpp:63-80`; `xmi_reader.cpp:267-350, 573-660`."
kind = "xmi"
status = "verified"
depends_on = ["SACM23-XMI-001", "LIB-SEC-005"]
acceptance = [
  "\"The same document\" means: the same `roots()` ids and kinds, parent `None`, name `None`, the same `element_count()`, and empty `diagnostics()`, compared with SACM23-XMI-001's `sacm:`/`xmi:` inputs.",
  "SACM prefix: `s:`, `ns0:`, `SACM:` and a non-ASCII prefix (`ü:`), each bound to the SACM URI, give the same document as `sacm:`, for both AssuranceCasePackage and ArgumentPackage.",
  "Default namespace: `<ArgumentPackage xmlns=\"<SACM>\" xmlns:xmi=\"<XMI>\" xmi:id=\"a\"/>`, and a wrapper `<XMI xmlns=\"<XMI>\" xmlns:s=\"<SACM>\"><s:ArgumentPackage xmlns:x=\"<XMI>\" x:id=\"a\"/></XMI>`, give the same document.",
  "XMI and XSI prefixes: each of these, with `x` bound to XMI and `i` bound to XSI, gives the same document: `x:id`, `x:version=\"2.0\"`, `x:type=\"sacm:ArgumentPackage\"`, an `x:XMI` wrapper, and `i:type=\"sacm:ArgumentPackage\"`.",
  "Declaration placement: the same document results when the SACM declaration is on the root but not on the wrapper, when the XSI or type-value prefix is declared only on the wrapper, and when two prefixes are bound to the SACM URI, one used for the element and one in `xsi:type`.",
  "Rebinding: `<p:XMI xmlns:p=\"<XMI>\"><p:ArgumentPackage xmlns:p=\"<SACM>\" xmlns:x=\"<XMI>\" x:id=\"a\"/></p:XMI>` reads one ArgumentPackage `a`. A wrapper `xmlns:t=\"urn:other\"` with a root that has `xmlns:t=\"<SACM>\" xsi:type=\"t:ArgumentPackage\"` reads, and the reverse binding is `Unsupported` at the root. A wrapper `xmlns:s=\"<SACM>\"` with a root `<s:ArgumentPackage xmlns:s=\"urn:other\" …>` is `Unsupported` at the root.",
  "Type values: `xsi:type=\"ArgumentPackage\"` under the default namespace SACM reads. `xsi:type=\" sacm:ArgumentPackage \"` reads, as does a value with a tab or newline around it. Each of these is `Unsupported` at the root: `zz:ArgumentPackage` with `zz` undeclared, an unprefixed value under `xmlns=\"\"`, `:ArgumentPackage`, `sacm:`, `a:sacm:ArgumentPackage` and `sacm:Argument Package`. Unicode white space that XSD does not collapse is not removed: a value with U+00A0 before or after it, or with U+0085 around it, is `Unsupported` at the root.",
  "Spelling confers nothing: `xmlns:xmi=\"urn:not-xmi\" xmi:id=\"a\"`, with no other id, is `Unsupported` at the root (no XMI id). `xmlns:xsi=\"urn:not-xsi\" xsi:type=\"sacm:ArgumentPackage\"` is `Unsupported` at that attribute (not read). A root in the default namespace XMI with an unprefixed `id=\"a\"` is `Unsupported` at the root (Namespaces §6.2).",
  "Exact URIs: `xmlns:sacm=\"http://www.omg.org/spec/SACM/20220301/\"` (trailing slash) and `\"HTTP://www.omg.org/spec/SACM/20220301\"` are `Unsupported` at the root.",
  "No namespace: `<ArgumentPackage xmlns=\"\" xmlns:xmi=\"<XMI>\" xmi:id=\"a\"/>` is `Unsupported` at the root, with a reason that says the element is in no namespace (not `namespace \"\"`).",
  "Duplicate expanded name: `xmlns:a=\"<XMI>\" xmlns:b=\"<XMI>\" a:id=\"p\" b:id=\"p\"` is `Malformed` (SACM-XML-001) at the second attribute (Namespaces §6.3).",
  "Refusals do not depend on the prefix: `<s:Claim xmlns:s=\"<SACM>\" …>` and `<Claim xmlns=\"<SACM>\" …>` give `InvalidRoot` (SACM-XMI-001) at line 1, column 1, with `element_name` `\"s:Claim\"` and `\"Claim\"` as written. A wrapper with `xmlns:x` bound to XMI that holds only `<x:documentation/>` gives `NoPackage`.",
]
code = ["crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi.rs", "docs/adr/0016-interchange-roots.md"]
tests = [
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_the_references_are_parentless_unnamed_roots_without_diagnostics",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_any_sacm_prefix_gives_the_same_document",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_a_default_sacm_or_xmi_namespace_gives_the_same_document",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_any_xmi_and_xsi_prefixes_give_the_same_document",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_declarations_on_the_wrapper_or_the_root_give_the_same_document",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_a_prefix_rebound_to_sacm_on_the_root_takes_the_inner_binding",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_a_prefix_rebound_away_from_sacm_on_the_root_is_unsupported_at_the_root",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_an_unprefixed_type_under_a_default_sacm_namespace_reads",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_white_space_around_a_type_value_is_collapsed_before_it_is_resolved",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_a_type_value_that_is_not_a_sacm_qname_of_the_root_class_is_unsupported_at_the_root",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_a_prefix_spelled_xmi_or_xsi_but_bound_elsewhere_confers_nothing",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_prefixes_spelled_after_another_namespace_are_that_namespace",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_namespace_uris_compare_as_exact_strings",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_a_root_under_an_empty_default_namespace_is_refused_as_in_no_namespace",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_one_attribute_under_two_prefixes_is_malformed_at_the_second",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_invalid_root_names_the_element_with_the_prefix_as_written",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_a_wrapper_with_only_xmi_content_under_any_prefix_is_no_package",
  "crates/sacm/tests/xmi_namespace_prefixes.rs::sacm23_xmi_002_unsupported_refusals_have_the_same_kind_code_and_location_under_any_prefix",
]
verification = "docs/verification/0023-m1-namespace-prefixes.md"

[[row]]
id = "SACM23-XMI-003"
area = "XMI"
milestone = "M1"
title = "Pinned strict namespace"
requirement = "`xmi::write` declares exactly `xmlns:sacm=\"http://www.omg.org/spec/SACM/20220301\"` and `xmlns:xmi=\"http://www.omg.org/spec/XMI/20131001\"`, and writes `xmi:version=\"2.0\"`, on the document element only: the bare root, or `xmi:XMI` when there are several roots. Roots and type values use the `sacm` prefix, and role elements are unprefixed (XMI rule 2a). No default namespace and no `xmlns:xsi` is declared. The reader and the writer share one constant per namespace URI. Keeping `xmi:version`, which XMI.xsd 2.5.1 does not declare, follows C++ (the maintainer's decisions of 2026-11-12 (ADR 0017))."
source = "D-NS-PIN; XMI 2.5.1 §7.5.3 (p. 10) \"identification of the XMI version is indicated by the presence of the XMI namespace declaration\", rule 1e (p. 61), rule 1h (p. 61) \"Document producers can choose their own namespace prefixes\", rule 2a and rule 2d (p. 63); formal/23-05-08 §2.2–2.5; ADR 0017; assurance-forge `metadata/namespaces.h:17-35`, `io/xmi_writer.cpp:456-462, 537-542`"
kind = "xmi"
status = "implemented"
depends_on = ["SACM23-XMI-001"]
notes = "Slice 0021 research: XMI 2.5.1 declares no `xmi:version` attribute (XMI.xsd; §7.8.3 p. 17 has no anyAttribute), so a strict export that writes `xmi:version=\"2.0\"` may not validate against the 2.5.1 schema. C++ writes it (namespaces.h:32 `kXmiVersion`, xmi_writer.cpp:461, 542). Decide keep or drop with an ADR naming that C++ decision, and check it against clause 2. Maintainer decision 2026-11-12: strict export keeps writing `xmi:version=\"2.0\"`, following C++. The ADR for this row records that strict output may then not validate against XMI.xsd 2.5.1."
acceptance = [
  "For one root and for several roots, the document element carries exactly `xmlns:sacm` and `xmlns:xmi` with the pinned URIs and `xmi:version=\"2.0\"`; no other element carries a namespace declaration or `xmi:version`.",
  "The output has no `xmlns=\"…\"`, no `xmlns:xsi` and no prefix other than `sacm` and `xmi`.",
  "A root's element name is `sacm:<Kind>` (the `ElementKind` name); child elements are unprefixed.",
  "The output for a document with 1 root and with 2 roots (AssuranceCasePackage/ArgumentPackage, nameless, no children) reads back through `xmi::read` to the same ids, kinds and order.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "docs/adr/0017-xmi-writer.md", "crates/sacm/src/xmi/namespaces.rs", "crates/sacm/src/xmi/roots.rs"]
tests = [
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_003_one_root_declares_the_pinned_namespaces_and_version_on_the_root_only",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_003_several_roots_declare_the_namespaces_and_version_on_xmi_xmi_only",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_003_no_element_but_the_document_element_declares_a_namespace_or_version",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_003_output_has_no_default_namespace_no_xsi_and_only_the_sacm_and_xmi_prefixes",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_003_roots_are_sacm_prefixed_by_kind_and_children_are_unprefixed",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_003_one_and_two_roots_read_back_to_the_same_ids_kinds_and_order",
]

[[row]]
id = "SACM23-XMI-004"
area = "XMI"
milestone = "M1"
title = "xmi:id identity"
requirement = "`xmi::write` writes every element with exactly one `xmi:id` whose value reads back equal to its `ElementId`, with markup characters and TAB, LF and CR escaped (`&amp;`, `&lt;`, `&gt;`, `&quot;`, `&#9;`, `&#10;`, `&#13;`). An id holding a character XML 1.0 cannot represent makes the write fail, and nothing is returned. Ids read from a file are written back exactly; today that means root ids, and each content row extends it. No `xmi:id` is written on a LangString or MultiLangString. An id that is not an NCName is written as it is, escaped, as C++ does. Writing takes `&Document`: it changes nothing and generates no id."
source = "XMI 2.5.1 §7.6.1 (p. 13) `<xsd:attribute name=\"id\" type=\"xsd:ID\" use=\"optional\"/>` and \"the value for xmi:id is unique across all elements within the file\", rules 2e and 2f (p. 63); D-ID; D-PRESERVE; assurance-forge `io/xmi_writer.cpp:76`"
kind = "xmi"
status = "implemented"
depends_on = ["SACM23-XMI-001"]
notes = "Slice 0021 research: no row yet owns a missing `xmi:id` (SACM-XMI-004, generated in tolerant mode). The catalog lists it as Error (strict), but the id is `use=\"optional\"` (XMI 2.5.1 §7.6.1, p. 13) and D-STRICT says strict import accepts every schema-conforming document; settle this here or in a new row. SACM23-XMI-001 refuses a missing root id as `Unsupported`. Maintainer decision 2026-11-12: strict import accepts an element with no `xmi:id` and reports it with a diagnostic (D-STRICT; the id is optional in XMI 2.5.1). This departs from C++, where SACM-XMI-004 is an Error in strict mode, so the row needs an ADR naming that decision. Slice 0025 research: the LangString `xmi:id` Info rule moves to SACM23-XMI-012 (the first row that reads a LangString); the MultiLangString wrapper rule moves to SACM23-BASE-004; the maintainer's decision on a missing `xmi:id` moves to the new SACM23-XMI-020; \"preserved through edit\" moves to the LIB-EDIT rows."
acceptance = [
  "In a document built with `insert` that covers every kind the model admits, each element's start tag has exactly one `xmi:id`, equal to `id().as_str()`.",
  "Read, write and read again of AssuranceCasePackage and ArgumentPackage roots keeps every id exactly, including ids holding `&`, `<`, `>`, `\"`, `'`, non-ASCII characters, and TAB, LF and CR.",
  "Writing a document whose id holds U+0001 or U+FFFE fails with an error naming the element, and no output is returned.",
  "Writing does not change the document (it takes `&Document`).",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "docs/adr/0017-xmi-writer.md"]
tests = [
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_every_element_of_every_kind_has_exactly_one_xmi_id_equal_to_its_id",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_read_write_read_keeps_root_ids_with_markup_line_breaks_non_ascii_and_non_ncnames",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_id_characters_are_escaped_with_the_pinned_references_and_nothing_else",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_an_id_holding_u0001_is_refused_naming_the_element_and_the_character",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_an_id_holding_ufffe_is_refused_naming_the_element_and_the_character",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_every_character_outside_xml_char_in_an_id_is_refused",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_the_xml_char_boundary_characters_in_an_id_are_written_and_read_back",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_writing_takes_a_shared_reference_and_leaves_the_document_unchanged",
]

[[row]]
id = "SACM23-XMI-006"
area = "XMI"
milestone = "M1"
title = "Type attribute where the class differs from the role's type"
requirement = "`xmi::write` writes `xmi:type=\"sacm:<Kind>\"` on a child whose class is not known from its role: under the abstract roles `argumentElement`, `artifactElement` and `terminologyElement`, and for an Interface or Binding under one of AssuranceCasePackage's four package roles. Any other child, and every root, has no type attribute. The value is `sacm:` followed by the exact `ElementKind` name. XMI's own form is used (XMI 2.5.1 §7.8.8 and rule 2g; SACM sets no `useSchemaExtensions`), not the `xsi:type` that C++ writes; this is the maintainer's decisions of 2026-11-12 (ADR 0017). Import keeps accepting both `xmi:type` and `xsi:type`, as C++ and EMF do."
source = "XMI 2.5.1 §7.6.3 (p. 15) \"The type attribute is used to specify the type of object being serialized, when the type is not known from the model\", §7.8.8 (p. 21) \"XMI specifies that inheritance will be copy-down inheritance and therefore uses xmi:type instead of xsi:type\", Table 7.1 (p. 28) useSchemaExtensions default false, production 2g (p. 62), rule 2g (p. 63) \"You may only use the XML schema instance type attribute if org.omg.xmi.useSchemaExtensions is true\"; ptc/22-03-13 (no `org.omg.xmi` tags); ADR 0017; assurance-forge `io/xmi_writer.cpp:435-439` (departed from)"
kind = "xmi"
status = "implemented"
depends_on = ["SACM23-XMI-001", "SACM23-ARG-002"]
notes = "Slice 0023 research: XMI 2.5.1 rule 2g (p. 63) \"You may only use the XML schema instance type attribute if org.omg.xmi.useSchemaExtensions is true\", and §7.8.8 (p. 21) \"uses xmi:type instead of xsi:type\". The default is `false` (Table 7.1, p. 28), and ptc/22-03-13 has no `org.omg.xmi` tags. Decide here whether the pinned export form `xsi:type=\"sacm:<Class>\"` (metamodel-inventory.md) stands, and whether strict import accepts `xsi:type` as a tolerance; it may also be a specification defect. Slice 0023 verification: C++ matches a type value's class name case-insensitively (`kind_from_class_name_ci`, `xmi_reader.cpp:2160`); this crate matches exactly. Name that departure here. Slice 0025 research: strict import requiring the type attribute (SACM-XMI-005) moves to SACM23-XMI-016, which reads containment children; tolerant inference from the element name moves to the new LIB-COMPAT-010."
acceptance = [
  "Every ArgumentationElement kind under an ArgumentPackage is written as `<argumentElement xmi:type=\"sacm:<Kind>\" …>`; likewise every ArtifactElement kind under `artifactElement` and every TerminologyElement kind under `terminologyElement`.",
  "Under each of AssuranceCasePackage's four package roles, a plain package has no type attribute, and its Interface and Binding have `xmi:type=\"sacm:<Kind>\"` (8 cases).",
  "Children of `description`, `implementationConstraint`, `note`, `taggedValue` and `property` have no type attribute, and a root never has one.",
  "The output never contains `xsi:` or `xmlns:xsi`.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "docs/adr/0017-xmi-writer.md", "crates/sacm/src/model/containment.rs"]
tests = [
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_every_argumentation_element_kind_under_an_argument_package_is_typed",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_every_artifact_element_kind_under_an_artifact_package_is_typed",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_every_terminology_element_kind_under_a_terminology_package_is_typed",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_in_the_four_package_roles_only_interfaces_and_bindings_are_typed",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_utility_property_and_root_elements_have_no_type_attribute",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_output_never_contains_xsi",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_006_every_child_has_the_role_and_type_its_parent_class_and_kind_give",
]

[[row]]
id = "SACM23-XMI-007"
area = "XMI"
milestone = "M1"
title = "Deterministic export"
requirement = "Writing the same document always produces identical bytes: UTF-8 without a BOM; the declaration `<?xml version=\"1.0\" encoding=\"UTF-8\"?>`; LF line endings; two spaces of indentation per depth; `<x … />` for an element with no children; a final LF. Attributes are in double quotes, in the order namespace declarations, `xmi:version`, `xmi:type`, `xmi:id`. Children are written in model order (ADR 0010 D2), not grouped by role as C++ does. Nothing depends on hash iteration order. The output is checked against golden files."
source = "D-RT; XMI 2.5.1 §9.5 (p. 60) \"the XML attributes may be serialized in any order\", rule 2a (p. 63); ADR 0010 D2; ADR 0017; assurance-forge `io/xmi.h:18-21`, `tests/test_roundtrip.cpp:892-925`"
kind = "xmi"
status = "implemented"
depends_on = ["SACM23-XMI-003", "SACM23-XMI-004", "SACM23-XMI-006"]
acceptance = [
  "Writing one document twice gives identical bytes, and so does writing a document and its clone.",
  "Two documents built by the same `insert` sequence, with at least 50 elements, write identical bytes.",
  "The output equals golden files byte for byte: (a) one ArgumentPackage, bare and self-closing; (b) ArgumentPackage, AssuranceCasePackage, ArgumentPackage inside `xmi:XMI`; (c) an AssuranceCasePackage with nested packages, typed and untyped children, and model order across roles.",
  "The output has no CR byte and no BOM, line 1 is the declaration, and it ends in exactly one LF.",
  "In an ArgumentPackage whose children are inserted as Note, Claim, Description, they are written in that order.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "docs/adr/0017-xmi-writer.md", "crates/sacm/src/model/containment.rs"]
tests = [
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_writing_a_document_twice_or_its_clone_gives_identical_bytes",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_two_documents_built_by_the_same_inserts_write_identical_bytes",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_one_argument_package_matches_the_single_root_golden_file",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_three_roots_match_the_several_roots_golden_file",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_a_nested_assurance_case_package_matches_the_nested_golden_file",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_output_is_lf_only_without_a_bom_starts_with_the_declaration_and_ends_in_one_lf",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_007_lines_are_indented_two_spaces_per_depth_and_childless_elements_self_close",
