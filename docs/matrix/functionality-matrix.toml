[[row]]
id = "SACM23-ARG-005"
area = "ARG"
milestone = "M2"
title = "ArgumentReasoning"
requirement = "ArgumentReasoning is represented with its optional `structure` reference to an ArgumentPackage, created, round-tripped and editable."
