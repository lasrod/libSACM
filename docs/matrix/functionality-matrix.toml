source = "Verification 0001 round 3 follow-up (surviving mutations P20, P15)"
kind = "tooling"
status = "planned"
depends_on = ["LIB-TOOL-003"]

[[row]]
id = "LIB-TOOL-009"
area = "TOOL"
milestone = "M0"
title = "Area table is validated"
requirement = "The gate rejects an `[[area]]` whose code is empty or not all uppercase ASCII letters, in addition to the existing uniqueness check."
source = "Verification 0001 round 5 follow-up"
kind = "tooling"
status = "verified"
code = ["xtask/src/matrix.rs"]
acceptance = [
  "An `[[area]]` whose `code` is empty, or contains anything other than ASCII `A`-`Z`, is reported as `area code `<code>` must be one or more uppercase ASCII letters`. Lowercase, digits, `-`, `_`, spaces and non-ASCII letters are all rejected.",
  "The uniqueness check stays, and a bad code reports both problems when both apply.",
  "Every area in the real matrix passes.",
]
depends_on = ["LIB-TOOL-001"]
tests = [
  "xtask/tests/gate_hardening.rs::lib_tool_009_rejects_area_codes_that_are_not_uppercase_ascii_letters",
  "xtask/tests/gate_hardening.rs::lib_tool_009_accepts_uppercase_ascii_area_codes",
  "xtask/tests/gate_hardening.rs::lib_tool_009_a_duplicate_bad_code_reports_both_problems",
  "xtask/tests/gate_hardening.rs::lib_tool_009_every_area_in_the_real_matrix_has_an_uppercase_ascii_code",
]
verification = "docs/verification/0004-m0-gate-hardening.md"

[[row]]
id = "LIB-TOOL-010"
area = "TOOL"
milestone = "M0"
title = "Every gate problem reaches the user"
requirement = "When `cargo xtask matrix check` fails, every problem is reported on stderr (or in the returned error), one per line, in a deterministic order, so a CI failure says what to fix."
source = "Verification 0001 round 5 follow-up (surviving mutations R30, R31)"
kind = "tooling"
status = "verified"
code = ["xtask/src/matrix.rs", "xtask/src/main.rs"]
acceptance = [
  "When `matrix check` finds problems, `xtask::run([\"matrix\", \"check\"], root, out)` returns an error. The error's first line is `functionality matrix: <n> problem(s)`, and it is followed by every problem, one per line, each indented by two spaces. No problem is printed only to stderr, and `cmd_check` no longer writes to stderr itself.",
  "Each problem takes exactly one line. A cited value containing a line break or other control character is shown escaped, so it cannot split or forge a line.",
  "The order is deterministic: the problems come in the order `check` returns them, and that order does not depend on `HashMap` iteration or directory-listing order. Orphan-test problems are sorted by file and then by function name. A test feeds a `Repo` whose traced functions come out of order.",
  "The `xtask` binary prints the whole error on stderr with the `xtask: ` prefix and exits with a failure status. A test runs the binary against a repository whose matrix has at least two problems, and checks that every problem appears on stderr.",
]
depends_on = ["LIB-TOOL-001"]
tests = [
  "xtask/tests/gate_hardening.rs::lib_tool_010_run_matrix_check_returns_every_problem_in_its_error",
  "xtask/tests/gate_hardening.rs::lib_tool_010_each_problem_is_on_its_own_line_exactly_once",
  "xtask/tests/gate_hardening.rs::lib_tool_010_a_control_character_in_a_value_cannot_split_or_forge_a_line",
  "xtask/tests/gate_hardening.rs::lib_tool_010_orphan_problems_are_sorted_by_file_then_function",
  "xtask/tests/gate_hardening.rs::lib_tool_010_the_report_does_not_depend_on_listing_order",
  "xtask/tests/gate_hardening.rs::lib_tool_010_binary_prints_every_problem_on_stderr_and_fails",
]
verification = "docs/verification/0004-m0-gate-hardening.md"

[[row]]
id = "LIB-TOOL-011"
area = "TOOL"
milestone = "M0"
title = "Test scanner recognises tests and non-code precisely"
requirement = "The traced-test scanner ignores test-like text inside multi-line raw strings, block comments and Python triple-quoted strings; does not count `#[ignore]`d or skipped tests as evidence; and recognises `#[test_case(...)]`-style attributes and Python `async def test_` methods as tests."
source = "Verification 0001 round 2 Low and round-6 prescription (R63; different-class notes)"
kind = "tooling"
status = "planned"
