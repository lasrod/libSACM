[[row]]
id = "LIB-API-002"
area = "API"
milestone = "M1"
title = "Document, ElementId and typed navigation"
requirement = "A `Document` owns one root interchange package and all elements under it; elements are identified by an `ElementId` newtype; users navigate by typed views (look up by id, iterate children by kind) without access to internal storage; `Document` and its views are `Send + Sync` and `Debug`."
source = "docs/architecture.md (Model); D-ID"
kind = "api"
status = "planned"

[[row]]
id = "LIB-API-003"
area = "API"
milestone = "M1"
title = "Element kind metadata"
requirement = "A public, non-exhaustive `ElementKind` enumerates every concrete SACM 2.3 class, reports its SACM class name and package, and answers is-a questions against the abstract superclasses (ModelElement, ArtifactElement, ArgumentAsset, Assertion, AssertedRelationship, ...)."
source = "ptc/22-03-13 (all packages); docs/sacm/metamodel-inventory.md"
kind = "api"
status = "planned"

[[row]]
id = "LIB-API-004"
area = "API"
milestone = "M1"
title = "Error types"
requirement = "Operational failures (I/O, unreadable XML, rejected edits) are reported through documented, non-exhaustive error enums implementing `std::error::Error` with source chains; no public function panics on any input."
