[[row]]
id = "SACM23-ART-010"
area = "ART"
milestone = "M3"
title = "ArtifactAssetRelationship"
requirement = "ArtifactAssetRelationship (§12.14; its name and superclass ArtifactAsset follow the text, D-TEXT-MODEL) is read and written typed in an ArtifactPackage's `artifactElement`, with its Base features, its `property` children (SACM23-ART-003) and the reference ends `source : ArtifactAsset [1..*]` and `target : ArtifactAsset [1..*]`, held as `ReferenceEnd::ArtifactSource` and `ReferenceEnd::ArtifactTarget`: XMI names `source` and `target`, serde names `artifactSource` and `artifactTarget`, because `Source` and `Target` are an AssertedRelationship's ends (the maintainer's M3 decision 5). `SacmElement::sources()` and the new `targets()` answer for it and for every AssertedRelationship; `target()` stays the AssertedRelationship's. Each end follows SACM23-XMI-005/015 (serialization), SACM23-VAL-003/004/022 (dangling, typing to ArtifactAsset, repeats; clause `12.14`) and LIB-EDIT-009 (edits; each end keeps at least one id). `validation::validate` reports a relationship with no `source`, and one with no `target`, as one SACM-MULT-001 Error per missing end, because the text and the model agree on `[1..*]` (D-SEV). `edit::CreateArtifactAssetRelationship::new(parent, name, sources, targets)` creates one. Under LIB-EDIT-005, `DeleteReferencingRelationships` deletes a relationship whose `source` or `target` names a deleted element, and `ScrubReferences` deletes one left with no `source` or no `target` (decision 7). `semantic_compare` reports `Difference::ArtifactSources` and `Difference::ArtifactTargets`."
source = "formal/23-05-08 §12.14 (pp. 49-50) \"ArtifactAssetRelationship enables the ArtifactAssets of a structured assurance case to be linked together.\", \"Superclass ArtifactAsset\", \"source:ArtifactAsset[1..*] - the source of the ArtifactAssetRelationship\", \"target:ArtifactAsset[1..*] - the target of the ArtifactAssetRelationship\"; §12.6 (p. 47) \"property:Property[0..*] (composition)\"; ptc/22-03-13 Artifact::ArtifactAssertedRelationship (`source` and `target` typed ArtifactAsset, upperValue `*`, no lowerValue; no generalization); D-TEXT-MODEL (name and generalization); D-SEV; D-ORDER; D-POLICY; the maintainer's M3 decisions 5 and 7 (2026-11-15); ADR 0026; ADR 0028; ADR 0034 amendment 2"
kind = "model"
status = "verified"
verification = "docs/verification/0057-artifact-relationships.md"
depends_on = ["SACM23-ART-003", "SACM23-ART-004", "SACM23-XMI-015", "SACM23-VAL-003", "SACM23-VAL-004", "SACM23-VAL-022", "LIB-EDIT-009", "LIB-EDIT-005", "LIB-API-015"]
notes = "Slice 0062: reworded for the Terminology kinds; re-check there."
code = ["crates/sacm/src/model/reference.rs", "crates/sacm/src/model/document.rs", "crates/sacm/src/edit/artifact.rs", "crates/sacm/src/edit/delete.rs", "crates/sacm/src/compare.rs", "crates/sacm/src/validation/relationships.rs", "crates/sacm/src/xmi.rs", "docs/adr/0034-artifact-packages-assets-and-groups.md"]
