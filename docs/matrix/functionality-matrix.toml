[[row]]
id = "LIB-TOOL-003"
area = "TOOL"
milestone = "M0"
title = "Agent write scopes are enforced by a hook"
requirement = "A Claude Code PreToolUse hook refuses Write/Edit/MultiEdit/NotebookEdit calls from project subagents outside their declared scope (read-only roles cannot write; the builder writes tests, production code and docs, but not the matrix, verification records or ADRs; ADR 0006 amendment 5), never restricts the main session, and fails closed for subagents when its configuration is unreadable."
source = "ADR 0006"
kind = "tooling"
status = "verified"
acceptance = [
  "Main-session writes and non-write tools pass through.",
  "Read-only roles are denied every write.",
  "Scoped roles are allowed inside and denied outside their globs, with deny taking precedence.",
  "Paths outside the repository and `..` escapes are denied.",
  "Unreadable configuration denies subagent writes only.",
  "Every agent named in write-scopes.json has a definition in .claude/agents/.",
  "Live probe (verification evidence): the hook denies a scoped role's out-of-scope Write, which also confirms the hook input carries `agent_type`; a read-only role, run as a background subagent, has no write tool (first control, ADR 0006 amendment 1).",
  "The repository's real write-scopes.json gives every role the scope ADR 0006 states: the three read-only roles (designer, verifier, matrix steward) are denied everywhere; the builder cannot write the guard, its scopes or settings, the matrix, verification records or ADRs; every agent definition is listed.",
  "Any internal error, or a structurally invalid configuration, denies subagent writes (fail closed); the settings matcher covers every write tool.",
]
code = [".claude/hooks/agent_write_guard.py", ".claude/hooks/write-scopes.json", ".claude/settings.json"]
tests = [
  ".claude/hooks/test_agent_write_guard.py::test_lib_tool_003_main_session_is_never_restricted",
  ".claude/hooks/test_agent_write_guard.py::test_lib_tool_003_read_only_roles_cannot_write_anywhere",
