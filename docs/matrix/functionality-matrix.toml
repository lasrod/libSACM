[[row]]
id = "LIB-COMPAT-003"
area = "COMPAT"
milestone = "M2"
title = "Unknown content is preserved, not dropped"
requirement = "`xmi::read` keeps, in both modes, every attribute, child element (with its subtree) and non-white-space text that the SACM XML Schema and the XMI 2.5.1 production rules do not allow where it stands and that no row reads as a tolerance, as preserved content of the element it sits in (ADR 0033). Each gives one SACM-XMI-003 (`Code::XMI_UNKNOWN_CONTENT`; Warning tolerant, Error strict) at it, affecting that element. Nothing inside a preserved subtree is read or reported, but its `xmi:id`s are checked (an empty one is SACM-ID-002 in tolerant mode). Preserved content keeps its position (a child at its index among the element's children; attributes after the typed ones, in input order) and its namespace URIs, local names, prefixes and values exactly. A tolerant `xmi::write` writes it back, so load → save → load gives an equal `Document` and a re-write is byte-identical; a strict write refuses it (SACM23-XMI-008). `==` and `semantic_compare` compare it exactly and in order (`Difference::PreservedContent`). Its ids stay in the document's id space; a typed reference to one is SACM-REF-003. Deleting a holder removes its preserved content. Conforming content this version does not read yet is refused by a strict read and kept by a tolerant read with SACM-XMI-014 (LIB-API-011, ADR 0035). A document also holds preserved content outside its elements: wrapper attributes, unread roots, XMI-namespace wrapper children and text, placed among the roots, moved by root creates, deletes and reorders, and exposed by `Document::has_preserved_content` and `Difference::DocumentPreservedContent` (ADR 0035 D3). A preserved attribute whose prefix binds `sacm` or `xmi` to another URI is a strict refusal; a tolerant read keeps it, with its prefix replaced by the first `nsN` unbound at the holder. Known gap: a prefix used only inside a preserved attribute's value (a QName such as `v:ref=\"u:thing\"`) is not declared on write, so its binding is lost on a tolerant save (LIB-COMPAT-013)."
source = "ADR 0033 (the maintainer, 2026-11-14 and 2026-11-15); D-PRESERVE; D-STRICT; ADR 0022; XMI 2.5.1 §7.3.3 (p. 7) \"Tools that rely on XMI are expected to store the extension information and export it again to enable round trip engineering\"; §2.3.1 (p. 2) \"preserve the extensions of other tools that fall within the XMI namespace\"; §7.8.3 (p. 17) the class complexType (xmi:Extension, xmi:id, ObjectAttribs; no anyAttribute); XML 1.0 §3.1 \"the order of attribute specifications … is not significant\"; formal/23-05-08 §8.12 (p. 21); assurance-forge 65577b3 `model/element.h`, `compat/preserve.h`, `io/xmi_reader.cpp`, `io/xmi_writer.cpp`, `compare/semantic_compare.cpp`"
kind = "xmi"
status = "verified"
verification = "docs/verification/0053-simplification.md"
depends_on = ["LIB-COMPAT-001", "SACM23-XMI-016", "LIB-COMPAT-007", "LIB-API-010", "LIB-RT-001", "LIB-EDIT-005", "SACM23-VAL-004", "SACM23-XMI-002"]
notes = "Maintainer decisions 2026-11-14 (strict keeps with an Error) and 2026-11-15 (only non-conforming content; a preserved child element counts for RejectIfNonEmpty; a root type naming another class is preserved; a discard edit is LIB-EDIT-016, M6). The design and worked example are in ADR 0033 and the slice 0050 brief. Slice 0062: reworded for the Terminology kinds; re-check there."
acceptance = [
  "A tolerant write never emits an attribute twice: an edit that leaves a reference end non-empty (SetReferences, AddReference, RemoveReference) replaces a preserved attribute of the end's name on that element and reports it changed, and a typed end read beside a preserved attribute of its name is written in the element form; output reads back equal (lead decisions, slice 0050 verification).",
  "The ADR 0033 worked fixture (classes 1-5, A3 and A5 in one ArgumentPackage) reads in both modes with exactly eight SACM-XMI-003 at the stated locations, affecting the stated holders (Warning tolerant, Error strict, same document): `get(\"a1\")` is None, c2 has no `name()` and no `abstract_form()`, and `validate` gives SACM-MULT-001 on c2 and SACM-REF-003 `[c3, a1]` and no REF-001.",
  "Its tolerant write is exactly the expected text (each holder or fragment declaring the bindings it needs), `read(out) == read(in)`, `semantic_compare` is empty, and `write(read(out)) == out` byte for byte.",
  "Each class alone, on a root, on a UtilityElement and inside `content`/`key`/`value`, differs from the same input without the construct only by `[PreservedContent { holder }]`; a root `<sacm:ArgumentPackage xmi:type=\"sacm:Claim\">` reads as an ArgumentPackage with the type preserved, SACM-XMI-003 and no SACM-XMI-010.",
  "Position: a preserved child between typed children a and b is written between them, one before `name` is written after it, one after all children before the end tag; `ReorderElements` keeps its index, deleting an earlier child shifts it down, a create appends after it.",
  "Values, text and namespaces survive exactly: TAB, LF, CR, `<`, `&`, `\"` and non-ASCII characters; a prefix declared on an ancestor, `sacm` rebound in a fragment, a default namespace; the output is namespace-well-formed and `sacm`/`xmi` are declared only on the document element.",
  "Ids: a preserved `xmi:id` repeating a typed one is `DuplicateId` naming both; an empty one is `InvalidId` in strict mode, and in tolerant mode is kept verbatim, outside the id space, with a SACM-ID-002 Warning affecting the holder; generated ids skip preserved ids and preserved idrefs; `with_id` of a preserved id is `EditError::DuplicateId`; a reference to one is `ReferenceNotFound`.",
  "Delete: a Claim holding one preserved element is `NotEmpty { contained: 1 }` (attributes or text alone give 0); deleting the holder of a referenced preserved id is `Referenced`, is listed in `preview().dangling_references()`, and is scrubbed under `ScrubReferences`; afterwards `with_id` of the freed id succeeds.",
  "A part preserved because it does not conform is never a `RepeatedValue` occurrence; one a tolerant read keeps for a bad literal counts as the property's occurrence (SACM23-VAL-006). In strict mode, content on `xmi:XMI` and a preserved attribute binding `sacm`/`xmi` to another URI are `Unsupported` labelled `(a defect in the input)`; a tolerant read keeps them with SACM-XMI-003, as document-level content and with an `nsN` prefix.",
  "`SacmElement::has_preserved_content` is true exactly for holders; `Difference::PreservedContent` is reported once for a changed prefix, attribute order, value or index; a 10,000-deep fragment reads, clones, compares, writes and drops without overflowing the stack.",
  "The catalog rows SACM-XMI-003 and SACM-REF-003 are updated and name `Code::XMI_UNKNOWN_CONTENT` and `Code::REF_PRESERVED_TARGET`; tests that used non-conforming content as an `Unsupported` sample use conforming-but-unread content instead.",
  "Tolerant mode: an attribute and text on `xmi:XMI` and a `<xmi:Documentation>` beside the roots are kept as document-level preserved content in place, with one Warning each, and written back; a bare unread root (`<sacm:TerminologyPackageInterface>`) reads as a document with no element and writes back wrapped; creating, deleting and reordering roots keep that content's positions; it is one `Difference::DocumentPreservedContent`. Deleting every root beside document-level content that holds no unread root is `WriteError::NoRoot` in both modes; the document holds ids of its document-level content (the wrapper's `xmi:id` too, an empty one being SACM-ID-002), so a create or a read that repeats one is `DuplicateId`, also after a delete.",
]
