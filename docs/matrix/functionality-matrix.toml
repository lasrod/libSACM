[[row]]
id = "LIB-API-008"
area = "API"
milestone = "M1"
title = "Containment legality"
requirement = "The model knows, for every (parent kind, child kind) pair, whether a SACM 2.3 composite role of the parent's class admits the child, per ptc/22-03-13 with the inventory's recorded divergences. The roles are ModelElement `description`, `implementationConstraint`, `note` and `taggedValue`; AssuranceCasePackage `assuranceCasePackage`, `argumentPackage`, `artifactPackage` and `terminologyPackage`; ArgumentPackage `argumentElement`; TerminologyPackage `terminologyElement`; ArtifactPackage `artifactElement`; and ArtifactAsset `property`. Subclasses inherit roles, package interfaces and bindings included. Every insertion refuses a child whose kind no role of the parent's class admits, and leaves the document unchanged; this binds the crate-internal insertion that the XMI reader and edit operations will use, and the test-support `insert`. ArtifactPackage `artifactElement` admits every ArtifactElement kind, as the metamodel types it (ADR 0014). A root must be a package kind (`ElementKind::is_package`: the four packages, their interfaces and bindings; ADR 0010 D1 \"of any package kind\"); any other root is refused with `InsertError::RootNotAllowed`, as C++ refuses it (`io/xmi_reader.cpp` read_root, `is_package_kind`, `kXmiInvalidRoot`). Multiplicity is not enforced on insertion (D-VAL-LAYER, D-DESC-MULT). Which role a child fills, role names and multiplicities become observable with SACM23-XMI-016."
source = "docs/sacm/decisions.md D-VAL-LAYER: \"**Structural** invariants (ids unique, references resolve, containment legal, multiplicities of required ends) hold after every successful mutation.\"; ptc/22-03-13 ownedAttribute aggregation=\"composite\" (12 element-typed ends, all 0..*); formal/23-05-08 §8.6 \"implementationConstraint: ImplementationConstraint [0..*] (composition)\", \"note:Note[0..*] (composition)\", \"taggedValue: TaggedValue [0..*] (composition)\", \"description: Description[0..1] (composition)\" (D-DESC-MULT); §9.2 (four sub-package compositions); §10.4 \"TerminologyElement:TerminologyElement[0..*] (composition)\" (spec defect D9); §11.4 \"argumentationElement:ArgumentationElement[0..*] (composition)\"; §12.2 \"artifactElement:Base::ArtifactElement[0..*] (composition)\"; §12.6 \"property:Property[0..*] (composition)\"; §12.14 ArtifactAssetRelationship \"Superclass ArtifactAsset\" (D-TEXT-MODEL); ADR 0010 D1/D2; ADR 0014; assurance-forge libs/sacm io/xmi_reader.cpp attach_child, io/name_tables.cpp"
kind = "api"
status = "verified"
verification = "docs/verification/0017-m1-assurance-case-package.md"
depends_on = ["LIB-API-002", "LIB-API-003", "LIB-API-004"]
acceptance = [
  "Exhaustive table test: for every (parent kind, child kind) pair of the 38 kinds, `insert(Some(parent), child, ..)` succeeds for exactly the 339 legal pairs of the containment table and is refused for the other 1,105. The test spells out the table itself rather than calling `is_a`.",
  "Every containment refusal leaves the document unchanged (`element_count`, `contains`, `elements()`, `roots()`, the parent's `children()`) and returns `InsertError::ContainmentNotAllowed { id, kind, parent, parent_kind }`, whose `Display` follows the LIB-API-004 rules, e.g. `element \"c1\" of kind Claim cannot be contained in element \"case\" of kind AssuranceCasePackage`.",
  "Precedence: EmptyId, DuplicateId, UnknownParent and NameNotAllowed are each still returned when they apply to an illegal pair or an illegal root; the containment or root refusal is reported only when all four pass.",
  "Roots: `insert(None, k, ..)` succeeds for exactly the 12 package kinds (the four packages, their interfaces and bindings) and returns `InsertError::RootNotAllowed(id, kind)` for the other 26, Note and Claim included, leaving the document unchanged; its `Display` follows the LIB-API-004 rules, e.g. `element \"c1\" of kind Claim cannot be a root`.",
  "The four UtilityElement kinds are accepted under each of the 34 ModelElement kinds; every kind is refused under a UtilityElement parent, UtilityElements included.",
  "ArtifactPackage, ArtifactPackageInterface and ArtifactPackageBinding accept all 34 ModelElement kinds, an AssuranceCasePackage, an ArgumentPackage, a Claim and a Term included (§12.2; ADR 0014).",
  "Inheritance: interfaces and bindings hold their package's roles (an AssuranceCasePackageBinding accepts a TerminologyPackage; an ArgumentPackageInterface accepts a Claim); ArtifactAssetRelationship and Property accept Property (§12.14 via D-TEXT-MODEL; §12.6); ArgumentGroup, ArtifactGroup and TerminologyGroup accept only UtilityElements, because their member ends are references; TerminologyPackage accepts TerminologyGroup (§10.4 declared type; spec defect D9).",
  "Multiplicity is not enforced on insert: a second and a third Description under one Claim are accepted (D-DESC-MULT; SACM23-VAL-011 warns), and any number of children of any role is accepted.",
  "Drift test: under every concrete class, `insert` admits exactly the kinds that the element-typed roles of the inventory's \"Concrete class -> containment roles\" table admit (a concrete type by `is_kind_of`, an abstract one by `is_a`); the value-typed roles (`name`, `value`, `key`, `content`, `location`) are excluded and listed as such. Role names become observable with SACM23-XMI-016 and are checked there.",
]
code = ["crates/sacm/src/model/containment.rs", "crates/sacm/src/model/document.rs"]
tests = [
  "crates/sacm/tests/containment.rs::lib_api_008_a_second_and_third_description_under_one_claim_are_accepted",
  "crates/sacm/tests/containment.rs::lib_api_008_any_number_of_children_of_any_role_is_accepted",
  "crates/sacm/tests/containment.rs::lib_api_008_artifact_asset_relationship_and_property_accept_property",
  "crates/sacm/tests/containment.rs::lib_api_008_artifact_packages_accept_every_model_element_kind",
  "crates/sacm/tests/containment.rs::lib_api_008_containment_not_allowed_display_is_exact",
  "crates/sacm/tests/containment.rs::lib_api_008_containment_not_allowed_display_quotes_both_ids_on_one_line",
  "crates/sacm/tests/containment.rs::lib_api_008_containment_refusal_leaves_the_document_unchanged",
  "crates/sacm/tests/containment.rs::lib_api_008_earlier_refusals_take_precedence_over_containment",
  "crates/sacm/tests/containment.rs::lib_api_008_earlier_refusals_take_precedence_over_root_not_allowed",
  "crates/sacm/tests/containment.rs::lib_api_008_exactly_the_12_package_kinds_are_accepted_as_roots",
  "crates/sacm/tests/containment.rs::lib_api_008_groups_accept_only_utility_elements",
  "crates/sacm/tests/containment.rs::lib_api_008_insert_admits_exactly_the_339_legal_pairs_of_the_table",
  "crates/sacm/tests/containment.rs::lib_api_008_insert_admits_exactly_what_the_inventory_roles_admit",
  "crates/sacm/tests/containment.rs::lib_api_008_inventory_containment_table_parses_into_every_kind",
  "crates/sacm/tests/containment.rs::lib_api_008_package_interfaces_and_bindings_hold_their_package_roles",
  "crates/sacm/tests/containment.rs::lib_api_008_root_not_allowed_display_is_exact",
  "crates/sacm/tests/containment.rs::lib_api_008_root_not_allowed_display_quotes_the_id_on_one_line",
  "crates/sacm/tests/containment.rs::lib_api_008_root_refusal_leaves_the_document_unchanged",
  "crates/sacm/tests/containment.rs::lib_api_008_terminology_package_accepts_terminology_group",
  "crates/sacm/tests/containment.rs::lib_api_008_the_spelled_out_table_has_339_of_1444_pairs",
  "crates/sacm/tests/containment.rs::lib_api_008_utility_elements_go_under_every_model_element_and_contain_nothing",
]

[[row]]
id = "SACM23-XMI-016"
area = "XMI"
milestone = "M2"
title = "Containment children conform to their role"
requirement = "Every containment child is written under the role element of the one role that admits it (LIB-API-008), checked for all 339 legal (parent, child) pairs and each role's name against the inventory, with the type attribute (`xmi:type`) as SACM23-XMI-006 requires, and is read back into the same kind, parent and order. On import, a child whose class does not conform to its role element's declared type (e.g. `<assuranceCasePackage xsi:type=\"sacm:ArgumentPackage\">`), or that no role of its parent admits, is an error in strict mode and is kept as preserved content with a warning in tolerant mode (D-PRESERVE); it is never re-roled or dropped."
source = "formal/23-05-08 §9.2, §10.4, §11.4, §12.2, §12.6; ptc/22-03-13 composite ends; XMI 2.5.1 type rules (quoted when analysed, LIB-TOOL-020); D-PRESERVE; D-STRICT; slice 0017 research (assurance-forge io/xmi_reader.cpp attach_child places a child by kind, not by role element, and drops one no role admits)"
kind = "xmi"
status = "planned"
depends_on = ["LIB-API-008", "SACM23-XMI-006", "SACM23-XMI-010", "LIB-TOOL-020"]
notes = "Slice 0025: owns strict import requiring the type attribute on an abstract-role child (SACM-XMI-005), moved from SACM23-XMI-006. Export writes `xmi:type` (ADR 0017); import accepts `xmi:type` and `xsi:type`."

[[row]]
id = "SACM23-XMI-017"
area = "XMI"
milestone = "M2"
title = "assertionDeclaration in XMI"
requirement = "On every Assertion kind, import reads the attribute form of each of the six AssertionDeclaration literals. An absent `assertionDeclaration` reads as `asserted`; an explicit `assertionDeclaration=\"asserted\"` is accepted in both modes without a diagnostic and loads equal to the omitted form. Export omits the attribute when the value is `asserted` and otherwise writes the exact literal spelling. All six literals round-trip on a Claim."
source = "formal/23-05-08 §11.10 \"assertionDeclaration:AssertionDeclaration[1] = asserted\"; XMI 2.5.1 §9.4.1 \"Properties whose values are the default values are not serialized\" and §7.8.4 \"the XML Schema will never contain default values for Properties\" (quoted when analysed, LIB-TOOL-020); assurance-forge libs/sacm io/xmi_writer.cpp:95-98, io/xmi_reader.cpp:1759-1795"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-001", "SACM23-ARG-002", "SACM23-XMI-016", "LIB-TOOL-020"]

[[row]]
id = "SACM23-VAL-019"
area = "VAL"
milestone = "M2"
title = "asCited declarations are citations"
requirement = "An Assertion declared `asCited` that is not a citation (`isCitation` not true), or whose `citedElement` is not an Assertion, is reported as a warning naming the element (§11.8 \"should\", D-SEV). The element is kept."
source = "formal/23-05-08 §11.8: \"asCited - a flag indicating that because the Assertion is cited, the AssertionDeclaration should be transitively derived from the value of the AssertionDeclaration of the cited Assertion.\"; D-SEV; slice 0018 research (assurance-forge has no such check)"
kind = "validation"
status = "planned"
depends_on = ["SACM23-ARG-002", "SACM23-BASE-007"]

[[row]]
id = "LIB-API-009"
area = "API"
milestone = "M1"
title = "The reader refuses what it cannot represent"
requirement = "`xmi::read` never returns a document that is missing content from its input (D-PRESERVE). Well-formed input that it cannot fully represent is refused with `ReadError::Unsupported`, which has no catalog code and carries a reason and a location: content that no verified row reads yet (SACM23-XMI-001 reads the first package roots), UTF-16 without a byte order mark, UTF-32 or UCS-4 input, and a declared encoding other than UTF-8 or ASCII in input without a UTF-16 byte order mark (SACM23-XMI-018 reads UTF-16 with one). A declared UTF-8 or ASCII encoding is accepted in any letter case; a byte of 0x80 or above under an ASCII declaration is malformed (SACM-XML-001). Parser capacity limits belong to LIB-SEC-003."
source = "D-PRESERVE \"Never drop conforming SACM data. Preserve with a diagnostic, or refuse\"; ADR 0015 (interim rule); ADR 0005 B2; XML 1.0 (Fifth Edition) §4.3.3 (encodings; quoted when SACM23-XMI-018 is analysed)"
kind = "api"
status = "verified"
verification = "docs/verification/0024-m1-utf16-input.md"
depends_on = ["LIB-API-004", "LIB-DIAG-001"]
acceptance = [
  "Well-formed SACM input the reader cannot represent yet (e.g. an `AssuranceCasePackage` root with a `name` child, or an `ArtifactPackage` root) is refused with `ReadError::Unsupported`, `code()` `None`, located at the construct it cannot read; no partial document is returned. Which roots are recognised at all is SACM23-XMI-001.",
  "UTF-32 BOMs, and BOM-less UTF-16 or UCS-4 input recognised by its first bytes (XML 1.0 Appendix F: `3C 00 3F 00`, `00 3C 00 3F` and the four-byte forms), such as a document declaring `UTF-16LE`, are refused with `Unsupported`, never `Malformed` and never misread; the reason does not claim a BOM that is not there. Every BOM and first-bytes refusal is located at line 1, column 1. UTF-16 with a byte order mark is read by SACM23-XMI-018.",
  "A declared `encoding=\"ISO-8859-1\"` (and another non-UTF-8 name) is refused with `Unsupported` located at the encoding name (`<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>` at line 1, column 31; with a CR before `encoding`, at line 2), whether or not its bytes are valid UTF-8: a real ISO-8859-1 file with a 0xE9 byte is `Unsupported`, not `Malformed`, because the declaration is read before the UTF-8 check (ADR 0005 B2). Declarations of `UTF-8`, `utf-8`, `Utf-8`, `US-ASCII`, `us-ascii`, `ASCII` and `ascii` are not refused for their encoding: a readable root under each reads `Ok`, and an unreadable one is refused at the root start tag. A non-ASCII character under an ASCII declaration is `Malformed` at that character (`<?xml version=\"1.0\" encoding=\"US-ASCII\"?>\\n<r>café</r>` at line 2, column 7).",
  "The `Unsupported` `Display` is one lowercase line without trailing punctuation, naming the location when known; names from the input are quoted.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/input.rs"]
tests = [
  "crates/sacm/tests/xmi_read.rs::lib_api_009_well_formed_sacm_document_is_unsupported_at_the_construct_it_cannot_read",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_well_formed_non_sacm_document_is_unsupported_at_its_root",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_utf32_input_with_a_bom_is_unsupported",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_utf16_and_ucs4_without_bom_are_unsupported_by_their_first_bytes",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_declared_non_utf8_encoding_is_unsupported",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_utf8_and_ascii_declarations_in_any_case_are_not_refused",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_non_ascii_byte_under_ascii_declaration_is_malformed",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_utf8_and_ascii_declarations_in_any_case_are_refused_at_the_root_not_the_encoding",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_declared_non_utf8_encoding_is_located_at_the_encoding_name",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_bom_and_first_bytes_refusals_are_located_at_line_1_column_1",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_declared_non_utf8_encoding_with_invalid_utf8_bytes_is_unsupported",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_invalid_utf8_without_or_under_a_utf8_or_ascii_declaration_stays_malformed",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_unsupported_display_is_one_located_line_quoting_names",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_refusal_of_an_encoding_name_with_line_breaks_stays_one_line",
]
notes = "Item 1 and item 3 reworded in slice 0021, when SACM23-XMI-001 made the first inputs readable; re-checked there. Reworded and re-checked in slice 0024: UTF-16 moves to SACM23-XMI-018, so item 2 and the requirement no longer list UTF-16 with a byte order mark."

