id = "LIB-DIAG-001"
area = "DIAG"
milestone = "M1"
title = "Structured diagnostics"
requirement = "A `Diagnostic` carries a stable code, a severity (info, warning, error), the matrix row and clause it enforces, the affected element ids, an optional source location (line, column) and a message. Diagnostics have one total, documented order, every function returning them returns them sorted, and they implement `Display` (ADR 0011)."
source = "D-DIAG; D-SEV; docs/sacm/diagnostics.md; ADR 0011; assurance-forge libs/sacm validation/diagnostic.h, validation/codes.h"
kind = "api"
status = "verified"
verification = "docs/verification/0014-m1-errors-diagnostics-round2.md"
acceptance = [
  "Each accessor returns exactly what the diagnostic was built with: `code`, `severity`, `requirement_id`, `clause` (Some and None), `affected`, `location` (Some and None), `message`.",
  "`affected()` keeps the given order and duplicates.",
  "`Severity` is exactly Info < Warning < Error. `as_str` and `Display` give `info`, `warning` and `error`.",
  "`Code::as_str` and `Display` return the text unchanged. `Code`'s associated constants are exactly the catalog codes whose rows emit them (none in slice 0014; `XML_MALFORMED` and `XML_DOCTYPE_REJECTED` since slice 0019, proven by LIB-SEC-002 and LIB-SEC-001).",
  "`SourceLocation::new` returns None when the line or the column is 0. `line()` and `column()` round-trip, `Display` is `line L, column C`, and the order is by line, then column.",
  "`Diagnostic`'s `Display` matches the ADR 0011 format exactly, with or without a clause and with or without a location.",
  "Sorting any permutation of diagnostics that each differ in one key field gives the ADR 0011 key order. Located diagnostics come first. `a.cmp(&b) == Equal` exactly when `a == b`.",
  "`Diagnostic` is `Clone + Debug + Eq + Hash + Ord + Send + Sync + 'static`. `Severity`, `Code` and `SourceLocation` are also `Copy`.",
  "Without `test-support`, users cannot build a `Diagnostic`, `Code` or `SourceLocation`. The module example compiles without the feature.",
]
