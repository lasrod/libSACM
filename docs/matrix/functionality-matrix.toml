[[row]]
id = "LIB-QA-001"
area = "QA"
milestone = "M0"
title = "CI runs every quality gate on three platforms"
requirement = "Every push and pull request runs rustfmt, clippy (all targets, all features, -D warnings), the workspace and xtask tests on Linux, Windows and macOS, rustdoc with -D warnings, cargo-deny, the agent-hook tests and `cargo xtask matrix check`; any failure fails the build."
source = "Project policy (ADR 0002, ADR 0004)"
kind = "quality"
status = "implemented"
acceptance = [
  "ci.yml defines a job for each gate and the test job runs on ubuntu, windows and macos.",
  "A regression test fails if any gate command is removed from ci.yml.",
  "The workflow has run green on GitHub for the main branch (verification evidence: run URL).",
]
code = [".github/workflows/ci.yml"]
tests = ["xtask/src/repo_checks.rs::lib_qa_001_ci_runs_every_gate"]

[[row]]
id = "LIB-QA-002"
area = "QA"
milestone = "M0"
title = "MSRV 1.85 is declared consistently and checked"
requirement = "The minimum supported Rust version is declared once in the workspace manifest, matches clippy.toml, and CI builds and tests the library and CLI with exactly that toolchain."
source = "ADR 0007"
kind = "quality"
status = "implemented"
depends_on = ["LIB-QA-001"]
acceptance = [
  "Cargo.toml rust-version, clippy.toml msrv and the CI msrv toolchain are the same version (regression test).",
  "`cargo +1.85 test -p sacm -p sacm-cli` passes locally and in CI.",
]
code = ["Cargo.toml", "clippy.toml", ".github/workflows/ci.yml"]
tests = ["xtask/src/repo_checks.rs::lib_qa_002_msrv_is_consistent"]

[[row]]
id = "LIB-QA-003"
area = "QA"
milestone = "M0"
title = "Dependency licences, advisories and sources are policed"
requirement = "cargo-deny checks that every dependency has a licence compatible with distributing an MIT library, has no known security advisory, is not yanked, and comes from crates.io; CI runs it."
source = "Project policy (public MIT library)"
kind = "quality"
status = "implemented"
depends_on = ["LIB-QA-001"]
acceptance = [
  "deny.toml allows only permissive licences and denies unknown registries and git sources.",
  "`cargo deny check` passes locally and in CI.",
  "A regression test fails if the CI deny job or deny.toml is removed.",
]
code = ["deny.toml", ".github/workflows/ci.yml"]
tests = ["xtask/src/repo_checks.rs::lib_qa_003_dependency_policy_is_enforced"]

[[row]]
id = "LIB-TOOL-001"
area = "TOOL"
milestone = "M0"
title = "Functionality-matrix gate"
requirement = "`cargo xtask matrix check` enforces the rules of docs/matrix/README.md, `render` regenerates the Markdown view, and `next` lists the open rows whose dependencies are all verified, in milestone then file order."
source = "ADR 0004"
kind = "tooling"
status = "implemented"
acceptance = [
  "Rejects malformed, mismatched and duplicate ids, unknown areas and milestones.",
  "Enforces the evidence each status requires (acceptance, tests, code, verification record, reason).",
  "Test citations must resolve to a defined function named for the row; traced tests no row cites are reported.",
  "Rejects dependency cycles, dependencies on later milestones or unscheduled rows, and verified rows with unverified dependencies.",
  "Reports a stale or missing rendered page.",
  "`next` hides rows blocked on unverified dependencies and orders by milestone.",
]
code = ["xtask/src/matrix.rs", "docs/matrix/README.md"]
tests = [
  "xtask/src/matrix.rs::lib_tool_001_accepts_a_consistent_matrix",
  "xtask/src/matrix.rs::lib_tool_001_rejects_malformed_and_mismatched_ids",
  "xtask/src/matrix.rs::lib_tool_001_rejects_duplicate_ids",
  "xtask/src/matrix.rs::lib_tool_001_planned_rows_must_not_cite_tests",
  "xtask/src/matrix.rs::lib_tool_001_implemented_rows_need_acceptance_code_and_tests",
  "xtask/src/matrix.rs::lib_tool_001_test_citations_must_resolve_and_trace",
  "xtask/src/matrix.rs::lib_tool_001_verified_rows_need_record_and_verified_dependencies",
  "xtask/src/matrix.rs::lib_tool_001_rejects_cycles_and_backward_milestone_dependencies",
  "xtask/src/matrix.rs::lib_tool_001_unscheduled_rows_must_give_a_reason",
  "xtask/src/matrix.rs::lib_tool_001_reports_orphaned_traced_tests",
  "xtask/src/matrix.rs::lib_tool_001_detects_stale_rendered_page",
  "xtask/src/matrix.rs::lib_tool_001_next_lists_open_rows_with_verified_dependencies_in_order",
  "xtask/src/matrix.rs::lib_tool_001_finds_function_definitions_not_mentions",
  "xtask/src/matrix.rs::lib_tool_001_only_marked_tests_count_as_traced",
]

[[row]]
id = "LIB-TOOL-002"
area = "TOOL"
milestone = "M0"
title = "Hash-pinned fetching of the normative SACM 2.3 sources"
requirement = "`cargo xtask fetch-spec` downloads formal/23-05-08 and ptc/22-03-13 from omg.org into the git-ignored third_party/sacm-2.3/, verifies each against a SHA-256 pin, refuses a mismatching file, and never commits OMG documents."
source = "ADR 0003"
kind = "tooling"
status = "implemented"
acceptance = [
  "Both artifacts are pinned with lowercase 64-hex SHA-256 values and OMG URLs.",
  "A fresh fetch verifies the hash before the file is moved into place; a mismatch deletes the partial file and fails.",
  "An existing file with the right hash is not re-downloaded; one with the wrong hash is an error.",
  "third_party/sacm-2.3/ is git-ignored.",
]
code = ["xtask/src/fetch.rs", ".gitignore"]
tests = [
  "xtask/src/fetch.rs::lib_tool_002_pins_are_well_formed_and_unique",
  "xtask/src/fetch.rs::lib_tool_002_hashes_known_input",
]

[[row]]
id = "LIB-TOOL-003"
area = "TOOL"
milestone = "M0"
title = "Agent write scopes are enforced by a hook"
requirement = "A Claude Code PreToolUse hook refuses Write/Edit/MultiEdit/NotebookEdit calls from project subagents outside their declared scope (read-only roles cannot write; the test engineer only tests; the implementer not tests, matrix, verification records or ADRs), never restricts the main session, and fails closed for subagents when its configuration is unreadable."
source = "ADR 0006"
kind = "tooling"
status = "implemented"
acceptance = [
  "Main-session writes and non-write tools pass through.",
  "Read-only roles are denied every write.",
  "Scoped roles are allowed inside and denied outside their globs, with deny taking precedence.",
  "Paths outside the repository and `..` escapes are denied.",
  "Unreadable configuration denies subagent writes only.",
  "Every agent named in write-scopes.json has a definition in .claude/agents/.",
  "Live probe in a fresh Claude Code session: a read-only subagent's Write is denied and the test engineer's Write to crates/sacm/src is denied (confirms the hook input carries `agent_type`; verification evidence).",
]
code = [".claude/hooks/agent_write_guard.py", ".claude/hooks/write-scopes.json", ".claude/settings.json"]
tests = [
  ".claude/hooks/test_agent_write_guard.py::test_lib_tool_003_main_session_is_never_restricted",
  ".claude/hooks/test_agent_write_guard.py::test_lib_tool_003_read_only_roles_cannot_write_anywhere",
  ".claude/hooks/test_agent_write_guard.py::test_lib_tool_003_non_write_tools_pass_through",
  ".claude/hooks/test_agent_write_guard.py::test_lib_tool_003_test_engineer_confined_to_tests",
  ".claude/hooks/test_agent_write_guard.py::test_lib_tool_003_implementer_cannot_touch_tests_or_matrix",
  ".claude/hooks/test_agent_write_guard.py::test_lib_tool_003_paths_outside_repository_are_denied",
  ".claude/hooks/test_agent_write_guard.py::test_lib_tool_003_dot_dot_cannot_escape_scope",
  ".claude/hooks/test_agent_write_guard.py::test_lib_tool_003_unlisted_agents_use_normal_flow",
  ".claude/hooks/test_agent_write_guard.py::test_lib_tool_003_unreadable_scopes_fail_closed_for_subagents",
  ".claude/hooks/test_agent_write_guard.py::test_lib_tool_003_glob_semantics",
  ".claude/hooks/test_agent_write_guard.py::test_lib_tool_003_repository_scopes_file_is_valid",
]
notes = "Does not cover Bash or sessions with hooks disabled; agent prompts prohibit those routes (ADR 0006)."

[[row]]
id = "LIB-API-001"
area = "API"
milestone = "M0"
title = "Library and standard versions are exposed"
requirement = "The crate exposes its own version and the SACM revision it implements as public constants, documented with examples."
source = "Project policy (D-VERSION)"
kind = "api"
status = "implemented"
acceptance = [
  "`sacm::VERSION` equals the published crate version.",
  "`sacm::SACM_VERSION` is \"2.3\".",
  "Both are documented with a doctest.",
]
code = ["crates/sacm/src/lib.rs"]
tests = ["crates/sacm/tests/version.rs::lib_api_001_reports_library_and_sacm_versions"]

[[row]]
id = "LIB-CLI-001"
area = "CLI"
milestone = "M0"
title = "CLI skeleton with `sacm version`"
requirement = "The `sacm` binary parses subcommands, prints the tool version and implemented SACM revision for `sacm version`, prints usage and exits non-zero for unknown subcommands, and treats a closed stdout pipe as success."
source = "Project policy (D-API)"
kind = "cli"
status = "implemented"
