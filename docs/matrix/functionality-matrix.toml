[[row]]
id = "SACM23-VAL-019"
area = "VAL"
milestone = "M2"
title = "asCited declarations are citations"
requirement = "`validation::validate` reports an element of an Assertion kind whose `assertionDeclaration` is `asCited` with one SACM-CITE-002 Warning when its `isCitation` is not true, and one when its `citedElement` is absent or names an element of the document that is not of an Assertion kind (affecting the element, then that target). Each has requirement SACM23-VAL-019, clause 11.8 and no location. A `citedElement` that names no element gives only SACM-REF-001. The element is kept, and a strict save is not refused."
source = "formal/23-05-08 §11.8 (p. 38) \"asCited - a flag indicating that because the Assertion is cited, the AssertionDeclaration should be transitively derived from the value of the AssertionDeclaration of the cited Assertion.\"; §11.11 (p. 39); §8.2 (p. 18) \"isCitation[0..1]=false\", \"citedElement:SACMElement[0..1]\"; D-SEV; the maintainer, 2026-11-15 (code SACM-CITE-002)"
kind = "validation"
status = "verified"
verification = "docs/verification/0049-m2-reading-and-validation.md"
depends_on = ["SACM23-ARG-002", "SACM23-BASE-007", "SACM23-ARG-008", "SACM23-ARG-009", "SACM23-ARG-010", "SACM23-ARG-011", "SACM23-ARG-012", "SACM23-VAL-003", "SACM23-VAL-007"]
acceptance = [
  "Each of the six Assertion kinds declared asCited, with `isCitation=\"true\"` and a `citedElement` naming a Claim or an AssertedInference, gives no SACM-CITE-002 finding; the kinds need not match.",
  "asCited with `isCitation` false and no `citedElement` gives two Warnings, both affecting `[element]`; with `isCitation` true and no `citedElement`, one.",
  "asCited citing an ArgumentReasoning, an ArtifactReference or an ArgumentPackage gives one Warning affecting `[element, target]`; a dangling `citedElement` gives SACM-REF-001 only.",
  "`isCitation` false with a `citedElement` naming a Claim gives SACM-CITE-001 (Error, SACM23-VAL-007) and this row's Warning.",
  "A citation of an Assertion not declared asCited, and every other literal, give no finding; a strict write succeeds when these are the only findings.",
  "`SetAssertionDeclaration` to asCited on a non-citation succeeds, and `validate` then warns.",
  "The catalog row SACM-CITE-002 (Warning) names SACM23-VAL-019.",
]
code = ["crates/sacm/src/validation/references.rs", "crates/sacm/src/diagnostic.rs"]
tests = [
  "crates/sacm/tests/as_cited_validation.rs::sacm23_val_019_the_setup_gives_no_finding_without_as_cited",
  "crates/sacm/tests/as_cited_validation.rs::sacm23_val_019_an_as_cited_citation_of_a_claim_or_an_asserted_inference_gives_no_finding",
  "crates/sacm/tests/as_cited_validation.rs::sacm23_val_019_an_as_cited_non_citation_without_cited_element_gives_two_warnings_on_the_element",
  "crates/sacm/tests/as_cited_validation.rs::sacm23_val_019_an_as_cited_citation_without_cited_element_gives_one_warning_on_the_element",
  "crates/sacm/tests/as_cited_validation.rs::sacm23_val_019_an_as_cited_citation_of_a_non_assertion_gives_one_warning_on_the_element_and_target",
  "crates/sacm/tests/as_cited_validation.rs::sacm23_val_019_an_as_cited_citation_of_itself_gives_no_finding",
  "crates/sacm/tests/as_cited_validation.rs::sacm23_val_019_a_dangling_cited_element_gives_only_ref_001",
  "crates/sacm/tests/as_cited_validation.rs::sacm23_val_019_a_cited_claim_without_is_citation_gives_cite_001_and_this_row_s_warning",
  "crates/sacm/tests/as_cited_validation.rs::sacm23_val_019_findings_come_in_validate_s_order_code_then_affected_ids",
  "crates/sacm/tests/as_cited_validation.rs::sacm23_val_019_every_other_declaration_gives_no_finding",
  "crates/sacm/tests/as_cited_validation.rs::sacm23_val_019_the_warnings_do_not_refuse_a_strict_write",
  "crates/sacm/tests/as_cited_validation.rs::sacm23_val_019_set_assertion_declaration_as_cited_on_a_non_citation_succeeds_and_validate_warns",
  "crates/sacm/tests/as_cited_validation.rs::sacm23_val_019_as_cited_invalid_is_sacm_cite_002_and_its_catalog_row_names_it_and_the_row",
]

[[row]]
id = "SACM23-VAL-020"
area = "VAL"
milestone = "M1"
title = "An xmi:id is an NCName"
requirement = "`validation::validate` reports each element whose id is not an NCName (XML 1.0 Fifth Edition productions [4], [4a], [5] without `:`; Namespaces in XML 1.0 Third Edition [4]) as one Error SACM-ID-002, with the element's id as its only affected id, clause 7.6.1 and no location, and a strict save refuses the document by its schema check (LIB-COMPAT-007) and a tolerant save writes the id unchanged (D-ID). A strict `xmi::read` refuses an empty `xmi:id`, which a `Document` cannot hold, as `ReadError::InvalidId` whose `code()` is SACM-ID-002, at the element's start tag; a tolerant read gives the element a generated id (a `name`, `content`, `key`, `location` or `value` is read without an id), with a SACM-ID-002 Warning (LIB-COMPAT-001). An id with XML white space around it whose trimmed value is an NCName is read trimmed (SACM23-XMI-025, ADR 0024). A `name`, `content`, `key`, `location` or `value` id that is not an NCName is reported the same way, with the owning element as the affected id (SACM23-XMI-022, SACM23-BASE-004)."
source = "XMI 2.5.1 §7.6.1 (p. 13) `type=\"xsd:ID\"`; XML Schema 1.0 Part 2 2E §3.3.8 \"The ·lexical space· of ID is the set of all strings that ·match· the NCName production in [Namespaces in XML]\", §4.3.6; Namespaces in XML 1.0 (Third Edition) [4]; XML 1.0 (Fifth Edition) [4], [4a], [5]; ADR 0015 amendment 2; ADR 0019 E6; ADR 0022; D-ID; assurance-forge `validate.cpp:303-309`"
kind = "validation"
status = "verified"
depends_on = ["SACM23-VAL-018", "SACM23-XMI-004", "LIB-COMPAT-007", "SACM23-XMI-016", "LIB-EDIT-001"]
acceptance = [
  "A Claim read with `xmi:id` set to each of `1c`, `-c`, `.c`, `a:b`, `a b` and `·c` reads Ok, on a root and on a child; `validate` returns exactly one Error SACM-ID-002 for it, requirement SACM23-VAL-020, clause `7.6.1`, affected `[id]`, no location, with a message naming the kind and the `{:?}`-quoted id.",
  "Boundary NCNames give no SACM-ID-002: `_`, `a-b.c`, `x·y`, `à`, `𐀀`; a document built only by edits (caller and generated ids) gives none.",
  "Two elements with bad ids give two diagnostics in `Diagnostic` order; elements with valid ids beside them give none.",
  "A strict `xmi::write` of such a document returns `Err(WriteError::Invalid)` holding the SACM-ID-002; a tolerant write keeps the id byte for byte, and reading that output back gives the same id.",
  "`xmi::read` with `xmi:id=\"\"` on a root and on a child returns `Err(ReadError::InvalidId)` with `code()` SACM-ID-002 at that element's `<`, in strict mode (tolerant: LIB-COMPAT-001); `Unsupported` is no longer returned for it.",
  "An id such as `\" c1 \"` or `\"c1&#9;\"` (trimmed value an NCName) reads trimmed with an Info (SACM23-XMI-025); `\" \"` is read as written and reported by `validate`, in both modes.",
  "The diagnostics catalog's SACM-ID-002 row covers read ids as well as created ones and names SACM23-VAL-020.",
]
tests = [
  "crates/sacm/tests/ids.rs::sacm23_val_020_a_non_ncname_id_reads_and_is_one_id_002_error_on_a_root_and_on_a_child",
  "crates/sacm/tests/ids.rs::sacm23_val_020_boundary_ncnames_and_edit_built_ids_give_no_id_002",
  "crates/sacm/tests/ids.rs::sacm23_val_020_two_bad_ids_give_two_findings_in_diagnostic_order_and_valid_ids_give_none",
  "crates/sacm/tests/ids.rs::sacm23_val_020_strict_write_refuses_and_tolerant_write_keeps_the_id_byte_for_byte",
  "crates/sacm/tests/ids.rs::sacm23_val_020_an_empty_id_is_invalid_id_at_the_element_in_strict_mode",
  "crates/sacm/tests/ids.rs::sacm23_val_020_an_id_of_white_space_alone_is_read_as_written_and_reported",
  "crates/sacm/tests/ids.rs::sacm23_val_020_the_catalog_id_002_row_covers_read_ids_and_names_the_row",
  "crates/sacm/tests/utility_elements.rs::sacm23_val_020_a_content_or_value_id_that_is_not_an_ncname_is_one_id_002_on_the_utility_element",
  "crates/sacm/tests/tagged_values.rs::sacm23_val_020_a_key_or_key_value_id_that_is_not_an_ncname_is_one_id_002_on_the_tagged_value",
  "crates/sacm/tests/utility_elements.rs::sacm23_val_020_the_message_names_a_bad_value_id_by_its_1_based_position",
  "crates/sacm/tests/tagged_values.rs::sacm23_val_020_the_message_names_a_bad_key_value_id_by_its_1_based_position",
]
verification = "docs/verification/0036-m1-ids-docs-cli.md"
code = ["crates/sacm/src/validation/ids.rs", "crates/sacm/src/validation.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi.rs", "docs/adr/0015-xmi-read-entry-point.md"]
notes = "Choose its diagnostic code (extend SACM-ID-002 or add one) before its tests. Moved to M1 by the maintainer (2026-11-13), as the slice after LIB-COMPAT-007, so strict save writes only schema-conforming files. Its code is SACM-ID-002 per ADR 0022. Slice 0039: padded ids read trimmed and name ids are validated; reworded, re-check there. Slice 0040: reworded for ADR 0025 (MultiLangString roles); re-check there. Slice 0055: reworded because Artifact, Resource, Activity and Event are read now (ADR 0034 amendment 1); re-check there. Slice 0063: refusals carry codes, templates and arguments (LIB-API-017); re-check there."

