[[row]]
id = "SACM23-ARG-005"
area = "ARG"
milestone = "M2"
title = "ArgumentReasoning"
requirement = "ArgumentReasoning (§11.12, superclass ArgumentAsset) is read under `argumentElement` of an ArgumentPackage, written and round-tripped (ADR 0027). It holds `structure`, a single-valued reference to an ArgumentPackage (`SacmElement::structure() -> Option<&ElementId>`; ADR 0026 rules); it has no `assertionDeclaration`, `metaClaim` or `isCounter`. It is created by `CreateArgumentReasoning::new(parent, name)` (with `with_structure`) under the LIB-EDIT-001 contract; a `structure` naming no element is `EditError::ReferenceNotFound`. Setting `structure` later is LIB-EDIT-009."
source = "formal/23-05-08 §11.12 (p. 40) \"Superclass ArgumentAsset\"; \"structure:ArgumentPackage[0..1] - optional reference to another the ArgumentPackage that provides the detailed structure of the argument being described by the ArgumentReasoning.\"; ptc/22-03-13 Argumentation::ArgumentReasoning.structure (0..1); ADR 0019; ADR 0026; ADR 0027"
kind = "model"
status = "verified"
verification = "docs/verification/0043-m2-asserted-relationships.md"
depends_on = ["SACM23-ARG-001", "SACM23-XMI-005", "SACM23-XMI-016", "LIB-EDIT-001", "SACM23-XMI-015"]
acceptance = [
  "It reads in both modes with `xmi:type` and `xsi:type`, with name, gid, flags, `citedElement` and utility children.",
  "`structure=\"p1\"` and `<structure xmi:idref=\"p1\"/>` read equal, write after `abstractForm` and round-trip; an absent `structure` is `None` and writes nothing.",
  "`structure=\"p1 p2\"`, two `<structure>` elements, and attribute plus element are each `RepeatedValue`; `structure=\"\"` is kept as preserved content of the ArgumentReasoning, with SACM-XMI-003 at the attribute (LIB-COMPAT-003).",
  "A `structure` naming its own containing package, or a forward or cross-root package, reads with no finding; one naming a Claim reads and round-trips; a dangling one gives SACM-REF-001 with clause `11.12`.",
  "`assertionDeclaration`, `isCounter`, `metaClaim`, `source`, `target` and `reasoning` on an ArgumentReasoning are each kept as preserved content of it; an ArgumentReasoning in an AssuranceCasePackage is kept whole as preserved content of the package; each with one SACM-XMI-003 at the construct in both modes (LIB-COMPAT-003).",
  "`CreateArgumentReasoning::new(parent, name)` under an ArgumentPackage gives `argument_reasoning_1`; under an AssuranceCasePackage or a Claim it is `InvalidParent`; `with_structure` naming no element is `ReferenceNotFound`; refusals leave the document unchanged.",
  "`semantic_compare` reports `Difference::Structure`.",
  "A reference id holding XML white space (an element read with `xmi:id=\"a b\"`) is refused as `EditError::InvalidReference` (SACM-ID-002), after `TooFewReferences` and before `ReferenceNotFound`, leaving the document unchanged (ADR 0027; found by Copilot on PR #54).",
]
