[[row]]
id = "LIB-CLI-002"
area = "CLI"
milestone = "M1"
title = "`sacm validate`"
requirement = "`sacm validate <file> [--strict | --tolerant] [--format human|json]` reads the file strictly by default (`--strict` names the default, `--tolerant` reads in tolerant mode, both together are a usage error), runs `validation::validate` on the document read, and reports the read and validation diagnostics together, sorted (ADR 0023 amendment of 2026-11-16). A file passes only when a strict read accepts it and no diagnostic is an Error. Human format: each diagnostic's `Display` on stdout, then `<file>: <result> (E errors, W warnings, I info)`, where `<result>` is `valid` or `invalid` in strict mode and `readable` or `invalid` with `--tolerant`; tolerant acceptance is never reported as `valid`. A strict refusal of a file that a tolerant read opens prints `<file>: <code|error> <ReadError>` and `<file>: invalid (refused by a strict read; --tolerant opens it)` on stdout. JSON: one object `{format: 1, file, mode, result, refusal, diagnostics}`, `mode` `strict` or `tolerant`, `result` `valid`, `readable`, `invalid` or `unreadable`; each diagnostic `{code, severity, requirement, clause, location, affected, message}`, keys always present, RFC 8259 escaping; `refusal` is the strict refusal of a file only a tolerant read opens (with `result: \"invalid\"` and `diagnostics: []`), or the refusal of an unreadable file. Exit 0 when the check passes (`valid`, or `readable` with `--tolerant`), 1 when it fails (an Error diagnostic, or a strict refusal of a file a tolerant read opens), 2 when the arguments are invalid, the file cannot be read from disk, or neither a strict nor a tolerant read opens it; an unreadable file prints `sacm: <file>: <code|error> <ReadError>`, the refusal in the mode asked for, on stderr in the human format."
source = "ADR 0023 (amended 2026-11-16); the maintainer, 2026-11-16 (strict by default: anything a strict read refuses is an error and exit 1; `--tolerant` says readable, not valid); D-STRICT \"Tolerant acceptance is never presented as conformance.\"; SACM 2.3 formal/23-05-08 §2.4 (import and export of XMI documents that conform with the SACM XML Schema); ADR 0035 D1 (what a tolerant read refuses); D-API; D-DIAG; RFC 8259 §7; assurance-forge `libs/sacm/tools/sacm_cli.cpp` (differs: exit 1 for unreadable files; no location, affected ids or clause)"
kind = "cli"
status = "verified"
depends_on = ["LIB-CLI-001", "SACM23-XMI-001", "SACM23-VAL-001", "LIB-COMPAT-001", "SACM23-VAL-018"]
acceptance = [
  "A clean file exits 0 and prints only `<file>: valid (0 errors, 0 warnings, 0 info)`, by default and with `--strict`; stderr is empty.",
  "With `--tolerant` the summary never says `valid`: a clean file prints only `<file>: readable (0 errors, 0 warnings, 0 info)` and exits 0; `xsi-type.sacm.xmi` prints its `warning SACM-XMI-010` line and `readable (0 errors, 1 warning, 0 info)` and exits 0; a nameless Claim is `invalid` and exits 1.",
  "A file with a nameless Claim exits 1; stdout has the `error SACM-MULT-001 ...` line and an `invalid` summary.",
  "A file using `xsi:type` exits 1 by default and with `--strict`, with an `error SACM-XMI-010` line and `invalid (1 error, 0 warnings, 0 info)`.",
  "A file a strict read refuses and a tolerant read opens exits 1 with stdout exactly `<file>: <code|error> <ReadError>` then `<file>: invalid (refused by a strict read; --tolerant opens it)`, and stderr empty: `bad-literal.sacm.xmi` (SACM-ENUM-001) and `xmi-attribute.sacm.xmi` (`Unsupported`, printed with its code SACM-XMI-003). With `--tolerant`, `bad-literal.sacm.xmi` exits 0 with its `warning SACM-ENUM-001` line and a `readable` summary.",
  "A missing file, malformed XML (SACM-XML-001), a duplicate id (SACM-ID-001) and `latin-1.sacm.xmi` (`Unsupported` in both modes) each exit 2, by default and with `--tolerant`; stderr is the one line `sacm: <file>: <code|error> <ReadError>`, and stdout is empty.",
  "`--format json` equals the golden texts `validate-clean.json`, `validate-clean-tolerant.json`, `validate-nameless-claim.json`, `validate-xsi-type.json` (default and `--strict`), `validate-xsi-type-tolerant.json`, `validate-bad-literal.json`, `validate-bad-literal-tolerant.json` and `validate-malformed.json`: key order, `\"format\":1`, `mode`, `result`, `null` for an absent clause or location, the `affected` array, and the `refusal` with its code and locations; `xmi-attribute.sacm.xmi` gives `result:\"invalid\"` with `\"code\":\"SACM-XMI-003\"` and exit 1, `latin-1.sacm.xmi` `result:\"unreadable\"` with `\"code\":\"SACM-XML-002\"` and exit 2; a message with `\"`, `\\`, CR, LF and U+0001 is escaped per RFC 8259; the output is identical across runs, and stderr is empty.",
  "An unknown flag, `--format xml`, `--strict` together with `--tolerant`, or a missing `<file>` exits 2 with a usage message on stderr.",
]
tests = [
  "crates/sacm-cli/tests/validate.rs::lib_cli_002_a_clean_file_exits_0_and_prints_only_the_valid_summary",
  "crates/sacm-cli/tests/validate.rs::lib_cli_002_a_nameless_claim_exits_1_with_the_mult_001_line_and_an_invalid_summary",
  "crates/sacm-cli/tests/validate.rs::lib_cli_002_xsi_type_is_an_error_by_default_and_a_warning_with_tolerant",
  "crates/sacm-cli/tests/validate.rs::lib_cli_002_a_missing_malformed_or_duplicate_id_file_exits_2_naming_the_file_and_code",
  "crates/sacm-cli/tests/validate.rs::lib_cli_002_json_output_equals_the_golden_text_and_is_identical_across_runs",
