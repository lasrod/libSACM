  "crates/sacm/tests/expression_lang_string.rs::sacm23_base_009_copy_refuses_an_expression_lang_string_with_no_expression",
  "crates/sacm/tests/expression_lang_string.rs::sacm23_base_009_expressions_follow_write_order_and_a_scrub_keeps_the_others",
  "crates/sacm/tests/expression_lang_string.rs::sacm23_base_009_two_type_attributes_naming_different_classes_keep_the_whole_name",
  "crates/sacm/tests/expression_lang_string.rs::sacm23_base_009_creates_with_ends_check_the_name_expression_in_each_phase",
]
acceptance = [
  "`LangString::new(\"x\").with_lang(\"en\").with_expression(\"blade\")` has `expression() == Some(\"blade\")`, `is_expression_lang_string()`, `lang() == Some(\"en\")` and `content() == Some(\"x\")`. `with_expression(\"lid\")` replaces the expression. `without_expression()` gives a value `==` to `LangString::new(\"x\").with_lang(\"en\")`. A plain value has `expression() == None` and `!is_expression_lang_string()`. With equal `lang` and `content`, plain < an ExpressionLangString with no expression < one with `a` < one with `b`, all pairwise unequal, and equal values hash equally. `Debug` of a plain value is unchanged; an ExpressionLangString's `Debug` starts `ExpressionLangString {` and shows its `expression`.",
  "`expression-lang-string-valid.sacm.xmi` reads in both modes with no diagnostic, and `validate` gives none. `expressions()` is `[blade_guarded]` on c1, `[blade]` on n1, `[lid]` on c2, `[blade]` on tv1 and `[blade]` on manual_pdf, and empty elsewhere. c2's `name_id()` is `c2_name`. n1's content is `[plain sv, ExpressionLangString en \"\" blade]`.",
  "A strict and a tolerant write of that document give `golden/expression-lang-string.golden.sacm.xmi` byte for byte, and reading the golden in both modes gives an equal document. `<expression xmi:idref=\"t\"/>`, `<expression href=\"#t\"/>` and `expression=\"t\"` read equal, and so do the element forms of `lang` and `content` beside an `expression` element.",
  "`xsi:type=\"sacm:ExpressionLangString\"` reads as `xmi:type` does, with the SACM-XMI-010 Warning a LangString `name` gives. A `name` typed ExpressionLangString with no `expression` reads with `expression() == None` and is written back with its type and no `expression`. A `sacm` prefix bound to the pinned URI under another name reads the same.",
  "Strict: `<name xmi:type=\"sacm:ExpressionLangString\" expression=\"a b\"/>` in `named_package` (message_templates.rs) is `RepeatedValue` with Display `the single-valued property \"name.expression\" of the element \"p\" is given 2 times, at line 1, column 189; line 1, column 191`. `expression=\"t1\"><expression xmi:idref=\"t1\"/>` is `... given 2 times, at line 1, column 177; line 1, column 193`, and two reference elements are refused likewise. In a value, the property is `content.value.expression`, `key.value.expression` or `location.value.expression`. Tolerant: the whole `name` (or `content`, `key`, `location`) is kept as preserved content, with one SACM-MULT-001 Warning at the second occurrence, and the owner has no name (or no such text).",
  "These keep the whole `name`, or the whole `content`, `key` or `location`, as preserved content of the owner, with one SACM-XMI-003 at its start tag, in both modes, and a strict write then refuses with SACM-XMI-006: `expression=\"t1\"` on an untyped `name` and on one typed `sacm:LangString`; `expression=\"\"`; `expression=\" \"`; `sacm:expression=\"t1\"`; an `<expression/>` with no link attribute, with both, or holding text; `xmi:type` naming ExpressionLangString beside `xsi:type` naming LangString; `<name><value xmi:type=\"sacm:ExpressionLangString\" expression=\"t1\"/></name>`; `xmi:type=\"sacm:ExpressionLangString\"` on a `content` element. An `expression=\"t1\"` attribute on a Claim element is not read as an end: it is kept as a preserved attribute with one SACM-XMI-003, as any unknown attribute is; like any preserved attribute named after a reference end, its ids are not generated.",
  "`<expression xmi:idref=\"t1\" xmi:id=\"e\"/>` is `Unsupported` naming SACM23-XMI-019. `<expression href=\"other.xmi#t1\"/>` is `Unsupported` naming SACM23-XMI-027, and a tolerant read keeps it with SACM-XMI-007. No input gives `Unsupported` naming SACM23-BASE-009: the refusal-list entry and the template `SACM-XMI-014/expression-lang-string` are gone.",
  "`ReferenceEnd::Expression.name() == \"expression\"`; it is the last of the 17 entries of `ReferenceEnd::ALL`. It applies to every `ElementKind`, `bounds(kind) == Some((0, None))` for every kind, it serializes as `\"expression\"`, and `references(ReferenceEnd::Expression) == expressions()` for every element.",
  "In the valid fixture, `referrers(\"blade\")` is `[(blade_guarded, Element, 0), (n1, Expression, 0), (tv1, Expression, 0), (manual_pdf, Expression, 0)]` and `referrers(\"lid\")` is `[(blade_guarded, Element, 1), (c2, Expression, 0)]`. LIB-API-014 acceptance 3 (index equals a full scan) holds with the new end after every operation of the LIB-EDIT-002 set. With a dangling name expression `claim_1` read from a file, `CreateClaim` without an id does not generate `claim_1`.",
  "`SetReferences::new(\"c1\", ReferenceEnd::Expression, [\"blade\"])`, `SetReferences::clear`, `AddReference` and `RemoveReference` on Expression are `EditError::DerivedEnd { element: \"c1\", kind: Claim, end: \"expression\" }`, with code SACM-CMD-008 and Display `the expression of the Claim \"c1\" is derived from its name and texts: set it with SetName, SetContent, SetKey or SetLocation`. An unknown element is `ElementNotFound` first. The document is `==` to before.",
  "`CreateClaim` with a name `with_expression(\"blade\")` succeeds. `with_expression(\"nowhere\")` is `ReferenceNotFound { end: \"expression\" }` with Display `the document has no element \"nowhere\" for the expression to reference`. `with_expression(\"c2\")`, where c2 is a Claim, is `WrongReferenceType { end: \"expression\", kind: Claim, expected: \"ExpressionElement\" }` with Display `the expression \"c2\" names a Claim, and the expression must be an ExpressionElement`. `with_expression(\"a b\")` is `InvalidReference`. An ExpressionLangString with no expression (from JSON) is `TooFewReferences { end: \"expression\", given: 0, required: 1 }` with Display `the expression is given 0 ids, and SACM requires at least 1`. In each check phase, expression ids are checked after the operation's own ends: a `CreateAssertedInference` with a dangling source and a dangling name expression reports the source. The same holds for `SetName`, `SetContent` (a Note), `SetKey` (a TaggedValue), `SetLocation` (a Resource), `CreateNote`, `CreateTaggedValue` and `CreateResource::with_location`. A set keeps an id the element's Expression end already holds. `changed_ids` is `[element]` exactly when the name or text changes.",
  "`CopyElements` of c1 together with blade_guarded gives the copy's name the copied Expression's new id. Copying c1 alone into a document without `blade_guarded` is `ReferenceNotFound { end: \"expression\" }`.",
  "In the valid fixture: `DeleteElement::new(\"blade_guarded\")` is `CrossPackageReference { holder: c1, end: \"expression\", id: blade_guarded }`, with Display `the expression of \"c1\" names \"blade_guarded\" in another package, and the delete would leave it dangling`. With `ApplyReferencePolicy` it is `Referenced { holder: c1, end: \"expression\" }`. With `ScrubReferences` and `ApplyReferencePolicy`: `deleted_ids == [blade_guarded]`, `changed_ids == [c1]`, c1's name `== LangString::default().with_lang(\"en\")` (plain), the preview's `dangling_references` is `[(c1, expression, blade_guarded)]`, and `validate` gives none. `DeleteReferencingRelationships` gives the same. Deleting `blade` with `ScrubReferences` and `ApplyReferencePolicy` gives `changed_ids == [blade_guarded, n1, tv1, manual_pdf]`. n1's value 2 becomes `LangString::new(\"\").with_lang(\"en\")` and keeps its value id, and tv1's key value and manual_pdf's location value become plain.",
  "`semantic_compare` of the valid fixture against a copy where c1's name is set to `LangString::default().with_lang(\"en\")` gives exactly one difference, `Difference::Name`, with Display `element \"c1\" differs in name: [lang \"en\", no content, expression \"blade_guarded\"] on the left, [lang \"en\", no content] on the right`. No end difference is reported for `expression`. An ExpressionLangString with no expression displays as `[lang \"en\", no content, no expression]`.",
  "`invalid/expression-lang-string-findings.sacm.xmi` reads in both modes with no diagnostic, and `validate` gives exactly its four lines (see Fixtures). A strict write fails with `WriteError::Invalid`, Display `the document cannot be written in strict mode: 1 schema error, SACM-REF-001 on \"c2\"`; a tolerant write keeps every reference. A Resource whose name and location value both name `blade` gives no SACM23-VAL-022 Warning. Two places in one element naming the same missing id give one SACM-REF-001.",
  "With `serde`, `values.json` gains the two samples given below. `{\"type\":\"ExpressionLangString\",\"lang\":null,\"content\":null,\"expression\":null}` reads as an ExpressionLangString with no expression and writes back the same. These are refused: `\"type\":\"LangString\"`, any other `type`, an `expression` key without `type`, and `type` without `expression`. `{}` is still `LangString::default()`. `edit-errors.json` gains the `DerivedEnd` sample.",
  "In docs/sacm/diagnostics.md: the SACM-MULT-001 row names the missing expression; the SACM-REF-001, -002 and -003 rows give clause 8.4 for `expression`; the SACM-CMD-008 row names `DerivedEnd`; the template table no longer has `SACM-XMI-014/expression-lang-string` (102 refusal templates). `messages-0.1.0.txt` gains the new fixtures' lines, and no existing line changes.",
]

[[row]]
id = "SACM23-VAL-009"
area = "VAL"
milestone = "M4"
title = "ExpressionLangString exclusivity"
requirement = "`validation::validate` reports each ExpressionLangString (SACM23-BASE-009) that has an `expression` and a content that is present and not empty as one SACM-EXPR-001 Warning (`Code::EXPRESSION_WITH_CONTENT`), because §8.4 says \"If expression is not empty, then +content should be empty.\" (\"should\", no OCL; D-SEV). An absent content and `content=\"\"` give none (ADR 0012, D-EXPR-CONTENT). An ExpressionLangString with no expression gives none: it is SACM-MULT-001's (SACM23-BASE-009). Each finding has requirement SACM23-VAL-009, clause `8.4`, no location and affected `[holder]`. The holder is the element whose name it is, or the UtilityElement or Resource whose `content`, `key` or `location` holds it. The message names the name, or the value by its 1-based position. Reading, editing and both saves never refuse it."
source = "formal/23-05-08 §8.4 (p. 19) \"Constraints If expression is not empty, then +content should be empty.\"; D-SEV; D-EXPR-CONTENT; ADR 0012; ADR 0038; SACM-EXPR-001"
kind = "validation"
status = "verified"
verification = "docs/verification/0065-expression-lang-string.md"
depends_on = ["SACM23-BASE-009"]
code = ["crates/sacm/src/validation/expressions.rs", "crates/sacm/src/diagnostic.rs"]
tests = [
  "crates/sacm/tests/expression_lang_string.rs::sacm23_val_009_the_with_content_fixture_gives_its_two_lines",
  "crates/sacm/tests/expression_lang_string.rs::sacm23_val_009_each_place_with_expression_and_content_gives_one_warning",
  "crates/sacm/tests/expression_lang_string.rs::sacm23_val_009_absent_or_empty_content_no_expression_and_plain_give_none",
  "crates/sacm/tests/expression_lang_string.rs::sacm23_val_009_the_warning_never_refuses_a_write_or_an_edit",
  "crates/sacm/tests/expression_lang_string.rs::sacm23_val_009_the_code_and_its_catalog_row",
]
acceptance = [
  "`warning/expression-lang-string-with-content.sacm.xmi` reads in both modes with no diagnostic, and `validate` gives exactly its two lines (see Fixtures).",
  "An ExpressionLangString with expression `t1` and content `x`, placed in turn as a Claim's name, value 1 of a Note's content, value 2 of a TaggedValue's key and value 1 of a Resource's location, gives one Warning each, affected `[holder]`. The messages are: `the name of Claim \"c1\" has the expression \"t1\" and a content that is not empty, and §8.4 says that if expression is not empty, then content should be empty`; `value 1 of the content of Note \"n1\" has the expression …`; `value 2 of the key of TaggedValue \"tv1\" …`; `value 1 of the location of Resource \"r1\" …`.",
  "There is no finding for an absent content, for `content=\"\"`, for an ExpressionLangString with no expression (only SACM-MULT-001), or for a plain LangString. `content=\" \"` gives one.",
  "A strict write of the fixture succeeds, and `SetName` with an expression and a content succeeds. `has_errors` is false when this Warning is the only finding.",
  "`Code::EXPRESSION_WITH_CONTENT` is SACM-EXPR-001, and the catalog row names it and SACM23-VAL-009 (LIB-DIAG-002, 42 live codes).",
]

[[row]]
id = "SACM23-VAL-017"
area = "VAL"
milestone = "M4"
title = "Concrete Expressions reference concrete elements"
requirement = "`validation::validate` reports, for each Expression whose `isAbstract` is not true, each distinct id of its `element` end (§10.10) that names a Term or an Expression of the document whose `isAbstract` is true, as one SACM-ABS-001 Error (`Code::ABSTRACT_FORM_INVALID`). §10.10 gives the OCL `self.isAbstract = false implies self.element->forall(expr|expr.isAbstract = false).` (D-SEV). Each finding has requirement SACM23-VAL-017, clause `10.10`, no location and affected `[expression, element]`. An abstract Expression gives none, whatever its elements. An id that names no element is SACM-REF-001's alone, one naming an element of another kind is SACM-REF-002's alone (SACM23-VAL-003, SACM23-VAL-004), and one held in preserved content is SACM-REF-003's alone. Reading, editing and both saves never refuse it (D-VAL-LAYER, ADR 0029, ADR 0035 D4)."
source = "formal/23-05-08 §10.10 (p. 30) \"A concrete expression (denoted by isAbstract:Boolean being false) is one that has a literal string value and references only concrete ExpressionElements.\", \"A concrete expression should have references to only concrete ExpressionElements\", OCL \"self.isAbstract = false implies self.element->forall(expr|expr.isAbstract = false).\"; §8.2 (p. 18) \"isAbstract[0..1]=false\"; D-SEV; SACM-ABS-001"
kind = "validation"
status = "verified"
verification = "docs/verification/0065-expression-lang-string.md"
depends_on = ["SACM23-TERM-005", "SACM23-VAL-008", "SACM23-VAL-003", "SACM23-VAL-004"]

code = ["crates/sacm/src/validation/terminology.rs"]
tests = [
  "crates/sacm/tests/concrete_expressions.rs::sacm23_val_017_the_fixture_gives_its_three_lines",
  "crates/sacm/tests/concrete_expressions.rs::sacm23_val_017_dangling_wrong_kind_preserved_and_concrete_elements_give_no_finding",
  "crates/sacm/tests/concrete_expressions.rs::sacm23_val_017_set_flag_removes_and_adds_findings",
  "crates/sacm/tests/concrete_expressions.rs::sacm23_val_017_edits_and_strict_write_never_refuse_it",
  "crates/sacm/tests/concrete_expressions.rs::sacm23_val_017_the_catalog_and_the_code_doc_state_the_rule",
]
acceptance = [
  "`invalid/expression-abstract-element.sacm.xmi` reads in both modes with no diagnostic, and `validate` gives exactly its three lines (see Fixtures). `guard`, held twice, gives one SACM-ABS-001, and `pattern` gives one. The abstract `pattern` gives none for its own abstract `guard`.",
  "There is no SACM-ABS-001 for: a concrete Expression whose elements are concrete; a dangling `element` `x` (only SACM-REF-001); an `element` naming an abstract Claim read from a file (only SACM-REF-002); an `element` naming an id held in preserved content (only SACM-REF-003).",
  "`SetFlag(guarded, IsAbstract, true)` removes both findings. `SetFlag(blade, IsAbstract, true)` succeeds and then gives one finding more, on `guarded`. `CreateExpression::new(..).with_expression_elements([\"guard\"])` succeeds. A strict write of the fixture succeeds.",
  "The catalog's SACM-ABS-001 row and the `Code::ABSTRACT_FORM_INVALID` doc state the §10.10 rule as emitted (SACM23-VAL-017).",
]
