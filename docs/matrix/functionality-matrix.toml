[[row]]
id = "SACM23-XMI-003"
area = "XMI"
milestone = "M1"
title = "Pinned strict namespace"
requirement = "`xmi::write` declares exactly `xmlns:sacm=\"http://www.omg.org/spec/SACM/20220301\"` and `xmlns:xmi=\"http://www.omg.org/spec/XMI/20131001\"` on the document element only: the bare root, or `xmi:XMI` when there are several roots. Roots and type values use the `sacm` prefix, and role elements are unprefixed (XMI rule 2a). No default namespace and no `xmlns:xsi` is declared. Preserved content (LIB-COMPAT-003) is the exception: it keeps its prefixes, and each holder or fragment declares the other bindings it needs. The reader and the writer share one constant per namespace URI."
source = "D-NS-PIN; XMI 2.5.1 §7.5.3 (p. 10) \"identification of the XMI version is indicated by the presence of the XMI namespace declaration\", rule 1e (p. 61), rule 1h (p. 61) \"Document producers can choose their own namespace prefixes\", rule 2a and rule 2d (p. 63); formal/23-05-08 §2.2–2.5; ADR 0017; assurance-forge `metadata/namespaces.h:17-35`, `io/xmi_writer.cpp:456-462, 537-542`"
kind = "xmi"
status = "verified"
depends_on = ["SACM23-XMI-001"]
notes = "Slice 0021 research: XMI 2.5.1 declares no `xmi:version` attribute (XMI.xsd; §7.8.3 p. 17 has no anyAttribute), so a strict export that writes `xmi:version=\"2.0\"` may not validate against the 2.5.1 schema. C++ writes it (namespaces.h:32 `kXmiVersion`, xmi_writer.cpp:461, 542). Decide keep or drop with an ADR naming that C++ decision, and check it against clause 2. Maintainer decision 2026-11-12: strict export keeps writing `xmi:version=\"2.0\"`, following C++. The ADR for this row records that strict output may then not validate against XMI.xsd 2.5.1. Slice 0033: `xmi:version` is no longer written (SACM23-XMI-024; the maintainer, 2026-11-13, on the ADR review); reworded and re-checked there."
acceptance = [
  "For one root and for several roots, the document element carries exactly `xmlns:sacm` and `xmlns:xmi` with the pinned URIs, and in the XMI namespace nothing besides a bare root's own `xmi:id` (SACM23-XMI-004): no `xmi:version` (SACM23-XMI-024). No other element carries a namespace declaration.",
  "The output has no `xmlns=\"…\"`, no `xmlns:xsi` and no prefix other than `sacm` and `xmi`.",
  "A root's element name is `sacm:<Kind>` (the `ElementKind` name); child elements are unprefixed.",
  "The output for a document with 1 root and with 2 roots (AssuranceCasePackage/ArgumentPackage, nameless, no children) reads back through `xmi::read` to the same ids, kinds and order.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "docs/adr/0017-xmi-writer.md", "crates/sacm/src/xmi/namespaces.rs", "crates/sacm/src/xmi/roots.rs"]
tests = [
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_003_one_root_declares_the_pinned_namespaces_on_the_root_only",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_003_several_roots_declare_the_namespaces_on_xmi_xmi_only",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_003_no_element_but_the_document_element_declares_a_namespace",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_003_output_has_no_default_namespace_no_xsi_and_only_the_sacm_and_xmi_prefixes",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_003_roots_are_sacm_prefixed_by_kind_and_children_are_unprefixed",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_003_one_and_two_roots_read_back_to_the_same_ids_kinds_and_order",
]
verification = "docs/verification/0033-m1-no-xmi-version.md"

[[row]]
id = "SACM23-XMI-004"
area = "XMI"
milestone = "M1"
title = "xmi:id identity"
requirement = "`xmi::write` writes every element with exactly one `xmi:id` whose value reads back equal to its `ElementId`, with markup characters and TAB, LF and CR escaped (`&amp;`, `&lt;`, `&gt;`, `&quot;`, `&#9;`, `&#10;`, `&#13;`). An id holding a character XML 1.0 cannot represent makes the write fail (in strict mode the schema check refuses it first, as `WriteError::Invalid` with SACM-ID-002, LIB-COMPAT-007; in tolerant mode it is `UnrepresentableCharacter`), and nothing is returned. Ids read from a file are written back exactly, as their `xsd:ID` values (a padded id is written trimmed, SACM23-XMI-025); today that means root and child ids (SACM23-XMI-016), generated ids (SACM23-XMI-020) and name ids. No `xmi:id` is written on a LangString or MultiLangString except one read from the file, on a `name` (SACM23-XMI-022) or on a `content`, `key` or `value` (SACM23-BASE-004). An id that is not an NCName is written as it is, escaped, as C++ does. Writing takes `&Document`: it changes nothing and generates no id."
source = "XMI 2.5.1 §7.6.1 (pp. 13-14) `<xsd:attribute name=\"id\" type=\"xsd:ID\" use=\"optional\"/>` and \"the value for xmi:id is unique across all elements within the file\", rules 2e and 2f (p. 63); D-ID; D-PRESERVE; assurance-forge `io/xmi_writer.cpp:76`"
kind = "xmi"
status = "verified"
depends_on = ["SACM23-XMI-001"]
notes = "Slice 0021 research: no row yet owns a missing `xmi:id` (SACM-XMI-004, generated in tolerant mode). The catalog lists it as Error (strict), but the id is `use=\"optional\"` (XMI 2.5.1 §7.6.1, p. 13) and D-STRICT says strict import accepts every schema-conforming document; settle this here or in a new row. SACM23-XMI-001 refuses a missing root id as `Unsupported`. Maintainer decision 2026-11-12: strict import accepts an element with no `xmi:id` and reports it with a diagnostic (D-STRICT; the id is optional in XMI 2.5.1). This departs from C++, where SACM-XMI-004 is an Error in strict mode, so the row needs an ADR naming that decision. Slice 0025 research: the LangString `xmi:id` Info rule moves to SACM23-XMI-012 (the first row that reads a LangString); the MultiLangString wrapper rule moves to SACM23-BASE-004; the maintainer's decision on a missing `xmi:id` moves to the new SACM23-XMI-020; \"preserved through edit\" moves to the LIB-EDIT rows. Slice 0036: a test's ids or expectations changed for the new id rules (ADR 0015 amendment 2, SACM23-VAL-020); re-checked there. Slice 0039: reworded for ADR 0024 (trimmed, generated and name ids); re-check there. Slice 0040: reworded for ADR 0025 (MultiLangString roles); re-check there."
acceptance = [
  "In a document built with `insert` that covers every kind the model admits, each element's start tag has exactly one `xmi:id`, equal to `id().as_str()`.",
  "Read, write and read again of AssuranceCasePackage and ArgumentPackage roots keeps every id exactly, including ids holding `&`, `<`, `>`, `\"`, `'`, non-ASCII characters, and TAB, LF and CR.",
  "Writing a document whose id holds U+0001 or U+FFFE fails with an error naming the element, and no output is returned.",
  "Writing does not change the document (it takes `&Document`).",
  "A `name` id holding `&`, `<`, `>`, `\"`, `'`, TAB, LF and CR, read and written tolerantly, is written escaped and reads back exactly (SACM23-XMI-022).",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "docs/adr/0017-xmi-writer.md"]
tests = [
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_a_strict_write_of_an_id_holding_u0001_is_invalid_with_sacm_id_002",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_every_element_of_every_kind_has_exactly_one_xmi_id_equal_to_its_id",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_read_write_read_keeps_root_ids_with_markup_line_breaks_non_ascii_and_non_ncnames",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_id_characters_are_escaped_with_the_pinned_references_and_nothing_else",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_an_id_holding_u0001_is_refused_naming_the_element_and_the_character",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_an_id_holding_ufffe_is_refused_naming_the_element_and_the_character",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_an_id_with_two_unrepresentable_characters_names_the_first",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_every_character_outside_xml_char_in_an_id_is_refused",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_the_xml_char_boundary_characters_in_an_id_are_written_and_read_back",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_writing_takes_a_shared_reference_and_leaves_the_document_unchanged",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_004_a_name_id_is_written_escaped_and_reads_back_exactly",
  "crates/sacm/tests/utility_elements.rs::sacm23_xmi_004_a_content_or_value_id_is_written_escaped_and_reads_back_exactly",
  "crates/sacm/tests/utility_elements.rs::sacm23_xmi_004_an_edit_built_content_and_its_values_are_written_without_an_xmi_id",
  "crates/sacm/tests/tagged_values.rs::sacm23_xmi_004_a_key_or_key_value_id_is_written_escaped_and_reads_back_exactly",
]
