[[row]]
id = "SACM23-BASE-001"
area = "BASE"
milestone = "M1"
title = "LangString"
requirement = "LangString (§8.3) is a value type with an optional `lang` and an optional `content`, each a String [0..1]. For each field, absent, empty and non-empty are distinct (ADR 0012), and values are kept byte for byte: no trimming, case folding, Unicode normalisation or format check on `lang`. It is not a SACMElement: it has no id and no ElementKind."
source = "formal/23-05-08 §8.3; ptc/22-03-13 Base::LangString; ADR 0012; assurance-forge libs/sacm model/lang_string.h"
kind = "model"
status = "verified"
verification = "docs/verification/0015-m1-value-types-round2.md"
acceptance = [
  "`LangString::default()` has both fields absent. `LangString::new(c)` has `lang` absent and `content` `Some(c)`. `with_lang(l)` sets `lang` to `Some(l)`.",
  "All nine combinations of absent, `\"\"` and `\"x\"` across `lang` and `content` can be built, `lang()` and `content()` return exactly what was set as `Option<&str>`, and the nine are pairwise unequal (§8.3 `lang:String[0..1]`, `content:String[0..1]`; ADR 0012).",
  "Content with leading or trailing spaces, LF, CR, TAB, non-ASCII text, NFC and NFD forms and an embedded U+0000 comes back byte for byte; NFC and NFD forms compare unequal.",
  "`lang` takes any string without a format check (`\"\"`, `\"en\"`, `\"en-GB\"`, `\"not a tag\"`), and `\"en-GB\"` and `\"en-gb\"` stay distinct.",
  "`set_lang` and `set_content`, with `Some` or `None`, change only their own field.",
  "`Ord` compares `lang`, then `content`, with absent before present. Equal values hash equally. `LangString` is `Clone + Debug + Default + Eq + Ord + Hash + Send + Sync`, and building, cloning, comparing, hashing and `Debug` never panic.",
  "`LangString` has no id and no kind: no `id()` or `kind()` method, and no `ElementKind` names it (ptc: it generalizes Element, not SACMElement). Review item.",
]
