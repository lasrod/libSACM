[[row]]
id = "LIB-COMPAT-010"
area = "COMPAT"
milestone = "M2"
title = "An untyped child under an abstract role is refused"
requirement = "An element under a role whose declared type is abstract, with no `xmi:type` or `xsi:type` and not in reference form, is refused in strict mode with the coded refusal SACM-XMI-005 at its start tag (a tolerant read keeps it whole as preserved content of its parent, with SACM-XMI-005 as a Warning, LIB-COMPAT-001): its local name is the role, so no class can be inferred, and none is guessed (ADR 0022). An element in reference form (carrying `xmi:idref` or an unqualified `href`) is not one of these: it is a proxy for an element held elsewhere, refused as not read yet under SACM23-XMI-019 or SACM23-XMI-027 (the maintainer, 2026-11-16)."
source = "XMI 2.5.1 §7.6.3 (p. 15) \"The type attribute is used to specify the type of object being serialized, when the type is not known from the model.\"; ADR 0022 (its codes table: an untyped child under an abstract role is SACM-XMI-005); the maintainer, 2026-11-15 (a refusal, not an inference); assurance-forge `xmi_reader.cpp:1103-1116` (tries the role name as a class name, then drops the child)"
kind = "compliance"
status = "verified"
verification = "docs/verification/0051-m2-close.md"
depends_on = ["LIB-COMPAT-001", "SACM23-XMI-016"]
notes = "Reworded 2026-11-15 (slice 0049 research): no tool is known to write this shape, and an abstract-role element is named after its role, so nothing can be inferred. Class-named children (`<Claim>`, `<claim>`) are the legacy dialect, LIB-COMPAT-012."
acceptance = [
  "`<argumentElement xmi:id=\"c1\"/>` under an ArgumentPackage is refused in strict mode (tolerant: LIB-COMPAT-001) with code SACM-XMI-005 at its `<`; so is one with a `name` or children.",
  "The same element with `xmi:type` or `xsi:type` naming a concrete admitted class reads as before.",
  "`<argumentPackage>` under an AssuranceCasePackage (a concrete declared type) still reads untyped.",
  "SACM-XMI-005's catalog row is live: Error (strict) / Warning (tolerant read); `Unsupported` is no longer returned for this input.",
  "`<argumentElement xmi:idref=\"c1\"/>` under an ArgumentPackage is `Unsupported` naming SACM23-XMI-019, and `<argumentElement href=\"o.xmi#c1\"/>` is `Unsupported` naming SACM23-XMI-027, in strict mode; a tolerant read keeps them with SACM-XMI-014 and SACM-XMI-007 (LIB-API-011); neither is SACM-XMI-005.",
]
code = ["crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi.rs"]
tests = [
  "crates/sacm/tests/untyped_abstract_roles.rs::lib_compat_010_a_reference_form_element_under_an_abstract_role_is_not_missing_type",
  "crates/sacm/tests/untyped_abstract_roles.rs::lib_compat_010_an_untyped_child_under_an_abstract_role_is_sacm_xmi_005_at_its_start_tag",
  "crates/sacm/tests/untyped_abstract_roles.rs::lib_compat_010_the_same_element_typed_as_a_concrete_admitted_class_reads_as_before",
  "crates/sacm/tests/untyped_abstract_roles.rs::lib_compat_010_an_untyped_child_under_a_concrete_role_still_reads",
  "crates/sacm/tests/untyped_abstract_roles.rs::lib_compat_010_the_catalog_row_of_sacm_xmi_005_is_live_and_an_error_in_strict_mode",
  "crates/sacm/tests/untyped_abstract_roles.rs::lib_compat_010_a_qualified_href_does_not_make_a_reference_form",
]

