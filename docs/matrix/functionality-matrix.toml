[[row]]
id = "LIB-EDIT-019"
area = "EDIT"
milestone = "M5"
title = "Deleting a package an interface implements or a binding binds"
requirement = "Under `DeleteReferencingRelationships` and `ScrubReferences`, a dangling id in an interface's `implements` or a binding's `participantPackage` is scrubbed. An interface or binding that loses an id there and is left below the end's lower bound (no `implements`; fewer than two distinct participants) is deleted with its contents, and the fixpoint continues from it. The package policy guards that holder: under `RejectIfNonEmpty` one that contains an element other than a UtilityElement, or a preserved child element, refuses the delete as `EditError::NotEmpty` naming it (SACM-CMD-006), checked after the dangling references. A holder below its bound that loses no id is untouched. A package's `interface` end has no lower bound and is scrubbed. `RejectIfReferenced` and `RejectIfExternalReferencesExist` refuse as for any end."
source = "M5 decisions Q6 (the maintainer, 2026-11-18); D-POLICY; ADR 0031; ADR 0039 D5"
kind = "editing"
status = "implemented"
depends_on = ["LIB-EDIT-005", "LIB-EDIT-006", "SACM23-ARG-014", "SACM23-ARG-015", "SACM23-ART-012", "SACM23-ART-013"]
code = ["crates/sacm/src/edit/delete.rs", "crates/sacm/src/edit.rs", "docs/adr/0039-package-interfaces-and-bindings.md"]
tests = [
  "crates/sacm/tests/delete.rs::lib_edit_019_deleting_an_implemented_package_is_cross_package_reference_by_default",
  "crates/sacm/tests/delete.rs::lib_edit_019_reject_if_referenced_names_the_first_holder",
  "crates/sacm/tests/delete.rs::lib_edit_019_scrub_deletes_an_interface_left_without_implements",
  "crates/sacm/tests/delete.rs::lib_edit_019_delete_referencing_relationships_does_the_same",
  "crates/sacm/tests/delete.rs::lib_edit_019_the_package_policy_guards_the_holder",
  "crates/sacm/tests/delete.rs::lib_edit_019_a_binding_left_with_one_participant_is_deleted_to_a_fixpoint",
  "crates/sacm/tests/delete.rs::lib_edit_019_a_binding_keeping_two_distinct_participants_survives",
  "crates/sacm/tests/delete.rs::lib_edit_019_participants_count_as_distinct_ids",
  "crates/sacm/tests/delete.rs::lib_edit_019_a_holder_below_its_bound_that_loses_no_id_is_untouched",
  "crates/sacm/tests/delete.rs::lib_edit_019_artifact_holders_cascade_across_two_levels",
  "crates/sacm/tests/delete.rs::lib_edit_019_after_conditions_hold",
  "crates/sacm/tests/delete.rs::lib_edit_019_preview_and_apply_agree_and_join_the_atomic_set",
  "crates/sacm/tests/delete.rs::lib_edit_019_deleting_an_interface_with_a_package_interface_end_is_cross_package_by_default",
  "crates/sacm/tests/delete.rs::lib_edit_019_serde_unchanged",
  "crates/sacm/tests/delete.rs::lib_edit_019_check_4_guards_only_interfaces_and_bindings",
  "crates/sacm/tests/delete.rs::lib_edit_019_check_4_counts_a_preserved_child",
]
acceptance = [
  "`lib_edit_019_deleting_an_implemented_package_is_cross_package_reference_by_default`: delete `r` gives `CrossPackageReference{holder:\"k\",end:\"implements\",id:\"r\"}`.",
  "`lib_edit_019_reject_if_referenced_names_the_first_holder`: `ApplyReferencePolicy` with default references gives `Referenced{holder:\"k\",end:\"implements\",id:\"r\"}`. Delete `i` gives `Referenced{holder:\"p\",end:\"interface\",id:\"i\"}`.",
  "`lib_edit_019_scrub_deletes_an_interface_left_without_implements`: delete `r`, Apply, Scrub gives `deleted_ids [r,k,kc,e]`, empty `changed_ids`, and dangling `[(k,implements,r,crosses),(e,implements,r,crosses)]`.",
  "`lib_edit_019_delete_referencing_relationships_does_the_same`: the same as 3.",
  "`lib_edit_019_the_package_policy_guards_the_holder`: the same as 3 with `RejectIfNonEmpty` gives `NotEmpty{element:\"k\",contained:1}` and Display `the element \"k\" contains 1 element that is no UtilityElement, and the delete is not recursive`. The document is `==` before and after. Deleting `r` when `k` is removed first succeeds, with `e` cascaded and no NotEmpty (`e` holds only a Note).",
  "`lib_edit_019_a_binding_left_with_one_participant_is_deleted_to_a_fixpoint`: delete `i`, Apply, Scrub gives `deleted_ids [i,ci,b,bi,bj,bl]` and `changed_ids [p]`. Dangling: `[(p,interface,i,true),(b,participantPackage,i,true),(bi,citedElement,ci,true),(bl,source,bi,false),(bl,target,bj,false)]`. `j` survives unchanged.",
  "`lib_edit_019_a_binding_keeping_two_distinct_participants_survives`: with `b=[i,j,q]`, delete `i` gives `deleted [i,ci]` and `changed [p,b,bi]`.",
  "`lib_edit_019_participants_count_as_distinct_ids`: with `b=[i,i,j]`, delete `j` gives `deleted [j,dj,b,bi,bj,bl]` and `changed [q]`.",
  "`lib_edit_019_a_holder_below_its_bound_that_loses_no_id_is_untouched`: read from XMI, `b` has `participantPackage=\"i\"`; delete `r` leaves `b` out of `changed_ids`. Delete `i` deletes `b`. With `[i, zz]` and `zz` dangling, delete `i` deletes `b`.",
  "`lib_edit_019_artifact_holders_cascade_across_two_levels`: delete ArtifactPackage `tests` (root interface `tests_api` empty; binding `[tests_api, requirements_api]`) gives `deleted [tests…, tests_api, binding…]`.",
  "`lib_edit_019_after_conditions_hold`: LIB-EDIT-005's after-conditions and LIB-API-014's referrers hold after every case.",
  "`lib_edit_019_preview_and_apply_agree_and_join_the_atomic_set`: the cases join `edit_atomic.rs`.",
  "`lib_edit_019_deleting_an_interface_with_a_package_interface_end_is_cross_package_by_default`: SACM-CMD-007, as Q6 states.",
  "`lib_edit_019_serde_unchanged`: the existing JSON of `DeleteElement` reads the same.",
]

