kind = "model"
status = "planned"
depends_on = ["SACM23-TERM-003"]

[[row]]
id = "SACM23-TERM-005"
area = "TERM"
milestone = "M4"
title = "Expression"
requirement = "Expression is represented with its `element` references to ExpressionElements, created, round-tripped and editable."
