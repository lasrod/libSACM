depends_on = ["SACM23-ARG-004", "SACM23-ARG-007", "SACM23-ARG-006", "SACM23-ARG-013"]
notes = "Found in slice 0043 research; severity chosen by the maintainer on 2026-11-14. Slice 0057: reworded for ArtifactAssetRelationship and the SACM23-XMI-009 spellings; re-check there. Slice 0065: reworded for ExpressionLangString (SACM23-BASE-009); re-check there. Slice 0066: reworded for the ARG/ART package interfaces and bindings (SACM23-ARG-014, -015, SACM23-ART-012, -013, LIB-EDIT-019); re-check there."
acceptance = [
