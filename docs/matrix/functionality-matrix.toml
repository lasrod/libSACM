[[row]]
id = "SACM23-XMI-028"
area = "XMI"
milestone = "M4"
title = "The text spelling TerminologyElement read on import"
requirement = "Tolerant import reads the §10.4 text spelling `TerminologyElement` of a TerminologyPackage's composite role (ptc/22-03-13 `terminologyElement`; spec defect D9) under SACM23-XMI-009's rules: the child is read under the role `terminologyElement` in document order among its siblings, with one SACM-XMI-013 Warning at its start tag affecting the package. A strict read keeps it whole as preserved content of the package with one SACM-XMI-013 Error, so a strict write refuses the document (SACM-XMI-006). `TerminologyElement` under any other kind, and as a TerminologyGroup's end (§10.3 spells that end `terminologyElement`), is ordinary content (SACM-XMI-003). Export writes `terminologyElement`."
source = "formal/23-05-08 §10.4 (p. 28) \"TerminologyElement:TerminologyElement[0..*] (composition)\"; §10.3 (p. 28) \"terminologyElement[0..*]\"; ptc/22-03-13 Terminology::TerminologyPackage `terminologyElement`; spec defect D9; D-TEXT-MODEL; the maintainer's M3 decision 3; ADR 0034 amendment 3"
kind = "xmi"
status = "verified"
verification = "docs/verification/0062-terminology.md"
depends_on = ["SACM23-TERM-001", "SACM23-XMI-009"]
code = ["crates/sacm/src/xmi/roots.rs"]
tests = [
  "crates/sacm/tests/terminology_element_spelling.rs::sacm23_xmi_028_the_fixture_reads_tolerantly_with_two_warnings_and_writes_exactly_the_golden_file",
  "crates/sacm/tests/terminology_element_spelling.rs::sacm23_xmi_028_a_strict_read_keeps_each_spelled_child_as_preserved_content_with_an_error",
  "crates/sacm/tests/terminology_element_spelling.rs::sacm23_xmi_028_the_messages_name_the_spelling_the_role_the_row_and_the_clause",
  "crates/sacm/tests/terminology_element_spelling.rs::sacm23_xmi_028_an_untyped_or_misplaced_spelled_child_is_reported_as_argumentation_element_is",
  "crates/sacm/tests/terminology_element_spelling.rs::sacm23_xmi_028_terminology_element_elsewhere_is_unknown_content_with_no_spelling_warning",
  "crates/sacm/tests/terminology_element_spelling.rs::sacm23_xmi_028_export_writes_terminology_element_for_every_child",
]
acceptance = [
  "`terminology-element-spelling.sacm.xmi` reads tolerantly with exactly two SACM-XMI-013 Warnings, at 5:3 and 8:3, affecting `[terms]`, and no other diagnostic. The children are `[blade, parts, blade_part]` in that order, and `validate` gives no finding. A strict `xmi::write` gives exactly `golden/terminology-element-spelling.golden.sacm.xmi`, which reads strictly with no diagnostic and `==` to the tolerant read.",
  "A strict read of the same input gives exactly two SACM-XMI-013 Errors at 5:3 and 8:3, and the package holds preserved content. Its children are `[blade_part]`; `validate` gives SACM-REF-003 for `element` `blade` and for `category` `parts`. A strict write is `WriteError::PreservedContent`, and a tolerant write writes the input's two spelled children back as read.",
  "Messages: tolerant `the element \"TerminologyElement\" in the root element \"sacm:TerminologyPackage\" is spelled as in the text of §10.4, and the role is terminologyElement; it is read as terminologyElement, which write writes`; strict, the same reason ending `; it is kept as preserved content, and a tolerant read reads the name as terminologyElement`. Requirement SACM23-XMI-028, clause `10.4`.",
  "An untyped `<TerminologyElement xmi:id=\"x\"/>` and one typed `sacm:Claim` give the same codes, severities and locations as the same inputs spelled `argumentationElement` under an ArgumentPackage. `<TerminologyElement>` in an AssuranceCasePackage, an ArgumentPackage, an ArtifactPackage or a TerminologyGroup, `TerminologyElement=\"a\"` on a TerminologyGroup, and `<argumentationElement>` in a TerminologyPackage, are SACM-XMI-003 in both modes, with no SACM-XMI-013.",
]

[[row]]
id = "SACM23-TERM-001"
area = "TERM"
milestone = "M4"
title = "TerminologyPackage"
requirement = "TerminologyPackage (§10.4; a TerminologyElement, so a Base::ArtifactElement, §10.2) is read and written as a root, bare or inside `xmi:XMI` (the Terminology unit of interchange, §2.5); in an AssuranceCasePackage's `terminologyPackage` role, untyped or typed `sacm:TerminologyPackage`; nested, typed, in another TerminologyPackage's `terminologyElement` role; and typed in an ArtifactPackage's `artifactElement` role (ADR 0014). It holds its TerminologyElements in the composite role `terminologyElement : TerminologyElement [0..*]` in document order; TerminologyGroup is admitted (LIB-API-008, spec defect D9). An untyped `terminologyElement` child is `MissingType` (SACM-XMI-005); one in reference form is a not-yet-read proxy (SACM23-XMI-019, SACM23-XMI-027). A TerminologyPackageInterface or TerminologyPackageBinding child is refused as `Interim` naming SACM23-TERM-007 or SACM23-TERM-008, and the package's `interface` end as `Interim(SACM23-TERM-007)` (LIB-API-011); a tolerant read keeps each with SACM-XMI-014. The §10.4 spelling `TerminologyElement` is SACM23-XMI-028. `edit::CreateTerminologyPackage` creates one as a root or a child (ADR 0034 amendment 3)."
source = "formal/23-05-08 §10.4 (p. 28) \"The TerminologyPackage is the container element for SACM terminology assets.\", \"TerminologyElement:TerminologyElement[0..*] (composition) - TerminologyElements contained in the TerminologyPackage, it can be either TerminologyPackage (and its sub-types) or TerminologyAssets (or its sub-types).\", \"TerminologyPackages can be nested.\"; §10.2 (p. 27) \"TerminologyElement extends Base::ArtifactElement, this implies that all elements in the Terminology package are artifacts.\"; §2.5 (p. 5) \"The top object of the Terminology package as a unit of interchange shall be the Terminology::TerminologyPackage element.\"; §9.2 (p. 24) \"terminologyPackage: TerminologyPackage [0..*] (composition)\"; ptc/22-03-13 Terminology::TerminologyPackage (`terminologyElement` aggregation=\"composite\", 0..*; `interface : TerminologyPackageInterface [0..*]`); spec defect D9; ADR 0014; ADR 0034 amendment 3"
kind = "model"
status = "verified"
verification = "docs/verification/0062-terminology.md"
depends_on = ["SACM23-AC-001", "SACM23-XMI-001", "SACM23-XMI-005", "SACM23-XMI-016", "LIB-API-008", "LIB-API-011", "LIB-COMPAT-010", "SACM23-ART-001"]
notes = "Reads `TerminologyPackage` as an interchange root, bare or inside `xmi:XMI` (SACM23-XMI-001, \u00a72.5)."
code = ["crates/sacm/src/edit/terminology.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/refusal.rs", "docs/adr/0034-artifact-packages-assets-and-groups.md"]
