acceptance = [
  "A table-driven test (`crates/sacm/tests/diagnostic_templates.rs`) gives one input for each of the 102 diagnostic templates: a tolerant or strict read, or `validate`, of a document built through the public API. It checks `code()`, `severity()`, `requirement_id()`, `clause()`, `template()`, every argument by name, kind and value, and `message()`. It also checks the table against itself: the pattern rendered with the arguments is the message, and the inputs cover the 102 templates once each. The message half runs green on the code before the slice changes it.",
  "With two descriptions, a Claim `CLM_132` gives a SACM-MULT-001 Warning (SACM23-VAL-011, clause 8.6). Its message is `Claim \"CLM_132\" has 2 descriptions (description:Description[0..1])`, its template `SACM-MULT-001/too-many`, and its arguments `[class: \"Claim\", id: \"CLM_132\", count: 2, property: \"description\", type: \"Description\", multiplicity: \"0..1\"]`. Its `affected()` is `[CLM_132]`.",
  "Every line of `tests/data/golden/messages-0.1.0.txt` is unchanged.",
  "A diagnostic built with `test-support`'s `Diagnostic::new` has its code's text as `template()` and no `arguments()`. In `crates/sacm/src`, no file but `diagnostic.rs` builds a `Diagnostic` other than through a template, and `Diagnostic::create` no longer exists.",
  "With `serde`, every value of `diagnostics.json` writes `template` and `arguments` after `message`, and one of them comes from a real `validate` (acceptance 2). `diagnostics-0.1.0.json`, the 0.1.0 golden file byte for byte, reads with each template equal to its code's text and no arguments, and serializes again as the first two values of `diagnostics.json`. The `Invalid` value of `write-errors.json` carries its diagnostic's template and arguments. These inputs are refused: `template` without `arguments`, `arguments` without `template`, or either as `null`; an unknown template, a refusal's template, or another code's template; the code's text as template with arguments; arguments that are missing, extra, out of order or of the wrong kind; and a refusal record that names a diagnostic template.",
  "Two diagnostics equal in the seven ADR 0011 keys order by template id, then by arguments. `cmp` is `Equal` exactly when the diagnostics are `==`. `Argument`, `ArgumentValue` and `Details` are `Clone + Debug + Eq + Hash + Send + Sync + 'static`, and `Argument` and `ArgumentValue` are also `Ord`.",
  "`template.rs` declares 102 templates whose carrier is `Diagnostic`. The catalog's `## Message templates` table lists all 204 templates (LIB-API-017 acceptance 6 checks it).",
]
status = "verified"
verification = "docs/verification/0064-diagnostic-templates.md"
