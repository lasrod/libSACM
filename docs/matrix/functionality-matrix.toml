[[row]]
id = "SACM23-XMI-005"
area = "XMI"
milestone = "M2"
title = "Reference serialization"
requirement = "A non-containment reference is read from, and written as, an XML attribute in no namespace named by the reference end, whose value is the targets' ids separated by XML white space (xsd:IDREFS; XMI 2.5.1 rules 2h, 2j, 4i) (ADR 0026). In this release the ends are `citedElement` and `abstractForm` (SACM23-BASE-007/008), `metaClaim` (SACM23-ARG-004), `structure` (SACM23-ARG-005), `referencedArtifactElement` (SACM23-ARG-006), `source`, `target` and `reasoning` (SACM23-ARG-007), an ArgumentGroup's `argumentElement` (SACM23-ARG-013), an ArtifactGroup's `artifactElement` (SACM23-ART-011) and an ArtifactAssetRelationship's `source` and `target` (SACM23-ART-010), a package's `interface`, an interface's `implements` and a binding's `participantPackage` (SACM23-ARG-014, SACM23-ARG-015, SACM23-ART-012, SACM23-ART-013); each later end's row inherits the rule. A reference is held as the target id, each token exactly as read (no `#` stripped), and resolves by id across the whole input whatever the order (a later element, another root, the element itself). A reference naming no element (an id absent from the file, or a `name`, `content`, `key`, `location` or `value` id) is kept, written back and reported by `validate` (SACM23-VAL-003); it is never dropped. Two or more ids on a single-valued end is `RepeatedValue` (SACM-MULT-001); an empty or all-white-space value, and `sacm:citedElement`, are kept as preserved content of the element, with SACM-XMI-003 at the attribute's name, never read as absent (LIB-COMPAT-003). Generated ids, in the reader and in edits, skip every referenced id. `xmi::write` writes the ids separated by one space, after the SACMElement flags."
source = "XMI 2.5.1 rule 2h (p. 63) \"either as an XML attribute or as XML elements but not both\"; rule 2j (p. 64) \"The value of the XML attribute contains the XMI ID of each referenced object, separated by a space\"; rule 4i (p. 51); §7.8.5 (p. 19) `type=\"xsd:IDREFS\"`; §7.10.2 (p. 23); XML Schema 1.0 Part 2 §3.3.10, §4.1.2.2 (list types collapse white space); D-PRESERVE; D-ID; ADR 0024; ADR 0026; assurance-forge io/xmi_reader.cpp:877-908, io/xmi_writer.cpp:29-38, 86-91"
kind = "xmi"
status = "verified"
verification = "docs/verification/0051-m2-close.md"
depends_on = ["SACM23-XMI-004", "SACM23-XMI-014", "SACM23-XMI-025", "SACM23-BASE-004"]
notes = "Slice 0057: reworded for ArtifactAssetRelationship and the SACM23-XMI-009 spellings; re-check there. Slice 0060 (M3 close audit): reworded; re-check there. Slice 0066: reworded for the ARG/ART package interfaces and bindings (SACM23-ARG-014, -015, SACM23-ART-012, -013, LIB-EDIT-019); re-check there."
acceptance = [
  "`citedElement=\"c2\"` on a Claim and `abstractForm=\"p2\"` on a package read with those targets; `write` emits the same attributes, read-write-read is equal and the second write gives the same bytes.",
  "A forward reference, a reference into another root of the same `xmi:XMI`, and a self-reference each read, round-trip and give no SACM-REF-001.",
  "`citedElement=\"nope\"` reads in both modes and is held as `nope`; a tolerant write writes it back; `validate` gives SACM-REF-001; a strict write fails with `WriteError::Invalid` holding it.",
  "`\" c2 \"` and `\"&#9;c2&#10;\"` read as `c2` with no diagnostic, and write as `citedElement=\"c2\"`.",
  "`citedElement=\"a b\"` is `RepeatedValue` in strict mode (tolerant: LIB-COMPAT-001), with one location per id at its first character (a character reference counts as the character it names; LF, CRLF and a lone CR each end a line) and `location()` the second id; `citedElement=\"\"` and `\"   \"`, and `sacm:citedElement`, are each kept as preserved content of the element, with one SACM-XMI-003 at the attribute's name in both modes, never read as absent (LIB-COMPAT-003).",
  "`citedElement=\"#c2\"` is the id `#c2` (unresolved, SACM-REF-001); a token equal to a non-NCName element id held as written (ADR 0024) resolves to it.",
  "A target id holding `&`, `<` or `\"` is written escaped and reads back equal.",
  "An id-less element read beside `citedElement=\"claim_1\"` (a dangling target) gets a generated id other than `claim_1`; an edit's generated id also skips a referenced id.",
  "Attribute order: `xmi:type`, `xmi:id`, `gid`, `isCitation`, `isAbstract`, `citedElement`, `abstractForm`, then the class's own attributes; output is deterministic.",
  "A 1 MiB reference value or many tokens do not panic.",
]
tests = [
  "crates/sacm/tests/repeated_reference_tokens.rs::sacm23_xmi_005_two_ids_display_the_count_and_both_locations",
  "crates/sacm/tests/repeated_reference_tokens.rs::sacm23_xmi_005_an_id_after_a_character_reference_separator_is_located_at_its_character",
  "crates/sacm/tests/repeated_reference_tokens.rs::sacm23_xmi_005_a_300000_token_single_valued_end_has_a_bounded_display",
  "crates/sacm/tests/repeated_reference_tokens.rs::sacm23_xmi_005_each_id_of_a_repeated_reference_attribute_is_located_at_its_own_column",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_005_cited_element_on_a_claim_and_abstract_form_on_a_package_read_and_round_trip",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_005_the_fixture_reads_with_its_references_and_round_trips",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_005_forward_cross_root_and_self_references_resolve_and_round_trip",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_005_a_dangling_reference_is_kept_written_back_and_refused_only_by_a_strict_write",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_005_white_space_around_a_token_is_not_part_of_the_id",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_005_two_tokens_on_a_single_valued_end_are_repeated_value_at_each_token",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_005_an_empty_or_qualified_reference_attribute_is_preserved_never_absent",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_005_a_hash_is_part_of_the_token_and_a_non_ncname_id_resolves_as_written",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_005_a_target_id_with_markup_characters_is_written_escaped_and_reads_back_equal",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_005_a_generated_id_skips_an_id_that_is_only_referenced",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_005_an_edits_generated_id_skips_a_referenced_id",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_005_the_flags_and_references_are_written_after_gid_and_before_the_class_attributes",
  "crates/sacm/tests/xmi_references.rs::sacm23_xmi_005_a_one_mib_reference_or_many_tokens_do_not_panic",
]
code = ["crates/sacm/src/model/reference.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/output.rs", "crates/sacm/src/model/document.rs"]

[[row]]
id = "SACM23-BASE-007"
area = "BASE"
milestone = "M2"
title = "Citations"
requirement = "Every element of every kind holds `isCitation`, a Boolean defaulting to false (§8.2 `isCitation[0..1]=false`; `SacmElement::is_citation()`), and an optional `citedElement` reference to any SACMElement (`cited_element() -> Option<&ElementId>`) (ADR 0026). They are independent: either may be present without the other; nothing repairs a file on read. `xmi::read` reads `isCitation` in both modes from the unqualified attribute or a value element (SACM23-XMI-014), as an xsd:boolean: white space collapsed, `true`/`1` true, `false`/`0` false, absent false (`false` equals absent); in strict mode any other value is `ReadError::InvalidLiteral` (SACM-ENUM-001) quoting it, and given twice it is `RepeatedValue` (tolerant: LIB-COMPAT-001, SACM23-VAL-006). `citedElement` follows SACM23-XMI-005/015. `xmi::write` writes `isCitation=\"true\"` when true and nothing when false. `semantic_compare` reports `Difference::IsCitation` and `CitedElement`. Setting them is LIB-EDIT-008/009; the §8.2 rule is SACM23-VAL-007."
source = "formal/23-05-08 §8.2 (p. 18) \"isCitation[0..1]=false - a flag to indicate whether the SACMElement cites another SACMElement.\" and \"citedElement:SACMElement[0..1] - a reference to another SACMElement that the SACMElement cites\"; ptc/22-03-13 Base::SACMElement.isCitation ([0..1], no default) and Association citedElement ([0..1], unnamed end, D8); XMI 2.5.1 §7.8.4, rule 2i, §9.4.1 \"Properties whose values are the default values are not serialized\"; XML Schema 1.0 Part 2 §3.2.2.1; ADR 0021 amendment 1; ADR 0026; assurance-forge model/element.h:69-115, io/xmi_reader.cpp:395-398, 897-905"
kind = "model"
status = "verified"
verification = "docs/verification/0042-m2-references.md"
depends_on = ["SACM23-BASE-003", "SACM23-XMI-005", "SACM23-XMI-014", "SACM23-BASE-006", "LIB-RT-001"]
notes = "Slice 0037: read in the attribute and the element form by SACM23-XMI-014's rules; the value is a Boolean, white space collapsed and `true`/`false`/`1`/`0` accepted (XSD 2 §4.3.6)."
acceptance = [
  "Every kind starts with `is_citation()` false and no `cited_element()`.",
  "On every readable kind (both packages, Claim, the four UtilityElements): `true`, `1`, `\" true \"` and `\"&#9;1&#10;\"` read true; `false`, `0` and absent read false, and `false` compares equal to absent.",
  "`TRUE`, `True`, `yes`, `\"\"` and `t rue` are `InvalidLiteral` in strict mode, quoting the value and naming `isCitation`, never read as false; a tolerant read keeps the attribute as preserved content, with a SACM-ENUM-001 Warning, and holds the default (SACM23-VAL-006).",
  "`<isCitation> true </isCitation>` reads; with an attribute or a child element it is kept whole as preserved content of its element, with SACM-XMI-003 at its start tag (LIB-COMPAT-003); attribute plus element, or two elements, is `RepeatedValue`; `sacm:isCitation`, as an attribute or an element, is preserved at it.",
  "`write` gives `isCitation=\"true\"` after `gid`, nothing for false, and `\"true\"` for a value read as `\"1\"`; the output round-trips.",
  "`isCitation` true with no `citedElement`, and `citedElement` with `isCitation` false, both read and round-trip unchanged.",
  "`isCitation` on or in `name`, `content`, `key` or `value` keeps the whole `name`, `content` or `key` as preserved content of its owner, with SACM-XMI-003 at its start tag (LIB-COMPAT-003).",
  "`semantic_compare` reports `IsCitation` and `CitedElement` after `Gid`.",
]
tests = [
