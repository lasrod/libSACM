[[row]]
id = "SACM23-BASE-003"
area = "BASE"
milestone = "M1"
title = "ModelElement name"
requirement = "Every element of a ModelElement kind (the 34 ElementKinds other than Description, ImplementationConstraint, Note and TaggedValue) has one `name` LangString (§8.6 `name:LangString[1]`), stored in the Document and returned by its view exactly as given (ADR 0012). A document can hold a ModelElement whose name is missing, as a file can leave it out; the view reports that as no name, distinct from a name whose fields are absent or empty, and nothing invents a name (ADR 0013). A name whose `lang` or `content` is absent or empty is not a missing name. Elements of the four UtilityElement kinds have no name."
source = "formal/23-05-08 §8.6: \"name:LangString[1] (composition) - the name of the ModelElement.\"; §8.7 UtilityElement \"Superclass SACMElement\"; §12.14 ArtifactAssetRelationship \"Superclass ArtifactAsset\" (D-TEXT-MODEL); §8.3 `content:String[0..1]`; ptc/22-03-13 Base::ModelElement name (composite LangString, no bounds); ADR 0012; ADR 0013; assurance-forge libs/sacm model/element.h"
kind = "model"
status = "verified"
verification = "docs/verification/0016-m1-names.md"
depends_on = ["LIB-API-002", "LIB-API-003", "SACM23-BASE-001"]
acceptance = [
  "For each of the 34 ModelElement kinds, `insert(.., Some(name))` and then `get(id).unwrap().name()` returns `Some` equal to `name`, for all nine absent/empty/non-empty `lang` × `content` combinations, including `LangString::default()`.",
  "A ModelElement kind inserted with `None` has `name() == None`, which differs from `Some(&LangString::default())` and from `Some(&LangString::new(\"\"))` (ADR 0013).",
  "For each of the four UtilityElement kinds: `insert(.., None)` succeeds and `name()` is `None`; `insert(.., Some(n))` with any `n`, including `LangString::default()`, returns `Err(InsertError::NameNotAllowed(id, kind))` and leaves the document unchanged (`element_count`, `contains`, `elements()`); the empty-id, duplicate-id and unknown-parent refusals take precedence.",
  "`insert` accepts a name exactly for the kinds where `is_a(AbstractClass::ModelElement)` holds: a table test lists the 34, including ArtifactAssetRelationship, and the 4 without.",
  "Names are not identifiers: two elements with the same name are both kept, and `get` and `contains` look up by id only.",
  "Inserting siblings or children leaves every existing name unchanged, and a cloned `Document` returns the same name for every element.",
  "`name()` returns `Option<&'a LangString>` borrowing the document, so the name outlives the view it came from. A view's `Debug` shows kind and id only, not the name.",
  "Hostile names (1 MiB content, U+0000, CR/LF/TAB, NFC and NFD forms) are kept byte for byte, and `insert`, `name()` and `Debug` never panic.",
  "`InsertError::NameNotAllowed` follows ADR 0011 and the LIB-API-004 acceptance, like every other variant: e.g. `element \"note_1\" of kind Note cannot have a name`.",
]
code = ["crates/sacm/src/model/document.rs"]
tests = [
  "crates/sacm/tests/element_name.rs::sacm23_base_003_a_cloned_document_returns_the_same_name_for_every_element",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_a_default_name_is_a_name_not_a_missing_one",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_artifact_asset_relationship_carries_a_name",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_earlier_refusals_take_precedence_over_name_not_allowed",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_every_model_element_kind_keeps_each_of_the_nine_names",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_get_and_contains_look_up_by_id_not_by_name",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_hostile_names_are_kept_byte_for_byte",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_insert_accepts_a_name_exactly_for_model_element_kinds",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_inserting_siblings_and_children_leaves_every_name_unchanged",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_missing_default_and_empty_names_are_three_different_answers",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_model_element_inserted_without_a_name_has_none",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_name_borrows_the_document_not_the_view",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_name_not_allowed_display_is_exact",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_name_not_allowed_names_the_id_and_kind_on_one_line",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_the_kinds_with_a_name_are_exactly_the_34_model_elements",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_two_elements_with_the_same_name_are_both_kept",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_utility_element_refuses_any_name_and_leaves_the_document_unchanged",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_utility_element_without_a_name_is_accepted_and_has_none",
  "crates/sacm/tests/element_name.rs::sacm23_base_003_view_debug_shows_kind_and_id_not_the_name",
]

[[row]]
id = "SACM23-AC-001"
area = "AC"
milestone = "M1"
title = "AssuranceCasePackage and nesting"
requirement = "AssuranceCasePackage (§9.2, a Base::ArtifactElement) is represented as a root or nested, and contains sub-packages through its four composition roles, each 0..*: `assuranceCasePackage` (AssuranceCasePackage, its interface and binding), `argumentPackage` (ArgumentPackage, its interface and binding), `artifactPackage` (ArtifactPackage, its interface and binding) and `terminologyPackage` (TerminologyPackage, its interface and binding). Each sub-package kind fits exactly one of the four roles; which role a child fills becomes observable with SACM23-XMI-016. Children keep document order across roles (ADR 0010 D2); the metamodel declares no order. Which kinds may be contained is LIB-API-008. The `interface` reference is SACM23-AC-002. Sub-package contents are SACM23-ARG-001, SACM23-ART-001 and SACM23-TERM-001. Interchange roots and the compliance point are SACM23-XMI-001, SACM23-XMI-013 and SACM23-CP-001."
source = "formal/23-05-08 §9.2 (pp. 23-24): \"AssuranceCasePackage is a sub-class of Base::ArtifactElement.\"; \"assuranceCasePackage: AssuranceCasePackage [0..*] (composition) - a collection of optional sub-packages\"; \"argumentPackage:Argument::ArgumentPackage[0..*] (composition) - a number of optional argument packages.\"; \"artifactPackage: ArtifactPackage [0..*] (composition) - a number of optional artifact sub-packages\"; \"terminologyPackage: TerminologyPackage [0..*] (composition) - a number of optional terminology sub-packages\"; \"It is a recursive container, and may contain one or more sub-packages.\"; §9.3/§9.4 \"Superclass AssuranceCasePackage\"; §2.4 \"The top object of the Assurance Case package as a unit of interchange shall be the SACM::AssuranceCasePackage element.\" (CP-001); ptc/22-03-13 AssuranceCase::AssuranceCasePackage (four aggregation=\"composite\" ends, 0..*, none isOrdered); ADR 0010 D2; assurance-forge libs/sacm model/assurance_case.h, io/xmi_reader.cpp attach_child"
kind = "model"
status = "verified"
verification = "docs/verification/0017-m1-assurance-case-package.md"
depends_on = ["SACM23-BASE-003", "LIB-API-008"]
acceptance = [
  "`ElementKind::AssuranceCasePackage` has `name() == \"AssuranceCasePackage\"` and package AssuranceCase; `is_a` holds for ArtifactElement, ModelElement and SACMElement, and not for ArgumentationElement, TerminologyElement or UtilityElement (§9.2 \"Superclass Base::ArtifactElement\").",
  "An AssuranceCasePackage inserted with no parent is in `roots()` and has `parent() == None`. In a chain of three nested AssuranceCasePackages, each inner one is absent from `roots()`, its `parent()` is the next outer one, and it is in that parent's `children()`.",
  "Order across roles: under one AssuranceCasePackage, children inserted interleaved from all four roles (ArgumentPackage a1, AssuranceCasePackage n1, ArtifactPackage f1, ArgumentPackageInterface a2, TerminologyPackage t1, AssuranceCasePackageBinding n2, TerminologyPackageInterface t2) come back from `children()` in exactly that order, each with that package as `parent()`; filtering by `is_kind_of` against the four role types gives a1, a2 / n1, n2 / f1 / t1, t2; `elements()` visits n1's subtree before f1.",
  "Multiplicity 0..* is unbounded: an AssuranceCasePackage with no children is held with an empty `children()`, and one with 1,000 ArgumentPackage children keeps all of them in insertion order.",
]
code = ["crates/sacm/src/model/containment.rs", "crates/sacm/src/model/document.rs", "crates/sacm/src/model/kind.rs"]
tests = [
  "crates/sacm/tests/assurance_case_package.rs::sacm23_ac_001_a_thousand_argument_packages_are_kept_in_insertion_order",
  "crates/sacm/tests/assurance_case_package.rs::sacm23_ac_001_assurance_case_package_kind_is_an_artifact_element_of_assurance_case",
  "crates/sacm/tests/assurance_case_package.rs::sacm23_ac_001_assurance_case_package_without_children_is_held",
  "crates/sacm/tests/assurance_case_package.rs::sacm23_ac_001_children_from_all_four_roles_keep_insertion_order",
  "crates/sacm/tests/assurance_case_package.rs::sacm23_ac_001_elements_visit_a_sub_package_subtree_before_the_next_sibling",
  "crates/sacm/tests/assurance_case_package.rs::sacm23_ac_001_filtering_children_by_role_type_gives_each_role_in_order",
  "crates/sacm/tests/assurance_case_package.rs::sacm23_ac_001_root_assurance_case_package_is_in_roots_without_a_parent",
  "crates/sacm/tests/assurance_case_package.rs::sacm23_ac_001_three_nested_assurance_case_packages_chain_through_parent_and_children",
]

[[row]]
id = "SACM23-ARG-001"
area = "ARG"
milestone = "M1"
title = "ArgumentPackage"
requirement = "ArgumentPackage (§11.4, superclass ArgumentationElement, so an ArtifactElement by §11.3) is represented as a root, the Argumentation unit of interchange (§2.2), or nested: in an AssuranceCasePackage (SACM23-AC-001), in another ArgumentPackage (§11.4 \"can also be nested\"), or in an ArtifactPackage (ADR 0014). Its `argumentElement` composition (ArgumentationElement [0..*]) holds any mix of the 12 ArgumentationElement kinds as children, in document order and interleaved with its ModelElement utility children (ADR 0010 D2). Which kinds are admitted is LIB-API-008. The §11.4 homogeneity constraint is a content rule reported by SACM23-VAL-012 and is never refused on insertion (D-PKG-HOMOG, D-VAL-LAYER). The `interface` reference is SACM23-ARG-014; the role element and the `argumentationElement` spelling are SACM23-XMI-016 and SACM23-XMI-009; interchange roots and the compliance point are SACM23-XMI-001 and SACM23-CP-002."
source = "formal/23-05-08 §11.4 (p. 36): \"Superclass ArgumentationElement\"; \"argumentationElement:ArgumentationElement[0..*] (composition) - a collection of ArgumentationElements forming a structured argument\"; \"ArgumentPackages elements can also be nested.\"; \"If an ArgumentPackage has nested ArgumentPackages, then it is only allowed to contain ArgumentPackages.\"; §11.3 \"ArgumentationElement extends Base::ArtifactElement.\"; §2.2 \"The top object of the Argumentation package as a unit of interchange shall be the Argumentation::ArgumentPackage element of the SACM.\"; ptc/22-03-13 Argumentation::ArgumentPackage (`argumentElement` aggregation=\"composite\", 0..*, not isOrdered); ADR 0010 D2; D-PKG-HOMOG; D-VAL-LAYER; assurance-forge libs/sacm model/argumentation.h ArgumentPackage"
kind = "model"
status = "verified"
verification = "docs/verification/0018-m1-argument-package-claim.md"
depends_on = ["SACM23-AC-001", "LIB-API-008"]
acceptance = [
  "Standalone root: an ArgumentPackage inserted with no parent, in a document with no AssuranceCasePackage, is the only entry in `roots()` and has `parent() == None` (§2.2).",
  "The 12 kinds mixed under one role: one of each ArgumentationElement kind inserted under one root ArgumentPackage in a non-model order (AssertedEvidence, Claim, ArgumentPackageBinding, ArgumentGroup, ArtifactReference, ArgumentPackage, AssertedContext, ArgumentReasoning, ArgumentPackageInterface, AssertedInference, AssertedArtifactContext, AssertedArtifactSupport) come back from `children()` in exactly that order, each with the package as `parent()`.",
  "Order across roles: Description d1, Claim c1, Note n1, ArgumentReasoning r1, TaggedValue t1 and Claim c2, inserted in that order, come back from `children()` in that order; filtering by `is_a(ArgumentationElement)` gives c1, r1, c2 and by `is_a(UtilityElement)` gives d1, n1, t1.",
  "Nesting: in the chain AssuranceCasePackage -> ArgumentPackage p1 -> p2 -> p3, with a Claim under p3, each inner package's `parent()` is the next one out and it is in that parent's `children()`; only the AssuranceCasePackage is in `roots()`; `elements()` visits case, p1, p2, p3 and the claim in pre-order.",
  "Homogeneity is not structural: under one ArgumentPackage, inserting a plain ArgumentPackage and then a Claim succeeds, and so does the reverse order; both children are held (the report is SACM23-VAL-012's).",
  "Negative containment: an Artifact, Term, AssuranceCasePackage, ArtifactPackage or TerminologyPackage under an ArgumentPackage is refused with `InsertError::ContainmentNotAllowed` naming both ids and kinds, and `element_count()` does not change.",
  "0..* is unbounded: an empty ArgumentPackage has an empty `children()`, and one holding 1,000 Claims keeps them all in insertion order.",
]
code = ["crates/sacm/src/model/containment.rs", "crates/sacm/src/model/document.rs"]
tests = [
  "crates/sacm/tests/argument_package.rs::sacm23_arg_001_all_twelve_argumentation_kinds_keep_insertion_order",
  "crates/sacm/tests/argument_package.rs::sacm23_arg_001_an_empty_argument_package_has_no_children",
  "crates/sacm/tests/argument_package.rs::sacm23_arg_001_argument_package_is_a_standalone_root",
  "crates/sacm/tests/argument_package.rs::sacm23_arg_001_argument_packages_nest_in_a_case_and_in_each_other",
  "crates/sacm/tests/argument_package.rs::sacm23_arg_001_children_interleave_argumentation_and_utility_elements_in_order",
  "crates/sacm/tests/argument_package.rs::sacm23_arg_001_mixing_a_nested_package_and_a_claim_is_not_refused",
  "crates/sacm/tests/argument_package.rs::sacm23_arg_001_non_argumentation_kinds_are_refused_under_an_argument_package",
  "crates/sacm/tests/argument_package.rs::sacm23_arg_001_one_thousand_claims_keep_insertion_order",
  "crates/sacm/tests/argument_package.rs::sacm23_arg_001_the_mixed_order_holds_each_argumentation_element_kind_once",
]

[[row]]
id = "SACM23-ARG-003"
area = "ARG"
milestone = "M1"
title = "AssertionDeclaration"
requirement = "The AssertionDeclaration enumeration (§11.8) is a `#[non_exhaustive]` enum with exactly the six literals in model order, `asserted` as default (§11.10), and exact, case-sensitive conversion to and from the literal spellings. A failed conversion is an error that follows ADR 0011."
source = "formal/23-05-08 §11.8, §11.10; ptc/22-03-13 Argumentation::AssertionDeclaration, Assertion.assertionDeclaration; ADR 0011; assurance-forge libs/sacm model/argumentation.h"
kind = "model"
status = "verified"
verification = "docs/verification/0015-m1-value-types-round2.md"
depends_on = ["LIB-API-004"]
acceptance = [
  "`AssertionDeclaration::ALL` holds exactly six literals in the order `asserted`, `needsSupport`, `assumed`, `axiomatic`, `defeated`, `asCited` (ptc `ownedLiteral` order; §11.8), and `Ord` follows that order.",
  "`as_str` and `Display` give exactly those six spellings.",
  "Parsing each literal's `as_str()` gives back that literal.",
  "`Default` is `Asserted` (§11.8 \"the default enumeration literal\"; §11.10 `= asserted`; ptc `defaultValue`).",
  "Parsing `\"Asserted\"`, `\"needssupport\"`, `\" asserted\"`, `\"asserted \"`, `\"\"`, `\"justification\"`, `\"byRule\"` and `\"needs\\nSupport\"` fails, and `ParseAssertionDeclarationError::input()` returns the input exactly. It never panics and never falls back to `Asserted`.",
  "`ParseAssertionDeclarationError` follows ADR 0011 amendment 2: a `#[non_exhaustive]` struct with private fields, `Clone + Eq + Debug + std::error::Error + Send + Sync + 'static`, a one-line lowercase message with the input quoted and escaped (`invalid AssertionDeclaration literal \"Asserted\"`), and `source()` `None`.",
  "`AssertionDeclaration` is `#[non_exhaustive]` and `Copy + Eq + Ord + Hash + Debug + Default + Send + Sync` (D-VERSION: SACM 2.4 changes this enumeration).",
]
code = ["crates/sacm/src/model/argumentation.rs"]
tests = [
