[[row]]
id = "LIB-TOOL-005"
area = "TOOL"
milestone = "M0"
title = "Verification records carry a per-row verdict the gate reads"
requirement = "A verified row's verification record must state a PASS verdict for that specific row in a machine-readable line, and the gate checks the verdict rather than mere mention of the id."
source = "Verification 0001 follow-up (a record saying 'LIB-X-001: FAIL' satisfied the substring check)"
kind = "tooling"
status = "verified"
code = ["xtask/src/matrix.rs"]
acceptance = [
  "A verdict-line candidate is a source line that starts at column 0 with `- Row verdict:`. A candidate counts only when it lies outside every hidden range. The hidden ranges are the code blocks (fenced or indented) and the closed comments that the CommonMark parser of ADR 0008 finds (`pulldown-cmark`, `Options::empty()`, with the D7 tab normalisation). A counted candidate that, after removing trailing spaces and tabs, is exactly `- Row verdict: <ROW-ID>: <VERDICT>` is a verdict line, where <VERDICT> is PASS, FAIL or OPEN. Any other counted candidate is malformed. A hidden line is never a verdict line and never malformed.",
  "A verified row passes only if its cited record contains exactly one verdict line for that row, and that line says PASS. The old check, which accepted any mention of the id, is removed.",
  "Each failure is reported with the row id and the record path: no verdict line for the row; more than one verdict line for the row (with the count); a verdict other than PASS (naming it); A candidate whose id is not a well-formed row id (README rule 2, `parse_id`), such as `LIB-TOOL-0011`, `LIB-TOOL-001x`, a lowercase id or an id after two spaces, is malformed (slice 0007 D13 f).",
  "A line that starts with `- Row verdict:` but is not a well-formed verdict line is reported as malformed, with the record path and its 1-based line number.",
  "A fence inside a list item closes where CommonMark closes it, nested items included, and closers are judged relative to the item. The P-005b probes P1, P1b, P6 and P8 (docs/verification/0004-m0-gate-hardening-round2.md) each give exactly the FAIL problem, and P9 gives exactly the no-verdict problem. These controls pass the row: a closed list-item fence followed by PASS, the same with a blank line inside the fence, and every real record.",
  "Fence opener and closer lines are themselves never verdict lines and never malformed, and the line after a closer counts. A closer followed by a character other than a space or tab, for example U+00A0, does not close the fence, so a PASS after it stays hidden (F5).",
  "The hand-written fence model is removed: `xtask` decides hidden lines only through the parser. The parser is used with `Options::empty()`.",
  "Records are strict (ADR 0008 amendment 1; slice 0007 D8 to D11). Each of these is a problem: raw HTML other than a closed comment or the inline tags <br>, <ul>, </ul>, <li>, </li>; a visible verdict-like line that is not at column 0 (indented, nested or block-quoted); a lone CR; a leading byte-order mark. Each is reported with the record path and its line, once per citing row, before the verdict problem.",
  "Every verified row in the real matrix passes. The lead adds the verdict lines to the existing records, the record template (`.claude/skills/sacm-slice/references/verification-record.md`) and `docs/matrix/README.md` rule 5.",
]
depends_on = ["LIB-TOOL-001"]
tests = [
  "xtask/tests/gate_hardening.rs::lib_tool_005_a_single_pass_line_for_the_row_passes",
  "xtask/tests/gate_hardening.rs::lib_tool_005_a_record_without_a_verdict_line_fails_the_row",
