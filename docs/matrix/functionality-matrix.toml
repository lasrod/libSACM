[[row]]
id = "LIB-QA-018"
area = "QA"
milestone = "M2"
title = "Documentation-only pushes skip the code-only CI jobs"
requirement = "A CI job `changes` decides whether the latest push (a pull request's new commits, or a push's before..after) changed any file outside `docs/`, and is true when it cannot tell. A push compared with the commit before it (a pull request's `synchronize`, or a push) is docs-only only if CI succeeded on that commit, so a docs-only push never turns failed, cancelled or unfinished code checks green (Copilot review on #67); a newly opened pull request compares with its base. Only an explicit `false` skips anything: the Windows and macOS test steps, the MSRV job and the PR-diff mutant shards; their required checks pass as skipped. The Ubuntu tests and every other job still run. The `mutants (PR diff)` check passes when every shard passed, or when `changes` succeeded with `false` and the shards were skipped."
source = "ADR 0006 amendment 4 (the maintainer, 2026-11-15)"
kind = "quality"
status = "verified"
verification = "docs/verification/0051-m2-close.md"
depends_on = ["LIB-QA-001"]
acceptance = [
  "The `changes` job has a step that asks the GitHub API whether CI succeeded on the previous commit (`actions: read`), and the detection script gives `false` for a docs-only `synchronize` or push range only when that answer is `true`; when it is `false`, missing or the lookup fails, `code` is `true` (shown by running the script with the answer set each way).",
  "ci.yml has the `changes` job with the `docs/` rule and fail-open default, and the four gates (`test` steps on non-Ubuntu, `msrv`, `mutants-shard`, the `mutants` aggregator) use `!= 'false'` or the explicit skip condition; the Ubuntu test steps are never skipped; a regression test fails if any gate is removed or inverted, or if the rule widens beyond `docs/`.",
  "The detection script gives `false` for a docs-only range and `true` for a range touching any other path, an empty range, or a failing `git diff` (checked by running the script on a scratch repository in the test).",
  "CI on the slice's PR shows a docs-only push skipping the four jobs with all required checks green, and a code push running them (verification evidence: run URLs).",
]
code = [".github/workflows/ci.yml"]
tests = [
