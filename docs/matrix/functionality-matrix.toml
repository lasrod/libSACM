  "In `crates/sacm/tests/artifact_package_interfaces.rs`, tests `sacm23_art_012_…` mirror ARG-014 #1–#11 and #13, with these differences: Roles: `<artifactPackage xmi:type=\"sacm:ArtifactPackageInterface\">` in an AssuranceCasePackage, `<artifactElement xmi:type=…>` in an ArtifactPackage, and as a root. `<argumentElement xmi:type=\"sacm:ArtifactPackageInterface\">` in an ArgumentPackage is kept whole as preserved content of the package, with one SACM-XMI-003 in both modes. Clauses are `12.5` (implements) and `12.2` (interface); types are `ArtifactPackage` and `ArtifactPackageInterface`. An `implements` naming an ArgumentPackage is REF-002. The generated id is `artifact_package_interface_<n>`. There is no homogeneity test, because §11.4 does not apply.",
