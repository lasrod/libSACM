[[row]]
id = "SACM23-VAL-007"
area = "VAL"
milestone = "M2"
title = "Citation constraints"
requirement = "`validation::validate` reports each SACMElement that has a `citedElement` but whose `isCitation` is not true as one SACM-CITE-001 Error (`Code::CITATION_INVALID`), with requirement SACM23-VAL-007, clause `8.2`, affected `[element]` and no location (§8.2 OCL `self.citedElement <> null implies self.isCitation = true`; D-SEV). `isCitation` true with no `citedElement` is not a §8.2 finding (ADR 0026). A dangling `citedElement` gives this finding as well as SACM-REF-001."
source = "formal/23-05-08 §8.2 (p. 18) Constraints \"If citedElement is populated, isCitation must be true. OCL: self.citedElement <> null implies self.isCitation = true\"; D-SEV; ADR 0026; assurance-forge validation/validate.cpp:397-408"
kind = "validation"
status = "verified"
verification = "docs/verification/0042-m2-references.md"
depends_on = ["SACM23-BASE-007", "SACM23-VAL-018", "LIB-COMPAT-007"]
acceptance = [
  "A Claim with `citedElement=\"c1\"` and no `isCitation` gives one SACM-CITE-001: Error, SACM23-VAL-007, clause `8.2`, affected `[claim]`, no location; the same with `isCitation=\"false\"`.",
  "`isCitation=\"true\"` with `citedElement` gives no finding; `isCitation=\"true\"` alone gives no finding.",
  "A dangling `citedElement` without `isCitation` gives both SACM-CITE-001 and SACM-REF-001.",
  "The rule holds on every readable kind; a strict write keeps the element.",
  "`Code::CITATION_INVALID` is SACM-CITE-001, and the catalog row states only the §8.2 OCL direction and names it and SACM23-VAL-007.",
]
tests = [
  "crates/sacm/tests/reference_validation.rs::sacm23_val_007_a_cited_element_without_is_citation_true_is_one_error_on_the_element",
  "crates/sacm/tests/reference_validation.rs::sacm23_val_007_the_fixture_gives_one_error_on_its_claim",
  "crates/sacm/tests/reference_validation.rs::sacm23_val_007_is_citation_true_with_or_without_a_cited_element_gives_no_finding",
  "crates/sacm/tests/reference_validation.rs::sacm23_val_007_a_dangling_cited_element_without_is_citation_gives_both_findings",
  "crates/sacm/tests/reference_validation.rs::sacm23_val_007_the_rule_holds_on_every_readable_kind_and_a_strict_write_keeps_it",
  "crates/sacm/tests/reference_validation.rs::sacm23_val_007_citation_invalid_is_sacm_cite_001_and_its_catalog_row_states_only_the_ocl_direction",
]
