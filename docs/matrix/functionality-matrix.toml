[[row]]
id = "SACM23-ARG-007"
area = "ARG"
milestone = "M2"
title = "AssertedRelationship common features"
requirement = "The shared features of all asserted relationships — `source` (1..*), `target` (1), optional `reasoning` (ArgumentReasoning), required `isCounter` and the inherited Assertion feature `assertionDeclaration` [1] (default `asserted`) — are represented once and available on every relationship kind, round-tripped and editable. `assertionDeclaration` is SACM23-ARG-002 (model) and SACM23-XMI-017 (XMI)."
source = "formal/23-05-08 §11.13; ptc/22-03-13 Argumentation::AssertedRelationship; formal/23-05-08 §11.10"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-002", "SACM23-ARG-005", "SACM23-XMI-005", "SACM23-XMI-017"]

[[row]]
id = "SACM23-ARG-008"
area = "ARG"
milestone = "M2"
title = "AssertedInference"
requirement = "AssertedInference is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedInference"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-007"]

[[row]]
id = "SACM23-ARG-009"
area = "ARG"
milestone = "M2"
title = "AssertedEvidence"
requirement = "AssertedEvidence is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedEvidence"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-007", "SACM23-ARG-006"]

[[row]]
id = "SACM23-ARG-010"
area = "ARG"
milestone = "M2"
title = "AssertedContext"
requirement = "AssertedContext is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedContext"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-007"]

[[row]]
id = "SACM23-ARG-011"
area = "ARG"
milestone = "M2"
title = "AssertedArtifactSupport"
requirement = "AssertedArtifactSupport is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedArtifactSupport"
kind = "model"
