[[row]]
id = "SACM23-XMI-019"
area = "XMI"
milestone = "M6"
title = "XMI document metadata"
requirement = "`xmi::read` reads, in both modes, and keeps the XMI document metadata (a tolerant `xmi::write` writes it back and `==` compares it), so that none is refused as `Unsupported` or dropped: `xmi:documentation`, `xmi:extension` and `xmi:Extension` (on the wrapper and inside any object), `xmi:difference`, `xmi:uuid`, `xmi:label`, `href` and `xmi:idref` on objects, identity attributes (`xmi:id`, `xmi:type`, `xmi:uuid`, `xmi:label`) on reference elements, XMI attributes on `name` and `value`, and `xsi:schemaLocation`. Any other XMI-namespace element inside an object (such as `<xmi:content>` or `<xmi:argumentElement>`) is handled the same way. Until then a strict read refuses them as `Unsupported` (Interim; SACM23-XMI-001, LIB-API-011), and a tolerant read keeps them with SACM-XMI-014; the `XmiMetadata` entry of LIB-API-011 is removed when this row is verified. A role element in reference form (an element in a composite role such as `argumentElement` or `argumentPackage`, typed or untyped, carrying `xmi:idref`) is a proxy for an element held elsewhere and is refused as not read yet under this row until then; one carrying an unqualified `href` is SACM23-XMI-027's (the maintainer, 2026-11-16)."
source = "XMI 2.5.1 formal/15-06-07 §7.3.3 (p. 7) \"Tools that rely on XMI are expected to store the extension information and export it again to enable round trip engineering\"; §7.6.1 (p. 14) \"The value of the label attribute is ignored on import.\"; XMI.xsd; assurance-forge xmi_reader.cpp:1543-1546 (ignores unknown XMI and XSI attributes)"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-001"]

[[row]]
id = "SACM23-XMI-020"
area = "XMI"
milestone = "M2"
title = "An element without an xmi:id"
requirement = "Import, in both load modes, reads an element with no `xmi:id`, a root or a child (ADR 0024). It gets a generated id in the edit scheme `<snake_case kind>_<n>` (ADR 0019) that is unused by every `xmi:id` in the input (later ones, the trimmed values of padded ids and LangString ids included), and deterministic for the input bytes and the same in both modes. Each such element is reported once as SACM-XMI-004, Info in both modes, with the generated id as its only affected id, requirement SACM23-XMI-020, clause 7.6.1, at the element's start tag. The generated id is an ordinary id: it is not marked, it is compared like any id, and `xmi::write` writes it. The document's id counters continue above it, so a later edit never reuses it. An unqualified `id` attribute is not an `xmi:id` (rule 2f). This narrows the `Unsupported` of SACM23-XMI-001 (a root) and SACM23-XMI-016 (a child). It departs from C++, where a missing id is an Error in strict mode and the element is dropped (`xmi_reader.cpp:755-762`)."
source = "XMI 2.5.1 §7.6.1 (p. 13) `<xsd:attribute name=\"id\" type=\"xsd:ID\" use=\"optional\"/>`, (p. 14) \"the value for xmi:id is unique across all elements within the file\"; rule 2e (p. 63) \"The identity attributes consist of an optional id, label, and uuid.\"; rule 2f \"The name of the identity attribute is \"id\" in the XMI namespace.\"; D-ID; ADR 0024; the maintainer's decisions of 2026-11-12 and 2026-11-14; C++ `xmi_reader.cpp:748-771`, `:2420-2426`"
kind = "xmi"
status = "verified"
verification = "docs/verification/0039-m2-ids-and-literals.md"
depends_on = ["SACM23-XMI-001", "SACM23-XMI-004", "SACM23-XMI-016", "LIB-COMPAT-001", "SACM23-VAL-001", "SACM23-XMI-023", "SACM23-XMI-025", "SACM23-XMI-022", "LIB-EDIT-001", "LIB-RT-001"]
notes = "ADR review, 2026-11-13: needs an ADR before its tests, on the identity of an element without an `xmi:id`: is a generated id marked, is it written back, and how does comparison treat it (ADR 0010, ADR 0013 \"Nothing invents\", ADR 0020). ADR review, 2026-11-13: docs/sacm/diagnostics.md lists SACM-XMI-004 as \"Error (strict)\" for a missing id, which conflicts with D-STRICT and XMI 2.5.1 §7.6.1 `use=\"optional\"`; this row settles it. Maintainer decision 2026-11-14: SACM-XMI-004 is Info in both modes (a missing id is conforming, XMI 2.5.1 `use=\"optional\"`), and the generated id is written on save like any other id; the catalog row is corrected to match. Slice 0042: generated ids now also skip referenced ids (ADR 0026); re-check there."
acceptance = [
  "In both modes these read Ok, each id-less element with a generated NCName id and exactly one SACM-XMI-004 Info: a single-root document element without `xmi:id`, a root inside `xmi:XMI` without one, a child without one, and all of them at once; `validate` reports nothing for a generated id.",
  "The Info: severity Info in both modes, requirement SACM23-XMI-020, clause `7.6.1`, `affected == [generated id]`, `location()` at the element's `<` (correct after a CRLF), and a message naming the kind and the generated id; read diagnostics stay in document order.",
  "Determinism: two reads of the same bytes, in each mode, give `==` documents with the same ids, and `write` of them gives identical bytes.",
  "No clash: an id-less Claim followed later in the file by `xmi:id=\"claim_1\"` reads Ok with no `DuplicateId`, the id-less Claim getting another id; the same when the later id is padded (`\" claim_1 \"`) or on a `name`.",
  "A generated id never takes part in a `DuplicateId`; a duplicate between two explicit ids in a file with id-less elements is still `DuplicateId`, with only the explicit locations.",
  "Write back: `write` writes the generated id as `xmi:id`; reading that output gives an equal document and no SACM-XMI-004; a strict save of the document succeeds.",
  "Edits after the read never generate an id in use, and a caller id equal to a generated one is `EditError::DuplicateId`.",
  "No id is generated for a `name`; an unqualified `id=\"c1\"` is not used as the id (the element still gets a generated one, and the attribute is kept as preserved content of it, with SACM-XMI-003 at its name, LIB-COMPAT-003); `xmi:id=\"\"` stays `InvalidId`.",
  "10,000 id-less Claims read in time linear in the input (within the file's deadline in debug).",
  "The catalog's SACM-XMI-004 row is Info, names `Code::XMI_MISSING_ID` and SACM23-XMI-020; Q-NO-ID becomes decision D-NO-ID.",
]
tests = [
  "crates/sacm/tests/reference_reserved_ids.rs::sacm23_xmi_020_an_id_named_only_by_a_reference_is_never_generated",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_an_id_less_bare_root_reads_with_a_generated_id_and_one_info",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_an_id_less_root_in_a_wrapper_reads_with_a_generated_id",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_an_id_less_child_reads_with_a_generated_id_under_its_parent",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_id_less_elements_everywhere_at_once_each_get_one_info_in_document_order",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_two_reads_of_the_same_bytes_give_equal_documents_and_identical_output",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_a_later_explicit_id_is_never_generated",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_a_generated_id_never_takes_part_in_a_duplicate_id",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_write_writes_the_generated_id_and_it_reads_back_equal_without_the_info",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_a_generated_id_is_unmarked_and_compares_like_a_written_one",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_edits_after_the_read_never_reuse_a_generated_id",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_a_caller_id_equal_to_a_generated_one_is_duplicate_id",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_no_id_is_generated_for_a_name",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_an_unqualified_id_is_not_an_xmi_id_and_is_preserved_at_its_name",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_an_empty_xmi_id_stays_invalid_id",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_ten_thousand_id_less_claims_read_within_the_deadline",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_the_catalog_xmi_004_row_is_info_and_names_the_code_and_the_row",
  "crates/sacm/tests/xmi_missing_ids.rs::sacm23_xmi_020_d_no_id_is_a_decision_and_q_no_id_is_no_longer_open",
]
