[[row]]
id = "LIB-EDIT-010"
area = "EDIT"
milestone = "M2"
title = "Reorder contained elements"
requirement = "`ReorderElements` reorders the direct children of any element (`new(parent, order)`) or the document's roots (`roots(order)`): it names a subset in a new order and writes them back into the positions they occupy, every other child keeping its position; roles, parents, ids and counters do not change. It refuses, in order: an unknown parent (SACM-CMD-001), an empty list (SACM-CMD-009), then, id by id in list order, an id that is not a direct child or root (`ChildNotFound`, SACM-CMD-001) and an id named before (SACM-CMD-009). The new order survives save and load (D-ORDER). `changed_ids` is `[parent]` exactly when the order changes (empty for roots)."
source = "D-ORDER; D-ATOMIC; D-RT; ADR 0010 D1/D2; ADR 0017 T4; ptc/22-03-13 (no `isOrdered`); XMI 2.5.1 §9.5.2 rule 2a (p. 63) \"The order of the elements for properties must follow any prescribed XML Schema ordering as defined in Clause 10 - even if no XML Schema has actually been generated.\"; assurance-forge `operations.h:161-183`, `commands.cpp:825-911`"
kind = "editing"
status = "verified"
verification = "docs/verification/0045-m2-set-operations.md"
depends_on = ["LIB-EDIT-002", "LIB-EDIT-003", "LIB-RT-001"]
notes = "Maintainer decisions of 2026-11-15 (slice 0045): a kind without the feature is the new SACM-CMD-008 and a bad order list the new SACM-CMD-009; `citedElement` and `isCitation` are set independently (unlike C++ `SetCitation`); reorder applies to the children of any element and to the roots; typed before-values move to LIB-EDIT-011 (ADR 0019 E10 amended). Lead decisions: a replaced name or content keeps its role element's `xmi:id` and its value ids by position (D-PRESERVE); removing an id removes every occurrence, and an id the end does not hold is refused. LIB-EDIT-003's oracle maps `RootOrder` from `ReorderElements::roots` to no id list; its tests change and are re-checked here."
acceptance = [
  "Children `[a, b, c, d]` reordered with `[d, b]` become `[a, d, c, b]`; a full permutation works; roots reorder the same way.",
  "Reordering across roles (a Description among Claims) is written in the held order and read back in it.",
  "`semantic_compare(before, after)` reports only the order difference on the parent; after write and read nothing more; the current order is `Ok` with empty `changed_ids`.",
  "An unknown parent, a grandchild, another parent's child, the id of a `name` or `content` are SACM-CMD-001; a repeated id and an empty list are SACM-CMD-009; each leaves the document `==` to before.",
  "Element count, roles and `validate` findings do not change (§11.4 homogeneity unaffected); the operations join the LIB-EDIT-002 set.",
]
tests = [
  "crates/sacm/tests/edit_atomic.rs::lib_edit_010_reorder_joins_the_set_with_every_answer",
  "crates/sacm/tests/edit_atomic.rs::lib_edit_010_every_successful_reorder_of_the_set_keeps_the_elements_parents_and_findings",
  "crates/sacm/tests/reorder.rs::lib_edit_010_a_named_subset_goes_back_into_the_positions_it_occupies",
  "crates/sacm/tests/reorder.rs::lib_edit_010_a_full_permutation_reorders_every_child",
  "crates/sacm/tests/reorder.rs::lib_edit_010_the_roots_reorder_the_same_way",
  "crates/sacm/tests/reorder.rs::lib_edit_010_a_reorder_across_roles_is_written_and_read_back_in_the_held_order",
  "crates/sacm/tests/reorder.rs::lib_edit_010_after_write_and_read_nothing_more_differs",
  "crates/sacm/tests/reorder.rs::lib_edit_010_the_current_order_is_ok_with_empty_changed_ids",
  "crates/sacm/tests/reorder.rs::lib_edit_010_an_unknown_parent_is_element_not_found",
  "crates/sacm/tests/reorder.rs::lib_edit_010_an_id_that_is_no_direct_child_or_root_is_child_not_found",
  "crates/sacm/tests/reorder.rs::lib_edit_010_a_repeated_id_or_an_empty_list_is_invalid_order",
  "crates/sacm/tests/reorder.rs::lib_edit_010_the_checks_run_in_order_and_id_by_id",
  "crates/sacm/tests/reorder.rs::lib_edit_010_element_count_roles_parents_and_findings_do_not_change",
  "crates/sacm/tests/reorder.rs::lib_edit_010_operations_hold_what_they_are_given_and_name_their_struct",
]
code = ["crates/sacm/src/edit/reorder.rs", "crates/sacm/src/edit.rs", "crates/sacm/src/model/document.rs", "crates/sacm/src/diagnostic.rs"]


[[row]]
id = "LIB-EDIT-012"
area = "EDIT"
milestone = "M2"
title = "UtilityElement content and key edits"
requirement = "The `content` of an existing Description, ImplementationConstraint, Note or TaggedValue can be replaced by any MultiLangString whose ExpressionLangString values pass SACM23-BASE-009's checks, or removed (§8.7 `[0..1]`), and the `key` of a TaggedValue replaced but never removed (§8.12 `[1]`). The edit addresses the UtilityElement by its id; values are held exactly, in order, and empty values and repeated languages are accepted (`validate` reports them, SACM23-VAL-010). The role element keeps its `xmi:id`, and each value keeps the id of the value at its position; ids beyond the new length go with their values. It refuses an unknown element (SACM-CMD-001) and a kind without the feature (SACM-CMD-008), in that order, then an ExpressionLangString value as SACM23-BASE-009 states. `changed_ids` is the UtilityElement, not its owner; it neither creates nor deletes UtilityElements."
source = "formal/23-05-08 §8.7 (p. 20) \"content:MultiLangString[0..1] (composition) - a MultiLangString to describe the content of the UtilityElement in (possibly) multiple languages\"; §8.12 (p. 21) \"key:MultiLangString[1] (composition) - the key of the TaggedValue.\"; §8.5 (p. 19); ADR 0025; D-VAL-LAYER; D-PRESERVE; assurance-forge `operations.h:247-358` (departure: addressed by id, whole value replaced)"
kind = "editing"
status = "verified"
verification = "docs/verification/0051-m2-close.md"
depends_on = ["LIB-EDIT-002", "LIB-EDIT-003", "SACM23-BASE-004", "SACM23-BASE-005", "SACM23-VAL-010"]
notes = "Split from LIB-EDIT-008 in slice 0045 research. Maintainer decisions of 2026-11-15 (slice 0045): a kind without the feature is the new SACM-CMD-008 and a bad order list the new SACM-CMD-009; `citedElement` and `isCitation` are set independently (unlike C++ `SetCitation`); reorder applies to the children of any element and to the roots; typed before-values move to LIB-EDIT-011 (ADR 0019 E10 amended). Lead decisions: a replaced name or content keeps its role element's `xmi:id` and its value ids by position (D-PRESERVE); removing an id removes every occurrence, and an id the end does not hold is refused. Slice 0065: reworded for ExpressionLangString (SACM23-BASE-009); re-check there."
acceptance = [
  "For each of the four kinds, content set to a two-language value, an empty value, a repeated language and `None` is returned exactly; a round trip keeps absent and empty apart.",
  "An empty content and a repeated language each give SACM-MULT-001 from `validate`, not a refusal.",
  "Content on a Claim, or a key on a Note, is SACM-CMD-008; `SetKey` has no remove form (checked by review of the API), so a TaggedValue's key cannot be removed.",
  "Of two TaggedValues with equal keys, editing one leaves the other unchanged.",
  "Content read as `<content xmi:id=\"c1\">` with value ids `v1 v2`, replaced by one value, keeps `c1` and `v1`; `v2` is no longer in use, and a later create may take it.",
  "`changed_ids` is `[utility id]`; an unknown element is SACM-CMD-001 and the document is unchanged; the operations join the LIB-EDIT-002 set.",
]
tests = [
  "crates/sacm/tests/content_edits.rs::lib_edit_012_replacing_a_large_content_keeps_ids_in_n_log_n_time",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_each_content_form_is_set_exactly_on_each_utility_kind",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_a_set_content_round_trips_with_absent_and_empty_kept_apart",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_an_empty_content_or_a_repeated_language_is_reported_by_validate_not_refused",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_content_on_a_model_element_or_a_key_on_another_kind_is_feature_not_applicable",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_a_key_edit_always_holds_a_key",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_editing_one_of_two_tagged_values_with_equal_keys_leaves_the_other_unchanged",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_a_replaced_content_keeps_its_id_and_the_value_ids_by_position",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_removing_a_content_frees_every_id_of_it",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_a_replaced_key_keeps_its_id_and_the_value_ids_by_position",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_a_freed_value_id_may_be_generated",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_changed_ids_is_the_utility_element_not_its_owner",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_an_unknown_element_is_element_not_found_and_changes_nothing",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_operations_hold_what_they_are_given_and_name_their_struct",
  "crates/sacm/tests/edit_atomic.rs::lib_edit_012_the_content_edits_join_the_set_with_every_answer",
  "crates/sacm/tests/edit_atomic.rs::lib_edit_012_no_successful_operation_of_the_set_removes_a_key",
  "crates/sacm/tests/content_edits.rs::lib_edit_012_a_freed_value_id_at_or_below_the_counter_is_not_generated",
]
