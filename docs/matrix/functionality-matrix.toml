[[row]]
id = "LIB-EDIT-004"
area = "EDIT"
milestone = "M2"
title = "Delete preview"
requirement = "Every operation can be previewed with `edit::preview(&Document, &Operation) -> Result<Preview, EditError>` without changing the document: it refuses exactly as `check` and `apply` would, `Preview::mutation()` is the `Mutation` `apply` would return, and `Preview::dangling_references()` lists each typed reference held outside the deleted element's subtree that names a deleted element or an id freed with a deleted element's preserved content (LIB-COMPAT-003) (references held by relationships the policy deletes included) (holder, end, id, and whether it crosses a package boundary), ordered by holder in document pre-order, then end, then position (an id named inside preserved content is not listed, ADR 0033). A delete under a given set of policies is refused exactly as `apply` would refuse it."
source = "D-PREVIEW; ADR 0031 (the maintainer, 2026-11-15); assurance-forge `commands/policies.h`, `commands/operations.h:362`, `commands.cpp:1771-2140`, `document.cpp:36-111`"
kind = "editing"
status = "verified"
verification = "docs/verification/0048-m2-batches-and-delete.md"
depends_on = ["LIB-EDIT-003", "SACM23-ARG-007", "LIB-EDIT-013"]
acceptance = [
  "For every starting document and every operation of the extended LIB-EDIT-002 set (deletes under all 12 policy combinations included), `preview(&d, &op).map(|p| p.mutation().clone()) == apply(&mut d.clone(), op)`, and a refusal equals `check`'s.",
  "After `preview`, the document is `==` to before, with the same next generated ids and the same revision.",
  "`dangling_references` is exactly the specified set and order, with `crosses_package` true exactly when the holder's nearest package differs from the target's; one entry per distinct id and end.",
  "`DeleteElement`, `Preview`, `DanglingReference` and the policy enums have rustdoc with an example that previews a delete and applies it; `Preview` serializes (not deserializes) and `DanglingReference` round-trips in the ADR 0030 shape, with golden samples.",
]
