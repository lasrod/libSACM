[[row]]
id = "LIB-SEC-005"
area = "SEC"
milestone = "M1"
title = "XML well-formedness the parser does not check"
requirement = "Input that roxmltree accepts but that XML 1.0 or Namespaces 1.0 make a fatal error is refused as `ReadError::Malformed` (SACM-XML-001) at the offending construct, before any root is classified and never repaired. This row covers exactly these constructs: a character reference to a surrogate or above U+10FFFF (roxmltree turns both into U+FFFD); a prefix undeclaring `xmlns:p=\"\"`; an XML declaration that does not match XML 1.0 [23]-[26], [32], [80] and [81]; a processing-instruction target (the XML Name after `<?`, [4]/[4a]) that is `xml` in any letter case other than the declaration, that contains a colon (Namespaces 1.0 §7), or that is followed by neither white space nor `?>` ([16]); and an element or attribute name written with an empty prefix (`<:c>`, `</:c>`, ` :a=\"1\"`), which roxmltree reads as unprefixed (Namespaces 1.0 §7 QName; XML 1.0 §3 Element Type Match). Other parser leniencies are found systematically by LIB-SEC-006 (ADR 0005 B1)."
source = "XML 1.0 5th ed. §1.2 \"Once a fatal error is detected, however, the processor MUST NOT continue normal processing\"; §4.1 WFC Legal Character \"Characters referred to using character references MUST match the production for Char.\" and [2] Char; §2.8 [23]-[26], §2.9 [32], §4.3.3 [80]/[81]; §2.6 [16] PI and [17] PITarget; §2.3 [4]/[4a] NameStartChar/NameChar and [5] Name; §3 WFC Element Type Match \"The Name in an element's end-tag MUST match the element type in the start-tag.\"; Namespaces in XML 1.0 3rd ed. §5 \"No Prefix Undeclaring\", §6.2 \"The attribute value in a default namespace declaration MAY be empty.\", §7 \"No entity names, processing instruction targets, or notation names contain any colons.\" and element and attribute names MUST match QName; §8 \"a processor MUST report violations of namespace well-formedness\"; ADR 0005 B1; slice 0019 verification; roxmltree 0.21.2 src/tokenizer.rs:27-71 (character classes), 303, 325-337, 368-391 (parse_pi), 1002, 1026-1062 (consume_name/skip_name: PI target names), 1061-1130 (consume_qname: an empty prefix reads as none, 1104 and 1120-1122)"
kind = "security"
status = "verified"
depends_on = ["LIB-SEC-002"]
acceptance = [
  "Character references: `&#xD800;`, `&#xDFFF;`, `&#55296;`, `&#x110000;` and `&#xFFFFFFFF;` give `Malformed` with `code()` SACM-XML-001, located at the `&`, in an `xmi:id`, in another attribute and in text inside an element; never `Unsupported` and never `Ok` with U+FFFD. `&#xD7FF;`, `&#xE000;` and `&#x10FFFF;` in an `xmi:id` are not refused, nor is the literal text `&#xD800;` in a comment, a CDATA section or a PI (including a comment whose text starts with `>` or `->`, `<!-->&#xD800;-->`, and a PI whose content starts with `>`), or written `&amp;#xD800;` (`xmi:id=\"p&amp;#xD800;\"` reads as id `p&#xD800;`).",
  "Prefix undeclaring: `xmlns:p=\"\"` on the root or on a child gives `Malformed` at the declaration; `xmlns=\"\"` is not refused, nor is `xmlns:p=''` inside a comment such as `<!--> <r xmlns:p=''>-->`; after the prolog `<!--> <x a='-->`, a later `xmlns:p=\"\"`, `<?XML x?>` or surrogate reference is still found.",
  "XML declaration: each gives `Malformed` at the offending name or value: pseudo-attributes `versionX`, `encodingX=\"UTF-8\"`, `standaloneX` and `foo`; pseudo-attributes out of order; `version` values `\"2.0\"`, `\"1.\"` and `\"abc\"`; `standalone=\"maybe\"`; `encoding` values `\"\"`, `\"8bit\"` and `\"UTF 8\"` (these fail [81] before the supported-encoding check). A declaration with TAB, CR or LF after `<?xml` is checked by the same rules, and a valid one is accepted; `version=\"1.1\"` is not refused.",
  "`xml` PI targets: `<?XML x?>` in the prolog, and `<?xml\\tfoo?>` or `<?Xml?>` inside the root, give `Malformed` at the `<?`. The target ends where the XML Name ends, so `<?xml>?>`, `<?Xml/?>`, `<?XML!x?>`, `<?xml\\u{A0}x?>`, `<?xml=1?>`, `<?xml\"a\"?>`, `<?xml'a'?>` and `<?xml&#xD800;?>` are `Malformed` at the `<?` too, in the prolog and inside the root, with the target quoted as written; before an ArtifactPackage root they are `Malformed`, not `Unsupported`. Not refused: `<?xml-stylesheet href=\"a\"?>`, targets that continue past `xml` with a NameChar (`<?xml-x?>`, `<?xml.x?>`, `<?xml_x?>`, `<?xml\\u{B7}x?>`, `<?xml\\u{E9}?>`, `<?xml\\u{300}?>`, `<?xml\\u{203F}?>`, `<?xml7?>`), `<?xml x?>` inside a comment (`<!--><?xml x?>-->`) and `<?xml?>` inside a CDATA section.",
  "PI with no white space after its target (XML [16]): `<?pi>x?>` and `<?pi/?>` give `Malformed` at the character after the target, with a reason of their own; `<?pi?>` and `<?pi x?>` are not refused.",
  "PI targets with a colon (Namespaces 1.0 §7): `<?a:b x?>`, `<?xml:x?>`, `<?:?>` and `<?p:?>` give `Malformed` at the `<?`, with a reason of their own that quotes the target; the reserved-`xml` check comes first (`<?xml?>` keeps its reason), then the colon check, then [16].",
  "Empty prefixes: `<:ArgumentPackage xmlns=\"…SACM…\" xmlns:xmi=\"…\" xmi:id=\"p\"/>`, `<:ArgumentPackage …></ArgumentPackage>`, `<ArgumentPackage …></:ArgumentPackage>`, a wrapped `<:ArgumentPackage …/>`, `<:XMI xmlns=\"…XMI…\">…</:XMI>`, a child `<:c/>` and an attribute ` :x=\"1\"` give `Malformed` at the name (the character after `<` or `</`, or the attribute name's first character), never `Ok` and never `Unsupported`, also before an ArtifactPackage root.",
  "Name-character edges: for every range of [4]/[4a] except `:` (refused as a colon target), `<?xml{lo}?>` and `<?xml{hi}?>` read `Ok`; for each neighbouring Char that is not a NameChar (U+BF, U+D7, U+F7, U+37E, U+2000, U+200B, U+200E, U+206F, U+2190, U+2BFF, U+2FF0, U+3000, U+F8FF, U+FDD0, U+FDEF, U+F0000, U+B6, U+B8, U+203E, U+2041, and ASCII `,` `/` `;` `@` `[` `^` `` ` `` `{`), `<?xml{c}?>` is `Malformed` with the reserved-target reason and `<?p{c}x?>` is `Malformed` with the [16] reason.",
  "Order: the XML declaration is checked before parsing, so a bad declaration comes before a DOCTYPE. Within it, `<?xml`, VersionInfo and EncodingDecl are checked first ([81] before the supported-encoding check); the rest (SDDecl, `?>`) is checked only for a supported encoding, so `<?xml version=\"1.0\" encoding=\"ISO-8859-1\" \\xE9?>` stays `Unsupported` (LIB-API-009 item 3). The character-reference, prefix and PI checks run after roxmltree accepts the input, so a DOCTYPE or a roxmltree `Malformed` comes before them, and among them the earliest offset wins. The `read` docs state this order.",
  "Agreement with the parser's tree: for a deterministic set of generated inputs that roxmltree accepts (comments, CDATA, PIs, attributes, empty-prefix names, references and namespace declarations in many combinations, with no XML declaration), `read` gives `Malformed` exactly when the roxmltree tree shows a construct this row refuses (U+FFFD from a reference, a PI targeted `xml` in any case, a prefix bound to an empty URI, a PI whose target contains a colon or is followed by neither white space nor `?>`, an element or attribute whose name as written starts with `:`), and every input returns within the deadline.",
  "Each refusal's `Display` follows the LIB-SEC-002 form (one lowercase line, location, our own reason, names quoted), and the checks never panic (the LIB-SEC-002 no-panic inputs still return a value).",
]
