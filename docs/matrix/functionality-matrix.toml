[[row]]
id = "SACM23-VAL-018"
area = "VAL"
milestone = "M1"
title = "A missing name is diagnosed"
requirement = "`validation::validate` reports each ModelElement whose name is missing (ADR 0013) as exactly one SACM-MULT-001 Error: requirement id SACM23-VAL-018, clause `8.6`, affected ids exactly the element's id, no location, and the message `{Kind} {id:?} has no name (name:LangString[1])`: the id is quoted and escaped as Rust's `{:?}` does, as write errors do. It reports nothing for a UtilityElement, or for a name whose `lang` or `content` is absent or empty. It does not change the document, and the result is sorted by `Diagnostic`'s order (ADR 0011). `diagnostic::has_errors` reports whether a list holds an Error (ADR 0018). SACM-MULT-001's catalog text widens to any multiplicity violation."
source = "formal/23-05-08 §8.6 (p. 19) \"name:LangString[1] (composition) - the name of the ModelElement.\" and \"All the individual and identifiable elements of a SACM model correspond to a ModelElement.\"; §8.3 (p. 18) `lang:String[0..1]`, `content:String[0..1]`; §8.7-8.12 (UtilityElement has no name); ptc/22-03-13 Base::ModelElement property `_19_0_4_68a022b_1650976745149_959605_5171` (association \"name\", no bounds, so [1..1]); XMI 2.5.1 §7.8.2 (p. 17) \"By default, XMI 2 produces schemas that ignore multiplicities also.\"; D-SEV (a multiplicity on which text and model agree is an error; the maintainer, 2026-11-12); D-VAL-LAYER; ADR 0011; ADR 0013; ADR 0018. C++ cannot represent a missing name (`element.h:177-179`)."
kind = "validation"
status = "verified"
depends_on = ["SACM23-BASE-003", "SACM23-XMI-012", "LIB-DIAG-001", "LIB-API-008"]
notes = "Slice 0036: a test's ids or expectations changed for the new id rules (ADR 0015 amendment 2, SACM23-VAL-020); re-checked there. Slice 0040: two of its tests now build their TaggedValues with a key through `CreateTaggedValue`, because a key-less TaggedValue is a SACM23-VAL-010 Error; re-check there. Slice 0041: its catalog test accepts the `Error / Warning` severity cell of SACM-MULT-001 (SACM23-VAL-011 adds the Warning); re-check there. Slice 0043: two tests compare only SACM23-VAL-018 findings, because seam-built relationships now also give SACM23-VAL-005 Errors; re-check there."
acceptance = [
  "`ElementKind::ALL` filtered by `is_a(AbstractClass::ModelElement)` is exactly 34 kinds, and the other 4 are exactly Description, ImplementationConstraint, Note and TaggedValue.",
  "For each of the 34 kinds, a named ArtifactPackage root holding one nameless element of that kind gives exactly one diagnostic, for that element; each of the 12 package kinds as a nameless root also gives exactly one.",
  "A document holding all 34 nameless gives 34 diagnostics, one per id; a nameless element in a nameless parent gives two (no cascade, no suppression).",
  "Each of the 4 UtilityElement kinds under a named ModelElement gives no diagnostic.",
  "No diagnostic for these names: `LangString::default()`; `lang=\"\"` with `content=\"\"`; `lang` absent with `content=\"\"`; `lang=\"en\"` with `content` absent; `lang=\"\"` with `content` absent; and, read through XMI, `<name/>` and `<name lang=\"\" content=\"\"/>`.",
  "The fields are pinned: `code() == Code::MULTIPLICITY_VIOLATION` (`\"SACM-MULT-001\"`), `severity()` Error, `requirement_id() == \"SACM23-VAL-018\"`, `clause() == Some(\"8.6\")`, `affected() == [id]`, `location() == None`, `message()` `Claim \"c1\" has no name (name:LangString[1])`, and `Display` `error SACM-MULT-001 [SACM23-VAL-018, clause 8.6]: Claim \"c1\" has no name (name:LangString[1])`.",
  "An awkward id is quoted and escaped as Rust's `{:?}` does: a nameless ArgumentPackage read through `xmi::read` with `xmi:id=\"a&quot;b&#10;c&#92;d&#x301;\"` gives exactly the message `ArgumentPackage \"a\\\"b\\nc\\\\d\\u{301}\" has no name (name:LangString[1])`, written out in the test, and a `Display` on one line.",
  "The element is kept: after `validate`, `element_count` is unchanged, `get(id)` has `name() == None`, and `xmi::write` output is identical before and after.",
  "`xmi::read` of a nameless AssuranceCasePackage and a nameless ArgumentPackage root, bare and wrapped, returns `Ok` with no SACM-MULT-001 in `ReadOutput::diagnostics()` (D-VAL-LAYER); `validate` on its document then gives one.",
  "Order: several findings come out sorted by affected id in byte order (`a10`, `a2`, `b`), whatever the insertion order; equal documents built in different orders give equal results, and two calls give equal results.",
  "An empty `Document`, and one where every ModelElement has a name, give an empty `Vec`; `has_errors` is false for them and true when a name is missing.",
  "`docs/sacm/diagnostics.md` lists SACM-MULT-001 with the widened text.",
  "A nameless element at the end of a deep chain of nested packages is reported without a panic or stack overflow.",
]
code = ["crates/sacm/src/validation.rs", "crates/sacm/src/validation/names.rs", "crates/sacm/src/diagnostic.rs", "docs/sacm/diagnostics.md", "docs/adr/0018-validation-entry-point.md"]
tests = [
  "crates/sacm/tests/validation.rs::sacm23_val_018_exactly_34_kinds_are_model_elements_and_the_other_4_are_utility_elements",
  "crates/sacm/tests/validation.rs::sacm23_val_018_each_nameless_model_element_kind_in_a_named_package_gives_one_diagnostic",
  "crates/sacm/tests/validation.rs::sacm23_val_018_each_nameless_package_root_gives_one_diagnostic",
  "crates/sacm/tests/validation.rs::sacm23_val_018_all_34_nameless_kinds_give_34_diagnostics_one_per_id",
  "crates/sacm/tests/validation.rs::sacm23_val_018_a_nameless_element_in_a_nameless_parent_gives_two_diagnostics",
  "crates/sacm/tests/validation.rs::sacm23_val_018_utility_elements_under_a_named_model_element_give_no_diagnostic",
  "crates/sacm/tests/validation.rs::sacm23_val_018_absent_or_empty_lang_or_content_is_not_a_missing_name",
  "crates/sacm/tests/validation.rs::sacm23_val_018_an_empty_name_read_through_xmi_is_not_a_missing_name",
  "crates/sacm/tests/validation.rs::sacm23_val_018_the_diagnostic_fields_message_and_display_are_pinned",
  "crates/sacm/tests/validation.rs::sacm23_val_018_an_id_with_a_quote_line_break_backslash_and_combining_mark_is_debug_quoted",
  "crates/sacm/tests/validation.rs::sacm23_val_018_validate_keeps_the_nameless_element_and_the_written_output",
  "crates/sacm/tests/validation.rs::sacm23_val_018_reading_a_nameless_root_gives_no_multiplicity_diagnostic_but_validate_does",
  "crates/sacm/tests/validation.rs::sacm23_val_018_findings_are_sorted_by_affected_id_whatever_the_insertion_order",
  "crates/sacm/tests/validation.rs::sacm23_val_018_an_empty_or_fully_named_document_gives_no_diagnostic_and_no_errors",
  "crates/sacm/tests/validation.rs::sacm23_val_018_has_errors_is_true_exactly_when_a_list_holds_an_error",
  "crates/sacm/tests/validation.rs::sacm23_val_018_multiplicity_violation_code_is_sacm_mult_001_in_the_catalog",
  "crates/sacm/tests/validation.rs::sacm23_val_018_a_nameless_element_at_the_end_of_a_deep_chain_is_reported",
]
