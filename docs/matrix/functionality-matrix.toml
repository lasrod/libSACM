[[row]]
id = "LIB-API-002"
area = "API"
milestone = "M1"
title = "Document, ElementId and typed navigation"
requirement = "A `Document` owns its root interchange packages, in document order, and every element under them. Elements are identified by an `ElementId` newtype that keeps the `xmi:id` exactly. Users navigate through read-only borrowing views (look up by id, roots, children in containment order, parent, all elements in pre-order) without access to internal storage. `Document`, its views and `ElementId` are `Send + Sync + Debug` (ADR 0010)."
source = "docs/architecture.md (Model); docs/sacm/decisions.md D-ID; ADR 0010; assurance-forge libs/sacm model/document.h, model/element_id.h"
kind = "api"
status = "verified"
acceptance = [
  "`Document::new()` and `Document::default()` have no roots, `element_count() == 0` and no `elements()`.",
  "`get(id)` returns a view whose `id()` and `kind()` are the inserted ones. An unknown id gives `None`. `contains` agrees with `get`. Both accept `&str`, `&String` and `&ElementId`.",
  "`roots()` yields the roots in insertion order, and each root's `parent()` is `None`.",
  "`children()` yields the direct children in insertion order, including mixed kinds. Each child's `parent()` is the element. Filtering `children()` by `kind()` keeps the order.",
  "`elements()` visits every element exactly once, in pre-order document order, and its count equals `element_count()`.",
  "`ElementId::new`, `From<&str>`, `From<String>`, `as_str()` and `Display` keep the value byte for byte. Eq, Ord and Hash follow the string.",
