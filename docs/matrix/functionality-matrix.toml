[[row]]
id = "LIB-EDIT-009"
area = "EDIT"
milestone = "M2"
title = "Reference edits"
requirement = "Operations cover every reference end: `citedElement`, `abstractForm` (§8.2), `metaClaim` (§11.10), `reasoning`, `source`, `target` (§11.13), `structure` (§11.12), `referencedArtifactElement` (§11.9), an ArgumentGroup's `argumentElement` (§11.2), an ArtifactGroup's `artifactElement` (§12.3) and an ArtifactAssetRelationship's `source` and `target` (§12.14), a package's `interface` (ptc/22-03-13), an interface's `implements` (§11.6, §12.5) and a binding's `participantPackage` (§11.5, §12.4). They refuse the derived `expression` (`ReferenceEnd::Expression`, SACM23-BASE-009) as `EditError::DerivedEnd` (SACM-CMD-008), after an unknown element. `SetReferences` replaces an end's ids in order with repeats kept (`clear` empties it), `AddReference` appends one, and `RemoveReference` drops every occurrence of one, each within the end's multiplicity (`target` cannot be emptied; `implements` holds exactly one id and `participantPackage` at least two distinct ids). They refuse, in order: an unknown element (`ElementNotFound`, SACM-CMD-001), a kind without the end (SACM-CMD-008), for a remove an id the end does not hold (`ReferenceNotHeld`, SACM-CMD-001), fewer ids than the lower bound (`TooFewReferences`) or more than one on a single-valued end (`TooManyReferences`, both SACM-MULT-001), an id holding white space (`InvalidReference`), an id naming no element (`ReferenceNotFound`) and a wrongly typed id (`WrongReferenceType`); the last three check only ids the end does not already hold (C++'s repair exception, per end). Content rules are never refused: §11.15/§11.17/§11.18, SACM-CITE-001, SACM-ABS-001, repeats (SACM23-VAL-022) and self-references. `changed_ids` is `[owner]` exactly when the end changes, or when an edit that leaves the end non-empty replaces a preserved attribute of the end's name on the owner (such as `metaClaim=\"\"`), which it removes; clearing the end keeps it (ADR 0033)."
source = "formal/23-05-08 §8.2 (p. 18) \"citedElement:SACMElement[0..1]\", \"abstractForm:SACMElement[0..1]\"; §11.10 (p. 39) \"metaClaim:Claim[0..*]\"; §11.13 (p. 40) \"source:ArgumentAsset[1..*]\", \"target:ArgumentAsset[1]\", \"reasoning:ArgumentReasoning[0..1]\"; §11.12 (p. 40) \"structure:ArgumentPackage[0..1]\"; §11.9 (p. 39) \"referencedArtifactElement:Base::ArtifactElement[0..*]\"; §11.2 (p. 36); D-VAL-LAYER; D-ATOMIC; ADR 0026; ADR 0027; ADR 0028; assurance-forge `operations.h:115-154, 185-188, 299-309`, `commands.cpp:650-823, 913-958, 1097-1131`"
kind = "editing"
status = "verified"
verification = "docs/verification/0045-m2-set-operations.md"
depends_on = ["LIB-EDIT-002", "LIB-EDIT-003", "SACM23-ARG-004", "SACM23-ARG-005", "SACM23-ARG-006", "SACM23-ARG-007", "SACM23-ARG-013", "SACM23-BASE-007", "SACM23-BASE-008", "SACM23-VAL-003", "SACM23-VAL-004", "SACM23-VAL-022"]
notes = "Slice 0042: when an edit can replace a reference, kill the `IdUse::is_unused -> false` mutant excluded for this row in docs/quality/mutants-triage.md, and remove its exclusion. Maintainer decisions of 2026-11-15 (slice 0045): a kind without the feature is the new SACM-CMD-008 and a bad order list the new SACM-CMD-009; `citedElement` and `isCitation` are set independently (unlike C++ `SetCitation`); reorder applies to the children of any element and to the roots; typed before-values move to LIB-EDIT-011 (ADR 0019 E10 amended). Lead decisions: a replaced name or content keeps its role element's `xmi:id` and its value ids by position (D-PRESERVE); removing an id removes every occurrence, and an id the end does not hold is refused. Slice 0045: the `IdUse::is_unused -> false` mutant is equivalent (both readers look at the entry's fields), so its exclusion stays with a new reason in docs/quality/mutants-triage.md; the opposite mutant is killed. Slice 0057: reworded for ArtifactAssetRelationship and the SACM23-XMI-009 spellings; re-check there. Slice 0060 (M3 close audit): reworded; re-check there. Slice 0065: reworded for ExpressionLangString (SACM23-BASE-009); re-check there. Slice 0066: reworded for the ARG/ART package interfaces and bindings (SACM23-ARG-014, -015, SACM23-ART-012, -013, LIB-EDIT-019); re-check there."
acceptance = [
  "For each end on each kind that owns it, setting it makes the accessor return exactly the ids given; a round trip is equal; `semantic_compare` reports only that end's variant on the owner.",
  "Add appends; an id already held is kept and `validate` gives a SACM23-VAL-022 Warning; remove drops every occurrence, and an id not held is SACM-CMD-001.",
  "Empty sources or removing the last source is `TooFewReferences` (`source`, given 0, required 1); `target` cannot be cleared; two ids on a single-valued end, or adding to an asserted relationship's held `target`, is `TooManyReferences` (`target`, given 2, allowed 1).",
  "`ReferenceNotFound` for an absent id and a `name`/`content`/`key`/`location`/`value` id (the `location` id tested under SACM23-ART-005); `InvalidReference` for `a b`; `WrongReferenceType` for a metaClaim naming an ArgumentReasoning, a source naming an ArgumentPackage, a reasoning or structure naming a Claim, a referencedArtifactElement naming a Description and a member naming a Note; a citedElement or abstractForm naming a Description is accepted.",
  "An end on a kind that lacks it (a `source` on a Claim) is SACM-CMD-008; an operation failing two checks pins their order.",
  "With a dangling source `x` read from a file: sources `[x, c2]` succeed; `[y]` with `y` dangling is `ReferenceNotFound`; target `x` is `ReferenceNotFound`; removing `x` succeeds and its SACM-REF-001 goes; likewise for a held wrongly typed id and `WrongReferenceType`.",
  "Editing one end succeeds while another end of the same element dangles; an AssertedEvidence source set to a Claim succeeds and `validate` gives the §11.15 finding; self-references are accepted.",
  "While a dangling `claim_2` is referenced, generated ids skip it; once an edit removes its last reference, the next generated Claim id is deterministic and may be `claim_2` (kills the `IdUse::is_unused` mutant or shows it equivalent).",
  "`changed_ids` is `[owner]` when the end changes and `[]` when not; referenced elements are never reported; after a refusal the document is `==` to before and generates the same next ids; the operations join the LIB-EDIT-002 set.",
]
tests = [
  "crates/sacm/tests/edit_atomic.rs::lib_edit_009_the_reference_edits_join_the_set_with_every_answer",
  "crates/sacm/tests/edit_atomic.rs::lib_edit_009_no_successful_edit_of_the_set_adds_a_bad_reference_or_empties_a_required_end",
