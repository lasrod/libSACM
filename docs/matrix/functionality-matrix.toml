[[row]]
id = "LIB-COMPAT-007"
area = "COMPAT"
milestone = "M1"
title = "Strict save writes only schema-valid output"
requirement = "`WriteOptions` carries a save mode, strict by default (ADR 0022). A strict write checks schema validity only and never runs `validation::validate` (ADR 0035 D4; the maintainer, 2026-11-16): after `NoRoot` and `PreservedContent` (SACM23-XMI-008) it fails with `WriteError::Invalid` when the output would not be valid against the SACM XML Schema: one SACM-ID-002 per `xmi:id` that is not an NCName (of an element, a name, a `content`, a `key`, a `location` or a `value`; XSD 1.0 Part 2 §3.3.8), and one SACM-REF-001 per distinct reference id that is no `xmi:id` the output writes (XSD 1.0 Part 1 §3.3.4; XMI 2.5.1 rule 4i), in `Diagnostic` order; unrepresentable characters follow. Content Errors that `validate` reports (a missing name, a missing source or target, a wrong reference type, package homogeneity, abstract-form and citation rules) never refuse a strict write; an application calls `validate` for model checks. A tolerant write writes the document as it is held. Both modes write the same bytes for any document both write."
source = "D-STRICT; D-VAL-LAYER; formal/23-05-08 §2.2–2.5 (pp. 4–5) \"shall be able to import and export XMI documents that conform with the SACM XML Schema\"; XMI 2.5.1 §7.8.2 (p. 17) \"By default, XMI 2 produces schemas that ignore multiplicities also\"; §2.2.3 (p. 2) \"Software is XMI document compliant when it produces or consumes XML documents that are XMI document compliant\"; ADR 0013 amendment 1; ADR 0017 W4; ADR 0018; ADR 0022; assurance-forge `io/xmi_writer.cpp:482-500` (strict save refuses preserved content and does not validate)"
kind = "xmi"
status = "verified"
verification = "docs/verification/0053-simplification.md"
depends_on = ["LIB-COMPAT-001", "SACM23-XMI-007", "SACM23-VAL-018", "LIB-TOOL-020", "SACM23-XMI-013"]
acceptance = [
  "`WriteOptions::default()` writes in strict mode; `WriteOptions::default().with_mode(Mode::Tolerant)` writes in tolerant mode.",
  "A nameless package, a relationship without a source or a target, a duplicate `gid`, a SACM-REF-002 wrong-type reference, a SACM-PKG-001 package and SACM-ABS-001 and SACM-CITE-001 findings each write strictly, byte-identical to the tolerant write.",
  "`xmi:id=\"1c\"` on an element, and a name id `1n`, each give `Invalid` holding one SACM-ID-002; `citedElement=\"nope\"` gives `Invalid` holding one SACM-REF-001 affecting `[element, nope]`; a reference to a name's `xmi:id` is written (the output holds that id), although `validate` reports SACM-REF-001 for it.",
  "Order: `NoRoot` before `PreservedContent` before `Invalid` before `UnrepresentableCharacter`.",
  "`Invalid`'s `Display`: `the document cannot be written in strict mode: 1 schema error, SACM-REF-001 on \"i1\"` and `the document cannot be written in strict mode: 3 schema errors, the first is SACM-ID-002 on \"1c\"`; its `code()` is SACM-XMI-016 (LIB-API-017) and `element()` is `None`.",
  "A tolerant write writes a nameless document with no `name` child, and it reads back equal; neither write changes the document.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "crates/sacm/src/validation.rs", "docs/adr/0022-load-and-save-modes.md", "crates/sacm/src/validation/references.rs", "docs/adr/0035-tolerant-read-and-schema-only-save.md"]
tests = [
  "crates/sacm/tests/load_and_save_modes.rs::lib_compat_007_a_dangling_reference_is_one_ref_001",
  "crates/sacm/tests/load_and_save_modes.rs::lib_compat_007_a_non_ncname_id_is_one_id_002",
  "crates/sacm/tests/load_and_save_modes.rs::lib_compat_007_a_reference_to_a_name_id_is_written",
  "crates/sacm/tests/load_and_save_modes.rs::lib_compat_007_the_invalid_display_counts_schema_errors",
  "crates/sacm/tests/load_and_save_modes.rs::lib_compat_007_the_refusals_come_in_order",
  "crates/sacm/tests/load_and_save_modes.rs::lib_compat_007_content_errors_never_refuse_a_strict_write",
  "crates/sacm/tests/load_and_save_modes.rs::lib_compat_007_write_options_default_to_strict_and_with_mode_sets_the_mode",
]
notes = "ADR review, 2026-11-13: decided in the load and save modes ADR with LIB-COMPAT-001: the semver stance (a new validation rule can make the default save fail in a minor release), and the reporting rule (every affected element, ADR 0013, or the first, ADR 0017 W4). Must land before any release (LIB-QA-005). Slice 0035: designed in ADR 0022, which takes over ADR 0013 amendment 1. ADR 0018's consequence: default writes of documents with validation Errors now fail; docs and examples are updated and the CHANGELOG calls it out. Slice 0036: a test's ids or expectations changed for the new id rules (ADR 0015 amendment 2, SACM23-VAL-020); re-checked there. Slice 0041: a test input broke §11.4 homogeneity or held two descriptions, which SACM23-VAL-011/012 now report; the input was changed, not the assertion; re-check there. Slice 0043: a test sample or list changed because ArgumentReasoning, AssertedInference and AssertedContext are read now (ADR 0027); re-check there. Slice 0044: the golden list gains `artifact-relationships.golden.sacm.xmi` (ADR 0028); re-check there. Slice 0053: a strict write checks schema validity only and never runs `validate` (ADR 0035 D4; the maintainer, 2026-11-16), so a new validation rule no longer changes what the default save writes. Slice 0055: reworded because Artifact, Resource, Activity and Event are read now (ADR 0034 amendment 1); re-check there. Slice 0062: its golden-file tests now cover the two terminology goldens; re-check there. Slice 0063: refusals carry codes, templates and arguments (LIB-API-017); re-check there."

[[row]]
id = "SACM23-XMI-013"
area = "XMI"
milestone = "M1"
title = "Export of one or more roots"
requirement = "`xmi::write` writes every root in document order: one root bare, more than one inside a single `xmi:XMI` element that carries the namespace declarations. Each of the twelve package kinds is written as a root under its class name. A document with no root makes the write fail with an error, and nothing is returned; C++ writes an empty `xmi:XMI` instead (the maintainer's decisions of 2026-11-12 (ADR 0017))."
source = "XMI 2.5.1 §7.5.3 (p. 10) \"it must be the XMI element if there are multiple elements\"; formal/23-05-08 §2.2–2.5 (pp. 4–5), §9.3 (p. 24), §11.6 (p. 37) \"ArgumentPackageInterface is a kind of ArgumentPackage that defines an interface that may be exchanged between users\"; ADR 0010 D1; ADR 0016; ADR 0017; assurance-forge `io/xmi_writer.cpp:529-549`"
kind = "xmi"
status = "verified"
depends_on = ["SACM23-XMI-001", "SACM23-XMI-007"]
acceptance = [
  "With one root, the document element is `sacm:<Kind>` and there is no `xmi:XMI`.",
  "With two or more roots, there is one `xmi:XMI` and the roots are its element children in `roots()` order; a mixed order such as AP, ACP, AP is kept.",
  "Each of the twelve package kinds written as a single root uses its own class name.",
  "An empty `Document` makes the write fail with an error, and no output is returned.",
  "The output for 1 and for 3 AssuranceCasePackage/ArgumentPackage roots reads back to the same ids, kinds and order.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "docs/adr/0017-xmi-writer.md"]
tests = [
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_013_one_root_is_the_document_element_with_no_xmi_element",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_013_several_roots_are_the_children_of_one_xmi_element_in_document_order",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_013_each_package_kind_is_written_as_a_single_root_under_its_class_name",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_013_an_empty_document_is_refused_with_no_root",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_013_one_and_three_roots_read_back_to_the_same_ids_kinds_and_order",
  "crates/sacm/tests/xmi_write.rs::sacm23_xmi_013_every_readable_input_writes_and_reads_back_to_the_same_ids_and_kinds",
]
verification = "docs/verification/0036-m1-ids-docs-cli.md"
notes = "Slice 0025: the earlier clause on \"the four interchange packages\" is dropped; every package kind is a root (§9.3, §11.6, ADR 0016). Slice 0036: a test's ids or expectations changed for the new id rules (ADR 0015 amendment 2, SACM23-VAL-020); re-checked there."

[[row]]
id = "SACM23-XMI-014"
area = "XMI"
milestone = "M1"
title = "Element form of single-valued values"
requirement = "`xmi::read` reads, in both modes and with no diagnostic, the XML element form of the single-valued DataType properties it reads today: a `name`'s `lang` and `content`, and an Assertion's `assertionDeclaration` (a Claim and the five asserted relationship kinds, SACM23-ARG-007); `gid` (SACM23-BASE-006), `isCitation` and `isAbstract` (SACM23-BASE-007/008), `isCounter` (SACM23-ARG-007), `version`, `date`, `startTime` and `endTime` (SACM23-ART-002, -004, -006, -007), an ExpressionElement's `value` and a Term's `externalReference` (SACM23-TERM-003, -004) and a `value`'s `lang` and `content` (SACM23-BASE-004) use it too. A value element is in no namespace, carries no attribute and has no element children; its value is its character content exactly (CDATA and references give their characters, comments and processing instructions are ignored, nothing is trimmed: XSD `preserve`), an empty element is the empty string, and an `assertionDeclaration` value must be one of the six literals exactly. The element may appear anywhere among its siblings, and the attribute and element forms may be mixed across different properties. The same document in either form reads to an equal `Document`, and export writes the attribute form. A property written both as an attribute and as an element, or as two elements, is refused in strict mode as `ReadError::RepeatedValue` (SACM-MULT-001), naming every occurrence, even when the values are equal (the maintainer, 2026-11-13); a tolerant read keeps the first occurrence and preserves each later one, with a SACM-MULT-001 Warning (LIB-COMPAT-001). A value element with an attribute (`xmi:id`, a type or another), an element child, or a namespace other than XMI does not conform: the `name` holding it, or the value element itself when it sits directly on its owner (`assertionDeclaration`, `gid`, a flag, `version`, `date`, `startTime`, `endTime`, `value`, `externalReference`), is kept whole as preserved content of the owner, with one SACM-XMI-003 at its start tag (LIB-COMPAT-003, ADR 0033); one in the XMI namespace is `Unsupported` at its start tag (SACM23-XMI-019); `xsi:nil` is read (SACM23-XMI-026) and the legacy `lang` on a `content` in a `name` is a LIB-COMPAT-008 shape (slice 0049); inside a `value` it keeps the whole `name`, `content`, `key` or `location` as preserved content; a bad literal is `ReadError::InvalidLiteral` at the start tag (SACM23-VAL-006)."
source = "XMI 2.5.1 §7.8.4 (pp. 17-18) \"If the property types are primitives or enumerations, then by default XML attributes and XML elements are declared for these types.\"; §7.11.3 (p. 29) \"Both XML attribute and element • The default\"; §9.3 (p. 56) \"An XMIValueElement is an XML element that can have a value, but cannot contain other XML elements or attributes.\"; §9.4.1 (p. 56) \"Choice of: 1. XMIValueAttribute 2. Nested XMIValueElement\", \"The value of an Enumeration is its name.\"; §9.5.2 production 2b (p. 62), rule 2b (p. 63) \"Each value of a property is represented by an XML element\", rule 2h (p. 63) \"A specific Property shall be serialized in an object either as an XML attribute or as XML elements but not both.\"; §8.2.1 rule 8 (p. 53); XSD 1 §3.1.4, §3.3.4 cl. 3.1; XSD 2 §4.3.6; XML 1.0 §2.11; formal/23-05-08 §2.4 (p. 4), §8.3 (p. 18), §11.10 (p. 39); ptc/22-03-13 (no org.omg.xmi tags); D-PRESERVE; ADR 0015 amendment 2; ADR 0021 amendment 1; assurance-forge `xmi_reader.cpp:1761`, `:1196-1203` (differs)"
kind = "xmi"
status = "verified"
depends_on = ["SACM23-XMI-001", "SACM23-XMI-011", "LIB-TOOL-020", "SACM23-XMI-012", "SACM23-XMI-017", "SACM23-XMI-010"]
acceptance = [
  "Read, both modes, no diagnostic: `<name><lang>en</lang><content>Case</content></name>`, in either order and on bare and wrapped roots and on a Claim, reads equal to `<name lang=\"en\" content=\"Case\"/>`; mixed `<name lang=\"en\"><content>Case</content></name>` reads the same; `<name><content>Case</content></name>` has no lang; `<content/>` and `<content></content>` read `Some(\"\")`, not absent.",
  "Read: on a Claim, `<assertionDeclaration>L</assertionDeclaration>` reads L for each of the six literals, before or after `name` and between white space and comments, equal to the attribute form; `asserted` reads equal to absent; on an ArgumentPackage or AssuranceCasePackage, root or child, the element is kept as preserved content of the package, with one SACM-XMI-003 at its start tag (LIB-COMPAT-003), as are a `content` element directly in a Claim and a `lang` element directly in a root.",
  "Value is exact: `<content>a<!--c-->b</content>` reads `ab`; `<content>a&amp;<![CDATA[<b>]]>&#13;</content>` reads `a&<b>\\r`; literal TAB and LF are kept and a literal CRLF reads LF; `<assertionDeclaration> needsSupport </assertionDeclaration>`, `NeedsSupport` and `<assertionDeclaration/>` are each `ReadError::InvalidLiteral` at the start tag, holding the value (SACM23-VAL-006).",
  "Shape: `xmi:id`, `xmi:type`, `xsi:type`, `foo` and `lang` on a value element, and an element child in one (`<content><b/></content>`, a nested value element, a `<value>`), each keep the whole `name`, or the `assertionDeclaration` element, as preserved content of its owner, with one SACM-XMI-003 at that start tag in both modes (LIB-COMPAT-003) (since slice 0049 `xsi:nil` is read, SACM23-XMI-026, and `lang` on a `<content>` in a `name` is a LIB-COMPAT-008 shape); so do `<sacm:content>`, a value element in a foreign namespace and an unprefixed `<content>` in a default SACM namespace; an XMI-prefixed value element such as `<xmi:content>` is `Unsupported` at its start tag (SACM23-XMI-019), and no document is returned.",
  "Repeats: `assertionDeclaration=\"assumed\"` with `<assertionDeclaration>assumed</assertionDeclaration>`, two `<assertionDeclaration>` elements, `<name lang=\"en\"><lang>en</lang></name>`, and two `<content>` elements are each refused in strict mode (tolerant: LIB-COMPAT-001) as `ReadError::RepeatedValue`: `code()` is SACM-MULT-001, `locations()` lists every occurrence in document order (attribute name, then start tags), and `location()` is the second.",
  "`RepeatedValue` follows ADR 0011: its `Display` is one lowercase line naming the property, the element and every location; it boxes and downcasts as `dyn Error + Send + Sync`.",
  "Round trip: each element-form input above, read in strict and in tolerant mode, writes byte-identical to its attribute-form twin and reads back to an equal `Document`.",
]
tests = [
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_lang_and_content_elements_in_either_order_read_equal_to_the_attribute_form",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_attribute_and_element_forms_mix_across_properties_and_elements",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_a_content_element_alone_gives_a_name_with_no_lang",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_an_empty_value_element_reads_as_the_empty_string_not_as_absent",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_each_literal_as_an_element_on_a_claim_reads_equal_to_the_attribute_form",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_an_asserted_element_reads_equal_to_no_declaration",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_a_value_element_reads_only_on_its_owner_and_elsewhere_is_preserved_at_its_start_tag",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_comments_and_processing_instructions_in_a_value_element_are_ignored",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_cdata_and_references_in_a_value_element_give_their_characters",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_tab_lf_and_edge_spaces_are_kept_and_a_literal_crlf_or_cr_reads_as_lf",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_a_declaration_element_whose_content_is_a_literal_however_written_reads_as_it",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_a_declaration_element_holding_no_literal_is_invalid_literal_at_its_start_tag_holding_it",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_an_attribute_on_a_value_element_is_preserved_with_its_name_or_element",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_an_element_in_a_value_element_is_preserved_with_its_name_or_element",
  "crates/sacm/tests/xmi_value_elements.rs::sacm23_xmi_014_a_value_element_in_a_namespace_is_preserved_or_unsupported_at_its_start_tag",
