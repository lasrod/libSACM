[[row]]
id = "LIB-TOOL-011"
area = "TOOL"
milestone = "M0"
title = "Test scanner recognises tests and non-code precisely"
requirement = "The traced-test scanner ignores test-like text inside multi-line raw strings, block comments and Python triple-quoted strings; does not count `#[ignore]`d or skipped tests as evidence; and recognises `#[test_case(...)]`-style attributes and Python `async def test_` methods as tests."
source = "Verification 0001 round 2 Low and round-6 prescription (R63; different-class notes)"
kind = "tooling"
status = "verified"
code = ["xtask/src/matrix.rs"]
acceptance = [
  "Rust text that is inside a comment or a literal is never scanned. That covers line comments (doc comments included), block comments (`/* */` nests), string literals that span lines, raw strings `r\"..\"` and `r#\"..\"#` with any number of `#`, the `b`, `br`, `c` and `cr` forms, and char and byte literals (`'\"'`, `'\\''`, `b'\"'`). A `#[test]` or `fn` there neither marks nor defines a test. A lifetime or label (`'a`, `'static`) does not open a literal. An unterminated literal or comment runs to the end of the file, without a panic. Line numbers are not affected.",
  "Python text that is inside a `#` comment or a string is never scanned. That covers single-quoted and triple-quoted strings (`\"\"\"`, `'''`, spanning lines), with any prefix (`r`, `b`, `f`, `u`, `rb`, `br`, `fr`, `rf`, in any case), and a backslash-escaped quote, which does not end the string, raw strings included. A `def test_...` inside a docstring is not a test.",
  "A Rust attribute is test-style when the last segment of its path is `test`, `test_case` or `rstest`, with or without arguments: `#[test]`, `#[tokio::test(flavor = \"multi_thread\")]`, `#[test_log::test]`, `#[test_case(1; \"a]b\")]`, `#[rstest]`. Arguments do not decide it, and `#[cfg(test)]`, `#[mytest]` and `#[testing]` are not test-style. Python `async def test_...` is a test, like `def test_...`.",
  "A test is ignored or skipped in these cases, and is then never evidence. In Rust: an `#[ignore]` or `#[ignore = \"..\"]` attribute on it, or `#[cfg_attr(<predicate>, ignore)]` (or `ignore = \"..\"`) listing `ignore`. In Python: a decorator on the lines directly above it (blank and comment lines may sit between) whose dotted name ends in `skip`, `skipIf`, `skipUnless`, `skipif` or `expectedFailure`, for example `@unittest.skip(\"x\")` or `@pytest.mark.skipif(..)`; or such a decorator on the enclosing `class`, which skips every `def test_...` indented under it. An ignored or skipped traced test that is not under `src` gives exactly one problem: `<file>: traced test `<name>` is ignored or skipped, so it is not evidence`. The problem is the same whether or not a row cites the test, and no orphan problem and no row-level citation problem is reported for it.",
  "`traced_tests(text, python)` keeps its signature and returns the traced tests that run, in source order. The new `ignored_traced_tests(text, python)` returns the ignored or skipped ones. `Repo` gains `ignored_functions()`, parallel to `traced_functions()`. Existing tests that pinned the old behaviour (an `#[ignore]`d test counted as a test) are updated, not deleted. The real repository passes the gate.",
]
depends_on = ["LIB-TOOL-001"]
tests = [
  "xtask/tests/function_scan.rs::lib_tool_011_function_scan_finishes_on_every_comment_and_literal_form",
  "xtask/tests/scanner.rs::lib_tool_011_rust_line_and_doc_comments_hide_test_like_text",
  "xtask/tests/scanner.rs::lib_tool_011_rust_block_comments_nest_and_hide_test_like_text",
  "xtask/tests/scanner.rs::lib_tool_011_rust_a_block_comment_left_open_hides_the_rest_of_the_file",
  "xtask/tests/scanner.rs::lib_tool_011_rust_strings_that_span_lines_hide_test_like_text",
  "xtask/tests/scanner.rs::lib_tool_011_rust_raw_strings_end_only_at_a_quote_with_as_many_hashes",
  "xtask/tests/scanner.rs::lib_tool_011_rust_byte_and_c_raw_strings_are_raw",
  "xtask/tests/scanner.rs::lib_tool_011_rust_char_and_byte_literals_hold_quotes",
  "xtask/tests/scanner.rs::lib_tool_011_rust_lifetimes_labels_and_raw_identifiers_open_no_literal",
