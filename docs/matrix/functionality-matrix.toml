[[row]]
id = "LIB-COMPAT-014"
area = "COMPAT"
milestone = "M6"
title = "Vendor content beside the roots"
requirement = "An element of another namespace directly under `xmi:XMI`, beside the SACM roots (XMI 2.5.1 §2.3.1 says tools should place extended information in elements outside the XMI namespace or in `xmi:Extension`; this row covers the first kind at the top level), is kept as document-level preserved content with SACM-XMI-003 in both modes and written back by a tolerant save, instead of refusing the document as `InvalidRoot`; a strict save refuses it (SACM23-XMI-008)."
source = "XMI 2.5.1 §2.3.1 (p. 2); ADR 0033; Verification 0050 (docs/follow-ups.md); the maintainer, 2026-11-16 (a new M6 row)"
kind = "xmi"
status = "deferred"
notes = "Deferred by the maintainer, 2026-11-16: taken up only when a real file needs it (LIB-COMPAT-015)."
depends_on = ["LIB-COMPAT-003", "SACM23-XMI-019"]

[[row]]
id = "LIB-COMPAT-013"
area = "COMPAT"
milestone = "M6"
title = "Preserved attribute values keep the namespace bindings they use"
requirement = "A tolerant `xmi::write` declares, on each element holding a preserved attribute, every prefix that a token of the attribute's value uses as a QName prefix and that was bound where it was read, so the value resolves to the same namespace URI when the output is read. Only elements holding preserved attributes are affected, and reading stays linear in the input."
source = "ADR 0033 (\"A prefix used only inside a preserved value is not yet kept\"); D-PRESERVE; XMI 2.5.1 §7.3.3 (p. 7); Copilot on #68 (the reverted e8c6f1d)"
kind = "xmi"
status = "deferred"
notes = "Deferred by the maintainer, 2026-11-16: taken up only when a real file needs it (LIB-COMPAT-015)."
depends_on = ["LIB-COMPAT-003"]
acceptance = [
  "An ArgumentPackage root with `xmlns:t` bound to the SACM URI and the conflicting, preserved `xmi:type=\"t:Claim\"`, and a Claim holding the preserved `v:ref=\"u:thing\"` with `u` declared on an ancestor, write output that declares `t` and `u` on their holders with the same URIs; reading it back is `==`, and a re-write is byte-identical.",
  "A prefix that no preserved value uses is not declared on the holder.",
  "With 3,000 bindings in scope by 20,000 Claims, one holding a preserved attribute, a read and a write each take at most twice as long as for the same document without those bindings (release build).",
]

[[row]]
id = "LIB-COMPAT-012"
area = "COMPAT"
milestone = "M6"
title = "The assurance-forge legacy app dialect"
requirement = "A tolerant load imports the assurance-forge legacy app dialect (`src/legacy_sacm/sacm_serializer.cpp`): class-named children (`<claim>`, `<Claim>`), unqualified `id`, `ref=`/`href` links, a multi-language `<name>` (the first entry is the name; the rest are kept, never dropped), repeated shorthand `content` siblings merged, and `content=`, `<content lang>`, `<statement>` and `description=` read as Descriptions, each reported. A strict load refuses them."
source = "Slice 0049 research (2026-11-15); assurance-forge 65577b3 `libs/sacm/src/io/xmi_reader.cpp:1187-1219, 1276-1316, 2037-2058`, `docs/sacm/sacm-interop-corpus.md` (\"legacy app dialect\"); D-PRESERVE; D-STRICT; ADR 0022"
kind = "xmi"
status = "planned"
depends_on = ["LIB-COMPAT-004", "LIB-COMPAT-008", "LIB-COMPAT-003"]
notes = "Its files are in the SACM 2.2 namespace, so LIB-COMPAT-004 comes first. C++ keeps the extra name entries as a TaggedValue keyed `sacm.import.name`; decide before the tests."

[[row]]
id = "LIB-COMPAT-004"
area = "COMPAT"
milestone = "M6"
title = "Other SACM revisions"
requirement = "A tolerant `xmi::read` reads a document of an older SACM revision (2.0 to 2.2) as SACM 2.3, with one SACM-XMI-008 Warning per root, and `xmi::write` writes SACM 2.3. No revision publishes an instance namespace (spec defect D7), so it recognises a closed table: OMG's dated base URIs `http://www.omg.org/spec/SACM/20170843`, `/20190235` and `/20210218`; the `http://www.omg.org/spec/SACM/2.x[/Package]` family; `http://omg.sacm/2.x/*` (the EMF tool's per-package URIs); and `http://SACM_ACEditor/sacm/2.1`. Only `argumentationElement` and Event `occurence` are mapped (as SACM23-XMI-009 maps their 2.3 spellings); everything else 2.3 does not have is kept as preserved content. A SACM 2.4 document (OMG's `http://www.omg.org/spec/SACM/20260504`) is not read as 2.3: its metamodel is restructured, so it is refused with its own reason naming LIB-COMPAT-018. Any other SACM-like namespace is SACM-XMI-002 (Warning). A strict read refuses both with their codes (ADR 0022: strict never applies a tolerance). Until then both are refused as `Tolerance(LIB-COMPAT-004)` (LIB-API-011); the maintainer reclassified it as a tolerance on 2026-11-16, so it no longer gates the SACM 2.3 compliance points."
source = "D-VERSION; SACM-XMI-002, SACM-XMI-008; spec defect D7; the maintainer, 2026-11-17 (kept in M6, split from SACM 2.4); the namespaces of SACM 2.0 to 2.4 Beta1 (research, 2026-11-17)"
kind = "xmi"
status = "planned"
depends_on = ["LIB-COMPAT-001"]
notes = "From verification 0051 (moved here at M3's close): `xmi/refusal.rs` `OtherSacmNamespace` labels any root in a non-SACM namespace, even a non-SACM document, as this row's tolerance; only a SACM-like namespace should be (SACM-XMI-002 for the others). Settle it when this row is built."

