[[row]]
id = "LIB-API-002"
area = "API"
milestone = "M1"
title = "Document, ElementId and typed navigation"
requirement = "A `Document` owns one root interchange package and all elements under it; elements are identified by an `ElementId` newtype; users navigate by typed views (look up by id, iterate children by kind) without access to internal storage; `Document` and its views are `Send + Sync` and `Debug`."
source = "docs/architecture.md (Model); D-ID"
kind = "api"
status = "planned"

[[row]]
id = "LIB-API-003"
area = "API"
milestone = "M1"
title = "Element kind metadata"
requirement = "A public, non-exhaustive `ElementKind` enumerates every concrete SACM 2.3 class, reports its SACM class name and package, and answers is-a questions against the abstract superclasses (ModelElement, ArtifactElement, ArgumentAsset, Assertion, AssertedRelationship, ...)."
source = "ptc/22-03-13 (all packages); docs/sacm/metamodel-inventory.md"
kind = "api"
status = "planned"

[[row]]
id = "LIB-API-004"
area = "API"
milestone = "M1"
title = "Error types"
requirement = "Operational failures (I/O, unreadable XML, rejected edits) are reported through documented, non-exhaustive error enums implementing `std::error::Error` with source chains; no public function panics on any input."
source = "rust-library-craft skill (Errors vs diagnostics)"
kind = "api"
status = "planned"

[[row]]
id = "LIB-DIAG-001"
area = "DIAG"
milestone = "M1"
title = "Structured diagnostics"
requirement = "A `Diagnostic` carries a stable code, a severity (info, warning, error), the matrix row and clause it enforces, the affected element ids, an optional source location (line, column) and a message; diagnostics are returned in a deterministic order and implement `Display`."
source = "D-DIAG; docs/sacm/diagnostics.md"
kind = "api"
status = "planned"

[[row]]
id = "SACM23-BASE-001"
area = "BASE"
milestone = "M1"
title = "LangString"
requirement = "LangString (an optional `lang` tag and optional `content`) is represented, readable, writable and editable, preserving the language tag and content exactly, including the empty and absent cases."
source = "formal/23-05-08 clause 8; ptc/22-03-13 Base::LangString"
kind = "model"
status = "planned"
depends_on = ["LIB-API-002"]

[[row]]
id = "SACM23-BASE-002"
area = "BASE"
milestone = "M1"
title = "MultiLangString"
requirement = "MultiLangString (one or more LangString values) is represented and round-tripped in order."
source = "formal/23-05-08 §8.5; ptc/22-03-13 Base::MultiLangString; D-TEXT-MODEL"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-001"]

[[row]]
id = "SACM23-BASE-003"
area = "BASE"
milestone = "M1"
title = "ModelElement name"
requirement = "Every ModelElement has exactly one `name` LangString; it is required when creating an element, read and written as the `name` containment, and a missing name is diagnosed."
source = "formal/23-05-08 §8.6; ptc/22-03-13 Base::ModelElement.name [1]"
kind = "model"
status = "planned"
depends_on = ["LIB-API-002", "SACM23-BASE-001"]

[[row]]
id = "SACM23-AC-001"
area = "AC"
milestone = "M1"
title = "AssuranceCasePackage and nesting"
requirement = "AssuranceCasePackage is represented as the mandatory unit of interchange; it may contain nested AssuranceCasePackages and ArgumentPackages in document order (artifact and terminology sub-packages are added by SACM23-ART-001 and SACM23-TERM-001)."
source = "formal/23-05-08 clause 9; ptc/22-03-13 AssuranceCase::AssuranceCasePackage"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-003"]

[[row]]
id = "SACM23-ARG-001"
area = "ARG"
milestone = "M1"
title = "ArgumentPackage"
requirement = "ArgumentPackage is represented, contained in an AssuranceCasePackage or as a root interchange object, and contains ArgumentationElements (role `argumentElement`) in document order."
source = "formal/23-05-08 §11.4; ptc/22-03-13 Argumentation::ArgumentPackage"
kind = "model"
status = "planned"
depends_on = ["SACM23-AC-001"]

[[row]]
id = "SACM23-ARG-003"
area = "ARG"
milestone = "M1"
title = "AssertionDeclaration"
requirement = "The AssertionDeclaration enumeration (asserted, needsSupport, assumed, axiomatic, defeated, asCited) is represented as a non-exhaustive Rust enum with `asserted` as default, parsed and written with the exact literal spellings."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertionDeclaration"
kind = "model"
status = "planned"
depends_on = ["LIB-API-002"]

[[row]]
id = "SACM23-ARG-002"
area = "ARG"
milestone = "M1"
title = "Claim"
requirement = "Claim is represented with its inherited Assertion feature `assertionDeclaration`, created, read, written and round-tripped inside an ArgumentPackage."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::Claim"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-001", "SACM23-ARG-003"]

[[row]]
id = "LIB-SEC-001"
area = "SEC"
milestone = "M1"
title = "DTDs and entities are refused"
requirement = "Any document containing a DOCTYPE declaration or entity is refused with diagnostic SACM-SEC-001 before any entity could be resolved or expanded, in every mode."
source = "OWASP XXE prevention; docs/sacm/diagnostics.md SACM-SEC-001"
kind = "security"
status = "planned"
depends_on = ["LIB-DIAG-001", "LIB-API-004"]

[[row]]
id = "LIB-SEC-002"
area = "SEC"
milestone = "M1"
title = "Malformed input is diagnosed, never a panic"
requirement = "Malformed XML, truncated input, invalid UTF-8 and wrong root elements produce an error or diagnostic (SACM-XML-001, SACM-XMI-001) with a location where available; no input causes a panic."
source = "docs/sacm/diagnostics.md SACM-XML-001, SACM-XMI-001"
kind = "security"
status = "planned"
depends_on = ["LIB-DIAG-001", "LIB-API-004"]

[[row]]
id = "SACM23-XMI-001"
area = "XMI"
milestone = "M1"
title = "Interchange roots"
requirement = "XMI import recognizes an AssuranceCasePackage or ArgumentPackage root, directly or inside an `xmi:XMI` wrapper, and refuses any other root with SACM-XMI-001 (ArtifactPackage and TerminologyPackage roots are added by SACM23-ART-001 and SACM23-TERM-001)."
source = "formal/23-05-08 clause 2 (compliance points)"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-AC-001", "SACM23-ARG-001", "LIB-SEC-001"]

[[row]]
id = "SACM23-XMI-002"
area = "XMI"
milestone = "M1"
title = "Namespace-prefix independence"
requirement = "Import matches elements and attributes by namespace URI and local name, so the same document with any prefixes (including a default namespace) loads identically."
source = "XML Namespaces 1.0; XMI 2.5.1"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-001"]

[[row]]
id = "SACM23-XMI-003"
area = "XMI"
milestone = "M1"
title = "Pinned strict namespace"
requirement = "Strict export declares the SACM namespace `http://www.omg.org/spec/SACM/20220301` (prefix `sacm`) and the XMI 2.5.1 namespace with `xmi:version=\"2.0\"`; the pin is a single constant in the crate."
source = "D-NS-PIN; docs/sacm/metamodel-inventory.md (XMI serialization conventions)"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-001"]

[[row]]
id = "SACM23-XMI-004"
area = "XMI"
milestone = "M1"
title = "xmi:id identity"
requirement = "Every element is written with an `xmi:id`; ids read from a file are preserved exactly through load, edit and save."
source = "XMI 2.5.1 identity; D-ID"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-001"]

[[row]]
id = "SACM23-XMI-006"
area = "XMI"
milestone = "M1"
title = "xsi:type for abstract-typed roles"
requirement = "When a containment role's declared type is abstract (e.g. `argumentElement`), export writes `xsi:type` naming the concrete class, and strict import requires it (SACM-XMI-005); tolerant import may infer the class from the element name."
source = "XMI 2.5.1 type rules; docs/sacm/diagnostics.md SACM-XMI-005"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-001", "SACM23-ARG-002"]

[[row]]
id = "SACM23-XMI-007"
area = "XMI"
milestone = "M1"
title = "Deterministic export"
requirement = "Saving the same model always produces identical bytes: fixed attribute order, containment in model order, fixed indentation and line endings, no dependence on hash iteration order; checked against golden files."
source = "D-RT"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-003", "SACM23-XMI-004", "SACM23-XMI-006"]

[[row]]
id = "LIB-COMPAT-001"
area = "COMPAT"
milestone = "M1"
title = "Strict and tolerant load modes"
requirement = "Loading takes an explicit mode: tolerant (default) accepts and reports recognised variations as warnings; strict reports them as errors. Saving is strict by default. The mode used is visible in the load result."
source = "D-STRICT"
kind = "api"
status = "planned"
depends_on = ["SACM23-XMI-001", "SACM23-XMI-003"]

[[row]]
id = "SACM23-VAL-001"
area = "VAL"
milestone = "M1"
title = "Unique element ids"
requirement = "Duplicate `xmi:id` values in a document are reported as SACM-ID-001 errors naming every element involved; the edit API refuses to create a duplicate (SACM-CMD-004)."
source = "XMI 2.5.1 identity; docs/sacm/diagnostics.md SACM-ID-001"
kind = "validation"
status = "planned"
depends_on = ["SACM23-XMI-004", "LIB-DIAG-001"]

[[row]]
id = "SACM23-VAL-006"
area = "VAL"
milestone = "M1"
title = "Enumeration literals"
requirement = "An unknown `assertionDeclaration` literal is reported as SACM-ENUM-001 with the raw value; it is never silently mapped to the default."
source = "ptc/22-03-13 Argumentation::AssertionDeclaration; docs/sacm/diagnostics.md SACM-ENUM-001"
kind = "validation"
status = "planned"
depends_on = ["SACM23-ARG-003", "SACM23-XMI-001", "LIB-DIAG-001"]

[[row]]
id = "LIB-RT-001"
area = "RT"
milestone = "M1"
title = "Semantic comparison"
requirement = "A public function compares two documents semantically (ignoring formatting, attribute order and prefixes, not ignoring any model content) and reports the differences with element ids and feature names."
source = "D-RT"
kind = "api"
status = "planned"
depends_on = ["SACM23-ARG-002"]

[[row]]
id = "LIB-RT-002"
area = "RT"
milestone = "M1"
title = "Load → save → load is lossless"
requirement = "For every valid fixture in scope, loading, saving strictly and reloading yields a semantically equal document."
source = "D-RT"
kind = "xmi"
status = "planned"
depends_on = ["LIB-RT-001", "SACM23-XMI-007"]

[[row]]
id = "LIB-EDIT-001"
area = "EDIT"
milestone = "M1"
title = "Create operations"
requirement = "Elements are created through explicit operations taking a parent, a name and optional caller-provided id; generated ids are deterministic for a given sequence of operations; an invalid parent is refused (SACM-CMD-005). Initially AssuranceCasePackage, ArgumentPackage and Claim; each later model row extends it to its class."
source = "D-ID, D-ATOMIC"
kind = "editing"
status = "planned"
depends_on = ["SACM23-ARG-002", "LIB-API-004"]

[[row]]
id = "LIB-EDIT-002"
area = "EDIT"
milestone = "M1"
title = "Atomic mutations"
requirement = "Every public mutation either succeeds and leaves the document structurally valid, or fails with an error and leaves the document unchanged (semantically equal to before)."
source = "D-ATOMIC, D-VAL-LAYER"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-001"]

[[row]]
id = "LIB-EDIT-003"
area = "EDIT"
milestone = "M1"
title = "Mutation results"
requirement = "Every successful mutation returns the ids it created, changed and deleted and the operation that ran, sufficient for an audit log."
source = "D-RESULT"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-001"]

[[row]]
id = "LIB-RT-003"
area = "RT"
milestone = "M1"
title = "Created documents round-trip"
requirement = "A document built through the edit API saves strictly, reloads, validates without errors and is semantically equal to the in-memory document."
source = "D-RT"
kind = "xmi"
status = "planned"
depends_on = ["LIB-EDIT-001", "LIB-RT-002"]

[[row]]
id = "LIB-CLI-002"
area = "CLI"
milestone = "M1"
title = "`sacm validate`"
requirement = "`sacm validate <file>` loads (tolerant by default, `--strict` available), validates, prints diagnostics in a human format or as JSON (`--format json`), and exits 0 when there are no errors, 1 when there are errors, 2 when the file cannot be read."
source = "Project policy (D-API)"
kind = "cli"
status = "planned"
depends_on = ["LIB-CLI-001", "SACM23-XMI-001", "SACM23-VAL-001"]

[[row]]
id = "LIB-CLI-003"
area = "CLI"
milestone = "M1"
title = "`sacm roundtrip`"
requirement = "`sacm roundtrip <file>` loads, saves strictly to memory, reloads and reports any semantic difference, exiting non-zero if there is one; `-o` writes the strict output."
source = "Project policy (D-API)"
kind = "cli"
status = "planned"
depends_on = ["LIB-CLI-002", "LIB-RT-002"]

[[row]]
id = "LIB-DOC-001"
area = "DOC"
milestone = "M1"
title = "Crate root documentation with a complete example"
requirement = "The crate root explains SACM in plain words, states what is supported (linking the matrix), and shows a runnable load → inspect → validate → edit → save example as a doctest; the crate README mirrors it."
source = "Project goal (well documented, easy to use)"
kind = "docs"
status = "planned"
depends_on = ["LIB-EDIT-001", "LIB-RT-002"]

# ===========================================================================
# M2 — Base model and argumentation
# ===========================================================================

[[row]]
id = "SACM23-BASE-004"
area = "BASE"
milestone = "M2"
title = "Descriptions, notes and implementation constraints"
requirement = "ModelElement's `description`, `note` and `implementationConstraint` containments (UtilityElements with MultiLangString `content`) are represented in order, round-tripped and editable on every ModelElement; several descriptions are preserved (D-DESC-MULT)."
source = "formal/23-05-08 §8.6, §8.7; ptc/22-03-13 Base::ModelElement, Base::UtilityElement"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-002", "SACM23-BASE-003"]

[[row]]
id = "SACM23-BASE-005"
area = "BASE"
milestone = "M2"
title = "TaggedValue"
requirement = "TaggedValue (MultiLangString `key` and `content`) is represented on every ModelElement in order, round-tripped and editable."
source = "formal/23-05-08 clause 8; ptc/22-03-13 Base::TaggedValue"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-004"]

[[row]]
id = "SACM23-BASE-006"
area = "BASE"
milestone = "M2"
title = "gid"
requirement = "The optional SACMElement `gid` is represented, preserved exactly, writable and editable on every element, distinct from the XMI id."
source = "formal/23-05-08 §8.2; ptc/22-03-13 Base::SACMElement.gid"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-003", "SACM23-XMI-004"]

[[row]]
id = "SACM23-XMI-005"
area = "XMI"
milestone = "M2"
title = "Reference serialization"
requirement = "Non-containment references are written as attributes named by the reference end holding space-separated xmi:ids; import also accepts child-element and `href=\"#id\"` forms; references to unknown ids are kept and diagnosed, not dropped."
source = "XMI 2.5.1 reference rules; docs/sacm/metamodel-inventory.md"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-004"]

[[row]]
id = "SACM23-BASE-007"
area = "BASE"
milestone = "M2"
title = "Citations"
requirement = "SACMElement `isCitation` and `citedElement` are represented on every element, round-tripped and editable; `citedElement` is a reference to any SACMElement."
source = "formal/23-05-08 §8.2; ptc/22-03-13 Base::SACMElement"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-003", "SACM23-XMI-005"]

[[row]]
id = "SACM23-BASE-008"
area = "BASE"
milestone = "M2"
title = "Abstract elements and abstract forms"
requirement = "SACMElement `isAbstract` and `abstractForm` are represented on every element, round-tripped and editable."
source = "formal/23-05-08 §8.2; ptc/22-03-13 Base::SACMElement"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-003", "SACM23-XMI-005"]

[[row]]
id = "SACM23-ARG-004"
area = "ARG"
milestone = "M2"
title = "metaClaim"
requirement = "Assertion `metaClaim` (references to Claims about an assertion) is represented on Claims and asserted relationships, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::Assertion.metaClaim"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-002", "SACM23-XMI-005"]

[[row]]
id = "SACM23-ARG-005"
area = "ARG"
milestone = "M2"
title = "ArgumentReasoning"
requirement = "ArgumentReasoning is represented with its optional `structure` reference to an ArgumentPackage, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::ArgumentReasoning"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-001", "SACM23-XMI-005"]

[[row]]
id = "SACM23-ARG-006"
area = "ARG"
milestone = "M2"
title = "ArtifactReference"
requirement = "ArtifactReference is represented with its `referencedArtifactElement` references (0..*, to ArtifactElements), created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::ArtifactReference"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-001", "SACM23-XMI-005"]

[[row]]
id = "SACM23-ARG-007"
area = "ARG"
milestone = "M2"
title = "AssertedRelationship common features"
requirement = "The shared features of all asserted relationships — `source` (1..*), `target` (1), optional `reasoning` (ArgumentReasoning) and required `isCounter` — are represented once and available on every relationship kind, round-tripped and editable."
source = "formal/23-05-08 §11.13; ptc/22-03-13 Argumentation::AssertedRelationship"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-002", "SACM23-ARG-005", "SACM23-XMI-005"]

[[row]]
id = "SACM23-ARG-008"
area = "ARG"
milestone = "M2"
title = "AssertedInference"
requirement = "AssertedInference is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedInference"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-007"]

[[row]]
id = "SACM23-ARG-009"
area = "ARG"
milestone = "M2"
title = "AssertedEvidence"
requirement = "AssertedEvidence is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedEvidence"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-007", "SACM23-ARG-006"]

[[row]]
id = "SACM23-ARG-010"
area = "ARG"
milestone = "M2"
title = "AssertedContext"
requirement = "AssertedContext is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedContext"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-007"]

[[row]]
id = "SACM23-ARG-011"
area = "ARG"
milestone = "M2"
title = "AssertedArtifactSupport"
requirement = "AssertedArtifactSupport is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedArtifactSupport"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-007", "SACM23-ARG-006"]

[[row]]
id = "SACM23-ARG-012"
area = "ARG"
milestone = "M2"
title = "AssertedArtifactContext"
requirement = "AssertedArtifactContext is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 11; ptc/22-03-13 Argumentation::AssertedArtifactContext"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-007", "SACM23-ARG-006"]

[[row]]
id = "SACM23-ARG-013"
area = "ARG"
milestone = "M2"
title = "ArgumentGroup"
requirement = "ArgumentGroup is represented with its `argumentElement` membership references (not containment), round-tripped and editable; deleting a member does not delete the group."
source = "formal/23-05-08 §11.2; ptc/22-03-13 Argumentation::ArgumentGroup; D-TEXT-MODEL (argumentElement spelling)"
kind = "model"
status = "planned"
depends_on = ["SACM23-ARG-001", "SACM23-XMI-005"]

[[row]]
id = "SACM23-XMI-010"
area = "XMI"
milestone = "M2"
title = "Source locations on read diagnostics"
requirement = "Every diagnostic produced while reading XMI carries the line and column of the element or attribute it concerns."
source = "D-DIAG"
kind = "xmi"
status = "planned"
depends_on = ["LIB-DIAG-001", "SACM23-XMI-001"]

[[row]]
id = "LIB-COMPAT-003"
area = "COMPAT"
milestone = "M2"
title = "Unknown content is preserved, not dropped"
requirement = "In tolerant mode, elements and attributes the model does not recognise (vendor extensions, unknown standard-looking names) are preserved at their position with a SACM-XMI-003 warning, and survive load → save in tolerant output."
source = "D-PRESERVE; docs/sacm/diagnostics.md SACM-XMI-003"
kind = "xmi"
status = "planned"
depends_on = ["LIB-COMPAT-001"]

[[row]]
id = "SACM23-XMI-008"
area = "XMI"
milestone = "M2"
title = "Strict save refuses what it cannot write conformantly"
requirement = "Strict save of a document holding preserved unknown or compatibility-only content fails with SACM-XMI-006 listing that content, and writes nothing; it never silently omits it."
source = "D-PRESERVE, D-STRICT; docs/sacm/diagnostics.md SACM-XMI-006"
kind = "xmi"
status = "planned"
depends_on = ["LIB-COMPAT-003"]

[[row]]
id = "SACM23-VAL-002"
area = "VAL"
milestone = "M2"
title = "gid uniqueness"
requirement = "Two elements with the same non-empty gid are reported as SACM-ID-003 errors; absent or empty gids are not compared."
source = "formal/23-05-08 §8.2 (\"unique within the scope of the model instance\"); SACM-ID-003"
kind = "validation"
status = "planned"
depends_on = ["SACM23-BASE-006"]

[[row]]
id = "SACM23-VAL-003"
area = "VAL"
milestone = "M2"
title = "Dangling references"
requirement = "A reference whose target id does not resolve is reported as SACM-REF-001 naming the referring element, the reference end and the missing id."
source = "XMI 2.5.1; docs/sacm/diagnostics.md SACM-REF-001"
kind = "validation"
status = "planned"
depends_on = ["SACM23-XMI-005", "LIB-DIAG-001"]

[[row]]
id = "SACM23-VAL-004"
area = "VAL"
milestone = "M2"
title = "Reference target typing"
requirement = "A reference resolving to an element of the wrong type for its end (per ptc/22-03-13) is reported as SACM-REF-002; a target that is preserved-but-untyped content is SACM-REF-003 (warning), not a dangling reference."
source = "ptc/22-03-13 reference end types; docs/sacm/diagnostics.md SACM-REF-002, SACM-REF-003"
kind = "validation"
status = "planned"
depends_on = ["SACM23-VAL-003", "LIB-API-003"]

[[row]]
id = "SACM23-VAL-005"
area = "VAL"
milestone = "M2"
title = "Relationship multiplicities"
requirement = "An asserted relationship with no source or without exactly one target is reported as SACM-MULT-001; the edit API cannot create one."
source = "formal/23-05-08 §11.13 (source[1..*], target[1]); SACM-MULT-001"
kind = "validation"
status = "planned"
depends_on = ["SACM23-ARG-007"]

[[row]]
id = "SACM23-VAL-007"
area = "VAL"
milestone = "M2"
title = "Citation constraints"
requirement = "The clause 8.2 citation rules are checked: `isCitation` true requires a `citedElement` and vice versa (SACM-CITE-001), with severity per D-SEV."
source = "formal/23-05-08 §8.2; SACM-CITE-001; D-SEV"
kind = "validation"
status = "planned"
depends_on = ["SACM23-BASE-007"]

[[row]]
id = "SACM23-VAL-008"
area = "VAL"
milestone = "M2"
title = "Abstract-form constraints (clause 8.2)"
requirement = "The clause 8.2 abstract-form rules are checked with the severities of D-SEV: an abstract element using abstractForm is an error; an abstractForm target that is not abstract, or of a different type, is a warning (SACM-ABS-001)."
source = "formal/23-05-08 §8.2; SACM-ABS-001; D-SEV"
kind = "validation"
status = "planned"
depends_on = ["SACM23-BASE-008"]

[[row]]
id = "SACM23-VAL-010"
area = "VAL"
milestone = "M2"
title = "MultiLangString language uniqueness"
requirement = "A MultiLangString with two values for the same language is diagnosed per clause 8.5."
source = "formal/23-05-08 §8.5"
kind = "validation"
status = "planned"
depends_on = ["SACM23-BASE-002"]

[[row]]
id = "SACM23-VAL-011"
area = "VAL"
milestone = "M2"
title = "Description multiplicity"
requirement = "A ModelElement with more than one description is preserved and reported as a SACM-MULT-001 warning citing clause 8.6 (D-DESC-MULT)."
source = "formal/23-05-08 §8.6; D-DESC-MULT"
kind = "validation"
status = "planned"
depends_on = ["SACM23-BASE-004"]

[[row]]
id = "SACM23-VAL-012"
area = "VAL"
milestone = "M2"
title = "ArgumentPackage homogeneity"
requirement = "An ArgumentPackage that nests a plain ArgumentPackage and also contains other argumentation elements is reported as a SACM-PKG-001 error; contained interfaces and bindings do not trigger it (D-PKG-HOMOG)."
source = "formal/23-05-08 §11.4, §11.6; D-PKG-HOMOG"
kind = "validation"
status = "planned"
depends_on = ["SACM23-ARG-001"]
notes = "The interface/binding exception is exercised by SACM23-ARG-014 and SACM23-ARG-015."

[[row]]
id = "SACM23-VAL-016"
area = "VAL"
milestone = "M2"
title = "Relationship end typing per kind"
requirement = "The source and target typing each asserted relationship kind's clause requires (e.g. evidence sources are ArtifactReferences) is checked, with severity per D-SEV."
source = "formal/23-05-08 clause 11 (each Asserted* subclause)"
kind = "validation"
status = "planned"
depends_on = ["SACM23-ARG-008", "SACM23-ARG-009", "SACM23-ARG-010", "SACM23-ARG-011", "SACM23-ARG-012", "SACM23-VAL-004"]

[[row]]
id = "LIB-DIAG-002"
area = "DIAG"
milestone = "M2"
title = "Diagnostic catalog stays in sync"
requirement = "Every diagnostic code the crate can emit is documented in docs/sacm/diagnostics.md and every live code there exists in the crate; a test enforces both directions."
source = "D-DIAG"
kind = "quality"
status = "planned"
depends_on = ["LIB-DIAG-001"]

[[row]]
id = "LIB-EDIT-004"
area = "EDIT"
milestone = "M2"
title = "Delete preview"
requirement = "Deleting an element can be previewed: the preview lists the element, everything it contains, every relationship and reference that would dangle, and whether the delete is applicable under each policy, without changing the document."
source = "D-PREVIEW"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-003", "SACM23-ARG-007"]

[[row]]
id = "LIB-EDIT-005"
area = "EDIT"
milestone = "M2"
title = "Element delete policies"
requirement = "Deleting a referenced element requires an explicit policy — reject if referenced (SACM-CMD-002) or delete the referencing relationships — and never leaves a dangling reference."
source = "D-POLICY"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-004"]

[[row]]
id = "LIB-EDIT-006"
area = "EDIT"
milestone = "M2"
title = "Package delete policies"
requirement = "Deleting a non-empty package requires an explicit policy — reject if non-empty (SACM-CMD-006) or delete recursively — and cross-package references are reported and handled under an explicit policy (SACM-CMD-007)."
source = "D-POLICY"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-004"]

[[row]]
id = "LIB-EDIT-007"
area = "EDIT"
milestone = "M2"
title = "Stale previews are rejected"
requirement = "A preview records the document revision it was computed against; applying it after any other mutation fails with SACM-CMD-003 and changes nothing."
source = "D-PREVIEW"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-004"]

[[row]]
id = "LIB-EDIT-008"
area = "EDIT"
milestone = "M2"
title = "Attribute edits"
requirement = "Names, descriptions, notes, tagged values, gid, citation and abstract flags, assertion declarations and isCounter can be changed through operations that are atomic and report what changed."
source = "D-ATOMIC, D-RESULT"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-002", "SACM23-BASE-005", "SACM23-ARG-007"]

[[row]]
id = "LIB-EDIT-009"
area = "EDIT"
milestone = "M2"
title = "Reference edits"
requirement = "Relationship sources/targets/reasoning, metaClaims, citedElement, abstractForm, group membership and artifact references can be set, added and removed through atomic operations that refuse targets of the wrong type."
source = "D-ATOMIC"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-002", "SACM23-ARG-007", "SACM23-ARG-013", "SACM23-VAL-004"]

[[row]]
id = "LIB-EDIT-010"
area = "EDIT"
milestone = "M2"
title = "Reorder contained elements"
requirement = "The order of a package's contained elements can be changed atomically; the new order is preserved through save and load."
source = "D-ATOMIC, D-RT"
kind = "editing"
status = "planned"
depends_on = ["LIB-EDIT-002"]

# ===========================================================================
# M3 — Artifact model
# ===========================================================================

[[row]]
id = "SACM23-ART-001"
area = "ART"
milestone = "M3"
title = "ArtifactPackage"
requirement = "ArtifactPackage is represented, contained in an AssuranceCasePackage or as a root interchange object, and contains ArtifactElements (role `artifactElement`) in document order."
source = "formal/23-05-08 clause 12; ptc/22-03-13 Artifact::ArtifactPackage; clause 2"
kind = "model"
status = "planned"
depends_on = ["SACM23-AC-001", "SACM23-XMI-005"]

[[row]]
id = "SACM23-ART-002"
area = "ART"
milestone = "M3"
title = "Date-typed attributes"
requirement = "Attributes the text types as `date` (Artifact.date, Event.date, Activity.startTime/endTime) are represented so that every conforming lexical value round-trips exactly and a non-conforming value is diagnosed, per the resolution of Q-DATE."
source = "formal/23-05-08 §12.7–12.9; D-TEXT-MODEL; Q-DATE"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-001"]

[[row]]
id = "SACM23-ART-003"
area = "ART"
milestone = "M3"
title = "Property"
requirement = "ArtifactAsset `property` containment (Property elements, themselves ArtifactAssets) is represented on every artifact asset, round-tripped and editable."
source = "formal/23-05-08 clause 12; ptc/22-03-13 Artifact::ArtifactAsset.property, Artifact::Property"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-001"]

[[row]]
id = "SACM23-ART-004"
area = "ART"
milestone = "M3"
title = "Artifact"
requirement = "Artifact is represented with `version` and `date`, created, round-tripped and editable."
source = "formal/23-05-08 clause 12; ptc/22-03-13 Artifact::Artifact"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-002", "SACM23-ART-003"]

[[row]]
id = "SACM23-ART-005"
area = "ART"
milestone = "M3"
title = "Resource"
requirement = "Resource is represented with its `location` MultiLangString (text followed over the model, D-TEXT-MODEL), created, round-tripped and editable."
source = "formal/23-05-08 §12.10; D-TEXT-MODEL"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-003"]

[[row]]
id = "SACM23-ART-006"
area = "ART"
milestone = "M3"
title = "Activity"
requirement = "Activity is represented with `startTime` and `endTime`, created, round-tripped and editable."
source = "formal/23-05-08 clause 12; ptc/22-03-13 Artifact::Activity"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-002", "SACM23-ART-003"]

[[row]]
id = "SACM23-ART-007"
area = "ART"
milestone = "M3"
title = "Event"
requirement = "Event is represented with `date`, created, round-tripped and editable."
source = "formal/23-05-08 §12.9; D-TEXT-MODEL"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-002", "SACM23-ART-003"]

[[row]]
id = "SACM23-ART-008"
area = "ART"
milestone = "M3"
title = "Technique"
requirement = "Technique is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 12; ptc/22-03-13 Artifact::Technique"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-003"]

[[row]]
id = "SACM23-ART-009"
area = "ART"
milestone = "M3"
title = "Participant"
requirement = "Participant is represented, created, round-tripped and editable."
source = "formal/23-05-08 clause 12; ptc/22-03-13 Artifact::Participant"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-003"]

[[row]]
id = "SACM23-ART-010"
area = "ART"
milestone = "M3"
title = "ArtifactAssetRelationship"
requirement = "ArtifactAssetRelationship is represented with `source` (1..*) and `target` (1..*) references to ArtifactAssets, created, round-tripped, editable, and its multiplicities validated."
source = "formal/23-05-08 §12.14; D-TEXT-MODEL (name and generalization)"
kind = "model"
status = "planned"
depends_on = ["SACM23-ART-004"]

[[row]]
id = "SACM23-ART-011"
area = "ART"
