[[row]]
id = "LIB-TOOL-015"
area = "TOOL"
milestone = "M0"
title = "Verdict lines hidden by Markdown do not count"
requirement = "A `- Row verdict:` line that Markdown hides never counts, and a record whose rendering is ambiguous cannot pass. Code blocks, including a backtick fence whose info string contains a backtick (the next ``` line then opens a fence), and closed comments hide lines. Any other raw HTML is a problem rather than something the gate tries to render."
source = "Slice 0004 fix round 1, implementer follow-up (left outside the P-005 contract). Verification 0004 round 2 seeds P2 (```a`b, then ```, then PASS, then ```) and P7 (<div>, then ```, then </div>, then FAIL, then a fenced PASS); both give a false PASS today."
kind = "tooling"
status = "verified"
code = ["xtask/src/matrix.rs", "xtask/Cargo.toml"]
acceptance = [
  "A `- Row verdict:` line inside a closed HTML comment block (one HTML block that is a single comment) does not count and is not malformed. A candidate can never lie inside an inline comment (a column-0 list item ends the paragraph, CommonMark §5.2). A closed inline comment hides nothing, so a verdict-like line inside one is reported (slice 0007 round 3, D14 withdrawn). A PASS line after a closed comment counts.",
  "Raw HTML other than a closed comment and the inline tags <br>, <ul>, </ul>, <li>, </li> (case-insensitive; also <br/> and <br />) is a problem: `verification record <p>:<line>: raw HTML other than a closed comment or <br>, <ul>, <li> is not allowed`, once per line that holds it, per citing row. This covers HTML blocks of types 1 and 3 to 7, an unclosed comment, a comment with text after its closer in the same block, `--!>`, and inline tags outside the list. The verifier's probes of verification 0007 round 1 (F1, F3, F4 b) each give that problem and never pass.",
  "A backtick fence opener whose info string contains a backtick is not an opener. In seed P2 (```a`b, then ```, then a PASS line, then ```), the PASS is inside the fence that the second line opens, so the record has no verdict line. Seed P7 (<div>, then ```, then </div>, ...) now gives the raw-HTML problem. Controls: a PASS after a closed tilde fence whose info string holds a backtick, and after a closed backtick fence whose info string holds a tilde, counts.",
  "README rule 5 states the strict rules. It makes no claim to match what a browser renders.",
]
depends_on = ["LIB-TOOL-005"]
