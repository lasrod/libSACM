[[row]]
id = "SACM23-ART-001"
area = "ART"
milestone = "M3"
title = "ArtifactPackage"
requirement = "ArtifactPackage (§12.2) is read and written as a root (bare or inside `xmi:XMI`), in an AssuranceCasePackage's `artifactPackage` role, and nested in another ArtifactPackage's `artifactElement` role with `xmi:type`; it holds its ArtifactElements in the composite role `artifactElement : ArtifactElement [0..*]` in document order (every ArtifactElement kind is admitted: LIB-API-008, ADR 0014), so the kinds already readable are also read inside it. An untyped `artifactElement` child is `MissingType` (SACM-XMI-005); one in reference form is a not-yet-read proxy (SACM23-XMI-019, SACM23-XMI-027). ArtifactElement kinds this release does not read yet (the Terminology and AssuranceCase interface and binding kinds) are refused as `Interim` naming their rows (LIB-API-011); its `interface` end is read (SACM23-ART-012); the type `ArtifactAssertedRelationship` is a spelling read as SACM23-XMI-009 says. `edit::CreateArtifactPackage` creates one as a root or a child (ADR 0034)."
source = "formal/23-05-08 §12.2 (`artifactElement:Base::ArtifactElement[0..*] (composition)`; \"ArtifactPackages can also be nested\"); ptc/22-03-13 Artifact::ArtifactPackage (`artifactElement : ArtifactElement [0..*]`, composite; `interface : ArtifactPackageInterface [0..*]`); clause 2 (ArtifactPackage is a unit of interchange); ADR 0034"
kind = "model"
status = "verified"
verification = "docs/verification/0052-m3-artifact-basics.md"
code = ["crates/sacm/src/xmi/refusal.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/edit/artifact.rs", "crates/sacm/src/edit.rs"]
depends_on = ["SACM23-AC-001", "SACM23-XMI-005", "LIB-API-008"]
acceptance = [
  "The three placements (root bare and in `xmi:XMI`; in an AssuranceCasePackage's `artifactPackage`, typed or untyped; nested typed in `artifactElement`, with `xsi:type` giving SACM-XMI-010 as elsewhere) read in both modes with kind, id, name, parent and document order.",
  "An untyped `<artifactElement xmi:id=\"x\"/>` is `MissingType` (SACM-XMI-005) at its `<` in strict mode; a tolerant read keeps it whole as preserved content of its parent, with SACM-XMI-005 as a Warning (LIB-COMPAT-001).",
  "Every kind already readable (AssuranceCasePackage, ArgumentPackage, the nine argumentation kinds, ArtifactPackage, and the artifact kinds Property, Technique, Participant, ArtifactGroup, Artifact, Resource, Activity, Event and ArtifactAssetRelationship, the terminology kinds TerminologyPackage, Category, Term, Expression and TerminologyGroup, and the Argumentation and Artifact package interfaces and bindings) is read inside an ArtifactPackage; each kind not read yet is `Unsupported` with the exact label and row at the exact location in strict mode; a tolerant read keeps each as preserved content, with one SACM-XMI-014 naming the row (LIB-API-011).",
  "Written as `sacm:ArtifactPackage` at the root, an untyped `<artifactPackage>` under an AssuranceCasePackage, and `artifactElement` children with `xmi:type`. The fixture `artifact-package-valid.sacm.xmi` reads with no diagnostic in either mode and writes exactly `golden/artifact-package.golden.sacm.xmi`; reading that back is `==` and writing it again is byte-identical.",
  "`CreateArtifactPackage::root(name)` and `::new(parent, name)`: legal parents are none (a root), an AssuranceCasePackage and an ArtifactPackage; refusals in the order ParentNotFound, InvalidParent, InvalidId, DuplicateId; the generated id is `artifact_package_<n>`; `edit::check` and `edit::preview` agree with `edit::apply`.",
  "Deleting a non-empty ArtifactPackage is `NotEmpty` (SACM-CMD-006) unless `DeleteRecursively`, which deletes its subtree.",
]
tests = [
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_001_create_artifact_package_creates_roots_in_document_order",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_001_create_artifact_package_legal_parents_refusals_and_generated_id",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_001_create_artifact_package_reports_what_it_was_given",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_001_each_artifact_create_converts_into_its_operation_variant",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_001_the_artifact_creates_are_send_sync_clone_debug_and_eq",
