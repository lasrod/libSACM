requirement = "Errors from reading or parsing the matrix (for example TOML errors, which span several lines) are reported like gate problems: each on its own line, with control characters escaped, so a CI log shows them intact."
source = "Verification 0004 round 1 follow-up"
kind = "tooling"
status = "planned"
depends_on = ["LIB-TOOL-010"]

[[row]]
id = "LIB-TOOL-015"
area = "TOOL"
milestone = "M0"
title = "Verdict lines hidden by Markdown do not count"
requirement = "A `- Row verdict:` line that rendered Markdown hides does not count as a verdict line. This covers a line inside an HTML comment or HTML block. It also covers a line that a backtick-fence opener only appears to close: CommonMark does not accept a backtick fence opener whose info string contains a backtick (for example ```a`b), so the next ``` line opens a fence instead."
