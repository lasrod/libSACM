[[row]]
id = "SACM23-VAL-005"
area = "VAL"
milestone = "M2"
title = "Relationship multiplicities"
requirement = "`validation::validate` reports each asserted relationship with no `source`, and each with no `target`, as one SACM-MULT-001 Error per missing end (requirement SACM23-VAL-005, clause `11.13`, affected `[relationship]`, no location), because §11.13 and ptc/22-03-13 agree on `source [1..*]` and `target [1]` (D-SEV). Both saves write such a relationship (XMI 2.5.1 §7.8.2: the schema ignores multiplicities; ADR 0035 D4, ADR 0027). Two targets cannot be held (`RepeatedValue` on read, ADR 0026). Create operations cannot make one (`TooFewReferences`, the required target argument)."
source = "formal/23-05-08 §11.13 (p. 40) `source:ArgumentAsset[1..*]`, `target:ArgumentAsset[1]`; ptc/22-03-13 Argumentation::AssertedRelationship source [1..*], target [1..1]; XMI 2.5.1 §7.8.2 (schemas ignore multiplicities); D-SEV; D-VAL-LAYER; ADR 0027"
kind = "validation"
status = "verified"
verification = "docs/verification/0043-m2-asserted-relationships.md"
depends_on = ["SACM23-ARG-007", "SACM23-VAL-018", "LIB-COMPAT-007"]
acceptance = [
  "An AssertedInference with no `source` gives one SACM-MULT-001 Error, requirement SACM23-VAL-005, clause `11.13`, affected `[relationship]`, no location, the message naming `source`; with no `target`, one naming `target`; with neither, two.",
  "The same for an AssertedContext.",
  "A relationship with a source and a target gives none, whatever the declaration or `isCounter`.",
  "A strict and a tolerant write keep the relationship as read.",
]
tests = [
  "crates/sacm/tests/relationship_validation.rs::sacm23_val_005_an_asserted_inference_missing_its_source_or_target_gives_one_error_per_missing_end",
  "crates/sacm/tests/relationship_validation.rs::sacm23_val_005_an_asserted_context_missing_its_source_or_target_gives_one_error_per_missing_end",
  "crates/sacm/tests/relationship_validation.rs::sacm23_val_005_each_relationship_kind_inserted_without_ends_gives_two_errors",
  "crates/sacm/tests/relationship_validation.rs::sacm23_val_005_the_fixture_gives_two_errors_on_its_inference",
  "crates/sacm/tests/relationship_validation.rs::sacm23_val_005_a_relationship_with_a_source_and_a_target_gives_none_whatever_its_declaration_or_is_counter",
  "crates/sacm/tests/relationship_validation.rs::sacm23_val_005_a_strict_and_a_tolerant_write_keep_the_relationship_as_read",
]
