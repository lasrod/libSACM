[[row]]
id = "SACM23-VAL-004"
area = "VAL"
milestone = "M2"
title = "Reference target typing"
requirement = "`validation::validate` reports each distinct id of each reference end of each element that names an element whose kind does not conform to the end's declared type (ptc/22-03-13; for `interface`, `implements` and `participantPackage`, the class of the holder's family) as one SACM-REF-002 Error (`Code::REF_WRONG_TYPE`), with requirement SACM23-VAL-004, the end's clause, affected `[referrer, target]`, no location, and a message naming the referrer, the end, the target's kind and the declared type (ADR 0028). A dangling id gives only SACM-REF-001. Both loads keep the reference and both saves write it: IDREF is untyped, so a wrong type is schema-valid (ADR 0035 D4). Every create refuses a wrongly typed end as `EditError::WrongReferenceType` (D-VAL-LAYER, amended). SACM-REF-003 is LIB-COMPAT-003's."
source = "formal/23-05-08 §8.2 \"citedElement:SACMElement[0..1]\", \"abstractForm:SACMElement[0..1]\"; §11.10 \"metaClaim:Claim[0..*]\"; §11.12 \"structure:ArgumentPackage[0..1]\"; §11.13 \"source:ArgumentAsset[1..*]\", \"target:ArgumentAsset[1]\", \"reasoning:ArgumentReasoning[0..1]\"; §11.9 \"referencedArtifactElement:Base::ArtifactElement[0..*]\"; §11.2 \"argumentationElement:ArgumentationElement[0..*]\"; ptc/22-03-13 end types; XMI 2.5.1 rule 4i (p. 51); D-SEV; D-VAL-LAYER; ADR 0026; ADR 0027; ADR 0028; assurance-forge validate.cpp:42-79, 354-362, commands.cpp:467-495"
kind = "validation"
status = "verified"
notes = "Slice 0066: reworded for the ARG/ART package interfaces and bindings (SACM23-ARG-014, -015, SACM23-ART-012, -013, LIB-EDIT-019); re-check there."
verification = "docs/verification/0044-m2-artifact-relationships.md"
depends_on = ["SACM23-VAL-003", "LIB-API-003", "SACM23-ARG-004", "SACM23-ARG-005", "SACM23-ARG-007", "SACM23-ARG-006", "SACM23-ARG-013", "SACM23-VAL-018", "LIB-COMPAT-007"]
acceptance = [
  "A Claim with `metaClaim=\"r1\"` (an ArgumentReasoning) gives one SACM-REF-002 Error, clause `11.10`, affected `[c, r1]`, no location.",
  "An AssertedInference with `reasoning=\"c1\"` gives one finding (clause `11.13`); `source=\"p\"` (a package) and `target=\"g1\"` (a group) give two; a Note source gives one.",
  "ArgumentReasoning `structure=\"c1\"` gives one (clause `11.12`); ArtifactReference `referencedArtifactElement=\"t1\"` (a TaggedValue) gives one (clause `11.9`); ArgumentGroup `argumentElement=\"case\"` (an AssuranceCasePackage) gives one (clause `11.2`).",
  "`citedElement` or `abstractForm` naming a Note gives no SACM-REF-002; a dangling id or a name's `xmi:id` gives only SACM-REF-001; `source=\"n1 n1\"` gives one SACM-REF-002 and one SACM23-VAL-022 Warning.",
  "A strict and a tolerant write keep the bytes; both loads succeed.",
  "Every create (`CreateArgumentReasoning`, `CreateAssertedInference`, `CreateAssertedContext`, and this slice's five) refuses a wrongly typed end as `EditError::WrongReferenceType { end, id, kind, expected }` (SACM-REF-002), after `ReferenceNotFound`, over the ends in order, leaving the document unchanged.",
  "`Code::REF_WRONG_TYPE` is SACM-REF-002, and the catalog row names it and SACM23-VAL-004; no document without preserved content yields SACM-REF-003 (LIB-COMPAT-003).",
]
tests = [
