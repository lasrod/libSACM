[[row]]
id = "SACM23-XMI-010"
area = "XMI"
milestone = "M1"
title = "Read refusals are located at what they refuse"
requirement = "Every `ReadError` from `xmi::read` carries the line and column of the construct it refuses: lines end as in XML 1.0 §2.11, columns count characters, and a leading byte order mark takes no column. An element is located at the `<` of its start tag, an attribute at the first character of its qualified name, text at its first character in the input that is not literal white space (a CDATA section or a character reference is located at its start), and a DOCTYPE at `<!DOCTYPE`. A well-formedness error is located where the input stops being well-formed, or at the end of a truncated input. An unsupported encoding is located at its name, or at line 1, column 1. Only a refusal for the parser's capacity limits has no location."
source = "D-DIAG \"source location where available\"; ADR 0011; ADR 0015 \"Each refusal carries a `SourceLocation` where one is known\"; XML 1.0 (Fifth Edition) §2.11; assurance-forge `io/xmi_reader.cpp:298-317` (C++ locates at the node, never at an attribute)"
kind = "xmi"
status = "verified"
depends_on = ["SACM23-XMI-016", "SACM23-XMI-012", "LIB-API-009", "LIB-DIAG-001"]
notes = "Moved to M1 by the maintainer, 2026-11-12: edited documents must reload, and M1's round-trip rows need it. Split in slice 0029: locations on read diagnostics move to SACM23-XMI-023. Slice 0036: tests updated for the coded id refusals (ADR 0015 amendment 2); re-checked there. Slice 0037: tests changed for the value elements (SACM23-XMI-014); re-checked there. Slice 0040: the table gains the utility-element, MultiLangString and gid refusals (ADR 0025); re-check there. Slice 0042: its tests replaced `isCitation`/`isAbstract` unread samples (now read, ADR 0026) with other unread ones, locations unchanged; re-check there. Slice 0044: the table gains the ArtifactReference and ArgumentGroup refusals (ADR 0028), with a new test; re-check there."
acceptance = [
  "A table test with one input per refusal site (every `ReadError` variant, and every `Unsupported` reason for roots and for children) places each construct at line 3 or later and, where the construct allows it, at column 5 or later after a CRLF, a lone CR and a non-ASCII character, and asserts the exact `location()`; each site where content that does not conform was refused before ADR 0033 is a row of its own, whose one SACM-XMI-003 must be at the same construct (LIB-COMPAT-003). A byte order mark, the first-bytes encodings and the XML declaration are the stated exceptions.",
  "`Display` shows \" at line L, column C\" for every input in the table, before the reason where there is one.",
  "Only the capacity-limit refusals return `None`; this is checked at unit level, and the public `ReadError` and `location()` docs say so.",
  "Text after white space written as a reference or CDATA is located at the start of that construct: `&#x20;x` at its `&`, and `<![CDATA[ x]]>` at its `<![CDATA[`.",
]
code = ["crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/input.rs", "crates/sacm/src/xmi.rs"]
tests = [
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_encoding_declaration_and_decoding_refusals_are_located",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_doctype_and_well_formedness_refusals_are_located",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_invalid_root_no_package_and_wrapper_refusals_are_located",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_root_refusals_are_located",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_name_refusals_are_located",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_child_role_and_type_refusals_are_located",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_child_kind_id_attribute_and_content_refusals_are_located",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_the_table_covers_every_read_error_variant",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_display_shows_the_location_for_every_refusal_site",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_hand_counted_locations_after_crlf_a_lone_cr_and_non_ascii",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_text_after_white_space_written_as_a_reference_or_cdata_is_located_at_that_construct",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_value_element_and_repeated_value_refusals_are_located",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_utility_element_and_multi_lang_string_refusals_are_located",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_gid_refusals_are_located",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_is_citation_and_is_abstract_refusals_are_located",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_cited_element_and_abstract_form_refusals_are_located",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_relationship_meta_claim_and_structure_refusals_are_located",
  "crates/sacm/tests/xmi_read_locations.rs::sacm23_xmi_010_artifact_reference_and_argument_group_refusals_are_located",
]
