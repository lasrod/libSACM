[[row]]
id = "LIB-API-009"
area = "API"
milestone = "M1"
title = "The reader refuses what it cannot represent"
requirement = "`xmi::read` never returns a document that is missing content from its input (D-PRESERVE). Content that does not conform where it stands is read and kept as preserved content (LIB-COMPAT-003). A strict read refuses other well-formed input that it cannot fully represent with `ReadError::Unsupported`, which carries the catalog code a tolerant read gives the same input (LIB-API-017), a reason and a location, from one labelled list (LIB-API-011); a tolerant read keeps all of it with a Warning except the encodings, the limits, a root outside SACM 2.3 or XMI 2.5.1, and an XMI-namespace document element (LIB-COMPAT-001). The list: conforming content that no verified row reads yet (SACM23-XMI-001 reads the first package roots), non-conforming content on the `xmi:XMI` element or in a preserved attribute whose prefix cannot be written (ADR 0033), UTF-16 without a byte order mark, UTF-32 or UCS-4 input, and a declared encoding other than UTF-8 or ASCII in input without a UTF-16 byte order mark (SACM23-XMI-018 reads UTF-16 with one). A declared UTF-8 or ASCII encoding is accepted in any letter case; a byte of 0x80 or above under an ASCII declaration is malformed (SACM-XML-001). Parser capacity limits belong to LIB-SEC-003."
source = "D-PRESERVE \"Never drop conforming SACM data. Preserve with a diagnostic, or refuse\"; ADR 0015 (interim rule); ADR 0005 B2; XML 1.0 (Fifth Edition) §4.3.3 (encodings; quoted when SACM23-XMI-018 is analysed)"
kind = "api"
status = "verified"
verification = "docs/verification/0037-m1-element-form-values.md"
depends_on = ["LIB-API-004", "LIB-DIAG-001"]
acceptance = [
  "Well-formed SACM input the reader cannot represent yet (e.g. an `AssuranceCasePackage` root with an `artifactPackage` child, `xmi:uuid` on a `name`, or a `TerminologyPackageInterface` root) is refused by a strict read with `ReadError::Unsupported`, whose `code()` is the code a tolerant read keeps it with (SACM-XMI-014 for these; LIB-API-017), located at the construct it cannot read; no partial document is returned. Which roots are recognised at all is SACM23-XMI-001.",
  "UTF-32 BOMs, and BOM-less UTF-16 or UCS-4 input recognised by its first bytes (XML 1.0 Appendix F: `3C 00 3F 00`, `00 3C 00 3F` and the four-byte forms), such as a document declaring `UTF-16LE`, are refused with `Unsupported`, never `Malformed` and never misread; the reason does not claim a BOM that is not there. Every BOM and first-bytes refusal is located at line 1, column 1. UTF-16 with a byte order mark is read by SACM23-XMI-018.",
  "A declared `encoding=\"ISO-8859-1\"` (and another non-UTF-8 name) is refused with `Unsupported` located at the encoding name (`<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>` at line 1, column 31; with a CR before `encoding`, at line 2), whether or not its bytes are valid UTF-8: a real ISO-8859-1 file with a 0xE9 byte is `Unsupported`, not `Malformed`, because the declaration is read before the UTF-8 check (ADR 0005 B2). Declarations of `UTF-8`, `utf-8`, `Utf-8`, `US-ASCII`, `us-ascii`, `ASCII` and `ascii` are not refused for their encoding: a readable root under each reads `Ok`, and an unreadable one is refused at the root start tag. A non-ASCII character under an ASCII declaration is `Malformed` at that character (`<?xml version=\"1.0\" encoding=\"US-ASCII\"?>\\n<r>café</r>` at line 2, column 7).",
  "The `Unsupported` `Display` is one lowercase line without trailing punctuation, naming the location when known; names from the input are quoted.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/input.rs"]
tests = [
  "crates/sacm/tests/xmi_read.rs::lib_api_009_well_formed_sacm_document_is_unsupported_at_the_construct_it_cannot_read",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_well_formed_non_sacm_document_is_unsupported_at_its_root",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_utf32_input_with_a_bom_is_unsupported",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_utf16_and_ucs4_without_bom_are_unsupported_by_their_first_bytes",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_declared_non_utf8_encoding_is_unsupported",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_utf8_and_ascii_declarations_in_any_case_are_not_refused",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_non_ascii_byte_under_ascii_declaration_is_malformed",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_utf8_and_ascii_declarations_in_any_case_are_refused_at_the_root_not_the_encoding",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_declared_non_utf8_encoding_is_located_at_the_encoding_name",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_bom_and_first_bytes_refusals_are_located_at_line_1_column_1",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_declared_non_utf8_encoding_with_invalid_utf8_bytes_is_unsupported",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_invalid_utf8_without_or_under_a_utf8_or_ascii_declaration_stays_malformed",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_unsupported_display_is_one_located_line_quoting_names",
  "crates/sacm/tests/xmi_read.rs::lib_api_009_refusal_of_an_encoding_name_with_line_breaks_stays_one_line",
]
notes = "Item 1 and item 3 reworded in slice 0021, when SACM23-XMI-001 made the first inputs readable; re-checked there. Reworded and re-checked in slice 0024: UTF-16 moves to SACM23-XMI-018, so item 2 and the requirement no longer list UTF-16 with a byte order mark. Slice 0026: the example became a `note` child, because SACM23-XMI-012 reads names; re-checked there. Slice 0029: its sample's `argumentPackage` child becomes readable (SACM23-XMI-016), so the test's refusal moves to the later `assertionDeclaration`; re-checked there. Slice 0037: tests changed for the value elements (SACM23-XMI-014); re-checked there. Slice 0042: its tests replaced `isCitation`/`isAbstract` unread samples (now read, ADR 0026) with other unread ones, locations unchanged; re-check there. Slice 0062: reworded for the Terminology kinds; re-check there. Slice 0063: refusals carry codes, templates and arguments (LIB-API-017); re-check there."

[[row]]
id = "LIB-API-010"
area = "API"
milestone = "M1"
title = "The writer never drops content"
requirement = "`xmi::write` never returns output that is missing content the `Document` holds (D-PRESERVE). It writes every feature a `Document` can hold: kind, id, name and name id, `gid`, the flags, the reference ends, a non-default `assertionDeclaration`, utility elements with their `content` and `key` and their ids, an Artifact's `version`, the `date` of an Artifact or an Event, an Activity's `startTime` and `endTime`, a Resource's `location` with its ids, and preserved content (each feature's output is tested under the row that reads it); its only refusals are `WriteError::NoRoot`, `WriteError::UnrepresentableCharacter` and, in strict mode only, `WriteError::PreservedContent` for a document holding preserved content (SACM23-XMI-008) and `WriteError::Invalid` for output that would not be schema-valid (LIB-COMPAT-007); a tolerant write writes everything a `Document` holds. A later row that lets a `Document` hold content before a row writes it must, in the same slice, make `write` refuse that content with an error naming the element (`WriteError::Unsupported`, reserved by ADR 0017 amendment 2), and never drop it. This is the write-side twin of ADR 0015's interim rule."
source = "D-PRESERVE \"Never drop conforming SACM data. Preserve with a diagnostic, or refuse\"; ADR 0015; ADR 0017 and its amendments 1 and 2"
kind = "api"
status = "verified"
depends_on = ["LIB-API-004", "LIB-DIAG-001", "SACM23-XMI-004", "SACM23-XMI-012", "SACM23-XMI-017", "LIB-COMPAT-007"]
acceptance = [
  "Completeness: a document with every kind in an admitted position (built with `edit::apply` and the test-support seam), every ModelElement named (absent, empty and non-ASCII name fields), and on each of the six Assertion kinds each of the six declarations on at least one element, writes `Ok`. For every element, in document order, the output holds exactly one start tag with its `xmi:id`, its `name` line exactly when it is named, and `assertionDeclaration=\"<literal>\"` exactly when the declaration is not `asserted`.",
  "A named element is written, not refused (SACM23-XMI-012).",
  "In tolerant mode `write` refuses only with `NoRoot` or `UnrepresentableCharacter`; `WriteError` is a `Send + Sync` error whose every variant has a catalog code (SACM-XMI-001, SACM-XML-003, SACM-XMI-016, and SACM-XMI-006 for `PreservedContent`, SACM23-XMI-008; LIB-API-017), with a one-line `Display`.",
  "The `write`, `WriteError` and crate docs no longer say that any declaration is refused.",
]
code = ["crates/sacm/src/xmi.rs", "crates/sacm/src/xmi/output.rs", "crates/sacm/src/model/document.rs", "docs/adr/0017-xmi-writer.md"]
tests = [
  "crates/sacm/tests/xmi_write.rs::lib_api_010_a_named_element_is_written_not_refused",
  "crates/sacm/tests/xmi_write.rs::lib_api_010_every_feature_a_document_holds_is_written",
  "crates/sacm/tests/xmi_write.rs::lib_api_010_write_error_refuses_only_no_root_unrepresentable_character_invalid_and_preserved_content",
  "crates/sacm/tests/xmi_write.rs::lib_api_010_write_error_is_a_send_sync_error_and_only_preserved_content_has_a_code",
]
verification = "docs/verification/0037-m1-element-form-values.md"
notes = "Reworded and re-checked in slice 0026: names are no longer refused. Reworded in slice 0030: declarations are written (SACM23-XMI-017), so nothing a `Document` holds is refused and `WriteError::Unsupported` is removed until a row needs it; re-checked there. Slice 0035: strict write also refuses invalid documents (`WriteError::Invalid`, LIB-COMPAT-007), so the refusal set is stated per mode; re-checked there. Slice 0037: its error-type test was renamed for the three `WriteError` variants and now asserts `Invalid` too (a follow-up); re-checked there. Slice 0053: `WriteError::Invalid` is the schema check only and never runs `validate` (ADR 0035 D4). Slice 0060 (M3 close audit): reworded; re-check there. Slice 0063: refusals carry codes, templates and arguments (LIB-API-017); re-check there."

[[row]]
id = "LIB-API-011"
area = "API"
milestone = "M2"
title = "Unread content is listed and gated"
requirement = "Every `ReadError::Unsupported` comes from one crate-private list (`xmi/refusal.rs`), whose entries are `Interim(row)` (conforming input this version does not read; the row reads it), `Tolerance(row)` (input that only tolerant mode is to read, under the row), `Limit` (a limit of this version) or `Defect` (non-conforming input a strict read refuses). Each reason ends with exactly one label: `(a limit of this version; ROW reads it)`, `(a limit of this version)`, `(strict mode never reads it; ROW is to read it in tolerant mode)` or `(a defect in the input)`. An xtask test checks that `Unsupported` is built only there, that every `Interim` row exists, is not verified and is in the `depends_on` closure of SACM23-CP-001 and SACM23-CP-003 (whose units of interchange, an AssuranceCasePackage and an ArtifactPackage, can hold every kind) and, for an `SACM23-ARG-` row, of CP-002, for an `SACM23-TERM-` row, of CP-004, and for a row of no package, of all four (the maintainer, 2026-11-16: a refusal gates the compliance points whose documents can hold it, not the Argumentation or Terminology point for another package's kinds), and that every `Tolerance` row exists and is not verified. That is a strict read; a tolerant read keeps every entry except the refused set (an encoding, a limit, `OtherSacmNamespace`, `OtherXmiNamespace` and an XMI-namespace document element) as preserved content with SACM-XMI-014, ending `…; ROW reads it`, SACM-XMI-007 for a cross-document `href`, or SACM-XMI-003 for a `Defect`, from one crate-private table (`Unread::tolerant`, ADR 0035). `Interim` covers conforming input this version does not read yet, and XMI-namespace elements that XMI.xsd does not define (SACM23-XMI-019)."
source = "D-PRESERVE; D-STRICT; ADR 0015 (and amendment 1); ADR 0016; ADR 0033; XMI 2.5.1 §7.6.1 `<xsd:attribute name=\"id\" type=\"xsd:ID\" use=\"optional\"/>`, §7.3.3 \"Tools that rely on XMI are expected to store the extension information and export it again\"; ADR review, 2026-11-13 (the maintainer: apply every recommendation)"
kind = "api"
status = "verified"
verification = "docs/verification/0053-simplification.md"
depends_on = ["LIB-API-009", "LIB-API-010", "LIB-COMPAT-003", "LIB-COMPAT-008", "LIB-COMPAT-010", "SACM23-XMI-026"]
acceptance = [
  "xtask/tests/interim_refusals.rs: (a) outside comments and `#[cfg(test)]`, the token `Unsupported` appears in `crates/sacm/src` only in `xmi.rs` and `xmi/refusal.rs`; (b) every `Interim(\"…\")` names a row that exists, is not `verified`, and is in the `depends_on` closure of SACM23-CP-001 and SACM23-CP-003 (whose units of interchange, an AssuranceCasePackage and an ArtifactPackage, can hold every kind) and, for an `SACM23-ARG-` row, of CP-002, for an `SACM23-TERM-` row, of CP-004, and for a row of no package, of all four (the maintainer, 2026-11-16: a refusal gates the compliance points whose documents can hold it, not the Argumentation or Terminology point for another package's kinds); (c) every `Tolerance` row exists and is not verified; each check reports an in-memory mutation of the source or matrix with its own code.",
  "One input per `Unread` variant, read strictly, gives `Unsupported` whose reason ends with that variant's label and row.",
  "SACM23-XMI-027 is in the `depends_on` of SACM23-CP-001 to -004 (the maintainer, 2026-11-15); LIB-COMPAT-004 is not, being a `Tolerance` row (the maintainer, 2026-11-16).",
  "The stale \"ADR 0017 amendment 1/2\" citations in code and test comments are gone.",
  "Tolerant mode: one input per kept `Unread` entry reads `Ok` with one Warning: SACM-XMI-014 naming the entry's row, SACM-XMI-007 for a cross-document `href`, and SACM-XMI-003 for a `Defect` (conforming content is never SACM-XMI-003); each refused entry is `Unsupported` in both modes; a unit test shows `Unread::tolerant` is total and refuses exactly the refused set.",
]
code = ["crates/sacm/src/xmi/refusal.rs", "crates/sacm/src/xmi/roots.rs"]
tests = [
  "xtask/tests/interim_refusals.rs::lib_api_011_unsupported_check_reports_a_construction_in_xmi_rs",
