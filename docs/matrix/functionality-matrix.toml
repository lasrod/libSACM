[[row]]
id = "LIB-DOC-008"
area = "DOC"
milestone = "M1"
title = "ADRs and decisions describe the current design"
requirement = "Each ADR states the decision as it stands, marks superseded text as superseded where it stands, and agrees with the code, the other ADRs, docs/sacm/decisions.md and CLAUDE.md. Interpretations of the standard made in ADRs (the readings of a clause the standard leaves open or contradicts) have a one-line `D-` entry in docs/sacm/decisions.md that points to the ADR. The ADR index lists every ADR. Decisions that exist only in slice briefs or matrix notes are recorded in an ADR."
source = "ADR 0001; CLAUDE.md rule 6; ADR review, 2026-11-13 (the maintainer: apply every recommendation)"
kind = "quality"
status = "verified"
depends_on = []
acceptance = [
  "docs/adr/README.md lists every ADR file with its status.",
  "ADR 0017 reads as the current state (two `WriteError` variants, no declaration refusal, the reader rules moved out) followed by a short history; ADR 0005 and ADR 0016 have their superseded passages condensed the same way.",
  "A new ADR records the reader's content decisions (slices 0029 and 0030: role elements, type resolution, `name`, `assertionDeclaration`), with the interim refusals of conforming input, each naming its closing row, kept apart from the refusals of non-conforming input, and every C++ difference the old ADR 0017 amendments listed; ADR 0017 points to it.",
  "ADR 0010 is amended with the current node shape (the stored role and the generated-id counters) and names the open decision on an element without an `xmi:id` (SACM23-XMI-020).",
  "ADR 0015 is amended: `ReadError::Unsupported` carries both limits of this version (conforming input not read yet, such as an element with no `xmi:id`, SACM23-XMI-020) and some defects in the input (an empty or duplicate `xmi:id`, a non-literal `assertionDeclaration`, non-conforming type attributes, and attributes or text the schema does not allow), and states truthfully which refusals are labelled as defects today; each interim refusal is gated by its closing row (LIB-API-011). Since ADR 0033 the non-conforming type attributes, attributes and text among these defects are kept as preserved content instead (LIB-COMPAT-003).",
