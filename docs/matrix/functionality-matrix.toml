  "crates/sacm/tests/artifact_asset_relationships.rs::sacm23_art_010_a_target_given_as_an_attribute_and_elements_is_not_called_single_valued",
]
acceptance = [
  "In an ArtifactPackage, `<artifactElement xmi:type=\"sacm:ArtifactAssetRelationship\" xmi:id=\"rel\" source=\"report\" target=\"testing tester\">` reads in both modes with no diagnostic, with `sources()` `[report]` and `targets()` `[testing, tester]`; `<source xmi:idref=\"report\"/>` and `<target href=\"#testing\"/>` read equal to the attribute form; a name, utility elements, gid, `isCitation`, `isAbstract`, `citedElement`, `abstractForm` and `property` children read as on any ArtifactAsset. An untyped `<artifactElement>` is `MissingType` (SACM-XMI-005); the kind under an ArgumentPackage's `argumentElement` is kept whole as preserved content of the package, and `isCounter`, `reasoning`, `metaClaim` or `assertionDeclaration` on it is kept as preserved content of it, each with one SACM-XMI-003.",
  "An attribute and elements for one end are `RepeatedValue` (tolerant: LIB-COMPAT-001); `source=\"a a\"` is held twice and gives one SACM23-VAL-022 Warning with clause `12.14`. A relationship with no `source`, no `target` or neither reads in both modes, is written back with nothing added, and `validate` gives one SACM-MULT-001 Error per missing end: requirement SACM23-ART-010, clause `12.14`, affected `[rel]`, no location, message `ArtifactAssetRelationship \"rel\" has no source (source:ArtifactAsset[1..*])` or `ArtifactAssetRelationship \"rel\" has no target (target:ArtifactAsset[1..*])`.",
  "A dangling `source` or `target` id gives SACM-REF-001 with clause `12.14`, and a strict write refuses it (the schema check); one naming a Claim, an ArtifactReference, an ArtifactGroup or an ArtifactPackage gives one SACM-REF-002 with clause `12.14` and is written by both saves; an Artifact, Activity, Event, Resource, Technique, Participant, Property or ArtifactAssetRelationship, the relationship itself included, gives none.",
  "Written with attribute order `xmi:type`, `xmi:id`, `gid`, `isCitation`, `isAbstract`, `citedElement`, `abstractForm`, `source`, `target`; an empty end is absent and repeats are kept. `artifact-asset-relationship-valid.sacm.xmi` reads in both modes with no diagnostic, validates with no finding and writes exactly `golden/artifact-asset-relationship.golden.sacm.xmi`; reading that is `==`, and writing it again gives the same bytes.",
  "`ReferenceEnd::ArtifactSource` and `ArtifactTarget` have `name()` `source` and `target`, apply only to ArtifactAssetRelationship, and have `bounds` `Some((1, None))` there and `None` elsewhere; `ReferenceEnd::ALL` lists these two directly after `ArtifactGroupMember`; no kind has two ends of one name; with `serde` they round-trip as `artifactSource` and `artifactTarget`. On a relationship `sources()` and `targets()` equal `references(ArtifactSource)` and `references(ArtifactTarget)`, and `target()` is `None`; on an AssertedInference they equal `references(Source)` and `references(Target)`.",
  "`semantic_compare` reports one `Difference::ArtifactSources` or `Difference::ArtifactTargets { id, left, right }` for a pair differing only there, order and repeats counting, after `ArtifactGroupMembers`; Display: `element \"rel\" differs in target: [\"testing\"] on the left, [\"testing\", \"tester\"] on the right`.",
  "`CreateArtifactAssetRelationship::new(parent, name, sources, targets)` with `with_id`: `parent()`, `id()`, `name()`, `sources()` and `targets()` report what it holds, and the element gets the ids in order, repeats kept. The only legal parent is an ArtifactPackage (an AssuranceCasePackage, an ArgumentPackage, an Artifact or an ArtifactGroup is `InvalidParent`). Refusals in order: ParentNotFound, InvalidParent, InvalidId, DuplicateId, `TooFewReferences` (`source` then `target`, given 0, required 1), then `InvalidReference`, `ReferenceNotFound` and `WrongReferenceType` (`expected: \"ArtifactAsset\"`), each over the sources then the targets in order. The generated id is `artifact_asset_relationship_<n>`; a refusal leaves the document `==` with the same next ids; `check` and `preview` agree with `apply`; `operation_name()` is `\"CreateArtifactAssetRelationship\"` and both constructor forms have golden JSON.",
  "`SetReferences`, `AddReference` and `RemoveReference` with `ArtifactSource` and `ArtifactTarget` follow LIB-EDIT-009: clearing either, setting no ids or removing the last id is `TooFewReferences` (`source` or `target`, given 0, required 1), and adding to a held `target` succeeds. `Source`, `Target` or `Reasoning` on a relationship, and `ArtifactSource` or `ArtifactTarget` on an AssertedInference, are `FeatureNotApplicable` (SACM-CMD-008), whose Display names the other class's end when the kind has one of the same name: `the ArtifactAssetRelationship \"rel\" has no source of an AssertedRelationship`, `the AssertedInference \"i1\" has no target of an ArtifactAssetRelationship`, and still `the Claim \"c1\" has no source` and `the ArtifactAssetRelationship \"rel\" has no reasoning`.",
  "Deleting a source or target under `RejectIfReferenced` is `Referenced { holder: rel, end: \"source\" or \"target\", id }` (SACM-CMD-002), or `CrossPackageReference` (SACM-CMD-007) across packages. `DeleteReferencingRelationships` deletes each relationship whose `source` or `target` names a deleted element, with its contents, to a fixpoint (a relationship that is another's source or target goes too). `ScrubReferences` removes the id and deletes a relationship only when it loses its last source or its last target. LIB-EDIT-005's after-conditions hold, and `Document::referrers` lists both ends.",
  "SetName, SetGid, SetFlag (`IsCounter` is `FeatureNotApplicable`), SetReferences(CitedElement), CreateProperty with it as parent, ReorderElements, MoveElement (legal parent: an ArtifactPackage), CopyElements (one with no source or no target is `TooFewReferences`) and DeleteElement apply to it; deleting one holding a Property under `RejectIfNonEmpty` is `NotEmpty { contained: 1 }`.",
]

[[row]]
id = "SACM23-ART-011"
area = "ART"
milestone = "M3"
title = "ArtifactGroup"
requirement = "ArtifactGroup (§12.3) is read and written typed in an ArtifactPackage's `artifactElement`, with the reference end `artifactElement : ArtifactElement [0..*]` (ptc gives it no aggregation, so it is a reference, not a containment), held as `ReferenceEnd::ArtifactGroupMember` (ADR 0034, the maintainer's M3 decision 5). The parent's kind decides: under an ArtifactGroup `artifactElement` is the member end (an IDREFS attribute, or elements with `xmi:idref` or `href=\"#id\"`, read as SACM23-ARG-013 reads `argumentElement`); under an ArtifactPackage it is the composite role. `group_members()` answers for the three group kinds; members stay children of their own package. The end follows SACM23-XMI-005/015 (serialization), SACM23-VAL-003/004/022 (dangling, typing to ArtifactElement, repeats) and LIB-EDIT-009 (edits); it has no lower bound, so a scrub leaves the group, even when empty. `edit::CreateArtifactGroup` takes its members."
source = "formal/23-05-08 §12.3 (`artifactElement:ArtifactElement[0..*]`, no composition; ArtifactGroups \"serve no structural purpose\"); ptc/22-03-13 Artifact::ArtifactGroup (`artifactElement : ArtifactElement [0..*]`, no aggregation); ADR 0034"
kind = "model"
status = "verified"
verification = "docs/verification/0052-m3-artifact-basics.md"
code = ["crates/sacm/src/model/reference.rs", "crates/sacm/src/model/document.rs", "crates/sacm/src/compare.rs", "crates/sacm/src/edit/artifact.rs", "crates/sacm/src/edit/argumentation.rs", "crates/sacm/src/edit.rs"]
depends_on = ["SACM23-ART-001", "SACM23-XMI-015", "SACM23-VAL-004", "LIB-EDIT-009", "LIB-EDIT-005"]
notes = "Slice 0062: reworded for the Terminology kinds; re-check there."
acceptance = [
  "`artifactElement=\"fta assessor\"` and the element form `<artifactElement xmi:idref=\"fta\"/><artifactElement href=\"#assessor\"/>` read equal in both modes; the attribute plus elements is `RepeatedValue`; an empty attribute is preserved content; a nested typed element is `Unsupported` (SACM23-XMI-019) and one with only a name is preserved, as for SACM23-ARG-013.",
  "`group_members()` returns the members of an ArtifactGroup, an ArgumentGroup and a TerminologyGroup, in order with repeats, and is empty for other kinds; the members stay children of their own package.",
  "`SetReferences`, `AddReference` and `RemoveReference` work with `ReferenceEnd::ArtifactGroupMember` on an ArtifactGroup; `GroupMember` on an ArtifactGroup and `ArtifactGroupMember` on an ArgumentGroup are `FeatureNotApplicable` (SACM-CMD-008).",
  "`validate`: a UtilityElement member is SACM-REF-002 (clause 12.3), an absent id is SACM-REF-001, a repeated id is one SACM-MULT-001 Warning; a strict write refuses only the absent id (the schema check's SACM-REF-001) and writes the other two.",
  "Written as an IDREFS attribute after `abstractForm`; an empty end is absent; repeats are kept. `semantic_compare` reports `Difference::ArtifactGroupMembers { id, left, right }` with a one-line Display.",
  "`CreateArtifactGroup::new(parent, name).with_group_members(ids)`: the only legal parent is an ArtifactPackage; after the parent and id refusals, the members are checked for InvalidReference, then all for ReferenceNotFound, then all for WrongReferenceType (`expected: \"ArtifactElement\"`), each check in member order, as for SACM23-ARG-013; the generated id is `artifact_group_<n>`.",
  "Deleting a member under `RejectIfReferenced` is `Referenced { holder, end: \"artifactElement\", id }` (SACM-CMD-002), or `CrossPackageReference` (SACM-CMD-007) across packages; `ScrubReferences` and `DeleteReferencingRelationships` remove the id from the group and keep the group, with `changed_ids == [group]`.",
]
