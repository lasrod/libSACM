[[row]]
id = "LIB-API-014"
area = "API"
milestone = "M3"
title = "Who references an element"
requirement = "`Document::referrers(id)` lists every typed reference that names `id`, whether or not an element has that id: the holder, the end and the id's position in the end. They are ordered by holder in document pre-order, then by end in `ReferenceEnd::ALL` order, then by position; an id held twice in one end gives two entries. References preserved content may hold are not typed and are not listed. So an application can answer \"what supports this claim?\" without walking every element. The document keeps an index of referrers, updated by every edit, so the cost grows with the number of referrers and the depth of their holders, not with the size of the document."
source = "Docs review 0043 (docs/follow-ups.md); the maintainer, 2026-11-16 (needed by the GSN layer, moved to M3); ADR 0036"
kind = "api"
status = "verified"
