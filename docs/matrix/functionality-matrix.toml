[[row]]
id = "LIB-TOOL-001"
area = "TOOL"
milestone = "M0"
title = "Functionality-matrix gate"
requirement = "`cargo xtask matrix check` enforces the rules of docs/matrix/README.md, `render` regenerates the Markdown view, and `next` lists the open rows whose dependencies are all verified, in milestone then file order."
source = "ADR 0004"
kind = "tooling"
status = "verified"
acceptance = [
  "Rejects malformed, mismatched and duplicate ids, unknown areas and milestones.",
  "Enforces the evidence each status requires (acceptance, tests, code, verification record, reason).",
  "Test citations must resolve to a defined function named for the row; traced tests no row cites are reported.",
  "Rejects dependency cycles, dependencies on later milestones or unscheduled rows, and verified rows with unverified dependencies.",
  "Reports a stale or missing rendered page.",
  "`next` lists only open rows (not verified, candidate, deferred or out-of-scope), hides rows blocked on unverified dependencies, and orders by milestone then file position.",
  "A test citation resolves only to a function marked as a test (`#[test]`-style attribute, including on the same line, or Python `def test_`); helpers, line comments and single-line string literals do not count. The scanner is line-based: multi-line raw strings, block comments and Python triple-quoted strings are not recognised as non-code (tracked in LIB-TOOL-011).",
  "Every gate rule listed in docs/matrix/README.md, and every required/forbidden cell of its status table, has a test that fails when that rule is removed.",
  "The repository scan behind `cargo xtask matrix check` covers crates/, xtask/ and .claude/hooks/, reads both .rs and .py files, skips target/ directories and non-source files, and reports /-separated repository-relative paths; `cmd_check` fails when the scan finds an uncited traced test.",
  "The `cargo xtask` binary exits non-zero and prints an `xtask:` message on stderr whenever a command fails, so CI fails when the gate does.",
]
code = ["xtask/src/lib.rs", "xtask/src/main.rs", "xtask/src/matrix.rs", "docs/matrix/README.md"]
