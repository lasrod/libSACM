[[row]]
id = "SACM23-VAL-008"
area = "VAL"
milestone = "M2"
title = "Abstract-form constraints (clause 8.2)"
requirement = "`validation::validate` reports, with requirement SACM23-VAL-008, clause `8.2` and no location: an element with an `abstractForm` whose own `isAbstract` is true as one SACM-ABS-001 Error (stated flatly, D-SEV), affected `[element]`; and, for a resolved `abstractForm` target, a target whose `isAbstract` is not true, and a target of another kind, each as one SACM-ABS-001 Warning (\"should\"), affected `[element, target]` (`Code::ABSTRACT_FORM_INVALID`). A dangling target gives no target-side Warning, only SACM-REF-001; the own-`isAbstract` Error does not depend on the target and still applies. Satisfying the target's ImplementationConstraints is not checked (prose)."
source = "formal/23-05-08 §8.2 (p. 18) Constraints \"When +abstractForm is used to refer to another SACMElement, +isAbstract of the SACMElement is false, and the +isAbstract of the referred SACMElement should be true. The referred SACMElement should be of the same type of the SACMElement.\"; D-SEV; ADR 0026; assurance-forge validation/validate.cpp:409-447"
kind = "validation"
status = "verified"
verification = "docs/verification/0042-m2-references.md"
depends_on = ["SACM23-BASE-008", "SACM23-VAL-018", "LIB-COMPAT-007", "SACM23-VAL-003"]
acceptance = [
  "A concrete Claim with `abstractForm` naming an abstract Claim gives no finding.",
  "A Claim with `isAbstract=\"true\"` and an `abstractForm` gives one Error, affected `[claim]`.",
  "A concrete Claim whose `abstractForm` target is a concrete Claim gives one Warning (target not abstract), affected `[claim, target]`; a target that is an abstract ArgumentPackage gives one Warning (another kind); a concrete ArgumentPackage target gives two Warnings.",
  "A self-reference on an abstract element gives the Error; on a concrete one the not-abstract Warning.",
  "A dangling `abstractForm` gives only SACM-REF-001.",
  "Neither the Errors nor the Warnings refuse a strict write (ADR 0035 D4).",
  "`Code::ABSTRACT_FORM_INVALID` is SACM-ABS-001, and the catalog row names it and SACM23-VAL-008.",
  "An abstract Claim with a dangling `abstractForm` gives the own-`isAbstract` Error and SACM-REF-001, and no Warning.",
]
tests = [
  "crates/sacm/tests/reference_validation.rs::sacm23_val_008_a_concrete_claim_conforming_to_an_abstract_claim_gives_no_finding",
  "crates/sacm/tests/reference_validation.rs::sacm23_val_008_an_abstract_claim_with_an_abstract_form_is_one_error_on_the_claim",
  "crates/sacm/tests/reference_validation.rs::sacm23_val_008_the_fixture_gives_one_error_on_its_claim",
  "crates/sacm/tests/reference_validation.rs::sacm23_val_008_a_target_not_abstract_or_of_another_kind_is_a_warning_on_the_element_and_target",
  "crates/sacm/tests/reference_validation.rs::sacm23_val_008_a_self_reference_is_the_error_when_abstract_and_the_warning_when_concrete",
  "crates/sacm/tests/reference_validation.rs::sacm23_val_008_a_dangling_abstract_form_gives_only_ref_001",
  "crates/sacm/tests/reference_validation.rs::sacm23_val_008_neither_errors_nor_warnings_refuse_a_strict_write",
  "crates/sacm/tests/reference_validation.rs::sacm23_val_008_abstract_form_invalid_is_sacm_abs_001_and_its_catalog_row_names_it_and_the_row",
  "crates/sacm/tests/reference_validation.rs::sacm23_val_008_an_abstract_claim_with_a_dangling_abstract_form_gives_the_error_and_ref_001_only",
]
code = ["crates/sacm/src/validation/references.rs"]

[[row]]
id = "SACM23-VAL-010"
area = "VAL"
milestone = "M2"
title = "MultiLangString language uniqueness"
requirement = "`validation::validate` reports, for every MultiLangString a document holds (each present UtilityElement `content`, TaggedValue `key` and Resource `location`, SACM23-ART-005), one SACM-MULT-001 Error when it has no values (§8.5 `[1..*]`), and one SACM-MULT-001 Error for each language held by two or more of its values (§8.5 \"must be unique\"). `lang` is compared exactly (ADR 0012): two absent are equal; absent, `\"\"` and `en` differ; `en`/`EN` and `en`/`en ` differ. It also reports a TaggedValue with no `key` as SACM-MULT-001 (§8.12 `key:MultiLangString[1]`; ptc `[1..1]`; D-SEV). Each diagnostic has the owning element (the UtilityElement, or the Resource for a `location`) as its only affected id, requirement SACM23-VAL-010, clause `8.5` (or `8.12` for a missing key), no location, and a message naming the role and, for a repeat, the language. An absent `content` gives no finding (the maintainer, 2026-11-14). Every value is kept, and both saves write it as held (LIB-COMPAT-007, ADR 0025)."
source = "formal/23-05-08 §8.5 (p. 19) \"value:LangString[1..*] (composition)\" and \"For each of the LangString in the value feature, their +lang must be unique.\"; §8.12 (p. 21) \"key:MultiLangString[1]\"; ptc/22-03-13 Base::MultiLangString (value lower 1), Base::TaggedValue (key [1..1]); D-SEV; D-TEXT-MODEL; ADR 0012; ADR 0025"
kind = "validation"
status = "verified"
verification = "docs/verification/0040-m2-descriptions-and-gid.md"
depends_on = ["SACM23-BASE-002", "SACM23-BASE-004", "SACM23-BASE-005", "LIB-COMPAT-007", "SACM23-VAL-018"]
acceptance = [
  "`<content/>` on a Description gives one Error naming the Description and `content`; `<key/>` gives one Error naming `key`; a TaggedValue with no `key` gives one Error, clause `8.12`.",
  "`[en:a, en:b]` gives one Error naming `en`; `[no lang, no lang]` gives one Error naming the absent language; `[en, en, en]` gives one Error for `en`.",
  "No finding for `[no lang, lang=\"\"]`, `[en, EN]`, `[en, \"en \"]`, `[en, fr]`, or a UtilityElement with no `content`.",
  "Each diagnostic: severity Error, code SACM-MULT-001, requirement SACM23-VAL-010, the UtilityElement as the only affected id, no location; diagnostics are in `Diagnostic` order and deterministic.",
  "Values are unchanged after `validate`; a strict and a tolerant save write the document as held.",
]
tests = [
  "crates/sacm/tests/multi_lang_string_validation.rs::sacm23_val_010_an_empty_content_on_each_utility_kind_is_one_error_naming_the_element_and_content",
  "crates/sacm/tests/multi_lang_string_validation.rs::sacm23_val_010_an_empty_key_is_one_error_naming_key_and_a_missing_key_one_with_clause_8_12",
  "crates/sacm/tests/multi_lang_string_validation.rs::sacm23_val_010_a_language_two_or_more_values_share_is_one_error_naming_it",
  "crates/sacm/tests/multi_lang_string_validation.rs::sacm23_val_010_each_repeated_language_is_its_own_error",
  "crates/sacm/tests/multi_lang_string_validation.rs::sacm23_val_010_distinct_languages_compared_exactly_and_an_absent_content_give_no_finding",
  "crates/sacm/tests/multi_lang_string_validation.rs::sacm23_val_010_findings_are_in_diagnostic_order_and_deterministic",
  "crates/sacm/tests/multi_lang_string_validation.rs::sacm23_val_010_values_are_kept_and_a_strict_and_a_tolerant_write_keep_them_as_held",
]
code = ["crates/sacm/src/validation/multi_lang.rs", "crates/sacm/src/validation.rs"]
notes = "Slice 0041: a test input broke §11.4 homogeneity or held two descriptions, which SACM23-VAL-011/012 now report; the input was changed, not the assertion; re-check there. Slice 0055: reworded because Artifact, Resource, Activity and Event are read now (ADR 0034 amendment 1); re-check there."

