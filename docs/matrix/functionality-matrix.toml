[[row]]
id = "SACM23-XMI-017"
area = "XMI"
milestone = "M1"
title = "assertionDeclaration in XMI"
requirement = "`xmi::read` reads the `assertionDeclaration` XML attribute, in no namespace, on every readable Assertion kind: in this release a Claim (SACM23-XMI-016), an AssertedInference and an AssertedContext (SACM23-ARG-007), and each later Assertion kind's read row inherits this rule. After XML 1.0 attribute-value normalisation, with no trimming or case folding, the value must be exactly one of `asserted`, `needsSupport`, `assumed`, `axiomatic`, `defeated` or `asCited`, and it reads as that literal. An absent attribute reads as `asserted`; an explicit `assertionDeclaration=\"asserted\"` is accepted without a diagnostic and reads equal to the absent form. In strict mode any other value (another letter case, white space anywhere, the empty string, another word) is `ReadError::InvalidLiteral` (SACM-ENUM-001, SACM23-VAL-006) at the attribute's name, holding the value as read, and is never mapped to `asserted`; a tolerant read keeps the attribute as preserved content and holds the default (SACM23-VAL-006). On a non-Assertion element, and when namespace-qualified, the attribute is kept as preserved content of its element, with SACM-XMI-003 at its name, and never checked as a literal (LIB-COMPAT-003); the element form is read by SACM23-XMI-014. `xmi::write` writes no attribute for `asserted` and otherwise `assertionDeclaration` with the exact literal, after `xmi:id`, on every element of an Assertion kind (all six) and on no other. Every literal round-trips on a Claim."
source = "formal/23-05-08 §11.10 (p. 39) \"assertionDeclaration:AssertionDeclaration[1] = asserted\"; §11.8 (p. 38) \"asserted - the default enumeration literal\"; ptc/22-03-13 `Assertion::assertionDeclaration` (defaultValue: literal `asserted`) and the `AssertionDeclaration` ownedLiterals; XMI 2.5.1 §9.4.1 (p. 57) \"Properties whose values are the default values are not serialized\", §7.8.4 (p. 18) \"the XML Schema will never contain default values for Properties\" and `<xsd:attribute name=\"a\" type=\"enumName\" use=\"optional\"/>`, §8.2.1 rule 8 (p. 53) \"a simple type derived from string whose legal values are the enumeration literals\", rule 4k (p. 51); XSD 1.0 Part 2 §4.3.6 \"for string the value of whiteSpace is preserve\", §4.3.5.4; XML 1.0 §3.3.3; D-STRICT; D-PRESERVE; ADR 0015; ADR 0017 amendment 2; assurance-forge `io/xmi_reader.cpp:1759-1815`, `io/xmi_writer.cpp:95-98`"
kind = "xmi"
status = "verified"
depends_on = ["SACM23-XMI-001", "SACM23-ARG-002", "SACM23-ARG-003", "SACM23-XMI-016", "SACM23-XMI-010", "LIB-API-009", "LIB-TOOL-020"]
notes = "Slice 0030: moved from M2 to M1, because the reader refused most real files at their first Claim (the maintainer, 2026-11-13). C++ differences: C++ maps an unknown literal to `asserted` with SACM-ENUM-001, losing the raw value, and `justification` to `axiomatic` with a TaggedValue (`xmi_reader.cpp:1766-1794`); this crate refuses both until SACM23-VAL-006 and LIB-COMPAT. C++ matches the attribute in any namespace; this crate refuses `sacm:assertionDeclaration`. Editorial defect: §11.11 writes `assertionDeclared` for `assertionDeclaration`. Slice 0037: the element form of `lang` and `content` (and of `assertionDeclaration`) is read now (SACM23-XMI-014); reworded and re-checked there. Slice 0039: reworded for SACM23-XMI-020/-021/-022/-025 and SACM23-VAL-006 (ADR 0024, ADR 0021 amendment 2); re-check there. Slice 0043: the asserted relationship kinds now read it too (ADR 0027); reworded, re-check there."
acceptance = [
  "Read: each of the six literals on a Claim (with `xmi:type` and with `xsi:type`) reads to that literal. With no attribute the Claim reads as `asserted`; with `assertionDeclaration=\"asserted\"` the document equals the one without the attribute.",
  "Read: a value whose character references resolve to a literal (`&#x61;sserted`, `needs&#x53;upport`) reads as that literal.",
  "Refuse, in strict mode: each of these is `ReadError::InvalidLiteral` (SACM-ENUM-001) and no document is returned: `Asserted`, `NeedsSupport`, `needssupport`, `ASCITED`, `\"\"`, `\" asserted\"`, `\"asserted \"`, `\"needs Support\"`, a literal TAB, LF or CR before, inside or after a literal, `&#9;asserted`, `asserted&#xA;`, `justification`, `byRule`. Each is located at the first character of the attribute's name (exact line and column, after a CRLF and a non-ASCII character), and `value` is the value as read. No case yields `asserted`.",
  "Preserve: `assertionDeclaration` (including `\"asserted\"`) on an ArgumentPackage or AssuranceCasePackage, root or child, and `sacm:assertionDeclaration` on a Claim (also after a readable `assertionDeclaration`), are kept as preserved content of that element, with one SACM-XMI-003 at the attribute's name in both modes (LIB-COMPAT-003).",
  "The element form `<assertionDeclaration>needsSupport</assertionDeclaration>` in a Claim is read as the attribute form is (SACM23-XMI-014); with the attribute also present it is `ReadError::RepeatedValue`; it is never dropped.",
  "Write: for each of the six Assertion kinds the model holds and each literal, the output has no `assertionDeclaration` for `asserted` and exactly `assertionDeclaration=\"<literal>\"` otherwise, directly after `xmi:id`. A byte-exact golden pins one `needsSupport` Claim. No non-Assertion element carries the attribute.",
  "Round trip: for documents built with `edit::apply` and the declaration seam (Claims with each of the six literals, depth 3 or more, sibling Claims with different literals), `read(write(d))` has equal declarations, ids, kinds, names, parents and order, and `write(read(write(d)))` equals `write(d)` byte for byte. A file with an explicit `\"asserted\"`, read and written, has no attribute.",
  "The SACM23-XMI-010 location table has the attribute on a non-Assertion among its preserved-content sites, with SACM-XMI-003 at the attribute's name (LIB-COMPAT-003).",
]
code = ["crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/output.rs", "crates/sacm/src/model/document.rs", "crates/sacm/src/xmi.rs", "docs/adr/0017-xmi-writer.md"]
tests = [
