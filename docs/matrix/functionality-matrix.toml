[[row]]
id = "LIB-TOOL-014"
area = "TOOL"
milestone = "M0"
title = "Matrix load errors are one line each"
requirement = "Errors from reading or parsing the matrix (for example TOML errors, which span several lines) are reported like gate problems: each on its own line, with control characters escaped, so a CI log shows them intact."
source = "Verification 0004 round 1 follow-up"
kind = "tooling"
status = "verified"
code = ["xtask/src/matrix.rs"]
acceptance = [
  "When the matrix text cannot be parsed or does not match the schema, `matrix::load` returns exactly one line: `docs/matrix/functionality-matrix.toml:<line>:<column>: <message>`. The position is the 1-based line, and the 1-based column in characters, of the start of the error's span. `<message>` is the parser's own message (`toml::de::Error::message`) without its source excerpt. Control characters in it are escaped as in LIB-TOOL-010. An error without a span gives `docs/matrix/functionality-matrix.toml: <message>`.",
  "This holds for a syntax error, an unknown key, a missing required field and a value of the wrong type. Tests check the exact line and column of each, including an error on a line after non-ASCII text, where the character column differs from the byte column.",
  "A matrix that cannot be read gives exactly one line: `read <path>: <error>`. `<path>` is the root joined with `docs/matrix/functionality-matrix.toml`, as `Path::display` shows it. The whole line, the I/O error text included, has its control characters escaped. A test makes the matrix path a directory.",
  "Every command that loads the matrix (`matrix check`, `render`, `next`, `status`) returns the same one-line error. The `xtask` binary prints it as `xtask: <line>` and a newline on stderr, writes nothing to stdout, and exits with a failure status.",
]
depends_on = ["LIB-TOOL-010"]
