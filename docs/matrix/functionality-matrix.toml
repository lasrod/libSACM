[[row]]
id = "SACM23-BASE-005"
area = "BASE"
milestone = "M2"
title = "TaggedValue"
requirement = "TaggedValue (§8.12) in `taggedValue` on every ModelElement is held as an element in document order across roles (`SacmElement::tagged_values()`), with `key()` (§8.12) and `content()` (§8.7), each `None` or a MultiLangString under the SACM23-BASE-004 rules (order, duplicates, absent vs empty, wrapper and value ids) (ADR 0025). `key` and `content` may be read in either order and are written `content` first (XMI 2.5.1 Annex B.5.2); a second `key` or `content` is `RepeatedValue`. TaggedValues with equal keys are all kept, in order. A TaggedValue with no `key` is a validation Error (SACM23-VAL-010). It is created by `CreateTaggedValue::new(parent, key, content)` under the LIB-EDIT-001 contract; changing is LIB-EDIT-008."
source = "formal/23-05-08 §8.12 (p. 21) \"key:MultiLangString[1] (composition) - the key of the TaggedValue.\", \"This class represents a simple key/value pair\"; §8.7 (p. 20); ptc/22-03-13 Base::TaggedValue (key [1..1]); XMI 2.5.1 Annex B.5.2; ADR 0025"
kind = "model"
status = "verified"
verification = "docs/verification/0040-m2-descriptions-and-gid.md"
depends_on = ["SACM23-BASE-004", "SACM23-XMI-021", "LIB-EDIT-001"]
acceptance = [
  "`<taggedValue xmi:id=\"t\"><key><value content=\"k\"/></key><content><value lang=\"en\" content=\"v\"/></content></taggedValue>` round-trips, written content first; `content` before `key` in the input reads equal.",
  "Absent `key`, `<key/>` and `<key><value/></key>` are three states that round-trip through a tolerant save (an absent or empty `key` is a SACM23-VAL-010 Error, which does not refuse a strict save: LIB-COMPAT-007).",
  "Two TaggedValues with the same key are both kept, in order.",
  "Two `key` children give `RepeatedValue { property: \"key\" }` in strict mode (tolerant: LIB-COMPAT-001); `key=\"k\"` and `value=\"v\"` attributes on `taggedValue` are LIB-COMPAT-008's C++ shapes (slice 0049: SACM-XMI-012 tolerant, `LegacyShape` strict); a `taggedValue` or `note` inside a TaggedValue, a `name` on it and `sacm:key` are kept as preserved content of the TaggedValue at their start tag, and a defect inside `key` (text beside `value` children, `foo`, `xml:lang` on a value, another child, a type naming another class) keeps the whole `key`, each with one SACM-XMI-003 (LIB-COMPAT-003).",
  "`key_id()` and `key_value_ids()` keep the `key` element's and its values' `xmi:id`s, as for `content`.",
  "`semantic_compare` reports `Key`, `KeyId` and `KeyValueIds`, separately from `Content`.",
  "`CreateTaggedValue` follows LIB-EDIT-001 (generated id `tagged_value_1`) and its result round-trips.",
]
