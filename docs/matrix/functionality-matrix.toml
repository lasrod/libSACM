title = "Implementation constraints only on abstract elements"
requirement = "`validation::validate` reports each ModelElement that has one or more `implementationConstraint` children and whose `isAbstract` is not true as one SACM-ABS-001 Error, with requirement SACM23-VAL-021, clause 8.6, affected `[element]` and no location (the §8.6 OCL; D-SEV). Reading, editing and both saves do not refuse it (ADR 0035 D4)."
source = "formal/23-05-08 §8.6 (p. 20) \"ImplementationConstraints should only be specified if +isAbstract is true OCL: self.implmentationConstraint->size() > 0 implies self.isAbstract = true\" (spec defect D15: the property is `implementationConstraint`); §8.2 (p. 18) \"isAbstract[0..1]=false\"; D-SEV; D-VAL-LAYER; ADR 0029; the maintainer, 2026-11-15 (SACM-ABS-001 widened); assurance-forge `validate.cpp:461-468` (SACM-CITE-001)"
kind = "validation"
status = "verified"
verification = "docs/verification/0049-m2-reading-and-validation.md"
depends_on = ["SACM23-BASE-004", "SACM23-BASE-008", "LIB-EDIT-008", "SACM23-VAL-008"]
acceptance = [
  "Each readable ModelElement kind (both packages, Claim, ArgumentReasoning, ArtifactReference, ArgumentGroup, the five relationships) with one constraint and `isAbstract` false gives exactly one Error; with two constraints still one.",
  "The same element with `isAbstract=\"true\"` gives none; Descriptions, Notes and TaggedValues alone give none.",
  "A strict and a tolerant write keep the constraint.",
  "`CreateImplementationConstraint` under a concrete Claim succeeds and `validate` reports the Error; `SetFlag(c, IsAbstract, true)` clears it and a strict write then succeeds.",
  "It is independent of SACM-ABS-001's clause 8.2 findings (an abstract element with an `abstractForm` gives that Error as well).",
  "The catalog row SACM-ABS-001 covers it and names SACM23-VAL-021.",
]
