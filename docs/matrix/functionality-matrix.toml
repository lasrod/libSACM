acceptance = [
  "An Activity with every Base feature, a property, `startTime` and `endTime` reads in both modes with no diagnostic and writes back with `xmi:type=\"sacm:Activity\"` and `startTime` before `endTime`; reading the output gives `==`.",
  "`CreateActivity::new(parent, name)` with `with_id`, `with_start_time` and `with_end_time`: accessors, legal parents and refusals as for CreateArtifact; the generated id is `activity_<n>`.",
  "An `endTime` earlier than its `startTime`, and either one alone, are held with no finding from `validate`.",
  "SetName, SetGid, SetFlag, SetReferences(CitedElement), ReorderElements and DeleteElement apply to an Activity.",
]

[[row]]
id = "SACM23-ART-007"
area = "ART"
milestone = "M3"
title = "Event"
requirement = "Event (§12.9, superclass ArtifactAsset) is read and written typed in an ArtifactPackage's `artifactElement`, with its Base features, its `property` children and its `date` (SACM23-ART-002), and round-trips. The model's spelling `occurece` (D-TEXT-MODEL), as an attribute or a value element of an Event, is read as SACM23-XMI-009 says: a tolerant read reads it as `date` with one SACM-XMI-013 Warning, and a strict read keeps it as preserved content with one SACM-XMI-013 Error, leaving `date()` unset. `edit::CreateEvent` (with `with_date`) creates one in an ArtifactPackage, and the existing edits apply to it."
source = "formal/23-05-08 §12.9 (p. 48) \"Event enables the specification of the events in the lifecycle of an Artifact.\", \"date: date[0..1] - the date on which the Event occurred.\"; ptc/22-03-13 Artifact::Event (generalization ArtifactAsset; attribute `occurece`); D-TEXT-MODEL; docs/sacm/metamodel-inventory.md (Known machine-readable model defects); spec defect D17; ADR 0034 amendment 1"
kind = "model"
status = "verified"
verification = "docs/verification/0055-m3-artifact-assets.md"
code = ["crates/sacm/src/model/document.rs", "crates/sacm/src/model/kind.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/output.rs", "crates/sacm/src/xmi/refusal.rs", "crates/sacm/src/compare.rs", "crates/sacm/src/edit/artifact.rs", "crates/sacm/src/edit.rs"]
depends_on = ["SACM23-ART-002", "SACM23-ART-003"]
tests = [
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_007_an_event_with_every_feature_reads_in_both_modes_and_writes_back",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_007_set_name_gid_flag_references_reorder_and_delete_apply_to_an_event",
