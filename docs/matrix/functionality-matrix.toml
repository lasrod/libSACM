[[row]]
id = "SACM23-XMI-008"
area = "XMI"
milestone = "M2"
title = "Strict save refuses what it cannot write conformantly"
requirement = "A strict `xmi::write` of a document holding preserved content (LIB-COMPAT-003), however it was read, fails with `WriteError::PreservedContent { elements }` (`code()` SACM-XMI-006, `Code::XMI_STRICT_SAVE_REFUSED`; `element()` None; no diagnostics), listing each holder once in `Document::elements()` order (empty only when the document alone holds preserved content outside its elements, ADR 0035 D3), and returns no text; it never omits the content. The write checks run in the order `NoRoot`, `PreservedContent`, `Invalid` (the schema check, LIB-COMPAT-007), unrepresentable characters. A tolerant write writes it."
source = "ADR 0033; D-PRESERVE; D-STRICT; ADR 0022; `docs/sacm/diagnostics.md` SACM-XMI-006; assurance-forge `io/xmi_writer.cpp:482-505`"
kind = "xmi"
status = "verified"
verification = "docs/verification/0053-simplification.md"
depends_on = ["LIB-COMPAT-003", "LIB-COMPAT-007"]
notes = "Slice 0062: its unread TerminologyPackage samples became TerminologyPackageInterface; re-check there. Slice 0063: refusals carry codes, templates and arguments (LIB-API-017); re-check there."
acceptance = [
  "For documents read tolerant and read strict, the strict write is `Err(PreservedContent)` with the exact holder list in order, `code() == Code::XMI_STRICT_SAVE_REFUSED` and `element()` None; a holder with only an attribute, only text, only a child, and a root holder are each refused.",
  "Order: `NoRoot` before `PreservedContent` before `Invalid` before unrepresentable characters; a document whose only other finding is SACM-REF-003 is still refused for its preserved content.",
  "A tolerant write of the same documents succeeds; strict output of documents with no preserved content is byte-identical to before; after every holder is deleted, a strict write of an otherwise valid document succeeds.",
  "The SACM-XMI-006 catalog row is updated.",
  "Display (ADR 0035): one holder `the document cannot be written in strict mode: the element \"p\" holds preserved content`; several `the document cannot be written in strict mode: 4 elements hold preserved content, the first is \"p\"`; document-level only `the document cannot be written in strict mode: the document holds preserved content outside its elements`, with `elements` empty.",
]
code = ["crates/sacm/src/xmi/output.rs", "crates/sacm/src/xmi.rs", "crates/sacm/src/validation.rs"]
tests = [
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_a_document_whose_only_finding_is_a_preserved_target_is_still_refused",
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_a_holder_of_only_an_attribute_only_text_or_only_a_child_and_a_root_are_each_refused",
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_a_strict_write_of_the_worked_fixture_lists_every_holder_in_document_order",
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_a_tolerant_write_of_the_same_documents_succeeds_and_keeps_the_content",
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_after_every_holder_is_deleted_a_strict_write_succeeds",
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_display_names_one_holder_or_counts_several_and_names_the_first",
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_each_holder_is_listed_once_however_much_it_holds",
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_no_root_is_reported_before_preserved_content",
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_preserved_content_is_refused_before_an_unrepresentable_character",
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_preserved_content_is_refused_before_the_schema_check",
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_strict_output_without_preserved_content_is_unchanged",
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_the_strict_save_refused_code_is_sacm_xmi_006",
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_without_preserved_content_the_schema_check_comes_before_an_unrepresentable_character",
  "crates/sacm/tests/strict_save_preserved.rs::sacm23_xmi_008_only_document_level_content_is_refused_with_no_elements",
]

[[row]]
id = "SACM23-VAL-002"
area = "VAL"
milestone = "M2"
title = "gid uniqueness"
requirement = "`validation::validate` reports each non-empty `gid` that two or more elements of the document hold, of any kind and UtilityElements included, as one SACM-ID-003 Error (`Code::GID_DUPLICATE`), citing clause 8.2 and affecting every holder in document order. Values compare exactly, letter case and white space included; an absent or `\"\"` gid is not compared (D-GID-EMPTY), and a gid equal to an `xmi:id` is not a finding. Reading, editing and both saves do not refuse a duplicate (D-VAL-LAYER, ADR 0035 D4). It is an Error because the indicative counts as \"must\" (D-SEV, the maintainer, 2026-11-14)."
source = "formal/23-05-08 §8.2 (p. 18) \"gid:String[0..1] - a unique identifier that is unique within the scope of the model instance\"; ptc/22-03-13 Base::SACMElement.gid (String, 0..1; no isID, no constraint); D-SEV; D-GID-EMPTY; D-VAL-LAYER; SACM-ID-003; ADR 0025; assurance-forge libs/sacm validation/validate.cpp (gid uniqueness), #335"
kind = "validation"
status = "verified"
verification = "docs/verification/0041-m2-validation-rules.md"
depends_on = ["SACM23-BASE-006", "SACM23-VAL-018", "LIB-COMPAT-007"]
acceptance = [
  "Two Claims with `gid=\"g\"` in one ArgumentPackage read in both modes with no read diagnostic for it; `validate` gives exactly one SACM-ID-003: Error, requirement SACM23-VAL-002, clause `8.2`, no location, affected `[c1, c2]`; the message quotes `\"g\"`, `c1` and `c2`.",
  "An AssuranceCasePackage root, a Claim and a Note sharing `\"g\"` give one finding affecting the three in `elements()` order, and the message says 3.",
  "`\"g\"` held twice and `\"h\"` held twice give two findings, each affecting only its own holders, in sorted order.",
  "Every readable kind is in scope: each of the four UtilityElements sharing a gid with a ModelElement, and two roots of one `xmi:XMI` document.",
  "No finding for two `gid=\"\"`, `\"\"` and absent, two absent, `\"g\"` and `\"G\"`, `\"g\"` and `\" g \"`, a gid equal to another element's `xmi:id`, or a unique gid; two `\" g \"` or two `\"  \"` give one finding.",
  "`gid=\"g\"` on one element and `<gid>g</gid>` on another give one finding.",
  "A strict and a tolerant `xmi::write` both keep both gids, which read back equal.",
  "Edits are not refused: a `CreateClaim` into a document holding duplicates succeeds; `validate` changes nothing and gives the same result twice.",
  "`Code::GID_DUPLICATE` is SACM-ID-003, and the catalog row names it and SACM23-VAL-002.",
]
tests = [
  "crates/sacm/tests/gid_validation.rs::sacm23_val_002_two_claims_sharing_a_gid_read_without_diagnostic_and_give_one_error",
  "crates/sacm/tests/gid_validation.rs::sacm23_val_002_the_fixture_gives_one_error_on_both_claims",
  "crates/sacm/tests/gid_validation.rs::sacm23_val_002_three_holders_are_one_finding_affecting_them_in_document_order",
  "crates/sacm/tests/gid_validation.rs::sacm23_val_002_two_holders_out_of_id_order_are_affected_in_document_order",
  "crates/sacm/tests/gid_validation.rs::sacm23_val_002_two_duplicated_values_give_two_findings_in_sorted_order",
  "crates/sacm/tests/gid_validation.rs::sacm23_val_002_each_utility_kind_sharing_a_gid_with_a_claim_is_one_finding",
  "crates/sacm/tests/gid_validation.rs::sacm23_val_002_two_roots_of_one_xmi_document_sharing_a_gid_are_one_finding",
  "crates/sacm/tests/gid_validation.rs::sacm23_val_002_empty_absent_case_and_space_differences_give_no_finding",
  "crates/sacm/tests/gid_validation.rs::sacm23_val_002_equal_values_of_only_white_space_or_with_spaces_give_one_finding",
  "crates/sacm/tests/gid_validation.rs::sacm23_val_002_an_attribute_gid_and_an_element_gid_of_one_value_are_one_finding",
  "crates/sacm/tests/gid_validation.rs::sacm23_val_002_a_strict_and_a_tolerant_write_keep_both_gids",
  "crates/sacm/tests/gid_validation.rs::sacm23_val_002_an_edit_is_not_refused_and_validate_changes_nothing",
  "crates/sacm/tests/gid_validation.rs::sacm23_val_002_gid_duplicate_is_sacm_id_003_and_its_catalog_row_names_it_and_the_row",
]
code = ["crates/sacm/src/validation/gid.rs", "crates/sacm/src/diagnostic.rs"]

[[row]]
id = "SACM23-VAL-003"
area = "VAL"
milestone = "M2"
title = "Dangling references"
requirement = "`validation::validate` reports each reference whose target id names no element of the document (an id absent from it, or a `name`, `content`, `key`, `location` or `value` id; an id held in preserved content is SACM-REF-003, LIB-COMPAT-003) as one SACM-REF-001 Error (`Code::REF_DANGLING`) per distinct missing id per end, with requirement SACM23-VAL-003, the end's clause (`8.2` for `citedElement` and `abstractForm`), no location, `affected = [referrer, missing id]`, and a message naming the referrer's kind and id, the end and the target. A strict save refuses it by its schema check (an IDREF must name an `xmi:id` the output writes; LIB-COMPAT-007, ADR 0035 D4), except a reference to a `name`, `content`, `key`, `location` or `value` id, which is schema-valid and written; a tolerant save writes the reference as held (ADR 0026)."
source = "XMI 2.5.1 rule 2j (p. 64) \"Class-typed Properties whose values are objects that are serialized in the same document\"; XML Schema 1.0 Part 1 §3.3.4 (ID/IDREF table: no unbound IDREF); D-SEV (indicative); D-VAL-LAYER; D-PRESERVE; ADR 0026; SACM-REF-001; assurance-forge validation/validate.cpp:344-353"
kind = "validation"
status = "verified"
verification = "docs/verification/0042-m2-references.md"
depends_on = ["SACM23-XMI-005", "LIB-DIAG-001", "SACM23-BASE-007", "SACM23-BASE-008", "SACM23-VAL-018", "LIB-COMPAT-007"]
acceptance = [
  "A Claim with `citedElement=\"nope\"` gives exactly one SACM-REF-001: Error, SACM23-VAL-003, clause `8.2`, no location, affected `[claim, nope]`, the message naming Claim, the claim id, `citedElement` and `nope`; the same for `abstractForm`.",
  "A forward, cross-root or self reference gives no finding.",
  "A reference to a `name`, `content`, `key`, `location` or `value` id gives SACM-REF-001 (the `location` case is tested under SACM23-ART-005).",
  "An element with both a dangling `citedElement` and a dangling `abstractForm` gives two findings; two elements citing the same missing id give two.",
  "A strict write refuses with `WriteError::Invalid` holding the finding; a tolerant write keeps the reference.",
  "`Code::REF_DANGLING` is SACM-REF-001, and the catalog row names it and SACM23-VAL-003.",
]
tests = [
