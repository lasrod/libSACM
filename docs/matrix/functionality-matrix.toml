[[row]]
id = "SACM23-XMI-016"
area = "XMI"
milestone = "M1"
title = "Containment children conform to their role"
requirement = "`xmi::read` reads each containment child under its role element: an element in no namespace whose local name is a composite role of the parent's class, as spelled in ptc/22-03-13. The child's class is the one its `xmi:type` or `xsi:type` names, resolved as for roots (SACM23-XMI-002); without a type attribute it is the role's declared type, if that type is concrete (XMI 2.5.1 §7.6.3). The child is read with its `xmi:id`, its name (SACM23-XMI-012) and its parent, in document order across roles (ADR 0010 D2). In this release the readable children are an AssuranceCasePackage in `assuranceCasePackage`, an ArgumentPackage in `argumentPackage` and in `argumentElement`, every other concrete Argumentation kind in `argumentElement` (SACM23-ARG-002, SACM23-ARG-005 to -015), an ArgumentPackageInterface or ArgumentPackageBinding in `argumentPackage` and `artifactElement`, an ArtifactPackageInterface or ArtifactPackageBinding in `artifactPackage` and `artifactElement` (SACM23-ARG-014, -015, SACM23-ART-012, -013), an ArtifactPackage in `artifactPackage` and in `artifactElement`, an Artifact, Resource, Activity, Event, Technique, Participant, ArtifactGroup, ArtifactAssetRelationship or Property in `artifactElement`, a Property in the `property` of an Artifact, Resource, Activity, Event, Property, Technique, Participant or ArtifactAssetRelationship, and every readable kind in an ArtifactPackage's `artifactElement` (SACM23-ART-001 to -011), a TerminologyPackage in `terminologyPackage`, in `terminologyElement` and in `artifactElement`, and a Category, Term, Expression or TerminologyGroup in `terminologyElement` and in `artifactElement` (SACM23-TERM-001 to -006); each may carry only namespace declarations, `xmi:id`, a type attribute, one `name`, one `gid` (SACM23-BASE-006), utility children (SACM23-BASE-004/005) the flags, references and string attributes (`version`, `date`, `startTime`, `endTime`, `value`, `externalReference`; SACM23-ART-002, -004, -006, -007, SACM23-TERM-003, -004) its class has (ADR 0026, ADR 0027), a Resource's one `location` (SACM23-ART-005) and, on an Assertion, one `assertionDeclaration` as an attribute or an element (SACM23-XMI-017, SACM23-XMI-014). A child is never re-roled, re-typed or dropped. A child whose type does not conform to its role, names an abstract or unknown class, or disagrees with its other type attribute, a child under a role the parent's class lacks or in a namespace other than XMI, and any other element are kept whole as preserved content of the parent, at the child's start tag; an attribute the child's class lacks (`xmi:version` included) and non-white-space text are kept as preserved content of the child, at the attribute's name or the text; each gives one SACM-XMI-003 (LIB-COMPAT-003, ADR 0033). Conforming content not read yet is refused as `ReadError::Unsupported` at the child's start tag, or at an attribute's name (LIB-API-011): a conforming kind outside the readable set in its role, and XMI-namespace content such as `xmi:Extension`, `xmi:uuid` or `xmi:label` (SACM23-XMI-019). The spellings `argumentationElement` and `sacm:ArtifactAssertedRelationship` follow SACM23-XMI-009, and `TerminologyElement` SACM23-XMI-028. A missing type under an abstract role is refused as `ReadError::MissingType` (SACM-XMI-005, LIB-COMPAT-010, slice 0049). `xmi::write` writes each child under the one role that admits it, for all 339 legal pairs, and what it writes for any document `edit::apply` builds reads back to the same ids, kinds, names, parents and order."
source = "formal/23-05-08 §9.2 (pp. 23-24) \"assuranceCasePackage: AssuranceCasePackage [0..*] (composition)\", \"argumentPackage:Argument::ArgumentPackage[0..*] (composition)\"; §11.3 (p. 36) \"ArgumentationElement (abstract)\"; §11.4 (p. 36) \"argumentationElement:ArgumentationElement[0..*] (composition)\"; ptc/22-03-13 `ArgumentPackage::argumentElement` (composite); XMI 2.5.1 §7.6.3 (p. 15) \"The type attribute is used to specify the type of object being serialized, when the type is not known from the model.\", §7.8.6 (p. 19) \"Each property that is a composite is represented by an XML element, but not by an XML attribute.\", rule 2a (p. 63) \"the XMI name is the name of the Property\", rule 2g (p. 63) (D11); D-PRESERVE; ADR 0015; ADR 0016 D2, D5, D6; ADR 0017; assurance-forge `io/xmi_reader.cpp:914-967, 1993-2090` (which re-roles or drops)."
kind = "xmi"
status = "verified"
depends_on = ["LIB-API-008", "SACM23-XMI-006", "LIB-TOOL-020", "SACM23-AC-001", "SACM23-ARG-001", "SACM23-ARG-002", "SACM23-XMI-002", "SACM23-XMI-012", "LIB-API-009"]
notes = "Slice 0025: owns strict import requiring the type attribute on an abstract-role child (SACM-XMI-005), moved from SACM23-XMI-006. Export writes `xmi:type` (ADR 0017); import accepts `xmi:type` and `xsi:type`. Moved to M1 by the maintainer, 2026-11-12: edited documents must reload, and M1's round-trip rows need it. Slice 0029 (lead decisions, the minimal options): only kinds whose model row is verified are read (ADR 0016 D5); non-conforming children are `Unsupported`, not coded (ADR 0015's interim rule, as ADR 0016 D6 does for roots); `assertionDeclaration` stays with SACM23-XMI-017; namespace-qualified role elements are refused, as for `name`. Moved out: references (SACM23-XMI-005 and the kind rows); utility children (SACM23-BASE-004/005); `gid`, `isCitation`, `isAbstract` (SACM23-BASE-006/007/008); strict SACM-XMI-003 and tolerant preservation (LIB-COMPAT-003); SACM-XMI-005 (LIB-COMPAT-010); a missing id (SACM23-XMI-020); a duplicate id (SACM23-VAL-001); `argumentationElement` (SACM23-XMI-009); element forms (SACM23-XMI-014/015); XMI metadata (SACM23-XMI-019); legacy shapes (LIB-COMPAT-008). C++ difference: C++ matches role elements by local name in any namespace (`xmi_reader.cpp:1988`); this crate refuses a namespace-qualified role element. Basis: role elements are local declarations, the XMI schema's default is unqualified, and XMI 2.5.1 rule 2a says \"The namespace prefix is ignored for an object that is the value of a Property\", which is ambiguous; the refusal is reversible and closes with LIB-COMPAT-003 (tolerant) if real files need it. Slice 0030: `assertionDeclaration` on a Claim is read (SACM23-XMI-017), so the attribute refusal narrows to non-Assertion children; re-checked there. Slice 0036: an empty or duplicate `xmi:id` is now a coded refusal (`ReadError::InvalidId`, `ReadError::DuplicateId`; ADR 0015 amendment 2), and a padded id is `Unsupported`; reworded and re-checked there. Slice 0037: tests changed for the value elements (SACM23-XMI-014); re-checked there. Slice 0039: reworded for SACM23-XMI-020/-021/-022/-025 and SACM23-VAL-006 (ADR 0024, ADR 0021 amendment 2); re-check there. Slice 0040: reworded, because utility children and `gid` are read now (SACM23-BASE-004/005/006); its tests use `isCitation`, `isAbstract`, `<foo/>` and `<isCitation>` as unread samples; re-check there. Slice 0041: a test input broke §11.4 homogeneity or held two descriptions, which SACM23-VAL-011/012 now report; the input was changed, not the assertion; re-check there. Slice 0042: `isCitation`, `isAbstract`, `citedElement` and `abstractForm` are read now (SACM23-BASE-007/008); its tests need other unread samples; re-check there. Slice 0043: ArgumentReasoning, AssertedInference and AssertedContext become readable in `argumentElement` (ADR 0027); its tests using them as unread samples change; re-check there. Slice 0044: ArtifactReference, ArgumentGroup and the three artifact relationships become readable (ADR 0028); re-check there. Slice 0055: reworded because Artifact, Resource, Activity and Event are read now (ADR 0034 amendment 1); re-check there. Slice 0057: reworded for ArtifactAssetRelationship and the SACM23-XMI-009 spellings; re-check there. Slice 0062: reworded for the Terminology kinds; re-check there. Its test `sacm23_xmi_016_every_conforming_kind_outside_the_readable_set_is_unsupported_in_its_role` changed its readable set and count. Slice 0066: reworded for the ARG/ART package interfaces and bindings (SACM23-ARG-014, -015, SACM23-ART-012, -013, LIB-EDIT-019); re-check there."
acceptance = [
  "Read: each readable case reads to its kind, id, name and parent; under a concrete role with no type, a redundant `xmi:type` and a redundant `xsi:type`; under `argumentElement` with `xmi:type` and `xsi:type`. An `xmi:type` and an `xsi:type` on the same child that name the same class read too.",
  "Read: document order holds across roles and with `name` after the children, at depth 3 or more.",
  "Read: type resolution follows SACM23-XMI-002: a prefix declared on the child works, surrounding white space is trimmed, and `sacm` rebound on the child, `sacm:claim` or white space inside the type keeps the child whole as preserved content of its parent, with SACM-XMI-003 at its start tag (LIB-COMPAT-003).",
  "Each of these keeps the child whole as preserved content of its parent, with one SACM-XMI-003 at an exact line and column in both modes (LIB-COMPAT-003): a non-conforming type under a concrete role and under `argumentElement`; a type naming an abstract class (`sacm:Assertion`, `sacm:ArgumentationElement`, `sacm:ArgumentAsset`); a type naming no SACM class, in a foreign namespace, or unresolvable; two type attributes that disagree; `<foo>` and an `<argumentElement>` in an AssuranceCasePackage; `<sacm:argumentElement>`, a role element in a foreign namespace and a role element under a default SACM namespace. Each of these is kept as preserved content of the child, at the attribute's name or the text: an `id` attribute in no namespace or another namespace (the child reads with a generated id, SACM23-XMI-020); `assertionDeclaration` (including `\"asserted\"`) on a child that is not an Assertion, `sacm:isCitation`, `sacm:name`, `foo` or `xmi:version` on a child; text in a child. Each of these is `Unsupported` at an exact line and column, and no document is returned: a role element in the XMI namespace; every conforming kind outside the readable set, in its role; `xmi:uuid` or `xmi:label` on a child (at the attribute's name). An untyped `<argumentElement>` is a coded `MissingType` (SACM-XMI-005, LIB-COMPAT-010, slice 0049); a padded `xmi:id` reads trimmed (SACM23-XMI-025); an empty one is `ReadError::InvalidId` and a duplicate `ReadError::DuplicateId` (ADR 0015 amendment 2).",
  "Text whose value is all XML white space is accepted wherever only white space may appear (a root, a child, a `name` and the `xmi:XMI` element), whether written literally, as a CDATA section (`<![CDATA[ ]]>`, `<![CDATA[]]>`) or as character references (`&#x20;`, `&#32;`, `&#9;`, `&#xA;`, `&#xD;`); the document read equals the one without it. `&#xA0;` and `<![CDATA[x]]>` are not white space (XML Infoset; XSD 1.0 Part 1 cvc-complex-type 2.3): in a root or a child they are kept as preserved content of that element, with SACM-XMI-003 at the construct (LIB-COMPAT-003); on the `xmi:XMI` element they are `Unsupported`; in a `name` that has `content` they are a second `content` (`RepeatedValue`, LIB-COMPAT-008).",
  "Each readable child, under every other role name of the same parent class, is kept whole as preserved content of the parent, with SACM-XMI-003 at its start tag (LIB-COMPAT-003).",
  "Write: for all 339 legal (parent, child) pairs, each child's role name matches a table written in the test from `docs/sacm/metamodel-inventory.md`.",
  "Round trip: for a deterministic set of documents built with `edit::apply` only (every readable pair, depth 3 or more, two or more roots, siblings interleaving roles, names with absent, empty and non-ASCII fields, caller and generated ids), `read(write(d))` has the same elements in order with equal id, kind, name, parent and child order, and `write(read(write(d)))` equals `write(d)` byte for byte.",
]
code = ["crates/sacm/src/xmi/roots.rs", "crates/sacm/src/model/containment.rs", "crates/sacm/src/xmi.rs"]
