[[row]]
id = "LIB-QA-013"
area = "QA"
milestone = "M0"
title = "GitHub's own actions are used only at reviewed refs"
requirement = "A gate job, or any workflow step, uses `actions/*` only at a major tag `v<N>` or at a reviewed commit SHA. GitHub resolves a commit SHA across a repository's fork network, so `actions/checkout@<sha from a fork>` (an imposter commit) can run code that GitHub never published."
source = "Verification 0009 round 1, new class"
kind = "quality"
status = "out-of-scope"
notes = "Retired 2026-11-09 (slice 0012, ADR 0006 amendment 2): harness hardening beyond what protects the library's users; CI configuration is protected by branch protection and review."

