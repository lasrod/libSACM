[[row]]
id = "SACM23-VAL-001"
area = "VAL"
milestone = "M1"
title = "Unique element ids"
requirement = "`xmi::read`, in both modes, refuses a document in which two or more `xmi:id`s, on elements, on `name`s (SACM23-XMI-022) or inside preserved content (LIB-COMPAT-003), have the same value with `ReadError::DuplicateId`, whose `code()` is SACM-ID-001. It concerns the first id that repeats in document order; `locations()` gives the start tag of every element in the input carrying that id, in document order, and `location()` is the first repeat. No document is returned, so no element is dropped (D-PRESERVE; a `Document` holds each id once). Ids compare by their `xsd:ID` value: exactly, after white space around an NCName is trimmed (D-ID, SACM23-XMI-025). The edit API refuses a caller id already in the document (SACM-CMD-004)."
source = "XMI 2.5.1 §7.6.1 (p. 14) \"it is important, to be a valid XML document, that the value for xmi:id is unique across all elements within the file\"; §2.2.2; XML 1.0 (Fifth Edition) VC: ID \"A name MUST NOT appear more than once in an XML document as a value of this type\"; ADR 0015 amendment 2; ADR 0022; D-PRESERVE; D-VAL-LAYER; assurance-forge `xmi_reader.cpp:2287-2303` (differs)"
kind = "validation"
status = "verified"
depends_on = ["SACM23-XMI-004", "LIB-DIAG-001", "SACM23-XMI-016", "LIB-COMPAT-001", "LIB-EDIT-001"]
acceptance = [
  "Two Claims `c1` in one package: `Err(ReadError::DuplicateId)` with `code()` SACM-ID-001, `location()` the second Claim's `<`, `locations()` both start tags in order; `Display` names `\"c1\"` and the locations; the same in both modes.",
  "The same for a repeat across two roots in an `xmi:XMI` wrapper, a root and its descendant, and a child repeating its parent's id.",
  "Three elements sharing one id give three locations; with two different repeated ids the refusal concerns the one whose first repeat comes first, and the same input always gives the same refusal.",
  "`c1` and `C1` are not duplicates: the input reads Ok, keeping both ids exactly.",
  "`ReadError::Unsupported` is no longer returned for a duplicate id; the catalog's SACM-ID-001 row names `Code::ID_DUPLICATE` and `ReadError::DuplicateId`.",
  "`edit::apply` creating an element with an existing id returns `EditError::DuplicateId` with code SACM-CMD-004 and leaves the document unchanged.",
]
tests = [
  "crates/sacm/tests/ids.rs::sacm23_val_001_two_claims_with_one_id_are_duplicate_id_in_both_modes",
  "crates/sacm/tests/ids.rs::sacm23_val_001_a_repeat_across_roots_into_a_descendant_and_under_its_parent_is_duplicate_id",
  "crates/sacm/tests/ids.rs::sacm23_val_001_three_elements_with_one_id_give_three_locations",
  "crates/sacm/tests/ids.rs::sacm23_val_001_with_two_repeated_ids_the_first_repeat_decides_and_always_the_same",
  "crates/sacm/tests/ids.rs::sacm23_val_001_ids_that_differ_in_case_are_not_duplicates",
  "crates/sacm/tests/ids.rs::sacm23_val_001_a_duplicate_is_duplicate_id_before_later_content_that_is_not_read",
  "crates/sacm/tests/ids.rs::sacm23_val_001_locations_of_every_other_refusal_is_its_one_location_or_none",
  "crates/sacm/tests/ids.rs::sacm23_val_001_the_catalog_id_001_row_names_the_code_and_the_refusal",
  "crates/sacm/tests/ids.rs::sacm23_val_001_edit_refuses_an_id_already_in_the_document_and_changes_nothing",
]
verification = "docs/verification/0036-m1-ids-docs-cli.md"
code = ["crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi.rs", "crates/sacm/src/diagnostic.rs", "docs/adr/0015-xmi-read-entry-point.md"]
