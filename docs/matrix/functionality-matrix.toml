[[row]]
id = "SACM23-ARG-006"
area = "ARG"
milestone = "M2"
title = "ArtifactReference"
requirement = "ArtifactReference (§11.9, superclass ArgumentAsset) is read under `argumentElement` of an ArgumentPackage with its `referencedArtifactElement` end (`Base::ArtifactElement[0..*]`), multi-valued under ADR 0026/0027's rules (`SacmElement::referenced_artifact_elements() -> &[ElementId]`), written after `abstractForm` when non-empty, compared (`Difference::ReferencedArtifactElements`) and round-tripped (ADR 0028). It is not an Assertion: `assertionDeclaration`, `metaClaim`, `isCounter`, `source` and `target` on it, and C++'s `referencedArtifact` alias, are content its class lacks, kept as preserved content with SACM-XMI-003 (LIB-COMPAT-003). It is created by `CreateArtifactReference::new(parent, name)` with `with_id` and `with_referenced_artifact_elements` (none required, repeats kept), after ADR 0019's four checks: `InvalidReference` (white space), `ReferenceNotFound`, then `EditError::WrongReferenceType` (SACM-REF-002) for an end whose target does not conform to its declared type (ADR 0028). Every kind but the UtilityElements conforms to ArtifactElement (which specializes ModelElement), so a Claim or a package is a well-typed target and a Note is not."
source = "formal/23-05-08 §11.9 (pp. 38-39) \"Superclass ArgumentAsset\", \"referencedArtifactElement:Base::ArtifactElement[0..*] - reference to a collection of ArtifactElements.\"; §11.1 (p. 35) \"It is also possible within a package to cite elements contained within other argument packages (through ArtifactReference).\"; ptc/22-03-13 Argumentation::ArtifactReference (referencedArtifactElement, Base::ArtifactElement, 0..*, no aggregation); XMI 2.5.1 rule 4i (p. 51); ADR 0014; ADR 0026; ADR 0027; ADR 0028; D-ORDER"
kind = "model"
status = "verified"
verification = "docs/verification/0044-m2-artifact-relationships.md"
depends_on = ["SACM23-ARG-001", "SACM23-XMI-005", "SACM23-XMI-016", "LIB-EDIT-001", "LIB-EDIT-002", "SACM23-VAL-003", "SACM23-ARG-004"]
acceptance = [
  "`<argumentElement xmi:type=\"sacm:ArtifactReference\" xmi:id=\"r1\" referencedArtifactElement=\"c1 c2\"/>` reads in both modes with `[c1, c2]`; two `<referencedArtifactElement xmi:idref=\"...\"/>` children or `href=\"#c1\"` read equal; attribute plus elements is `RepeatedValue`; an empty attribute is kept as preserved content of the ArtifactReference, with SACM-XMI-003 at it (LIB-COMPAT-003).",
  "`referencedArtifactElement=\"c1 c1\"` is held as `[c1, c1]`; write order is `... abstractForm referencedArtifactElement`, absent when empty; read-write-read is equal and the second write gives the same bytes.",
  "`semantic_compare` gives one `ReferencedArtifactElements` for a different order or a repeat.",
  "`assertionDeclaration`, `metaClaim`, `isCounter`, `source`, `target` and `referencedArtifact` on an ArtifactReference, and `referencedArtifactElement` on another kind, are kept as preserved content of that element, with SACM-XMI-003 at the construct (LIB-COMPAT-003); its inherited ModelElement and SACMElement features are read, written and compared.",
  "A dangling id gives SACM-REF-001 with clause `11.9`; a Claim, ArgumentPackage or AssuranceCasePackage target gives no finding.",
  "`CreateArtifactReference` under an ArgumentPackage gives `artifact_reference_1`; under an AssuranceCasePackage it is `InvalidParent`; white space is `InvalidReference`; an unknown id is `ReferenceNotFound`; a Note id is `WrongReferenceType`; no ids is accepted; repeats are kept; a refusal leaves the document and counters unchanged.",
]
tests = [
