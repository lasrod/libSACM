notes = "Parser leniencies beyond LIB-SEC-005's list were left to LIB-SEC-006 (W3C conformance suite), by the maintainer's decision of 2026-11-11 (slice 0021, verification round 3); LIB-SEC-006 closes the list within the suite (slice 0022). Slice 0026: the unread-content example `<name/>` became `<note/>`, because SACM23-XMI-012 reads names; re-checked there. Slice 0029: a duplicate root id is now refused at its id check, as \"an earlier element\"; re-checked there. Slice 0035: read diagnostics exist now (SACM-XMI-010, SACM-XMI-011), so `diagnostics()` is no longer always empty; re-checked there. Slice 0036: an empty or duplicate `xmi:id` is now a coded refusal (`ReadError::InvalidId`, `ReadError::DuplicateId`; ADR 0015 amendment 2), and a padded id is `Unsupported`; reworded and re-checked there. Slice 0039: reworded for SACM23-XMI-020/-021/-022/-025 and SACM23-VAL-006 (ADR 0024, ADR 0021 amendment 2); re-check there. Slice 0040: reworded, because utility children and `gid` are read now (SACM23-BASE-004/005/006); its tests use `isCitation`, `isAbstract`, `<foo/>` and `<isCitation>` as unread samples; re-check there. Slice 0042: `isCitation`, `isAbstract`, `citedElement` and `abstractForm` are read now (SACM23-BASE-007/008); its tests need other unread samples; re-check there. Slice 0043: a test sample or list changed because ArgumentReasoning, AssertedInference and AssertedContext are read now (ADR 0027); re-check there. Slice 0060 (M3 close audit): reworded; re-check there. Slice 0062: reworded for the Terminology kinds; re-check there. Slice 0063: refusals carry codes, templates and arguments (LIB-API-017); re-check there. Slice 0066: reworded for the ARG/ART package interfaces and bindings (SACM23-ARG-014, -015, SACM23-ART-012, -013, LIB-EDIT-019); re-check there."

[[row]]
id = "SACM23-XMI-002"
area = "XMI"
milestone = "M1"
title = "Namespace-prefix independence"
requirement = "`xmi::read` matches element and attribute names by expanded name (namespace URI and local name), and resolves the QName value of `xmi:type`/`xsi:type` against the namespaces in scope on the element that carries it, so the choice of prefix never changes the result, except that preserved content keeps its prefixes exactly (LIB-COMPAT-003). A document that SACM23-XMI-001 reads gives the same `ReadOutput`, with diagnostics equal apart from their locations, or the same refusal kind, code and location, whatever prefixes it uses for the SACM, XMI and XSI namespaces. This holds for a default namespace, for declarations on the wrapper or on the root, and for a prefix rebound on an inner element. A prefix confers nothing by its spelling: `xmi`, `xsi` or `sacm` bound to another URI is that other namespace. Namespace URIs compare as exact strings. `xmlns=\"\"` means no namespace, and a refusal says so. Before it is resolved, a type value is collapsed by the XSD white-space rules. An undeclared prefix in a type value, or an unprefixed value with no default namespace, names no SACM class: on a root the type attribute is kept as preserved content with SACM-XMI-003 (D-ROOT-NAME, LIB-COMPAT-003), as in SACM23-XMI-001, and on a child the child is kept whole as preserved content of its parent (SACM23-XMI-016); this departs from C++ `xmi_reader.cpp:597-658` (ADR 0016 D2). A name as written (`InvalidRoot.element_name`) keeps the document's prefix."
source = "Namespaces in XML 1.0 (Third Edition): §4 \"Note that the prefix functions only as a placeholder for a namespace name.\"; §6.1 \"The expanded name corresponding to a prefixed element or attribute name has the URI to which the prefix is bound as its namespace name, and the local part as its local name.\", and the scope sentence.; §6.2 \"The namespace name for an unprefixed attribute name always has no value.\" and \"The attribute value in a default namespace declaration MAY be empty. This has the same effect, within the scope of the declaration, of there being no default namespace.\"; §2.3 \"they are identical if and only if the strings are identical\"; §6.3; XMI 2.5.1 formal/15-06-07: §7.2 (p. 5) \"The namespace URIs, not the namespace prefixes, are used to identify which schemas to use\"; rule 1h (p. 61) \"Document producers can choose their own namespace prefixes\"; Table 7.1 nsPrefix (p. 27) \"(Any legal XML prefix may be used in documents.)\"; §7.6.3 (p. 15) `type=\"xsd:QName\"`; rule 2g (p. 63); XML Schema 1.0: Part 1 §2.6 \"in practice, any prefix can be used\"; Part 1 §3.15.3 QName Interpretation, clauses 1.1, 2.2.1 and 2.2.2; Part 2 §3.2.18; Part 2 §4.3.6 \"the value of whiteSpace is collapse\"; Project decisions: D-NS-PIN; D-STRICT; ADR 0016 D2, D6.; assurance-forge: `tests/test_xmi_io.cpp:63-80`; `xmi_reader.cpp:267-350, 573-660`."
kind = "xmi"
status = "verified"
depends_on = ["SACM23-XMI-001", "LIB-SEC-005"]
acceptance = [
  "\"The same document\" means: the same `roots()` ids and kinds, parent `None`, name `None`, the same `element_count()`, and the same `diagnostics()` apart from their locations (an `xsi:type` or `xmi:version` input carries SACM-XMI-010 or SACM-XMI-011, LIB-COMPAT-001), compared with SACM23-XMI-001's `sacm:`/`xmi:` inputs.",
  "SACM prefix: `s:`, `ns0:`, `SACM:` and a non-ASCII prefix (`ü:`), each bound to the SACM URI, give the same document as `sacm:`, for both AssuranceCasePackage and ArgumentPackage.",
  "Default namespace: `<ArgumentPackage xmlns=\"<SACM>\" xmlns:xmi=\"<XMI>\" xmi:id=\"a\"/>`, and a wrapper `<XMI xmlns=\"<XMI>\" xmlns:s=\"<SACM>\"><s:ArgumentPackage xmlns:x=\"<XMI>\" x:id=\"a\"/></XMI>`, give the same document.",
  "XMI and XSI prefixes: each of these, with `x` bound to XMI and `i` bound to XSI, gives the same document: `x:id`, `x:version=\"2.0\"`, `x:type=\"sacm:ArgumentPackage\"`, an `x:XMI` wrapper, and `i:type=\"sacm:ArgumentPackage\"`.",
  "Declaration placement: the same document results when the SACM declaration is on the root but not on the wrapper, when the XSI or type-value prefix is declared only on the wrapper, and when two prefixes are bound to the SACM URI, one used for the element and one in `xsi:type`.",
  "Rebinding: `<p:XMI xmlns:p=\"<XMI>\"><p:ArgumentPackage xmlns:p=\"<SACM>\" xmlns:x=\"<XMI>\" x:id=\"a\"/></p:XMI>` reads one ArgumentPackage `a`. A wrapper `xmlns:t=\"urn:other\"` with a root that has `xmlns:t=\"<SACM>\" xsi:type=\"t:ArgumentPackage\"` reads, and with the reverse binding the type is kept as preserved content of the root, with SACM-XMI-003 at the attribute (LIB-COMPAT-003). A wrapper `xmlns:s=\"<SACM>\"` with a root `<s:ArgumentPackage xmlns:s=\"urn:other\" …>` is `Unsupported` at the root.",
  "Type values: `xsi:type=\"ArgumentPackage\"` under the default namespace SACM reads. `xsi:type=\" sacm:ArgumentPackage \"` reads, as does a value with a tab or newline around it. Each of these is kept as preserved content of the root, with one SACM-XMI-003 at the type attribute's name in both modes (D-ROOT-NAME, LIB-COMPAT-003): `zz:ArgumentPackage` with `zz` undeclared, an unprefixed value under `xmlns=\"\"`, `:ArgumentPackage`, `sacm:`, `a:sacm:ArgumentPackage` and `sacm:Argument Package`. Unicode white space that XSD does not collapse is not removed: a value with U+00A0 before or after it, or with U+0085 around it, is likewise preserved at the attribute.",
  "Spelling confers nothing: `xmlns:xmi=\"urn:not-xmi\" xmi:id=\"a\"`, with no other id, is `Unsupported` at the attribute (no XMI id; a preserved attribute cannot bind `xmi` to another URI, a defect, ADR 0033). `xmlns:xsi=\"urn:not-xsi\" xsi:type=\"sacm:ArgumentPackage\"` is kept as preserved content of the root, with SACM-XMI-003 at that attribute (an attribute the class lacks, LIB-COMPAT-003). A root in the default namespace XMI with an unprefixed `id=\"a\"` is `Unsupported` at the root (Namespaces §6.2).",
  "Exact URIs: `xmlns:sacm=\"http://www.omg.org/spec/SACM/20220301/\"` (trailing slash) and `\"HTTP://www.omg.org/spec/SACM/20220301\"` are `Unsupported` at the root.",
  "No namespace: `<ArgumentPackage xmlns=\"\" xmlns:xmi=\"<XMI>\" xmi:id=\"a\"/>` is `Unsupported` at the root, with a reason that says the element is in no namespace (not `namespace \"\"`).",
  "Duplicate expanded name: `xmlns:a=\"<XMI>\" xmlns:b=\"<XMI>\" a:id=\"p\" b:id=\"p\"` is `Malformed` (SACM-XML-001) at the second attribute (Namespaces §6.3).",
  "Refusals do not depend on the prefix: `<s:Claim xmlns:s=\"<SACM>\" …>` and `<Claim xmlns=\"<SACM>\" …>` give `InvalidRoot` (SACM-XMI-001) at line 1, column 1, with `element_name` `\"s:Claim\"` and `\"Claim\"` as written. A wrapper with `xmlns:x` bound to XMI that holds only `<x:documentation/>` gives `NoPackage`.",
]
