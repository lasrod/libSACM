  "crates/sacm/tests/interim_refusals.rs::sacm23_xmi_009_a_strict_read_keeps_argumentation_element_in_a_group_with_one_error",
]
acceptance = [
  "Tolerant: `<artifactElement xmi:type=\"sacm:ArtifactAssertedRelationship\" xmi:id=\"r\" source=\"a\" target=\"b\">` in an ArtifactPackage reads `==` to the same element typed `sacm:ArtifactAssetRelationship`, with one SACM-XMI-013 Warning at its start tag affecting `r`; so do `xsi:type` (with SACM-XMI-010 too), another prefix bound to the SACM namespace, and `xmi:type=\"sacm:ArtifactAssertedRelationship\"` with `xsi:type=\"sacm:ArtifactAssetRelationship\"` (one SACM-XMI-013). In both modes `v:ArtifactAssertedRelationship` in another namespace, and the type under an ArgumentPackage's `argumentElement`, keep the child whole as preserved content of its parent with SACM-XMI-003, and `<sacm:ArtifactAssertedRelationship>` as the document element is `InvalidRoot`.",
  "Tolerant: `occurece=\"2024-03-05\"`, `<occurece>2024-03-05</occurece>` and `<occurece xsi:nil=\"true\"/>` on an Event read as its `date` (exactly as written; nil is absent), with one SACM-XMI-013 Warning at the attribute's name or the element's start tag affecting the Event. With `date` beside it in either form, `date()` is the `date` value and the `occurece` is preserved content of the Event with one SACM-MULT-001 Warning and no SACM-XMI-013; `occurece` as an attribute and an element reads the attribute and keeps the element as the repeat. `occurece` on an Artifact and `occurence` on an Event are SACM-XMI-003 in both modes.",
  "Tolerant: `<argumentationElement xmi:type=\"sacm:Claim\" xmi:id=\"c1\">` in an ArgumentPackage reads as a child in role `argumentElement`, in document order among its siblings, with one SACM-XMI-013 Warning at its start tag affecting the package. On an ArgumentGroup, `argumentationElement=\"c1 c2\"` and `<argumentationElement xmi:idref=\"c1\"/>` read as members, with one Warning per attribute or element affecting the group; member elements under both names accumulate in document order; `argumentElement=\"c1\" argumentationElement=\"c2\"` reads `[c1]` and keeps the spelled attribute as preserved content with one SACM-MULT-001 Warning. `argumentationElement` on a Claim, an ArtifactGroup or an AssuranceCasePackage is SACM-XMI-003 in both modes.",
  "Strict: each construct of items 1 to 3 is kept as preserved content of the element it sits in (the typed child and the role element whole, of their parent; the end's attribute or element, of the group; `occurece`, of the Event), with one SACM-XMI-013 Error at the same location affecting that element and no SACM-XMI-003, and nothing is read from it: no element or member is added and `date()` stays unset (a `date` beside it reads). The ids inside it join the id space; `has_errors()` is true; a strict write is `WriteError::PreservedContent`, and a tolerant write writes it back as read. No `ReadError::Unsupported` names SACM23-XMI-009.",
  "Messages begin as today's strict refusal reasons (the group end's naming §11.2) and end, tolerant, `; it is read as R, which write writes`, and strict, `; it is kept as preserved content, and a tolerant read reads the name as R`, with R `ArtifactAssetRelationship`, `date` or `argumentElement`; requirement SACM23-XMI-009; clause `12.14`, `12.9`, `11.4` (role) or `11.2` (end). `Code::XMI_SPELLING_VARIANT` is SACM-XMI-013, and its catalog row names both severities and SACM23-XMI-009.",
  "`model-spellings.sacm.xmi` reads tolerantly with exactly five SACM-XMI-013 Warnings, at 6:5, 12:5, 12:69, 21:62 and 24:5, and no other diagnostic; it validates with no finding, and a strict `xmi::write` of it gives exactly `golden/model-spellings.golden.sacm.xmi`, which reads strictly with no diagnostic and `==` to the tolerant read. A strict read of the input gives exactly four SACM-XMI-013 Errors, at 6:5, 12:5, 21:62 and 24:5.",
]

