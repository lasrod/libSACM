[[row]]
id = "LIB-SEC-003"
area = "SEC"
milestone = "M6"
title = "Resource limits"
requirement = "Loading enforces configurable limits on input size, nesting depth and element count with documented defaults, failing with a diagnostic instead of exhausting memory or stack. The parser's own capacity limits (nodes, attributes, namespaces) are refused as `ReadError::Unsupported` with no location, never as malformed input (slice 0019: today `input.rs` maps them; a test with 65,536 or more namespace prefixes belongs here). `xmi::write` output stays within a documented bound for every document the default load limits admit (indentation makes output grow with the square of depth), failing with an error rather than exhausting memory. The limits also bound the number of namespace declarations in scope, because roxmltree 0.21's parse is O(elements × in-scope bindings) (3,000 × 40,000 takes about 1.9 s in a debug build), while the crate's own read is linear."
source = "Robustness policy (docs/architecture.md, Goals)"
kind = "security"
status = "planned"
depends_on = ["LIB-SEC-002"]

