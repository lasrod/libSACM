id = "LIB-TOOL-007"
area = "TOOL"
milestone = "M0"
title = "Traced tests live outside production source"
requirement = "The gate rejects traced tests (functions named for a matrix row) under any `*/src/` directory, so acceptance tests stay in the test engineer's scope and the implementer cannot add or alter them inline."
source = "Verification 0001 round 2 follow-up; ADR 0006 amendment 1"
kind = "tooling"
status = "verified"
code = ["xtask/src/matrix.rs"]
acceptance = [
  "A traced test in a scanned file whose repository-relative path has a component equal to `src` gives exactly one problem: `<file>: traced test `<name>` is under a `src` directory; traced tests belong in test files`. Examples are `crates/sacm/src/lib.rs`, `crates/x/src/a/b.rs`, `xtask/src/matrix.rs`, and a Python file under a `src` directory. The problem is the same whether or not a row cites the test, and whether or not it is ignored, and no orphan problem is reported for it.",
  "Only the exact component `src` counts. `source/`, `srcs/`, `my_src/` and a file named `src.rs` outside a `src` directory do not. Untraced unit tests under `src` (`#[cfg(test)] mod tests { #[test] fn parses() {} }`) are allowed. `doctest:` citations of files under `src` are unaffected.",
  "The scan problems (under `src`, ignored, orphan) come together, sorted by file and then by function name. The real repository has no traced test under `src`, and the doc comments in `xtask/src/matrix.rs` that show `#[test] fn lib_cli_001_...` give no problem.",
]
depends_on = ["LIB-TOOL-001"]
tests = [
