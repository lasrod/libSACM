[[row]]
id = "SACM23-XMI-021"
area = "XMI"
milestone = "M2"
title = "A repeated single-valued containment is refused"
requirement = "A ModelElement given two or more `name` elements in no namespace is refused in strict mode as `ReadError::RepeatedValue` (SACM-MULT-001) with `property` `name`, even when the names are equal (ADR 0021 amendment 2). `element` is the owner's id, `locations()` is the start tag of every `name` in document order, and `location()` is the second. Each later `name` is checked in full first. Nothing is dropped: a tolerant read keeps the first name and preserves each later one, with a SACM-MULT-001 Warning (LIB-COMPAT-001). A repeated `UtilityElement.content` or `TaggedValue.key` follows the same rule (SACM23-BASE-004/005)."
source = "formal/23-05-08 §8.6 (p. 19) \"name:LangString[1] (composition) - the name of the ModelElement.\"; XMI 2.5.1 §7.8.2 (p. 17) \"By default, XMI 2 produces schemas that ignore multiplicities also.\", rule 4f (p. 51); D-STRICT; D-PRESERVE; ADR 0021 amendments 1 and 2; the maintainer's decision of 2026-11-13; C++ `xmi_reader.cpp:1182-1218` (keeps the last)"
kind = "xmi"
status = "verified"
verification = "docs/verification/0039-m2-ids-and-literals.md"
depends_on = ["SACM23-XMI-012", "SACM23-XMI-014", "SACM23-XMI-023"]
notes = "Maintainer decision 2026-11-12: the code is SACM-MULT-001, because `name:LangString[1]` held twice is a multiplicity violation. SACM23-VAL-018 has already widened the catalog text to cover it. SACM-XMI-003 (\"Unknown element\") is not used, as C++ uses it. Reworded 2026-11-13 by the maintainer: a coded refusal, consistent with SACM23-XMI-014, since a `Document` holds one name per element. Slice 0063: refusals carry codes, templates and arguments (LIB-API-017); re-check there."
acceptance = [
  "Two `name` elements on a root and on a child give `RepeatedValue { property: \"name\" }` in strict mode (tolerant: LIB-COMPAT-001), with `code()` SACM-MULT-001, `location()` the second `<name` and `locations()` both start tags; the same when the names are equal.",
  "Three names: `locations()` has all three and `location()` is the second; a malformed second name is kept whole as preserved content of the owner, with SACM-XMI-003 at its start tag (LIB-COMPAT-003); it is no occurrence, so there is no `RepeatedValue` and the owner keeps its first name.",
  "Names separated by children, white space, comments or processing instructions are still counted, in document order.",
  "A namespace-qualified `sacm:name` after a valid `name` is kept as preserved content of the owner (LIB-COMPAT-003), not counted as a `RepeatedValue`; a `name=\"x\"` attribute is not an occurrence.",
  "`Unsupported` is no longer returned for a second name; the `RepeatedValue` docs list `name`, and the catalog's SACM-MULT-001 row no longer says \"once SACM23-XMI-021 is built\".",
]
tests = [
  "crates/sacm/tests/xmi_repeated_names.rs::sacm23_xmi_021_two_names_on_a_root_or_a_child_are_repeated_value_in_strict_mode",
  "crates/sacm/tests/xmi_repeated_names.rs::sacm23_xmi_021_three_names_give_three_locations_and_the_second_is_the_location",
  "crates/sacm/tests/xmi_repeated_names.rs::sacm23_xmi_021_a_malformed_second_name_is_preserved_as_its_own_defect_not_repeated",
  "crates/sacm/tests/xmi_repeated_names.rs::sacm23_xmi_021_names_separated_by_children_white_space_comments_or_pis_still_count",
  "crates/sacm/tests/xmi_repeated_names.rs::sacm23_xmi_021_a_qualified_name_or_a_name_attribute_is_not_an_occurrence",
  "crates/sacm/tests/xmi_repeated_names.rs::sacm23_xmi_021_a_repeated_name_display_names_the_property_the_element_and_every_location",
  "crates/sacm/tests/xmi_repeated_names.rs::sacm23_xmi_021_the_catalog_mult_001_row_no_longer_waits_for_this_row",
]
code = ["crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi.rs"]

[[row]]
id = "SACM23-XMI-022"
area = "XMI"
milestone = "M2"
title = "An xmi:id on a LangString"
requirement = "An `xmi:id` on a `name` LangString (XMI 2.5.1 §7.8.3) is read in both load modes with no diagnostic and kept with the owning element as `SacmElement::name_id()`, not on the `LangString` value (ADR 0024). `xmi::write` writes it back as the first attribute of `name`. It shares the file's id space: a repeat with any element or name id is `DuplicateId` (SACM-ID-001), a caller id equal to it is `EditError::DuplicateId`, and generated ids skip it. It follows the element-id rules: empty is `InvalidId`, padded is trimmed (SACM23-XMI-025), and one that is not an NCName is reported by `validate` as SACM-ID-002 with the owner as the affected id. `semantic_compare` compares it (`Difference::NameId`). An `xmi:id` on a value element (`lang`, `content`) keeps the whole `name` as preserved content of the owner, which then has no name, with SACM-XMI-003 at the `name` start tag; the `name`'s own id stays in the id space (LIB-COMPAT-003). This departs from C++, which drops the id with an Info (`xmi_reader.cpp:793-803`)."
source = "XMI 2.5.1 §7.8.3 (p. 17) \"A class is represented by an XML element, with an XML element or attribute for each property.\" with `<xsd:attribute ref=\"xmi:id\"/>`; ptc/22-03-13 LangString `uml:Class`; rule 2a (p. 63) \"to serialize objects that are the values of Properties\"; §7.6.1 (p. 14) uniqueness; D-ID; D-PRESERVE; ADR 0024; C++ `xmi_reader.cpp:793-803`"
kind = "xmi"
status = "verified"
verification = "docs/verification/0039-m2-ids-and-literals.md"
depends_on = ["SACM23-XMI-012", "SACM23-XMI-014", "SACM23-VAL-001", "LIB-API-010", "LIB-RT-001", "SACM23-VAL-020", "SACM23-XMI-004", "SACM23-XMI-025"]
notes = "Maintainer decision 2026-11-12: preserve the id; no catalog code is needed. Moved from SACM23-XMI-012 in slice 0026. Not urgent: no corpus file and no C++ output carries such an id. When built, reword verified SACM23-XMI-004 (\"No `xmi:id` is written on a LangString or MultiLangString\"), because a preserved LangString id is written back."
acceptance = [
  "`<name xmi:id=\"n1\" lang=\"en\" content=\"x\"/>` on a root and on a child reads Ok in both modes with no diagnostic, and `name_id()` is `n1`; `write` writes `xmi:id=\"n1\"` first on that `name`, deterministically, and reading it back gives an equal document.",
  "`name_id()` is `None` for a name without an id and for an element without a name; `Document::get(\"n1\")` finds nothing.",
  "Uniqueness: a Claim `c1` whose `name` has `xmi:id=\"c1\"` gives `DuplicateId { id: \"c1\" }` listing both start tags; two names on different elements with one id give `DuplicateId`; an id-less element never gets a generated id equal to a name id; a create with a caller id equal to a name id is `EditError::DuplicateId`.",
  "`<name xmi:id=\"\"/>` is `InvalidId` at the `name` start tag; `\" n1 \"` reads as `n1` with the SACM23-XMI-025 Info.",
  "`<name xmi:id=\"1n\"/>` reads, and `validate` reports one SACM-ID-002 with the owner as the affected id and a message naming `name`; a strict write refuses it.",
  "Comparison: two documents differing only in a name's `xmi:id` (present vs absent, or different values) are not `==`, and `semantic_compare` gives one `Difference::NameId` naming the owner, reported after `Name`.",
  "`<name><content xmi:id=\"v1\">x</content></name>` keeps the whole `name` as preserved content of the owner, with one SACM-XMI-003 at the `name` start tag in both modes; the owner has no name (LIB-COMPAT-003).",
  "Generated ids skip name ids even when they outnumber the elements: after reading root `p` (name id `claim_1`) holding Claim `claim_2` (name id `claim_3`), a create with no caller id makes `claim_4`.",
  "A name id holding markup and TAB (`a&amp;b&lt;c&#9;`) is written escaped by a tolerant write and reads back equal.",
]
tests = [
  "crates/sacm/tests/xmi_name_ids.rs::sacm23_xmi_022_a_name_id_on_a_root_or_a_child_reads_with_no_diagnostic_and_is_kept_with_the_owner",
  "crates/sacm/tests/xmi_name_ids.rs::sacm23_xmi_022_write_writes_the_name_id_first_on_name_and_reads_back_equal",
  "crates/sacm/tests/xmi_name_ids.rs::sacm23_xmi_022_name_id_is_none_without_one_and_a_name_id_is_no_element",
  "crates/sacm/tests/xmi_name_ids.rs::sacm23_xmi_022_a_name_id_repeating_any_id_is_duplicate_id_at_both_start_tags",
  "crates/sacm/tests/xmi_name_ids.rs::sacm23_xmi_022_generated_ids_skip_a_name_id_on_read_and_on_edit",
  "crates/sacm/tests/xmi_name_ids.rs::sacm23_xmi_022_a_caller_id_equal_to_a_name_id_is_duplicate_id",
  "crates/sacm/tests/xmi_name_ids.rs::sacm23_xmi_022_an_empty_name_id_is_invalid_id_at_the_name_and_a_padded_one_is_trimmed",
  "crates/sacm/tests/xmi_name_ids.rs::sacm23_xmi_022_a_name_id_that_is_not_an_ncname_reads_and_is_one_id_002_on_the_owner",
  "crates/sacm/tests/xmi_name_ids.rs::sacm23_xmi_022_documents_differing_only_in_a_name_id_give_one_name_id_difference",
  "crates/sacm/tests/xmi_name_ids.rs::sacm23_xmi_022_a_name_id_difference_displays_the_owner_and_both_ids",
  "crates/sacm/tests/xmi_name_ids.rs::sacm23_xmi_022_an_xmi_id_on_a_value_element_is_preserved_with_its_name",
  "crates/sacm/tests/xmi_name_ids.rs::sacm23_xmi_022_generated_ids_skip_name_ids_even_when_they_outnumber_the_elements",
  "crates/sacm/tests/xmi_name_ids.rs::sacm23_xmi_022_a_name_id_holding_markup_and_tab_is_escaped_on_write_and_reads_back_equal",
]
code = ["crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/output.rs", "crates/sacm/src/model/document.rs", "crates/sacm/src/compare.rs", "crates/sacm/src/validation/ids.rs", "crates/sacm/src/edit/create.rs"]

[[row]]
id = "SACM23-XMI-023"
area = "XMI"
milestone = "M2"
title = "Read diagnostics carry a source location"
requirement = "Every diagnostic in `ReadOutput::diagnostics` carries the line and column of the element or attribute it concerns, by the rules of SACM23-XMI-010: an element at the `<` of its start tag, an attribute at the first character of its name, and text at its first character that is not white space. Each later row that adds a read diagnostic inherits this rule and tests it: SACM-XMI-003 (LIB-COMPAT-003), SACM-XMI-004 (SACM23-XMI-020), SACM-XMI-012 (LIB-COMPAT-008) and SACM-ID-004 (SACM23-XMI-025)."
source = "D-DIAG; ADR 0011; split from SACM23-XMI-010 in slice 0029"
kind = "xmi"
status = "verified"
verification = "docs/verification/0038-m1-audit-fixes.md"
depends_on = ["LIB-DIAG-001", "LIB-COMPAT-001", "SACM23-XMI-010"]
acceptance = [
  "Every read diagnostic that exists (SACM-XMI-010 on a root, a child and a `name`; SACM-XMI-011 on `xmi:XMI` and on a root) has `location()` at the first character of the attribute's name, in a table that includes positions after a CRLF, a lone CR and a non-ASCII character. SACM-XMI-003, SACM-XMI-004, SACM-XMI-012 and SACM-ID-004 are located by their own rows' tests (LIB-COMPAT-003, SACM23-XMI-020, LIB-COMPAT-008, SACM23-XMI-025).",
]
notes = "Slice 0038 (M1 audit): already holds for SACM-XMI-010 and SACM-XMI-011; the table test proves it, and later rows inherit it."
code = ["crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/input.rs"]
tests = ["crates/sacm/tests/xmi_read_diagnostic_locations.rs::sacm23_xmi_023_every_read_diagnostic_is_located_at_the_attribute_name"]

[[row]]
id = "SACM23-XMI-024"
area = "XMI"
milestone = "M1"
title = "No xmi:version on export"
requirement = "`xmi::write` writes no `xmi:version` attribute on any element, for one root or several, other than one kept as preserved content of a child (LIB-COMPAT-003): the XMI 2.5.1 namespace declaration identifies the version. This amends SACM23-XMI-003, -007 and -013, whose texts and tests no longer name it. Reading a file that has `xmi:version` on the wrapper or a root and writing it back drops the attribute, which carries no SACM or XMI model data. The reader ignores `xmi:version` on the `xmi:XMI` element and on the roots (SACM23-XMI-001), reporting each as SACM-XMI-011 (Info, LIB-COMPAT-001), and keeps it on a child as preserved content of the child, with SACM-XMI-003 at its name (LIB-COMPAT-003). The golden files change accordingly."
source = "XMI 2.5.1 formal/15-06-07 §2.2.2 (p. 1) \"must be equivalent to those generated by the XMI Document production rules\"; §7.5.3 (p. 10) \"identification of the XMI version is indicated by the presence of the XMI namespace declaration\", and the `XMI` complexType declares no attributes; §7.6.3 (p. 15) `ObjectAttribs` (IdentityAttribs, LinkAttribs, type); §7.8.1 (p. 17) \"The XMI element declares the version of XMI and the namespace for UML\" (an example with namespace declarations only); production 1a (p. 60) (\"1b to 1d: // rules deleted //\"); Annex B.2 item 5 (p. 103); D10; D-XMI-VERSION; ADR 0017 amendment 3; CLAUDE.md rule 6; ADR review, 2026-11-13 (the maintainer: apply every recommendation); assurance-forge `metadata/namespaces.h:32`, `io/xmi_writer.cpp:461, 542` (writes `2.0`)"
kind = "xmi"
status = "verified"
depends_on = ["SACM23-XMI-007", "SACM23-XMI-013", "SACM23-XMI-001", "SACM23-XMI-003", "SACM23-XMI-016"]
acceptance = [
  "For a document with one root (each of the twelve package kinds) and one with several roots (AP, ACP, AP), the output has no attribute in the XMI namespace with local name `version` on any element: not on the document element (`sacm:<Kind>` or `xmi:XMI`) and not on a root inside `xmi:XMI`. The document element still carries exactly `xmlns:sacm` and `xmlns:xmi` with the pinned URIs.",
  "The five golden files (`single-root`, `several-roots`, `nested`, `named`, `needs-support-claim`) match byte for byte after the change; in each, the only difference from the previous golden is that ` xmi:version=\"2.0\"` is gone from the document element.",
  "Reading a file with `xmi:version=\"2.0\"` and one with `\"2.1\"`, on the wrapper and on the roots, gives a document `==` to the one read from the same file without the attribute; writing either gives the same bytes, with no `xmi:version`. No SACM content is lost: `xmi:version` is a property of no SACM class (ptc/22-03-13) and not part of the XMI document model (§7.6.3 ObjectAttribs, the §7.5.3 complexType), and the version it would state is carried by the `xmlns:xmi` URI.",
  "Determinism: writing a document twice, its clone, and `write(read(write(d)))` give identical bytes, none containing `xmi:version`.",
  "The reader ignores `xmi:version` on the wrapper and on roots (SACM23-XMI-001), reporting it as an Info since LIB-COMPAT-001 (SACM-XMI-011), and on a child keeps it as preserved content of the child, with one SACM-XMI-003 and no SACM-XMI-011 at the attribute's name (LIB-COMPAT-003); reader test inputs that contain it stay as they are.",
]
code = ["crates/sacm/src/xmi/output.rs", "crates/sacm/src/xmi/namespaces.rs", "crates/sacm/src/xmi.rs", "docs/adr/0017-xmi-writer.md"]
tests = [
  "crates/sacm/tests/xmi_version.rs::sacm23_xmi_024_each_package_kind_as_a_single_root_is_written_without_xmi_version",
  "crates/sacm/tests/xmi_version.rs::sacm23_xmi_024_ap_acp_ap_roots_are_written_without_xmi_version_on_the_wrapper_or_a_root",
  "crates/sacm/tests/xmi_version.rs::sacm23_xmi_024_no_element_of_a_document_holding_every_kind_carries_xmi_version",
  "crates/sacm/tests/xmi_version.rs::sacm23_xmi_024_the_document_element_carries_nothing_in_the_xmi_namespace_but_an_id",
  "crates/sacm/tests/xmi_version.rs::sacm23_xmi_024_no_golden_file_carries_xmi_version",
  "crates/sacm/tests/xmi_version.rs::sacm23_xmi_024_reading_xmi_version_on_the_wrapper_or_the_roots_gives_an_equal_document",
  "crates/sacm/tests/xmi_version.rs::sacm23_xmi_024_writing_a_document_read_with_xmi_version_gives_the_same_bytes_without_it",
  "crates/sacm/tests/xmi_version.rs::sacm23_xmi_024_a_golden_file_with_xmi_version_added_writes_back_as_the_golden_file",
  "crates/sacm/tests/xmi_version.rs::sacm23_xmi_024_writing_twice_a_clone_and_a_read_back_give_identical_bytes_without_xmi_version",
  "crates/sacm/tests/xmi_version.rs::sacm23_xmi_024_the_reader_ignores_xmi_version_on_the_wrapper_and_on_the_roots",
  "crates/sacm/tests/xmi_version.rs::sacm23_xmi_024_the_reader_preserves_xmi_version_on_a_child_at_the_attribute_name",
]
verification = "docs/verification/0035-m1-load-and-save-modes.md"
notes = "Reverses ADR 0017's \"Kept from C++: xmi:version=\\\"2.0\\\"\" (the maintainer, 2026-11-13, on the ADR review): the standard decides, so it comes before C++ (`namespaces.h:32`). A `WriteOptions` switch is added only if a real consumer needs it. docs/sacm/metamodel-inventory.md and the sacm-expert skill's XMI reference, which stated `xmi:version=\"2.0\"`, are updated with it (slice 0033). Slice 0035: an ignored `xmi:version` is now reported as SACM-XMI-011 (Info); re-checked there."

[[row]]
id = "SACM23-XMI-025"
area = "XMI"
milestone = "M2"
title = "An xmi:id with white space around it"
requirement = "An `xmi:id`, on an element or a `name`, whose value after XML attribute-value normalisation is not an NCName but whose XSD-collapsed value is one is read as the collapsed (trimmed) value (ADR 0024). Collapse removes only #x20, #x9, #xA and #xD. The document identifies, compares, deduplicates and writes the element by that value. It is reported once as Info SACM-ID-004 in both modes: requirement SACM23-XMI-025, clause 7.6.1, the trimmed id as the affected id (the owner's id for a name id), at the attribute's name, with a message quoting the value as read. Other ids are held as written: one that is still not an NCName after trimming is reported by `validate` (SACM23-VAL-020), and an empty one is `InvalidId`. `Unsupported` is no longer returned for it."
source = "XMI 2.5.1 §7.6.1 (p. 13) `type=\"xsd:ID\"`; XML Schema 1.0 Part 2 (Second Edition) §3.3.8 \"The ·base type· of ID is NCName\", Appendix A (`token` has `<xs:whiteSpace value=\"collapse\"/>`), §4.3.6 \"collapse: After the processing implied by replace, contiguous sequences of #x20's are collapsed to a single #x20, and leading and trailing #x20's are removed.\"; XML 1.0 (Fifth Edition) §3.3.3; D-ID; ADR 0024; the maintainer's decision of 2026-11-14; C++ `xmi_reader.cpp:750-753` (raw)"
kind = "xmi"
status = "verified"
verification = "docs/verification/0039-m2-ids-and-literals.md"
depends_on = ["SACM23-VAL-020", "SACM23-XMI-023", "SACM23-VAL-001", "SACM23-XMI-004"]
notes = "Maintainer decision 2026-11-14: follow the schema (`xmi:id` is `xsd:ID`, white space collapsed): read the trimmed id, report an Info naming the original value, and write the trimmed id."
acceptance = [
  "Each of `\" c1 \"`, `\"c1 \"`, `\"  c1\"`, `\"c1&#9;\"`, `\"&#xA;c1&#xD;\"` and a literal TAB or LF around `c1` reads as `c1`, on a root, a child and a `name`, in both modes, with exactly one Info SACM-ID-004: affected `[\"c1\"]` (the owner for a name), at the `xmi:id` attribute's name (correct after a CRLF), quoting the value as read with `{:?}`.",
  "Duplicates after trimming: `\" c1 \"` beside `\"c1\"`, and `\" c1\"` beside `\"c1 \"`, give `DuplicateId { id: \"c1\" }` with both start tags.",
  "Not XML white space: `\"&#xA0;c1\"`, `\"c1&#x2003;\"` and `\"&#x200B;c1\"` are not trimmed; they are read as written, `validate` reports SACM-ID-002, and there is no SACM-ID-004. `\"&#xFEFF;c1\"` is an NCName (U+FEFF is a NameStartChar) and reads as written with no diagnostic.",
  "Still not an NCName after trimming: `\" 1c \"`, `\" a b \"` and `\"   \"` are read as written and reported by `validate` (SACM23-VAL-020); `\"\"` stays `InvalidId`.",
  "Write back: `write` writes `xmi:id=\"c1\"`; reading it back gives an equal document and no SACM-ID-004; a strict save succeeds.",
  "Edits: after reading `\" c1 \"`, a caller id `c1` is `EditError::DuplicateId`.",
  "`Code::ID_TRIMMED` is SACM-ID-004, in a catalog row naming SACM23-XMI-025.",
  "Locating stays linear: a package of 20,000 Claims, each with an `xsi:type` before a padded `xmi:id`, reads within the deadline, with every SACM-ID-004 and SACM-XMI-010 at its attribute's name (found by Copilot on PR #50).",
]
tests = [
  "crates/sacm/tests/xmi_padded_ids.rs::sacm23_xmi_025_a_padded_id_reads_trimmed_with_one_info_on_a_root_a_child_and_a_name",
  "crates/sacm/tests/xmi_padded_ids.rs::sacm23_xmi_025_ids_equal_after_trimming_are_duplicate_id",
  "crates/sacm/tests/xmi_padded_ids.rs::sacm23_xmi_025_characters_that_are_not_xml_white_space_are_not_trimmed",
  "crates/sacm/tests/xmi_padded_ids.rs::sacm23_xmi_025_an_id_still_not_an_ncname_after_trimming_is_held_as_written",
  "crates/sacm/tests/xmi_padded_ids.rs::sacm23_xmi_025_write_writes_the_trimmed_id_and_it_reads_back_without_the_info",
  "crates/sacm/tests/xmi_padded_ids.rs::sacm23_xmi_025_after_reading_a_padded_id_a_caller_id_equal_to_the_trimmed_one_is_duplicate_id",
  "crates/sacm/tests/xmi_padded_ids.rs::sacm23_xmi_025_the_catalog_id_004_row_names_the_code_and_the_row",
  "crates/sacm/tests/xmi_padded_ids.rs::sacm23_xmi_025_many_padded_ids_after_xsi_type_are_located_in_linear_time",
]
code = ["crates/sacm/src/xmi/roots.rs", "crates/sacm/src/diagnostic.rs"]

[[row]]
id = "SACM23-XMI-026"
area = "XMI"
milestone = "M2"
title = "xsi:nil on a value element"
requirement = "On a value element of a DataType-typed property (`gid`, `isCitation`, `isAbstract`, `isCounter`, `assertionDeclaration`, and `lang`/`content` in a `name` or `value`), `xsi:nil` is read in both modes as an `xsd:boolean`: `true`/`1` reads exactly as if the property were not written (absent for a [0..1] String, `false` for a flag, `asserted` for `assertionDeclaration`), `false`/`0` reads the element's content as usual, and any other value is `InvalidLiteral` (SACM-ENUM-001) in strict mode (tolerant: SACM23-VAL-006). A nil element with any character or element child does not conform (XML Schema Part 1 §3.3.4 cvc-elt 3.2.1) and is kept whole as preserved content, with one SACM-XMI-003 at its `<` (the whole `name` for a `lang`/`content` in a name; LIB-COMPAT-003). `xsi:nil` on an element that is not a value element (not nillable) is kept as preserved content: of that element, at the attribute's name, or, on or in a `name`, `content`, `key` or reference element, with that whole element (LIB-COMPAT-003). A nil occurrence counts for `RepeatedValue`. Nothing is reported, and `write` writes the property as omitted."
source = "XMI 2.5.1 §9.4.1 (p. 56) \"When the value of a Property is null, it is serialized as XMIValueElement with attribute nil='true'.\"; rule 2b (p. 63) \"Null values may be serialized as well, unless the value of the org.omg.xmi.includeNils tag is \\\"false,\\\" in which case you may not serialize null values.\"; Table 7.1 (p. 27) `includeNils` default `true`; §7.11.2 (p. 28); production 4d (pp. 48, 50) `nillable='true'`; §7.15 (p. 43) \"If P is included but empty in the XMI file, the property is unset; if mandatory, it is instead set to its default value.\"; XML Schema 1.0 Part 1 §3.3.4 cvc-elt 3.1 and 3.2.1, §3.2.7; the maintainer, 2026-11-15 (nil reads as omitted)"
kind = "xmi"
status = "verified"
verification = "docs/verification/0051-m2-close.md"
depends_on = ["SACM23-XMI-014", "SACM23-BASE-006", "SACM23-BASE-007", "SACM23-BASE-008", "SACM23-ARG-007", "SACM23-XMI-017", "SACM23-VAL-006"]
acceptance = [
  "`<gid xsi:nil=\"true\"/>`, `<name><lang xsi:nil=\"1\"/></name>` and `<value><content xsi:nil=\" true \"/></value>` read as absent: `==` to the same file without the element and different from `<gid/>` (`\"\"`); no diagnostic, in either mode.",
  "`xsi:nil=\"false\"` on `<gid>x</gid>` gives \"x\"; on `<gid xsi:nil=\"false\"/>` it gives `\"\"`; on `<assertionDeclaration xsi:nil=\"0\">assumed</assertionDeclaration>` it gives assumed.",
  "`<isCitation xsi:nil=\"true\"/>`, `<isAbstract …/>` and `<isCounter …/>` read as false, and `<assertionDeclaration xsi:nil=\"true\"/>` as asserted, each `==` to the file without the element.",
  "`xsi:nil=\"TRUE\"`, `\"yes\"` and `\"\"` are each `InvalidLiteral` (SACM-ENUM-001) naming `xsi:nil`, at the attribute.",
  "`<gid xsi:nil=\"true\">x</gid>` and `<gid xsi:nil=\"true\"> </gid>` are preserved whole, with one SACM-XMI-003 at the `gid` element's `<` (ADR 0033, slice 0050); a comment or processing instruction inside is accepted.",
  "`xsi:nil` on a root, a child element or a UtilityElement is kept as preserved content of it, at the attribute's name; on `<name>`, on a `<value>`, on a `content`/`key` role element or on a reference element it keeps that whole `name`, `content`, `key` or reference element as preserved content of its owner, at its start tag; an unqualified `nil` on a `gid` or on a `name`'s `lang` keeps that `gid` or `name` whole; each with one SACM-XMI-003 in both modes (LIB-COMPAT-003).",
  "`gid=\"x\"` with `<gid xsi:nil=\"true\"/>`, and two nil `gid` elements, are each `RepeatedValue`.",
  "Writing a nil-read document writes no `xsi:nil` and no element for the property, and it reads back `==`.",
]
code = ["crates/sacm/src/xmi/roots.rs"]
tests = [
  "crates/sacm/tests/xsi_nil.rs::sacm23_xmi_026_a_nil_element_holding_an_empty_cdata_is_omitted",
  "crates/sacm/tests/xsi_nil.rs::sacm23_xmi_026_a_nil_value_element_reads_as_if_the_property_were_not_written",
  "crates/sacm/tests/xsi_nil.rs::sacm23_xmi_026_a_nil_value_reads_as_absent_a_nil_flag_as_false_and_a_nil_declaration_as_asserted",
  "crates/sacm/tests/xsi_nil.rs::sacm23_xmi_026_nil_false_reads_the_element_content_as_usual",
  "crates/sacm/tests/xsi_nil.rs::sacm23_xmi_026_an_xsi_nil_that_is_not_a_boolean_literal_is_invalid_literal_at_the_attribute",
  "crates/sacm/tests/xsi_nil.rs::sacm23_xmi_026_a_nil_element_with_a_character_or_element_child_is_preserved_whole",
  "crates/sacm/tests/xsi_nil.rs::sacm23_xmi_026_xsi_nil_on_an_element_that_is_not_a_value_element_is_preserved",
  "crates/sacm/tests/xsi_nil.rs::sacm23_xmi_026_a_nil_occurrence_counts_for_repeated_value",
  "crates/sacm/tests/xsi_nil.rs::sacm23_xmi_026_a_nil_read_document_is_written_with_the_property_omitted_and_reads_back_equal",
]

[[row]]
id = "SACM23-XMI-027"
area = "XMI"
milestone = "M6"
title = "Cross-document references"
requirement = "An `href=\"doc#id\"` reference (XMI 2.5.1 §7.10.2) is read in both modes and held as an external reference (the document and the fragment), written back and compared; it is never dropped. Until this row a strict read refuses it as `Unsupported` (SACM23-XMI-015), and a tolerant read keeps it with SACM-XMI-007. SACM-XMI-007's catalog row is aligned to this. `href` values that name no element by a fragment (an empty `href`, `#` alone, an XPointer, white space in the fragment) are not cross-document references: this row reads them or keeps them as preserved content (ADR 0033; XMI 2.5.1 §7.10.2 `URI#id_value`), so that none is left without an owner when the `CrossDocumentHref` entry of LIB-API-011 is removed. A role element in reference form carrying an unqualified `href` (a proxy of a contained element named by an `href`, in this document or another), typed or untyped, under an abstract or a concrete role, is this row's; until then it is refused as not read yet (the maintainer, 2026-11-16)."
source = "XMI 2.5.1 §7.10.2 (p. 23) \"The URI reference must be of the form URI#id_value\"; rules 2l, 2m, 2n (p. 64); D-PRESERVE; ADR 0026"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-015"]
notes = "Found in slice 0042 research. C++ drops cross-document hrefs with a Warning. From verification 0051 (moved here at M3's close): a role element with both `href` and `xmi:idref` takes the first in document order when typed (`role_metadata`) but prefers `xmi:idref` when untyped under an abstract role (`proxy_link`). Both refuse and nothing is lost; pick one rule when this row is built."

