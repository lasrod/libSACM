  "`occurece=\"2024-03-05\"` and `<occurece>2024-03-05</occurece>` on an Event: a strict read keeps it as preserved content of the Event with one SACM-XMI-013 Error at the attribute's name or the element's start tag, `date()` is `None`, and a tolerant write writes it back; a tolerant read reads it as `date()` `2024-03-05` with one SACM-XMI-013 Warning (SACM23-XMI-009). With `date` beside it, a tolerant read holds the `date`. On an Artifact, `occurece` is an ordinary unknown attribute (SACM-XMI-003).",
