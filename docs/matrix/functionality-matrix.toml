[[row]]
id = "SACM23-BASE-004"
area = "BASE"
milestone = "M2"
title = "Descriptions, notes and implementation constraints"
requirement = "Every ModelElement holds its `description`, `implementationConstraint` and `note` children (UtilityElements, §8.7-§8.9, §8.11) as elements with an id and a kind, in document order across roles (D-ORDER), accessed through `SacmElement::descriptions()`, `implementation_constraints()` and `notes()`; several descriptions are kept (D-DESC-MULT) (ADR 0025). A UtilityElement's `content()` is `None` (no `content` child) or a MultiLangString (`<content/>` is empty), and both round-trip. A MultiLangString is written as its role element with one `value` child per LangString, in order and with duplicates; each `value` follows the `name` LangString rules (SACM23-XMI-012, -014). Several `value` children are kept; a second `content` is `RepeatedValue` (SACM23-XMI-021). An `xmi:id` on a `content` element or a `value` is kept by role and position (`content_id()`, `content_value_ids()`), shares the file's id space, is written back and compared (ADR 0024). A UtilityElement has no `name`. A role element with `lang`/`content` attributes or text and no `value` children, and `content=` or text on a UtilityElement, are the C++ shapes of LIB-COMPAT-008: read with a SACM-XMI-012 Warning in tolerant mode, refused as `LegacyShape` in strict mode. They are created by `CreateDescription`, `CreateImplementationConstraint` and `CreateNote` under the LIB-EDIT-001 contract; changing content is LIB-EDIT-008 and removal LIB-EDIT-004/005. An absent `content` gives no finding (the maintainer, 2026-11-14)."
source = "formal/23-05-08 §8.6 (p. 19) \"description: Description[0..1] (composition)\", \"note:Note[0..*] (composition)\", \"implementationConstraint: ImplementationConstraint [0..*] (composition)\"; §8.7 (p. 20) \"content:MultiLangString[0..1] (composition)\"; §8.8, §8.9, §8.11 \"Superclass UtilityElement\"; §8.5 (p. 19); ptc/22-03-13 Base::ModelElement, Base::UtilityElement (content [1..1]); XMI 2.5.1 §7.8.3, §7.8.6 \"Each property that is a composite is represented by an XML element, but not by an XML attribute.\", rule 2b; D-DESC-MULT; D-TEXT-MODEL; D-ORDER; ADR 0012; ADR 0024; ADR 0025"
kind = "model"
status = "verified"
verification = "docs/verification/0040-m2-descriptions-and-gid.md"
depends_on = ["SACM23-BASE-002", "SACM23-BASE-003", "SACM23-XMI-014", "SACM23-XMI-021", "SACM23-XMI-022", "SACM23-XMI-020", "LIB-RT-001", "LIB-EDIT-001"]
notes = "Slice 0040: ADR 0025 (accepted 2026-11-14). A MultiLangString or value `xmi:id` is kept per role and position, as ADR 0024 keeps a name id (this replaces the slice 0025 note that it is reported). Slice 0065: reworded for ExpressionLangString (SACM23-BASE-009); re-check there."
acceptance = [
  "On each readable kind, as root and as child, `<description xmi:id=\"d\"><content><value lang=\"en\" content=\"x\"/></content></description>` reads to a Description `d` with that parent and content `[en:x]`; the same for `note` and `implementationConstraint`; the output reads back equal and writes the same bytes again.",
  "Interleaved `description` d1, `argumentElement` c1, `note` n1, `description` d2, `implementationConstraint` i1 read and write in that order; the per-role accessors return d1, d2 / n1 / i1; two descriptions give no read diagnostic.",
  "A content `[en:a, fr:b, en:a]` keeps three values in order through read, write and read.",
  "States: no `content` child is `None` and writes nothing; `<content/>`, `<content></content>` and content holding only white space, comments or processing instructions are an empty MultiLangString and write `<content/>`; `<content><value/></content>` is one `LangString::default()`; the four absent/empty `lang` × `content` combinations on a `value` round-trip.",
  "`<value><lang>en</lang><content>x</content></value>` reads equal to the attribute form; `lang` as an attribute and an element on one `value` is `RepeatedValue`.",
  "Two `content` children on a Description give `RepeatedValue { property: \"content\" }` in strict mode (tolerant: LIB-COMPAT-001), with both locations.",
  "Types: `xmi:type=\"sacm:Description\"` on `description`, `sacm:MultiLangString` on `content` and `sacm:LangString` on `value` are accepted; a type naming another class in a utility role (`sacm:Note` in `description`, `sacm:Description` in `note`, `sacm:TaggedValue` in `implementationConstraint`), and `sacm:LangString` on `content`, keep that child whole as preserved content of its holder, with SACM-XMI-003 at its start tag (LIB-COMPAT-003); `sacm:ExpressionLangString` on `value` is read (SACM23-BASE-009, since slice 0065); no type attribute is written on any of them, except on a `value` that holds an ExpressionLangString.",
  "Ids: a UtilityElement without `xmi:id` gets `description_<n>` (etc.) with SACM-XMI-004; padded is trimmed (SACM-ID-004); `\"\"` is `InvalidId`; a repeat of any id is `DuplicateId`. An `xmi:id` on `content` and on a `value` is kept at its role and position, written first on its element, and takes part in `DuplicateId`, generation and the edit duplicate check; one that is not an NCName is reported by `validate` (SACM23-VAL-020) with the UtilityElement as the affected id.",
  "Preserved, never dropped, with one SACM-XMI-003 in both modes (LIB-COMPAT-003): a `name` on a UtilityElement, a `description`, `note`, `taggedValue` or `key` inside a Description, an `implementationConstraint` inside a Note, and `sacm:content`, each as preserved content of the UtilityElement at that child's start tag; `sacm:value`, text beside `value` children in `content` (since slice 0049 text in a `content` without `value`, or in a `value`, is a LIB-COMPAT-008 shape), `xml:lang` or `foo` on `content` or `value`, and another child of `content` or of a `value`, each keeping the whole `content` as preserved content of the UtilityElement at the `content` start tag; `foo` or `assertionDeclaration` on a UtilityElement, at the attribute's name.",
  "The shorthand `<content lang=\"en\" content=\"x\"/>`, `<content>x</content>`, `<description content=\"x\"/>` and `<description>x</description>` are LIB-COMPAT-008's C++ shapes (slice 0049): tolerant reads them with SACM-XMI-012, strict refuses them as `LegacyShape`.",
  "`semantic_compare` reports `Content` for None vs empty, a different value order and `lang` absent vs `\"\"`, and `ContentId` / `ContentValueIds` for a different wrapper or value id, each naming the UtilityElement.",
  "Edits: `CreateDescription`, `CreateImplementationConstraint` and `CreateNote` follow LIB-EDIT-001 (ParentNotFound, InvalidParent for a UtilityElement parent, InvalidId, DuplicateId; generated ids `description_1` etc.; `created_ids == [id]`); a document built by them writes, reads back equal and validates with no Error.",
  "SACM23-XMI-001 and SACM23-XMI-016 tests no longer use utility children as unread samples.",
]
tests = [
  "crates/sacm/tests/utility_elements.rs::sacm23_base_004_each_utility_role_reads_on_each_readable_kind_as_root_and_child",
  "crates/sacm/tests/utility_elements.rs::sacm23_base_004_the_fixture_reads_with_every_utility_element_and_round_trips",
