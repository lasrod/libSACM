  "Three descriptions give one finding saying 3; none or one gives no finding.",
  "Through the test seam, every ModelElement kind holding two Descriptions gives exactly one finding affecting it.",
  "Interleaved d1, n1, d2 give one finding; two Notes, two ImplementationConstraints or two TaggedValues give none; a package with one Description whose Claim has two gives one finding, for the Claim only.",
  "Two `CreateDescription` edits on one ArgumentPackage succeed, and `validate` then reports the Warning.",
  "When it is the only finding there is no Error; a strict write succeeds and reads back with both descriptions in order.",
  "The catalog's SACM-MULT-001 severity is \"Error / Warning\" and names SACM23-VAL-011 as the Warning; the `Code::MULTIPLICITY_VIOLATION` doc says so.",
]
tests = [
  "crates/sacm/tests/description_validation.rs::sacm23_val_011_a_claim_with_two_descriptions_reads_without_diagnostic_and_gives_one_warning",
