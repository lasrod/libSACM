acceptance = [
  "A Claim `top` that is the target of two AssertedInferences, the source of a third, and twice the `metaClaim` of a Claim gives five entries, in the stated order. After a `ReorderElements` that swaps the two inferences, their entries swap.",
  "An id nothing references gives none, and so does an id that only preserved content names. A dangling id, and a preserved id a typed end names, give their referrers.",
  "After every successful operation of LIB-EDIT-002's set (moves, copies and deletes included), `referrers(id)` for every id any end holds equals a full scan through `SacmElement::references` in the stated order. The same holds on a document read from XMI.",
