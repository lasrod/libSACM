[[row]]
id = "LIB-API-012"
area = "API"
milestone = "M2"
title = "Public containment queries"
requirement = "The containment table of LIB-API-008 is public on `ElementKind`: whether a kind may contain another, the kinds a kind may contain in a fixed documented order, and whether a kind may be a root (`is_package`). The queries read the same table that insertion and the edit operations use, so they cannot disagree with them. They state what SACM 2.3 admits, not which create operation exists."
source = "User request: Assurance Forge, GitHub issue #60 (2026-11-14); LIB-API-008; ADR 0010 amendment 2"
kind = "api"
status = "verified"
verification = "docs/verification/0046-m2-wasm-and-containment.md"
depends_on = ["LIB-API-008"]
acceptance = [
  "`ElementKind::may_contain(self, child) -> bool` is a `const fn`, `#[must_use]`, and is usable in a `const` item.",
  "For all 1,444 (parent, child) pairs of the 38 kinds, `may_contain` is true for exactly the 339 legal pairs of the containment table spelled out in the test (LIB-API-008's), and equals whether the test-support `insert` of that child under that parent succeeds.",
  "For every create operation in this release under a parent of every kind, `edit::apply` is refused with `InvalidParent` exactly when `may_contain(parent kind, created kind)` is false.",
  "`ElementKind::child_kinds(self)` yields `ElementKind::ALL` filtered by `may_contain(self, _)`, in `ALL` order, without duplicates; the counts over all kinds sum to 339; it is empty for the four UtilityElement kinds, is `[Description, ImplementationConstraint, Note, TaggedValue]` for a Claim, and has 16 kinds for an ArgumentPackage.",
  "`is_package` is true for exactly the 12 kinds `insert(None, ..)` accepts as a root.",
  "The rustdoc of `may_contain` says it states what SACM 2.3 admits, not that a create operation exists for the kind or that an edit will succeed, and links `is_package` for roots; a doctest builds an \"add child\" list with `child_kinds`.",
]
code = ["crates/sacm/src/model/kind.rs", "crates/sacm/src/model/containment.rs", "docs/adr/0010-document-model.md"]
tests = [
  "crates/sacm/tests/containment.rs::lib_api_012_may_contain_is_usable_in_a_const_item",
  "crates/sacm/tests/containment.rs::lib_api_012_may_contain_is_true_for_exactly_the_339_legal_pairs",
  "crates/sacm/tests/containment.rs::lib_api_012_may_contain_agrees_with_insert_for_all_1444_pairs",
  "crates/sacm/tests/containment.rs::lib_api_012_create_operations_refuse_invalid_parent_exactly_when_may_contain_is_false",
  "crates/sacm/tests/containment.rs::lib_api_012_child_kinds_is_all_filtered_by_may_contain_in_all_order",
  "crates/sacm/tests/containment.rs::lib_api_012_child_kinds_is_empty_for_the_four_utility_elements",
  "crates/sacm/tests/containment.rs::lib_api_012_child_kinds_of_a_claim_are_the_four_utility_elements",
  "crates/sacm/tests/containment.rs::lib_api_012_child_kinds_of_an_argument_package_are_its_16_kinds",
  "crates/sacm/tests/containment.rs::lib_api_012_is_package_is_true_for_exactly_the_kinds_insert_accepts_as_roots",
]

[[row]]
id = "LIB-EDIT-013"
area = "EDIT"
milestone = "M2"
title = "Check an operation without applying it"
requirement = "`edit::check(&Document, &Operation)` succeeds exactly when `edit::apply` on the same document would succeed, and otherwise returns the same `EditError`; it never changes the document. `check` and `apply` run the same checks through one code path, so they cannot disagree."
source = "User request: Assurance Forge, GitHub issue #60 (2026-11-14); D-ATOMIC; ADR 0019; ADR 0019 amendment 3 (the maintainer, 2026-11-15)"
kind = "editing"
status = "verified"
verification = "docs/verification/0047-m2-check-and-serde.md"
depends_on = ["LIB-EDIT-002", "LIB-EDIT-008", "LIB-EDIT-009", "LIB-EDIT-010", "LIB-EDIT-012"]
