[[row]]
id = "SACM23-BASE-006"
area = "BASE"
milestone = "M2"
title = "gid"
requirement = "Every element of every kind holds an optional `gid` String exactly as read (`SacmElement::gid() -> Option<&str>`): absent, `\"\"` and any other string are distinct (ADR 0012, ADR 0025). `xmi::read` reads it in both modes, on roots and children, from the unqualified attribute (after attribute-value normalisation) or a `gid` value element (SACM23-XMI-014: no attribute, no element children, nothing trimmed); given twice, in either form, it is `RepeatedValue` (SACM-MULT-001) in strict mode (tolerant: LIB-COMPAT-001). It is not an `xmi:id`: it is in no id space, has no syntax check, and is never trimmed or generated. `xmi::write` writes a present gid as an attribute after `xmi:id`, escaped, `gid=\"\"` for empty and nothing for absent; a character XML 1.0 cannot represent fails the write (`WriteAttribute::Gid`). `semantic_compare` reports `Difference::Gid`. Setting it is LIB-EDIT-008; uniqueness is SACM23-VAL-002."
source = "formal/23-05-08 §8.2 (p. 18) \"gid:String[0..1] - a unique identifier that is unique within the scope of the model instance\"; ptc/22-03-13 Base::SACMElement.gid (String, [0..1]); XMI 2.5.1 §7.8.4 (p. 18), rule 2h (p. 63); ADR 0012; ADR 0021 amendment 1; ADR 0025"
kind = "model"
status = "verified"
verification = "docs/verification/0040-m2-descriptions-and-gid.md"
depends_on = ["SACM23-BASE-003", "SACM23-XMI-004", "SACM23-XMI-014", "SACM23-XMI-021", "LIB-RT-001"]
notes = "Slice 0037: read in the attribute and the element form by SACM23-XMI-014's rules; the value is a String, exactly. Slice 0045: the gid write-failure test now also lives under LIB-EDIT-008 (`SetGid`); the old test is kept; comments only."
acceptance = [
  "On an AssuranceCasePackage, an ArgumentPackage, a Claim and each utility kind: `gid=\"g\"`, `gid=\"\"`, `<gid>g</gid>`, `<gid/>`, `<gid>` with CDATA or character references, `gid=\"  g \"` and `<gid> g </gid>` (spaces kept) read and round-trip; no gid stays absent.",
  "`gid=\"a&#10;b\"` reads `\"a\\nb\"`, a literal newline in the attribute reads as a space; the writer escapes `&`, `<`, `>`, `\"`, TAB, LF and CR and the value reads back equal; `WriteAttribute::Gid` exists for a gid holding a character XML 1.0 cannot represent; no read input can hold one, so the write-failure test belongs to LIB-EDIT-008, which first sets a gid.",
  "The attribute and the element, or two elements, give `RepeatedValue { property: \"gid\" }` in strict mode (tolerant: LIB-COMPAT-001), with every location.",
  "A `gid` equal to an `xmi:id` is accepted; two elements with the same gid both read.",
  "Preserved, with one SACM-XMI-003 in both modes (LIB-COMPAT-003): `sacm:gid` as attribute or element, at it; `gid` on or in `name`, `content`, `key` or `value`, which keeps the whole `name`, `content` or `key` as preserved content of its owner, at its start tag; `<gid xmi:id=\"x\">` and `<gid><b/></gid>`, at the `gid` start tag; `<gid xsi:nil=\"true\"/>` reads as an absent gid (SACM23-XMI-026, slice 0049).",
  "`semantic_compare` reports absent vs `\"\"` vs `\"g\"` as `Gid`, after `Parent`.",
  "SACM23-XMI-001 and SACM23-XMI-016 tests no longer use `gid` as an unread sample.",
]
tests = [
  "crates/sacm/tests/gid.rs::sacm23_base_006_every_gid_form_reads_exactly_on_every_kind_and_round_trips",
  "crates/sacm/tests/gid.rs::sacm23_base_006_the_element_form_may_appear_anywhere_among_the_siblings",
  "crates/sacm/tests/gid.rs::sacm23_base_006_the_fixture_reads_with_its_gids_and_round_trips",
  "crates/sacm/tests/gid.rs::sacm23_base_006_a_gid_attribute_is_read_after_attribute_value_normalisation",
  "crates/sacm/tests/gid.rs::sacm23_base_006_the_writer_escapes_markup_tab_lf_and_cr_and_the_gid_reads_back_equal",
  "crates/sacm/tests/gid.rs::sacm23_base_006_a_gid_given_twice_is_repeated_value_with_every_location",
  "crates/sacm/tests/gid.rs::sacm23_base_006_a_gid_is_not_an_id_and_two_elements_may_share_one",
  "crates/sacm/tests/gid.rs::sacm23_base_006_a_gid_has_no_syntax_check_and_is_never_trimmed",
  "crates/sacm/tests/gid.rs::sacm23_base_006_a_gid_in_the_wrong_place_or_form_is_preserved_at_that_construct",
  "crates/sacm/tests/gid.rs::sacm23_base_006_absent_empty_and_other_gids_are_each_one_gid_difference",
  "crates/sacm/tests/gid.rs::sacm23_base_006_a_gid_difference_comes_after_parent_and_before_the_name_and_content",
  "crates/sacm/tests/gid.rs::sacm23_base_006_a_gid_is_written_directly_after_xmi_id_and_before_the_class_attributes",
]
