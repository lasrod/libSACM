[[row]]
id = "SACM23-ARG-002"
area = "ARG"
milestone = "M1"
title = "Claim"
requirement = "Claim (§11.11, superclass Assertion; no features of its own) is represented with the Assertion attribute `assertionDeclaration: AssertionDeclaration [1] = asserted` (§11.10). Every element of an Assertion kind (Claim and the five asserted-relationship kinds) holds exactly one AssertionDeclaration: `asserted` until another is set, and any of the six literals once set. There is no absent state: the property is `[1]` with a metamodel default, and XMI 2.5.1 §9.4.1 leaves default values unserialized, so an omitted value means `asserted`, as in C++. Elements of any other kind have no assertionDeclaration. Homes: containment is LIB-API-008; `metaClaim` is SACM23-ARG-004; the ModelElement and SACMElement features are SACM23-BASE-003 to SACM23-BASE-008; XMI reading and writing is SACM23-XMI-017; the element form is SACM23-XMI-014; `xsi:type` is SACM23-XMI-006; unknown literals are SACM23-VAL-006; the asCited derivation is SACM23-VAL-019; creation is LIB-EDIT-001; editing is LIB-EDIT-008; comparison is LIB-RT-001."
source = "formal/23-05-08 §11.11 (p. 39): \"Superclass Assertion\"; §11.10 (p. 39): \"assertionDeclaration:AssertionDeclaration[1] = asserted - the declaration indicating the state of the Assertion.\"; §11.8 (p. 38): \"asserted - the default enumeration literal, indicating that an Assertion is asserted.\"; ptc/22-03-13 Argumentation::Claim, Argumentation::Assertion.assertionDeclaration (defaultValue InstanceValue -> `asserted`); XMI 2.5.1 §9.4.1 (p. 57): \"Properties whose values are the default values are not serialized except there the value is being used to specify the default itself\"; assurance-forge libs/sacm model/argumentation.h Assertion (`assertion_declaration_ = AssertionDeclaration::Asserted`), commands/commands.cpp SetAssertionDeclaration"
kind = "model"
status = "verified"
verification = "docs/verification/0018-m1-argument-package-claim.md"
depends_on = ["SACM23-ARG-001", "SACM23-ARG-003"]
acceptance = [
  "A Claim inserted through the seam has declaration `asserted` (§11.10 `= asserted`; the ptc `defaultValue`).",
  "Setting each of the six literals on a Claim reads back that literal, and a later set replaces an earlier one (`NeedsSupport` then `Asserted` reads `Asserted`).",
  "Over `ElementKind::ALL`, an element reports a declaration (`asserted` by default) exactly when its kind `is_a(AbstractClass::Assertion)`: Claim and the five Asserted* kinds. Every other kind reports none, ArgumentPackage, ArgumentReasoning, ArtifactReference and Note included.",
  "The setter refuses an unknown id, and an element of a kind that is not an Assertion (ArgumentReasoning, ArtifactReference, ArgumentPackage, Note); the error names the id, and the kind where there is one, and every element's declaration is as it was before.",
  "Elements are independent: setting `defeated` on Claim c1 leaves its sibling c2 `asserted`; a `clone()` keeps c1 `defeated`; setting `axiomatic` on the clone leaves the original c1 `defeated`.",
  "The declaration follows the kind, not the container: a Claim inside an ArtifactPackage (ADR 0014) also defaults to `asserted` and accepts all six literals.",
  "`SetAssertionDeclarationError` (test-support) follows ADR 0011: `#[non_exhaustive]`; `Clone + Eq + Debug + Error + Send + Sync + 'static`, checked statically; it boxes and downcasts as `dyn Error + Send + Sync`; each variant's `Display` is one lowercase line without trailing punctuation, with the id quoted and escaped (an id containing a line break stays one line), e.g. `the document has no element \"c9\"` and `element \"r1\" of kind ArgumentReasoning is not an Assertion`; `source()` is `None`; the setter refuses an empty, NUL-bearing, non-ASCII or 1 MiB unknown id without panicking.",
]
code = ["crates/sacm/src/model/document.rs", "crates/sacm/src/model/argumentation.rs"]
tests = [
