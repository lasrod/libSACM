[[row]]
id = "SACM23-VAL-012"
area = "VAL"
milestone = "M2"
title = "ArgumentPackage homogeneity"
requirement = "For each plain ArgumentPackage with a plain ArgumentPackage among its `argumentElement` children, `validation::validate` reports each other `argumentElement` child that is not of an ArgumentPackage kind as one SACM-PKG-001 Error (`Code::PACKAGE_CONTENT_INVALID`), citing clause 11.4 and affecting the package, then the child. A contained ArgumentPackageInterface or ArgumentPackageBinding neither triggers the rule nor is reported (D-PKG-HOMOG); UtilityElement children and `name` are not argumentation content; only a plain ArgumentPackage is checked as an owner. The rule is not recursive across levels: each package is checked for its own children. Reading, editing and both saves do not refuse it (D-VAL-LAYER, ADR 0035 D4)."
source = "formal/23-05-08 §11.4 (p. 36) \"ArgumentPackages elements can also be nested.\" and Constraints \"If an ArgumentPackage has nested ArgumentPackages, then it is only allowed to contain ArgumentPackages.\"; §11.6 (pp. 37-38) Superclass ArgumentPackage, \"An ArgumentPackageInterface resides insided the ArgumentPackage to which it refers.\"; ptc/22-03-13 Argumentation::ArgumentPackage argumentElement (composite, 0..*; no OCL); specification defect D4; D-PKG-HOMOG; D-SEV; D-VAL-LAYER; assurance-forge libs/sacm validation/validate.cpp (homogeneity), #334"
kind = "validation"
status = "verified"
verification = "docs/verification/0041-m2-validation-rules.md"
depends_on = ["SACM23-ARG-001", "SACM23-VAL-018", "LIB-COMPAT-007"]
notes = "The interface/binding exception is exercised by SACM23-ARG-014 and SACM23-ARG-015. Slice 0041: the interface/binding exemption is tested now through the test seam; read-path coverage comes later with SACM23-ARG-014 and SACM23-ARG-015. Slice 0066: the exemption is covered on the read path (SACM23-ARG-014, SACM23-ARG-015)."
acceptance = [
  "ArgumentPackage `p` holding ArgumentPackage `q` and Claim `c`, as a root and inside an AssuranceCasePackage, reads in both modes; `validate` gives one SACM-PKG-001: Error, requirement SACM23-VAL-012, clause `11.4`, no location, affected `[p, c]`, the message naming `p`, `q` and `Claim \"c\"`; the same whichever child comes first.",
  "`p{q, c1, c2}` gives two findings `[p, c1]` and `[p, c2]`; `p{q, r, c}` gives one.",
  "No finding for `p{q, r}`, `p{c}`, an empty `p`, or `p{q{c}}`; `p{q{r, c}}` gives exactly one finding `[q, c]`.",
  "`p` holding all four utility kinds and `q` gives no finding; adding a Claim gives one, for the Claim only.",
  "Through the test seam: `p{ArgumentPackageInterface i, c}`, `p{ArgumentPackageBinding b, c}` and `p{q, i, b}` give no finding; `p{q, i, c}` gives one, `[p, c]`; an interface or binding owner holding a plain package and a Claim gives none.",
  "Through the seam, `p{q, X}` for each non-package ArgumentationElement kind admitted in `argumentElement` gives one finding whose message names X's kind.",
  "An ArtifactPackage or AssuranceCasePackage owner is out of scope.",
  "`CreateClaim` into a package that nests one, and `CreateArgumentPackage` into a package holding a Claim, succeed; `validate` then reports.",
  "A strict and a tolerant write keep every child in order and round-trip.",
  "`Code::PACKAGE_CONTENT_INVALID` is SACM-PKG-001, and the catalog row names it and SACM23-VAL-012.",
]
tests = [
  "crates/sacm/tests/package_homogeneity_validation.rs::sacm23_val_012_a_package_nesting_a_package_and_holding_a_claim_is_one_error",
  "crates/sacm/tests/package_homogeneity_validation.rs::sacm23_val_012_the_fixture_gives_one_error_on_the_package_and_its_claim",
  "crates/sacm/tests/package_homogeneity_validation.rs::sacm23_val_012_each_other_child_is_its_own_finding_and_other_packages_are_not",
  "crates/sacm/tests/package_homogeneity_validation.rs::sacm23_val_012_homogeneous_packages_and_lower_levels_give_no_finding",
  "crates/sacm/tests/package_homogeneity_validation.rs::sacm23_val_012_each_package_is_checked_for_its_own_children",
  "crates/sacm/tests/package_homogeneity_validation.rs::sacm23_val_012_utility_children_do_not_count_and_a_claim_beside_them_does",
  "crates/sacm/tests/package_homogeneity_validation.rs::sacm23_val_012_interfaces_and_bindings_neither_trigger_nor_are_reported",
  "crates/sacm/tests/package_homogeneity_validation.rs::sacm23_val_012_an_interface_or_binding_owner_is_not_checked",
  "crates/sacm/tests/package_homogeneity_validation.rs::sacm23_val_012_each_non_package_argumentation_kind_beside_a_package_is_one_finding",
  "crates/sacm/tests/package_homogeneity_validation.rs::sacm23_val_012_artifact_and_assurance_case_package_owners_are_out_of_scope",
  "crates/sacm/tests/package_homogeneity_validation.rs::sacm23_val_012_edits_that_mix_the_content_succeed_and_validate_reports",
  "crates/sacm/tests/package_homogeneity_validation.rs::sacm23_val_012_a_strict_and_a_tolerant_write_keep_every_child",
  "crates/sacm/tests/package_homogeneity_validation.rs::sacm23_val_012_package_content_invalid_is_sacm_pkg_001_and_its_catalog_row_names_it",
]
code = ["crates/sacm/src/validation/homogeneity.rs", "crates/sacm/src/diagnostic.rs"]

[[row]]
id = "SACM23-VAL-016"
area = "VAL"
milestone = "M2"
title = "Relationship end typing per kind"
requirement = "`validation::validate` reports one SACM-REF-002 Error for each distinct id that names an ArgumentAsset other than an ArtifactReference in the `source` of an AssertedEvidence (§11.15 OCL), or in the `source` or `target` of an AssertedArtifactSupport (§11.17) or AssertedArtifactContext (§11.18) (D-SEV), with requirement SACM23-VAL-016, clause `11.15`, `11.17` or `11.18`, affected `[relationship, id]`, no location (ADR 0028). An id that dangles, or names a kind that is no ArgumentAsset, gives only SACM-REF-001 or SACM23-VAL-004's SACM-REF-002. AssertedEvidence's target is not narrowed; §11.14 and §11.16 add nothing (ADR 0027). A create does not refuse these."
source = "formal/23-05-08 §11.15 (p. 41) \"The source of AssertedEvidence relationships must be ArtifactReference. OCL: self.source->forall(s|s.oclIsTypeOf(ArtifactReference))\"; §11.17 (p. 41) \"The source and target of AssertedArtifactSupport must be of type ArtifactReference.\"; §11.18 (p. 42) \"The source and target of AssertedArtifactContext must be of type ArtifactReference.\"; D-SEV; D-VAL-LAYER; ADR 0027; ADR 0028; assurance-forge validate.cpp:122-183"
kind = "validation"
status = "verified"
verification = "docs/verification/0044-m2-artifact-relationships.md"
depends_on = ["SACM23-ARG-008", "SACM23-ARG-009", "SACM23-ARG-010", "SACM23-ARG-011", "SACM23-ARG-012", "SACM23-VAL-004"]
notes = "Slice 0043: §11.14 (AssertedInference) and §11.16 (AssertedContext) have no Constraints section, so this row adds no checks for them (ADR 0027)."
acceptance = [
  "An AssertedEvidence with source `c1` (a Claim) gives one finding, clause `11.15`, affected `[e, c1]`; its target is never checked here.",
  "Sources `\"r1 c1 c1\"` give one finding, for c1.",
  "An AssertedArtifactSupport with source `r1` and target `c1` gives one finding (clause `11.17`); source `c1` and target `r2` gives one; both Claims give two; the same for AssertedArtifactContext with clause `11.18`.",
  "AssertedInference and AssertedContext with ArtifactReference or Claim ends give no finding here.",
  "A dangling source gives only SACM-REF-001; a Note source gives only SACM23-VAL-004; a missing target gives only SACM23-VAL-005.",
  "A strict write keeps it; `CreateAssertedEvidence` with a Claim source succeeds.",
]
tests = [
  "crates/sacm/tests/reference_typing.rs::sacm23_val_016_an_asserted_evidence_from_a_claim_is_one_error_with_clause_11_15",
  "crates/sacm/tests/reference_typing.rs::sacm23_val_016_a_repeated_claim_source_is_one_finding",
  "crates/sacm/tests/reference_typing.rs::sacm23_val_016_an_asserted_artifact_support_needs_artifact_references_at_both_ends_clause_11_17",
  "crates/sacm/tests/reference_typing.rs::sacm23_val_016_an_asserted_artifact_context_needs_artifact_references_at_both_ends_clause_11_18",
  "crates/sacm/tests/reference_typing.rs::sacm23_val_016_inference_and_context_with_artifact_reference_or_claim_ends_give_no_finding",
  "crates/sacm/tests/reference_typing.rs::sacm23_val_016_a_dangling_note_or_missing_end_gives_only_the_generic_finding",
  "crates/sacm/tests/reference_typing.rs::sacm23_val_016_a_strict_write_keeps_it_and_create_asserted_evidence_from_a_claim_succeeds",
  "crates/sacm/tests/reference_typing.rs::sacm23_val_016_the_invalid_fixture_gives_one_error_on_its_evidence",
]
code = ["crates/sacm/src/validation/relationships.rs"]

[[row]]
id = "LIB-DIAG-002"
area = "DIAG"
milestone = "M2"
title = "Diagnostic catalog stays in sync"
requirement = "Every code the crate can construct is a `Code` associated constant, and the catalog's live rows are exactly those constants. A row of `docs/sacm/diagnostics.md` is live when its Meaning names the `` `Code::NAME` `` constant whose text is that row's code; a row naming none is reserved. A test checks both directions, and the catalog's Status note states this rule instead of a hand-kept list of live codes."
source = "D-DIAG; docs/sacm/diagnostics.md (\"Adding a code: append the row here in the same change that adds its constant to the crate\"); ADR 0011"
kind = "quality"
status = "verified"
verification = "docs/verification/0041-m2-validation-rules.md"
depends_on = ["LIB-DIAG-001"]
acceptance = [
  "The test collects the crate's codes by scanning `crates/sacm/src/**/*.rs`: every `Code::from_static(\"…\")` literal is the value of a `pub const NAME: Code` in `diagnostic.rs`, so no code is built elsewhere, and each `(NAME, text)` is checked against `Code::NAME.as_str()`.",
  "It parses every catalog table row `| SACM-<AREA>-<NNN> | <severity> | <meaning> |`; each code has exactly one row.",
  "Crate to catalog: every constant's text has a row, and that row names `` `Code::NAME` `` for it.",
  "Catalog to crate: every `` `Code::NAME` `` named in a row is a crate constant whose text equals that row's code; a row naming none is reserved and its code is not a constant.",
  "The check fails, naming the code and the row, for a constant with no row or a row not naming it, a row naming an unknown constant, a row naming another code's constant, and two rows for one code (shown by a pure helper on small synthetic catalogs).",
  "It passes with the live codes listed in its test: 42 after slice 0065.",
]
tests = [
  "crates/sacm/tests/diagnostic_catalog.rs::lib_diag_002_a_tuple_construction_of_code_in_diagnostic_rs_is_a_problem",
  "crates/sacm/tests/diagnostic_catalog.rs::lib_diag_002_every_code_the_crate_builds_is_a_constant_of_diagnostic_rs",
  "crates/sacm/tests/diagnostic_catalog.rs::lib_diag_002_the_catalog_and_the_crate_agree_in_both_directions",
  "crates/sacm/tests/diagnostic_catalog.rs::lib_diag_002_the_status_note_states_the_rule_and_lists_no_code",
  "crates/sacm/tests/diagnostic_catalog.rs::lib_diag_002_a_matching_catalog_with_a_reserved_row_has_no_problem",
  "crates/sacm/tests/diagnostic_catalog.rs::lib_diag_002_a_constant_with_no_row_is_named_with_its_code",
  "crates/sacm/tests/diagnostic_catalog.rs::lib_diag_002_a_row_not_naming_its_constant_is_named_with_its_code_and_line",
  "crates/sacm/tests/diagnostic_catalog.rs::lib_diag_002_a_row_naming_an_unknown_constant_is_named_with_its_code_and_line",
  "crates/sacm/tests/diagnostic_catalog.rs::lib_diag_002_a_row_naming_another_codes_constant_is_named_with_both_codes",
  "crates/sacm/tests/diagnostic_catalog.rs::lib_diag_002_two_rows_for_one_code_are_named_with_the_code_and_both_lines",
  "crates/sacm/tests/diagnostic_catalog.rs::lib_diag_002_a_malformed_row_is_named_with_its_line",
  "crates/sacm/tests/diagnostic_catalog.rs::lib_diag_002_the_scan_finds_constants_and_codes_built_any_other_way",
  "crates/sacm/tests/diagnostic_catalog.rs::lib_diag_002_a_non_constant_construction_in_diagnostic_rs_is_a_problem",
]
code = ["docs/sacm/diagnostics.md", "crates/sacm/src/diagnostic.rs"]
notes = "Slice 0042: its constant table gains REF_DANGLING, CITATION_INVALID and ABSTRACT_FORM_INVALID (19 live codes); re-check there. Slice 0044: its constant lists gain `Code::REF_WRONG_TYPE` (SACM-REF-002, SACM23-VAL-004); re-check there. Slice 0045: its constant lists gain `Code::CMD_FEATURE_NOT_APPLICABLE` and `CMD_INVALID_ORDER` (SACM-CMD-008/009, ADR 0029); re-check there. Slice 0063: its constant lists gain XMI_NAMESPACE_NOT_PINNED, XMI_WRAPPER_NAMESPACE, XMI_STRICT_SAVE_INVALID, XML_ENCODING_NOT_READ, XML_UNREPRESENTABLE_CHARACTER and PARSER_LIMIT (41 live codes); re-check there."

