kind = "quality"
status = "out-of-scope"
notes = "Retired 2026-11-09 (slice 0012, ADR 0006 amendment 2): harness hardening beyond what protects the library's users; CI configuration is protected by branch protection and review."

[[row]]
id = "LIB-QA-015"
area = "QA"
milestone = "M0"
title = "The cargo-deny action's image is reviewed or replaced"
requirement = "The cargo-deny gate's tools are fixed as well as its action. cargo-deny-action is a docker action whose image is built at run time: its Dockerfile downloads the cargo-deny release asset by tag without a checksum, and installs unpinned `apk` packages. Its entrypoint also runs `rustup toolchain install` inside the container at run time. Either review and pin those downloads, or replace the action with a checksum-verified install of cargo-deny."
source = "Verification 0009 round 1, new class"
kind = "quality"
status = "out-of-scope"
notes = "Retired 2026-11-09 (slice 0012, ADR 0006 amendment 2): harness hardening beyond what protects the library's users; CI configuration is protected by branch protection and review."

[[row]]
id = "LIB-QA-016"
area = "QA"
milestone = "M0"
title = "Repository configuration cannot weaken the gates"
requirement = "A check fails when repository configuration outside `ci.yml` weakens a gate: `.cargo/config.toml` (`build.rustflags`, `build.rustdocflags`, `--cap-lints`, aliases that shadow `test`, `clippy` or `doc`), `rust-toolchain.toml`, `clippy.toml` or `rustfmt.toml`, or a cargo `[alias]` that shadows an external subcommand CI relies on (`nextest`, `mutants`), which cargo only warns about (verification 0011 round 1)."
source = "Verification 0009 round 1, new class"
kind = "quality"
status = "out-of-scope"
notes = "Retired 2026-11-09 (slice 0012, ADR 0006 amendment 2): harness hardening beyond what protects the library's users; CI configuration is protected by branch protection and review."

[[row]]
id = "LIB-TOOL-016"
area = "TOOL"
milestone = "M0"
title = "Test scanner recognises more skip and compile-out forms"
requirement = "The traced-test scanner treats these as not running: Rust tests compiled out by `#[cfg(any())]` or `#[cfg(FALSE)]`-style predicates; a prelude-qualified `#[::core::prelude::v1::ignore]` or `#[std::prelude::v1::ignore]`; Python tests under a module-level `pytestmark = pytest.mark.skip...` or `__unittest_skip__`; and `@pytest.mark.xfail`. It also reads a `#` at the end of a line whose `[` is on the next line (a `#` line followed by a `[test]` line), and a `fn` whose name is on the next line."
source = "Verification 0006 round 1 (Low and Info findings)"
kind = "tooling"
status = "out-of-scope"
notes = "Retired 2026-11-09 (slice 0012, ADR 0006 amendment 2): harness hardening beyond what protects the library's users; CI configuration is protected by branch protection and review."

[[row]]
id = "LIB-TOOL-017"
area = "TOOL"
milestone = "M0"
title = "Cited tests are in files that run"
requirement = "A test citation is evidence only if its file is actually built and run. These citations give a problem: a Rust test file that no target or module tree includes, such as a stray `crates/x.rs` or a module file no `mod` reaches, and a Python test file outside the unittest discovery root that CI runs (`.claude/hooks`)."
source = "Verification 0006 round 2 (Info, new class)"
kind = "tooling"
status = "out-of-scope"
notes = "Retired 2026-11-09 (slice 0012, ADR 0006 amendment 2): harness hardening beyond what protects the library's users; CI configuration is protected by branch protection and review."

[[row]]
id = "LIB-TOOL-018"
area = "TOOL"
milestone = "M0"
title = "Verdict-like text in any written form is reported"
requirement = "A line outside every hidden block, other than a counted candidate, whose rendered text starts with `row verdict` is a problem, matched case-insensitively with an optional colon and whitespace runs collapsed. Removed before matching: footnote labels (`[^1]:`), a leading table pipe (`|`), list markers, `#` heading markers, `\\` escapes, task boxes and `_`/`*` emphasis, or the parser's text events are used instead. C0 control characters other than tab, LF and CRLF, and U+2028, U+2029 and U+0085, are refused like a lone CR. The D12 differential test also compares the records it now adjudicates against a second reference (comrak) instead of skipping them, and checks look-alike visibility against a recorded corpus of GitHub renderings, so CI makes no network calls (verification 0007 round 3)."
source = "Verification 0007 round 2 (Low: rest of F4; Info: D12 adjudicated records)"
kind = "tooling"
status = "out-of-scope"
notes = "Retired 2026-11-09 (slice 0012, ADR 0006 amendment 2): harness hardening beyond what protects the library's users; CI configuration is protected by branch protection and review."

[[row]]
id = "LIB-TOOL-019"
area = "TOOL"
milestone = "M0"
title = "The write guard blocks on every launch failure"
requirement = "Every way the write-guard hook can fail to judge a call blocks the write: a hook timeout, an uncaught crash before the guard decides, and an interpreter that starts but cannot run the guard (for example Python 2). Options: `onFailure: \"block\"` in the hook settings (Claude Code 2.1.295 or later), and a probe that requires Python 3.9 or later. The hook CI job fails on any runtime skip, and the launch-path tests also run the command under `sh -c`, the shell Claude Code uses on Linux and macOS."
source = "Verification 0008 round 1 (follow-ups)"
kind = "tooling"
status = "out-of-scope"
notes = "Retired 2026-11-09 (slice 0012, ADR 0006 amendment 2): harness hardening beyond what protects the library's users; CI configuration is protected by branch protection and review."

