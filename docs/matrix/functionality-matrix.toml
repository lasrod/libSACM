[[row]]
id = "SACM23-ART-002"
area = "ART"
milestone = "M3"
title = "Date-typed attributes"
requirement = "The four attributes formal/23-05-08 types `date`, Artifact `date` (§12.7), Event `date` (§12.9) and Activity `startTime` and `endTime` (§12.11), are each held as an optional string exactly as written: `SacmElement::date()` (Artifact and Event), `start_time()` and `end_time()` (D-DATE). SACM 2.3 defines no lexical form for `date`, ptc/22-03-13 types them by a link into a MagicDraw library (spec defect D17), and the SACM XML Schema the XMI rules produce types them `xsd:string`, so every value, `\"\"` included, is read in both modes with no diagnostic and written back exactly; nothing parses, trims or normalises it. Each is read from its XML attribute or its value element (SACM23-XMI-014), `xsi:nil` included (SACM23-XMI-026); given twice it is `RepeatedValue` (SACM-MULT-001; tolerant: LIB-COMPAT-001), and on a kind that lacks it, it is preserved content (SACM-XMI-003). Export writes the attribute form after the element's flags and references. `edit::SetDate`, `SetStartTime` and `SetEndTime` set or remove them, and `semantic_compare` compares them exactly (`Difference::Date`, `StartTime`, `EndTime`)."
source = "formal/23-05-08 §4 (p. 6) \"Attribute: A feature of a meta-element with a primitive type, such as integer, real, text, boolean, or date.\"; §12.7 (p. 48) \"date: date[0..1] - the date on which the artifact was created.\"; §12.9 (p. 48) \"date: date[0..1] - the date on which the Event occurred.\"; §12.11 (p. 49) \"startTime: date[0..1] - time when the activity started.\", \"endTime: date[0..1] - time when the activity ended.\"; ptc/22-03-13 Artifact::Artifact.date, Artifact::Event.occurece, Artifact::Activity.startTime and endTime (type `UML_Standard_Profile.mdzip#_be00301_1073305590699_364818_1`, lower 0, no upper; no org.omg.xmi tags); XMI 2.5.1 §8.2.1 rule 4d (p. 50) \"The type is \\\"xsd:string\\\" for simple properties, the name of an enumeration for enumerated properties, or the value of the org.omg.xmi.schemaType tag, if present.\", rule 4j (p. 51), §7.11.6 (p. 35) \"The dateCreated attribute of the CityModel class has type string. This is because Date is not in the set of MOF primitive datatypes.\"; §7.8.4 (pp. 17-18); formal/23-05-08 §2.4 (p. 4); D-STRICT; D-TEXT-MODEL; D-DATE; spec defect D17; ADR 0034 amendment 1"
kind = "model"
status = "verified"
verification = "docs/verification/0055-m3-artifact-assets.md"
code = ["crates/sacm/src/model/document.rs", "crates/sacm/src/model/kind.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/output.rs", "crates/sacm/src/xmi/refusal.rs", "crates/sacm/src/compare.rs", "crates/sacm/src/xmi.rs", "crates/sacm/src/edit/set.rs"]
depends_on = ["SACM23-ART-001", "SACM23-XMI-014", "SACM23-XMI-021", "SACM23-XMI-026"]
tests = [
  "crates/sacm/tests/artifact_dates.rs::sacm23_art_002_each_date_attribute_reads_verbatim_in_both_modes_with_no_diagnostic",
  "crates/sacm/tests/artifact_dates.rs::sacm23_art_002_the_element_form_and_xsi_nil_read_equal_to_the_attribute_form",
  "crates/sacm/tests/artifact_dates.rs::sacm23_art_002_values_with_markup_and_line_breaks_are_escaped_and_round_trip_exactly",
  "crates/sacm/tests/artifact_dates.rs::sacm23_art_002_a_date_given_twice_is_a_repeated_value_and_tolerant_keeps_the_first",
  "crates/sacm/tests/artifact_dates.rs::sacm23_art_002_a_date_attribute_on_a_kind_without_it_or_a_malformed_value_element_is_preserved",
  "crates/sacm/tests/artifact_dates.rs::sacm23_art_002_semantic_compare_reports_date_start_time_and_end_time_exactly",
  "crates/sacm/tests/artifact_dates.rs::sacm23_art_002_set_date_start_time_and_end_time_set_remove_and_refuse_in_order",
  "crates/sacm/tests/artifact_dates.rs::sacm23_art_002_a_qualified_date_attribute_is_preserved_and_not_read",
  "crates/sacm/tests/artifact_dates.rs::sacm23_art_002_a_preserved_value_element_is_no_occurrence_so_a_later_one_is_read",
  "crates/sacm/tests/artifact_dates.rs::sacm23_art_002_string_attributes_are_written_before_preserved_attributes",
]
acceptance = [
  "On an Artifact (`date`), an Event (`date`) and an Activity (`startTime`, `endTime`), each of `2024-03-01`, `2024-03-01T09:30:00Z`, `2024-03-01T09:30:00.250+01:00`, `-0044-03-15`, `2024-02-30`, `spring 2024`, ` 2024-03-01 ` and `\"\"` reads, in both modes and with no diagnostic, as exactly that string; an absent attribute is `None`; `validate` reports nothing about any of them.",
  "The element form (`<date>2024-03-01</date>`, also with CDATA, a comment or a character reference inside) reads equal to the attribute form; `<date xsi:nil=\"true\"/>` reads as absent and counts as given; output writes the attribute form after `abstractForm` (Artifact: `version` then `date`; Activity: `startTime` then `endTime`), and each element-form input writes byte-identical to its attribute-form twin.",
  "A value holding `&`, `<`, `\"`, TAB, LF and CR (`date=\"a&amp;b&#9;c&#10;d\"`) is written escaped and reads back to the same string; read, tolerant write, read gives `==` and the same bytes on a second write.",
  "An attribute plus a value element, or two value elements, are `RepeatedValue { property }` naming every location, with `location()` the second, in strict mode; a tolerant read keeps the first, preserves the later one and reports one SACM-MULT-001 Warning.",
  "On a kind that lacks it (`date` on a Technique, an Activity, a Resource, a Property; `startTime` on an Artifact or an Event; `<endTime>` on a Claim), the attribute or value element is preserved content of its element with one SACM-XMI-003 (Error strict, Warning tolerant), and the accessor is `None`. A value element with an attribute other than `xsi:nil`, or with an element child, is preserved whole with one SACM-XMI-003; `<sacm:date>` is preserved; `<xmi:date>` is `Unsupported` (SACM23-XMI-019).",
  "`SetDate::new(element, value)` / `SetDate::remove(element)` on an Artifact and an Event, and `SetStartTime` / `SetEndTime` on an Activity, hold any string exactly; `changed_ids` is `[element]` exactly when the value changes; an unknown element is `ElementNotFound` (SACM-CMD-001), then a kind that lacks the attribute is `FeatureNotApplicable` (SACM-CMD-008) naming `date`, `startTime` or `endTime`. A value holding U+0001 is accepted, and `xmi::write` then refuses it with `WriteAttribute::Date` (`StartTime`, `EndTime`), checked after `Gid` and `Version` and before `NameLang`.",
  "`semantic_compare` reports one `Difference::Date`, `StartTime` or `EndTime` for a pair differing only there, compared exactly (`2024-03-01` against `2024-03-01 `, absent against `\"\"`), after `KeyValueIds`; `Display` is e.g. `element \"released\" differs in date: \"2024-03-05\" on the left, no date on the right`.",
]

[[row]]
id = "SACM23-ART-003"
area = "ART"
milestone = "M3"
title = "Property"
requirement = "Property (§12.8) is read and written in the composite role `property : Property [0..*]` of every ArtifactAsset this release reads (Property, Technique, Participant, Artifact, Resource, Activity, Event and ArtifactAssetRelationship: SACM23-ART-004 to -010), untyped or typed `sacm:Property`, and typed in an ArtifactPackage's `artifactElement`. `SacmElement::properties()` lists an asset's `property` children in document order; a Property held directly in an ArtifactPackage is a child of the package, not a property of it. A `property` element typed as another class, or under an element that is not an ArtifactAsset, is preserved content (SACM-XMI-003). `edit::CreateProperty` creates one where the containment table admits it."
source = "formal/23-05-08 §12.6 and §12.8 (\"Property enables the specification of the characteristics of an Artifact\"); ptc/22-03-13 Artifact::ArtifactAsset.property (`property : Property [0..*]`, composite), Artifact::Property; ADR 0034"
kind = "model"
status = "verified"
verification = "docs/verification/0052-m3-artifact-basics.md"
code = ["crates/sacm/src/model/document.rs", "crates/sacm/src/edit/artifact.rs", "crates/sacm/src/edit.rs"]
depends_on = ["SACM23-ART-001"]
acceptance = [
  "`property` is read untyped or typed `sacm:Property` under each of the eight ArtifactAsset kinds, nested three deep, and typed in `artifactElement`, in both modes; a `property` typed as another class, and a `property` under a non-asset, are each kept as preserved content with one SACM-XMI-003.",
  "`property` children are written without `xmi:type`; `properties()` lists them in order, and is empty for a Property held directly in an ArtifactPackage's `artifactElement` and for every kind that is not an ArtifactAsset.",
  "`CreateProperty::new(parent, name)`: legal parents are Property, Technique, Participant, Artifact, Resource, Activity, Event and ArtifactAssetRelationship (role `property`; under an Artifact tested under SACM23-ART-004, under an ArtifactAssetRelationship under SACM23-ART-010, and under each of the four by LIB-API-012's create-parent test) and ArtifactPackage (role `artifactElement`); a Claim, an ArtifactGroup, an AssuranceCasePackage or an ArgumentPackage parent is `InvalidParent`; the generated id is `property_<n>`.",
  "Properties are content: deleting a Technique holding one Property is `NotEmpty { contained: 1 }`, and a Property holding a Property holding a Property gives 2.",
]
tests = [
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_003_a_property_typed_as_another_class_is_preserved_by_its_asset",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_003_a_property_under_an_element_that_is_no_artifact_asset_is_preserved_by_it",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_003_deleting_an_asset_holding_properties_is_not_empty_unless_recursive",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_003_property_children_are_written_without_a_type_and_round_trip",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_003_property_nests_three_deep_and_reads_typed_in_artifact_element",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_003_property_reads_untyped_or_typed_under_each_readable_asset_in_both_modes",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_003_create_property_legal_parents_refusals_and_generated_id",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_003_properties_lists_an_asset_s_property_children_and_nothing_else",
]
notes = "Slice 0055: reworded because Artifact, Resource, Activity and Event are read now (ADR 0034 amendment 1); re-check there. Slice 0057: reworded for ArtifactAssetRelationship and the SACM23-XMI-009 spellings; re-check there. Slice 0060 (M3 close audit): reworded; re-check there."

[[row]]
id = "SACM23-ART-004"
area = "ART"
milestone = "M3"
title = "Artifact"
requirement = "Artifact (§12.7, superclass ArtifactAsset) is read and written typed in an ArtifactPackage's `artifactElement`, with its Base features (name, utility elements, gid, flags, `citedElement`, `abstractForm`), its `property` children (SACM23-ART-003), `version : String[0..1]` and `date` (SACM23-ART-002), and round-trips. `SacmElement::version()` holds the version exactly as written, read from its attribute or its value element (an `xmi:version` is not it) and written as an attribute before `date`. `edit::CreateArtifact` (with `with_version` and `with_date`) creates one in an ArtifactPackage, `edit::SetVersion` sets or removes the version, `semantic_compare` reports `Difference::Version`, and the existing edits (SetName, SetGid, SetFlag, SetReferences, ReorderElements, DeleteElement) apply to it."
source = "formal/23-05-08 §12.7 (pp. 47-48) \"Artifact represents the distinguishable units of data used in a structured assurance case.\", \"version: String[0..1] - the version of the artifact\", \"date: date[0..1] - the date on which the artifact was created.\"; ptc/22-03-13 Artifact::Artifact (generalization ArtifactAsset; `version` typed PrimitiveTypes String, lower 0); XMI 2.5.1 §7.8.4 (pp. 17-18), rule 4j (p. 51); ADR 0034 amendment 1"
kind = "model"
status = "verified"
verification = "docs/verification/0055-m3-artifact-assets.md"
code = ["crates/sacm/src/model/document.rs", "crates/sacm/src/model/kind.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/output.rs", "crates/sacm/src/xmi/refusal.rs", "crates/sacm/src/compare.rs", "crates/sacm/src/edit/artifact.rs", "crates/sacm/src/edit/set.rs", "crates/sacm/src/edit.rs"]
depends_on = ["SACM23-ART-002", "SACM23-ART-003"]
tests = [
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_004_an_artifact_with_every_feature_reads_in_both_modes_and_writes_back",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_004_the_artifact_assets_example_reads_validates_and_writes_its_golden",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_004_set_name_gid_flag_references_reorder_and_delete_apply_to_an_artifact",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_004_create_artifact_reports_what_it_was_given",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_004_create_artifact_legal_parents_refusals_and_generated_id",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_004_set_version_sets_removes_and_refuses_a_kind_without_it",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_004_semantic_compare_reports_one_version_difference",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_004_an_artifact_holds_properties_and_deleting_it_is_not_empty",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_004_the_new_artifact_operations_are_send_sync_clone_debug_eq_and_convert_into_operation",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_004_version_reads_verbatim_in_both_forms_and_is_not_xmi_version",
  "crates/sacm/tests/artifact_dates.rs::sacm23_art_004_a_qualified_version_attribute_is_not_the_version",
]
acceptance = [
  "An Artifact typed in `artifactElement`, with a description, a note, a tagged value, gid, `isCitation`/`isAbstract`, `citedElement`, a property, `version` and `date`, reads in both modes with no diagnostic and writes back with `xmi:type=\"sacm:Artifact\"`; reading the output gives `==`.",
  "`version` reads verbatim (`1.2`, `\"\"`, ` v2 `) from the attribute or from `<version>`; beside `xmi:version=\"2.0\"`, `version()` is the unqualified value and SACM-XMI-011 Info is reported; twice is `RepeatedValue` (tolerant: one SACM-MULT-001 Warning); `version` on a Technique or an Event is preserved with SACM-XMI-003.",
  "`CreateArtifact::new(parent, name)` with `with_id`, `with_version` and `with_date`: `parent()`, `id()`, `name()`, `version()` and `date()` report what it holds and the element gets them exactly; the only legal parent is an ArtifactPackage; an AssuranceCasePackage, an ArgumentPackage, a Technique, an Artifact or an ArtifactGroup parent is `InvalidParent`; refusals in the order ParentNotFound, InvalidParent, InvalidId, DuplicateId; the generated id is `artifact_<n>`.",
  "`SetVersion::new(element, version)` and `SetVersion::remove(element)` behave as SetGid; on an Event, an Activity or a Technique they are `FeatureNotApplicable` naming `version`; U+0001 is accepted, and `xmi::write` then refuses with `WriteAttribute::Version`.",
  "`semantic_compare` reports one `Difference::Version`, exact; `Display` is `element \"report\" differs in version: \"1.2\" on the left, \"1.3\" on the right`.",
  "SetName, SetGid, SetFlag, SetReferences(CitedElement), ReorderElements and DeleteElement apply to an Artifact; `CreateProperty` under an Artifact is legal, and deleting an Artifact holding one Property is `NotEmpty { contained: 1 }`.",
  "`artifact-assets-valid.sacm.xmi` reads in both modes with no diagnostic, validates with no finding, and writes `golden/artifact-assets.golden.sacm.xmi`.",
]

[[row]]
id = "SACM23-ART-005"
area = "ART"
milestone = "M3"
title = "Resource"
requirement = "Resource (§12.10, superclass ArtifactAsset) is read and written typed in an ArtifactPackage's `artifactElement`, with its Base features, its `property` children and its `location` (text followed: D-TEXT-MODEL, spec defect D5). `location` is a MultiLangString role, read and written by SACM23-BASE-004's rules for a UtilityElement's `content`: absent kept apart from empty, values in order with duplicates, an `xmi:id` on `location` and on each `value` kept by position (`SacmElement::location()`, `location_id()`, `location_value_ids()`), a second `location` `RepeatedValue`. It is written directly after `name`. The LIB-COMPAT-008 single-language shorthand is not read on it: a `location` with `lang`/`content` attributes or text and no `value` is preserved whole (SACM-XMI-003). A missing `location` gives no finding, since the text states no multiplicity and the model has no property (D-SEV); `validate` checks a present one as it checks every MultiLangString (SACM23-VAL-010, SACM23-VAL-020). `edit::CreateResource` (with `with_location`) creates one, `edit::SetLocation` sets or removes the location, `semantic_compare` reports `Difference::Location`, `LocationId` and `LocationValueIds`, and the existing edits apply."
source = "formal/23-05-08 §12.10 (p. 48) \"Resource corresponds to the tangible objects representing an Artifact.\", \"location:Base::MultiLangString (composition) - the path or URL specifying the location of the Resource, can be in multiple languages.\"; §8.5 (p. 19) \"value:LangString[1..*] (composition)\"; ptc/22-03-13 Artifact::Resource (generalization ArtifactAsset; no `location`); XMI 2.5.1 §7.8.6 (p. 19); D-TEXT-MODEL; D-SEV; spec defect D5; ADR 0025; ADR 0034 amendment 1"
kind = "model"
status = "verified"
verification = "docs/verification/0055-m3-artifact-assets.md"
code = ["crates/sacm/src/model/document.rs", "crates/sacm/src/model/kind.rs", "crates/sacm/src/xmi/roots.rs", "crates/sacm/src/xmi/output.rs", "crates/sacm/src/xmi/refusal.rs", "crates/sacm/src/compare.rs", "crates/sacm/src/edit/artifact.rs", "crates/sacm/src/edit/set.rs", "crates/sacm/src/edit.rs", "crates/sacm/src/validation/multi_lang.rs", "crates/sacm/src/validation/ids.rs"]
depends_on = ["SACM23-ART-003", "SACM23-BASE-004", "SACM23-VAL-010", "SACM23-VAL-020"]
notes = "Slice 0060 (M3 close audit): reworded; re-check there."
tests = [
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_005_a_resource_with_every_feature_reads_in_both_modes_and_writes_back",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_005_location_keeps_order_duplicates_and_absent_apart_from_empty",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_005_a_second_location_is_a_repeated_value",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_005_a_malformed_or_misplaced_location_is_preserved_whole",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_005_set_name_gid_flag_references_reorder_and_delete_apply_to_a_resource",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_005_create_resource_legal_parents_refusals_and_generated_id",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_005_validate_checks_a_location_as_every_multi_lang_string",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_005_location_ids_are_kept_by_position_written_first_and_compared",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_005_semantic_compare_and_write_refusals_cover_the_location",
  "crates/sacm/tests/artifact_edits.rs::sacm23_art_005_set_location_replaces_keeps_ids_by_position_and_removes",
  "crates/sacm/tests/artifact_dates.rs::sacm23_art_005_location_differences_come_after_date_and_before_start_time",
  "crates/sacm/tests/artifact_assets.rs::sacm23_art_005_a_reference_to_a_location_id_dangles_and_is_written",
]
acceptance = [
  "A Resource with every Base feature, a property and `<location xmi:id=\"l\"><value xmi:id=\"l_en\" lang=\"en\" content=\"https://example.org/r.pdf\"/></location>` reads in both modes with no diagnostic and writes back with `location` directly after `name`; reading the output gives `==`.",
  "No `location` is `None` and writes nothing; `<location/>`, `<location></location>` and one holding only white space or comments are `Some` and empty and write `<location />`; `[en:a, sv:b, en:a]` keeps three values in order; the four absent/empty `lang` × `content` combinations of a `value` round-trip.",
  "Ids on `location` and on a `value` are kept by position, written first on their element, compared (`LocationId`, `LocationValueIds`), and take part in `DuplicateId`, id generation and the edit duplicate check.",
  "A second `location` is `RepeatedValue { property: \"location\" }` in strict mode; a tolerant read keeps the first, preserves the second, and reports one SACM-MULT-001 Warning.",
  "Each of the following is preserved whole as content of the Resource, with one SACM-XMI-003 in both modes: `location` typed other than `sacm:MultiLangString`, a `foo` attribute on it, text beside `value`s, `<location lang=\"en\" content=\"x\"/>`, `<location>x</location>`, and `<sacm:location>`. A `location` on a Technique, an Artifact or an Event is preserved with SACM-XMI-003.",
  "`CreateResource::new(parent, name)` with `with_id` and `with_location(impl Into<MultiLangString>)`: accessors, legal parents and refusals as for CreateArtifact; the generated id is `resource_<n>`.",
  "`SetLocation::new(element, location)` replaces the whole location, keeping the `location` id and each value id by position, and frees the ids beyond the new length; `SetLocation::remove(element)` frees them all; on a kind that is not a Resource it is `FeatureNotApplicable` naming `location`.",
  "`validate`: `<location/>` is one SACM-MULT-001 Error, requirement SACM23-VAL-010, clause `8.5`, affected `[resource]`; `[en:a, en:b]` is one Error naming `en`; a `location` or `value` `xmi:id` that is not an NCName is SACM-ID-002 (SACM23-VAL-020) with the Resource affected; a Resource with no `location` gives no finding.",
  "`semantic_compare` reports `Location` (`element \"r\" differs in location: no location on the left, [] on the right`), `LocationId` and `LocationValueIds`, after `Date` and before `StartTime`; U+0001 in a value is refused on write as `WriteAttribute::LocationValueContent` (`LocationValueLang` for `lang`).",
  "SetName, SetGid, SetFlag, SetReferences(CitedElement), ReorderElements and DeleteElement apply to a Resource.",
  "A `citedElement` naming the `location` id or a location `value` id gives one SACM-REF-001 from `validate` (SACM23-VAL-003), is written by a strict save (it names an `xmi:id` the output writes, LIB-COMPAT-007), and `SetReferences` to it is `ReferenceNotFound`.",
]

[[row]]
id = "SACM23-ART-006"
area = "ART"
milestone = "M3"
title = "Activity"
