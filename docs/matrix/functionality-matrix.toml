[[row]]
id = "SACM23-BASE-004"
area = "BASE"
milestone = "M2"
title = "Descriptions, notes and implementation constraints"
requirement = "ModelElement's `description`, `note` and `implementationConstraint` containments (UtilityElements with MultiLangString `content`) are represented in order, round-tripped and editable on every ModelElement; several descriptions are preserved (D-DESC-MULT). Each MultiLangString is written as its role element with one `value` child per LangString, in order and with duplicates, and reads back in the same order. An absent role and a role element with no `value` children are different states and are kept apart (ADR 0012, ADR 0013). A role element with `lang` or `content` attributes and no `value` children is the C++ single-language shorthand, read by LIB-COMPAT-008, not an empty MultiLangString."
source = "formal/23-05-08 §8.6, §8.7; ptc/22-03-13 Base::ModelElement, Base::UtilityElement"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-002", "SACM23-BASE-003"]
notes = "Slice 0025: owns the MultiLangString `xmi:id` rule moved from SACM23-XMI-004 (an `xmi:id` on a MultiLangString wrapper or its values is reported, never dropped silently)."

[[row]]
id = "SACM23-BASE-005"
area = "BASE"
milestone = "M2"
title = "TaggedValue"
requirement = "TaggedValue (MultiLangString `key` and `content`) is represented on every ModelElement in order, round-tripped and editable. Its MultiLangString roles follow the SACM23-BASE-004 XMI rule: order, duplicates, and an absent role kept apart from an empty one."
source = "formal/23-05-08 clause 8; ptc/22-03-13 Base::TaggedValue"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-004"]

[[row]]
id = "SACM23-BASE-006"
area = "BASE"
milestone = "M2"
title = "gid"
requirement = "The optional SACMElement `gid` is represented, preserved exactly, writable and editable on every element, distinct from the XMI id. An absent `gid` and `gid=\"\"` are different values and both round-trip (§8.2 `gid:String[0..1]`; ADR 0012)."
source = "formal/23-05-08 §8.2; ptc/22-03-13 Base::SACMElement.gid"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-003", "SACM23-XMI-004"]

[[row]]
id = "SACM23-XMI-005"
area = "XMI"
milestone = "M2"
title = "Reference serialization"
requirement = "Non-containment references are written as attributes named by the reference end holding space-separated xmi:ids; import also accepts child-element and `href=\"#id\"` forms; references to unknown ids are kept and diagnosed, not dropped."
source = "XMI 2.5.1 reference rules; docs/sacm/metamodel-inventory.md"
kind = "xmi"
status = "planned"
depends_on = ["SACM23-XMI-004"]

[[row]]
id = "SACM23-BASE-007"
area = "BASE"
milestone = "M2"
title = "Citations"
requirement = "SACMElement `isCitation` and `citedElement` are represented on every element, round-tripped and editable; `citedElement` is a reference to any SACMElement."
source = "formal/23-05-08 §8.2; ptc/22-03-13 Base::SACMElement"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-003", "SACM23-XMI-005"]

[[row]]
id = "SACM23-BASE-008"
area = "BASE"
milestone = "M2"
title = "Abstract elements and abstract forms"
requirement = "SACMElement `isAbstract` and `abstractForm` are represented on every element, round-tripped and editable."
source = "formal/23-05-08 §8.2; ptc/22-03-13 Base::SACMElement"
kind = "model"
status = "planned"
depends_on = ["SACM23-BASE-003", "SACM23-XMI-005"]

[[row]]
id = "SACM23-ARG-004"
area = "ARG"
milestone = "M2"
title = "metaClaim"
requirement = "Assertion `metaClaim` (references to Claims about an assertion) is represented on Claims and asserted relationships, round-tripped and editable."
