[package]
name = "sacm"
description = "Read, edit, validate and write OMG SACM 2.3 (Structured Assurance Case Metamodel) assurance cases"
readme = "README.md"
keywords = ["sacm", "assurance-case", "safety-case", "xmi", "omg"]
categories = ["parser-implementations", "encoding", "data-structures"]
documentation = "https://docs.rs/sacm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The published package holds the sources, the README, the MIT LICENSE and this manifest
# only. Tests and test data stay in the repository: they are megabytes no user builds
# (LIB-QA-005).
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
# Makes `Document::insert`, `InsertError`, `Document::set_assertion_declaration` and
# `SetAssertionDeclarationError` public, so tests can build documents, and the
# constructors of `Code`, `SourceLocation` and `Diagnostic` and the `with_*` builders of
# `Diagnostic` public, so tests can build diagnostics.
# Not part of the stable API: it may change or disappear in any release.
test-support = []
# `Serialize` and `Deserialize` for operations, mutations, edit errors, diagnostics and
# the value types they carry, in the JSON shape of ADR 0030, which follows the crate's
# semver until 1.0. Not for `Document`.
# Use a self-describing format such as JSON; the `"type"` tags do not work with bincode
# or postcard.
serde = ["dep:serde"]

[dependencies]
# The private XML parser of `sacm::xmi` (ADR 0005). 0.21.2 is the first release that
# parses deep nesting without recursion. DTDs stay disabled, its default.
roxmltree = { version = "0.21.2", default-features = false, features = ["std", "positions"] }
# Optional, behind the `serde` feature (ADR 0030). MIT OR Apache-2.0; MSRV below ours.
serde = { version = "1.0.200", optional = true, default-features = false, features = ["std", "derive"] }

[dev-dependencies]
# The crate's own tests always build with the test seam.
sacm = { path = ".", features = ["test-support"] }
# The serde tests' JSON format (ADR 0030); already in the lock through xtask.
serde_json = "1.0.128"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
