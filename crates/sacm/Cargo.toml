[package]
name = "sacm"
description = "Read, edit, validate and write OMG SACM 2.3 (Structured Assurance Case Metamodel) assurance cases"
readme = "README.md"
keywords = ["sacm", "assurance-case", "safety-case", "xmi", "omg"]
categories = ["parser-implementations", "encoding", "data-structures"]
documentation = "https://docs.rs/sacm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Makes `Document::insert` and `InsertError` public, so tests can build documents.
# Not part of the stable API: it may change or disappear in any release.
test-support = []

[dependencies]

[dev-dependencies]
# The crate's own tests always build with the test seam.
sacm = { path = ".", features = ["test-support"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
