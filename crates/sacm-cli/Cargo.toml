[package]
name = "sacm-cli"
description = "Command-line tool to inspect, validate and convert OMG SACM 2.3 assurance cases"
readme = "README.md"
keywords = ["sacm", "assurance-case", "safety-case", "xmi", "cli"]
categories = ["command-line-utilities", "parser-implementations"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "sacm"
path = "src/main.rs"
# The library crate is also named `sacm`; documenting both would collide.
doc = false

[dependencies]
sacm.workspace = true
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true
